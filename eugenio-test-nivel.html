function utter(text,r){
  const synth=window.speechSynthesis;

}

  try{
    const synth=window.speechSynthesis; if(!synth) return;
    const my=++seqId; synth.cancel(); if(muted) return;
    const words=text.split(/\s+/), parts=[];
    for(let k=0;k<words.length;k+=size) parts.push(words.slice(k,k+size).join(' '));
    let k=0;
    const step=()=>{
      if(my!==seqId) return;
      if(k>=parts.length){ if(onend) onend(); return; }
      const u=utter(parts[k++],r);
      u.onend=()=>setTimeout(step,pause);
      synth.speak(u);
    };
    step();
  }catch(e){}
}
try{ speechSynthesis.onvoiceschanged = ()=>{} }catch(e){}

// ---------- Экраны ----------
function start(){
  app.innerHTML = `
  <div class="card">
    <span class="scene">🇪🇸 Тест по испанскому · 10–15 минут</span>
    <h1>Один день в Испании</h1>
    <p>Тебя ждёт обычный день: офис и клиенты, кафе, супермаркет, аптека, банк, автосервис и даже поезд. В каждой сцене — один короткий вопрос.</p>
    <p>Задания постепенно усложняются. Проходи сколько хочешь: если станет слишком трудно или нет времени, нажми вверху <b>⏹ Стоп</b> — результат сохранится.</p>
    <p>Не угадывай: если не знаешь ответ, нажми <b>🤷 Не знаю</b>. Так результат будет точнее.</p>
    <p class="muted">В некоторых сценах есть аудио — включи звук. В конце появится сообщение с результатом, его нужно скопировать и отправить Дарье.</p>
    ${hasSaved()?'<button class="btn wide" id="cont">▶️ Продолжить с того же места</button><button class="ghost" id="go">Начать заново</button>':'<button class="btn wide" id="go">Начать день ☀️</button>'}
  </div>`;
  document.getElementById('go').onclick = ()=>{ speak(""); answers=BLOCKS.map(b=>Array(b.items.length).fill(null)); recalc(); bi=0; qi=0; save(); show(); };
  const c=document.getElementById('cont'); if(c) c.onclick=()=>{ speak(""); show(); };
}

// Прогресс хранится в этом браузере: если закрыть страницу, можно продолжить
const KEY='eugenio-test-nivel-v1';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({answers,bi,qi})); }catch(e){} }
function hasSaved(){ return answers.some(a=>a.some(x=>x)); }
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)||'null'); if(d&&Array.isArray(d.answers)&&d.answers.length===BLOCKS.length){
  answers=BLOCKS.map((b,k)=>b.items.map((_,j)=>(d.answers[k]&&d.answers[k][j])||null)); bi=Math.min(d.bi||0,BLOCKS.length-1); qi=Math.min(d.qi||0,BLOCKS[bi].items.length-1); recalc(); } }catch(e){} }

function totalDone(){ let n=qi; for(let k=0;k<bi;k++) n+=BLOCKS[k].items.length; return n; }

// Пересчёт баллов и списка ответов (ответ на тот же вопрос перезаписывается)
function recalc(){
  scores=[]; counts=[]; log=[];
  BLOCKS.forEach((b,k)=>b.items.forEach((it,j)=>{
    const r=answers[k][j]; if(!r) return;
    scores[k]=(scores[k]||0)+(r.ok?1:0); counts[k]=(counts[k]||0)+1;
    log.push({lvl:b.lvl,q:it.gapText||it.say||it.audio||it.msg||it.task,your:r.i<0?"не знаю":it.opts[r.i],right:it.opts[it.a],ok:r.ok});
  }));
}
function go(k,j){ bi=k; qi=j; show(); }
function prevQ(){ if(qi>0) return go(bi,qi-1); if(bi>0) return go(bi-1,BLOCKS[bi-1].items.length-1); }
function skipQ(){ if(qi<BLOCKS[bi].items.length-1) return go(bi,qi+1); if(bi<BLOCKS.length-1) return go(bi+1,0); finish(); }

function show(){
  answered=false; navTok++; save();
  try{seqId++;speechSynthesis.cancel()}catch(e){}
  const it = BLOCKS[bi].items[qi];
  const pct = Math.min(100, totalDone()/TOTAL*100);
  let body = "";
  if(it.say) body += `<div class="say"><b>«</b>${esc(it.say)}<b>»</b></div>`;
  if(it.msg) body += `<div class="msg">${esc(it.msg)}</div>`;
  if(it.gapText) body += `<div class="say">${esc(it.gapText).replace('___','<span class="gap">?</span>')}</div>`;
  const spText = it.say || it.msg || (it.gapText ? it.gapText.replace('___','…') : '');
  if(spText) body += `<button class="ghost rep" id="rep">🔊 Послушать ещё раз</button>`;
  if(it.audio) body += `<div class="listenCol"><button class="listen" id="play">🔊 Слушать</button><button class="ghost" id="slow">🐢 Слушать медленнее</button><button class="ghost" id="slow2">🐌 Слушать ещё медленнее</button></div>
     <button class="ghost" id="nosound" style="align-self:flex-start;font-size:.8rem">Нет звука?</button><div id="fallback" hidden class="say"></div>`;
  app.innerHTML = `
  <div class="day"><div class="track"><div class="fill" style="width:${pct}%"></div><span class="sunDot" style="left:${pct}%">☀️</span></div><span class="clock">${it.t}</span><button class="stop" id="stop">⏹ Стоп</button></div>
  <div class="nav">
    <button class="navb" id="prev" ${bi===0&&qi===0?'disabled':''} aria-label="Предыдущий вопрос">⏮</button>
    <div class="lvls">${BLOCKS.map((b,k)=>`<button class="lv ${k===bi?'cur':''}" data-k="${k}">${b.lvl}</button>`).join('')}</div>
    <span class="qn">${qi+1}/${BLOCKS[bi].items.length}</span>
    <button class="navb" id="skip" aria-label="Следующий вопрос">⏭</button>
  </div>
  <div class="snd">
    <button class="sb ${auto?'on':''}" id="autoBtn">${auto?'▶️ Автоплей: вкл':'⏸ Автоплей: выкл'}</button>
    <button class="sb ${muted?'':'on'}" id="muteBtn">${muted?'🔇 Звук: выкл':'🔊 Звук: вкл'}</button>
  </div>
  ${answers[bi][qi]?'<p class="muted" style="font-size:.85rem">Ты уже отвечал на этот вопрос. Новый ответ заменит старый.</p>':''}
  <div class="card">
    <span class="scene">${it.place}</span>
    <h2>${esc(it.task)}</h2>
    ${body}
    <div class="opts">${it.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
    <div id="fb"></div>
    <div class="row" id="ctrl"><button class="ghost" id="idk">🤷 Не знаю / пропустить</button></div>
  </div>`;
  try{document.activeElement&&document.activeElement.blur()}catch(e){}
  document.getElementById('prev').onclick=prevQ;
  document.getElementById('skip').onclick=skipQ;
  app.querySelectorAll('.lv').forEach(b=>b.onclick=()=>go(+b.dataset.k,0));
  const st=document.getElementById('stop');
  st.onclick=()=>{ if(!st.classList.contains('sure')){ st.classList.add('sure'); st.textContent='Завершить?'; setTimeout(()=>{st.classList.remove('sure'); st.textContent='⏹ Стоп'},3000); return; }
    try{seqId++;speechSynthesis.cancel()}catch(e){} finish(); };
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  document.getElementById('idk').onclick=()=>answer(-1);
  const toOpts=()=>{const o=app.querySelector('.opts'); if(o&&!answered) o.scrollIntoView({behavior:'smooth',block:'nearest'})};
  // ручное нажатие на 🔊 само включает звук, если он был выключен
  const unmute=()=>{ if(muted){ muted=false; saveSound(); const m=document.getElementById('muteBtn'); m.textContent='🔊 Звук: вкл'; m.classList.add('on'); } };
  const playPage=()=>{ rate=0.8; if(it.audio) speak(it.audio,toOpts); else if(spText) speak(spText,toOpts); };
  if(it.audio){
    document.getElementById('play').onclick=()=>{unmute();rate=0.8;speak(it.audio,toOpts)};
    document.getElementById('slow').onclick=()=>{unmute();speakSlow(it.audio,3,450,0.65,toOpts)};
    document.getElementById('slow2').onclick=()=>{unmute();speakSlow(it.audio,1,600,0.5,toOpts)};
    document.getElementById('nosound').onclick=()=>{const f=document.getElementById('fallback');f.textContent=it.audio;f.hidden=false};
  }
  if(spText) document.getElementById('rep').onclick=()=>{unmute();rate=0.8;speak(spText,toOpts)};
  const ab=document.getElementById('autoBtn');
  ab.onclick=()=>{ auto=!auto; saveSound(); ab.textContent=auto?'▶️ Автоплей: вкл':'⏸ Автоплей: выкл'; ab.classList.toggle('on',auto); if(auto&&!answered) playPage(); };
  const mb=document.getElementById('muteBtn');
  mb.onclick=()=>{ muted=!muted; saveSound(); mb.textContent=muted?'🔇 Звук: выкл':'🔊 Звук: вкл'; mb.classList.toggle('on',!muted); if(muted){ try{seqId++;speechSynthesis.cancel()}catch(e){} } };
  if(auto && !muted){ const tok=navTok; setTimeout(()=>{ if(tok===navTok && !answered) playPage(); },350); }
  window.scrollTo({top:0});
}

function answer(i){
  if(answered) return; answered=true;
  try{seqId++;speechSynthesis.cancel()}catch(e){}
  const it = BLOCKS[bi].items[qi];
  const ok = i===it.a;
  answers[bi][qi]={i,ok}; save();
  recalc();
  const btns=app.querySelectorAll('.opt');
  btns.forEach((b,k)=>{b.disabled=true; if(k===it.a) b.classList.add('ok'); if(k===i&&!ok) b.classList.add('bad');});
  document.getElementById('idk').remove();
  const fb=document.getElementById('fb');
  if(ok){ fb.innerHTML=`<div class="fb ok">✅ ¡Muy bien!</div>`; const tok=navTok; setTimeout(()=>{ if(tok===navTok) next(); },900); }
  else{
    fb.innerHTML=`<div class="fb bad"><strong>${i<0?'Ничего страшного.':'Не совсем.'}</strong> Правильно: «${esc(it.opts[it.a])}»</div>`;
    const c=document.getElementById('ctrl'); c.innerHTML=`<button class="btn wide" id="nx">Дальше →</button>`;
    const nx=document.getElementById('nx'); nx.onclick=next;
    nx.scrollIntoView({behavior:'smooth',block:'nearest'});
    if(it.es){ const full=it.gapText?it.gapText.replace('___',it.opts[it.a]):it.opts[it.a]; setTimeout(()=>{rate=0.7;speak(full)},1000); }
  }
}

function next(){
  qi++;
  if(qi<BLOCKS[bi].items.length) return show();
  // конец блока
  if(bi<BLOCKS.length-1){ bi++; qi=0; return between(); }
  finish();
}

function between(){
  const msgs={1:"Утро позади! Дальше — задания посложнее.",2:"Половина дня позади. Дальше ещё интереснее.",3:"Последняя часть дня — самая сложная. Попробуй, сколько получится."};
  app.innerHTML=`<div class="card"><span class="scene">☀️ Перерыв</span><h2>${msgs[bi]}</h2><button class="btn wide" id="go">Продолжить</button><button class="ghost" id="fin">⏹ Завершить и отправить результат</button></div>`;
  document.getElementById('go').onclick=show;
  document.getElementById('fin').onclick=finish;
}

// Уровень = самый высокий блок, где ответил минимум на 4 вопроса и 75%+ правильно,
// плюс как справился со следующим блоком. Пропущенные блоки ниже не мешают.
function level(){
  const good=k=>{const c=counts[k]||0, sc=scores[k]||0; return c>=4 && sc/c>=0.75;};
  let passed=0;
  for(let k=0;k<BLOCKS.length;k++) if(good(k)) passed=k+1;
  if(passed>=4) return "B2+";
  const c=counts[passed]||0, sc=scores[passed]||0;
  const upper = c>=4 && sc/c>=0.6;
  const table=[["A0–A1","A1"],["A1","A1–A2"],["A2","A2–B1"],["B1","B1–B2"]];
  return table[passed][upper?1:0];
}
const blkText=(k)=>{const n=BLOCKS[k].items.length,c=counts[k]||0; if(!c) return '—'; return c===n? scores[k]+'/'+n : scores[k]+'/'+c+' (из '+n+')';};

function finish(){
  const lv=level();
  const desc={"A0–A1":"Начинаем с основ — это самая приятная часть: прогресс будет заметен очень быстро.","A1":"Основа есть. Теперь нужно уверенно говорить о себе и о прошлом.","A1–A2":"Базу знаешь хорошо, впереди — прошедшее время и живые разговоры.","A2":"Уверенный бытовой испанский. Следующий шаг — субхунтив и свободная речь.","A2–B1":"Почти B1! Осталось закрепить сложные времена.","B1":"Свободно справляешься в повседневной жизни в Испании.","B1–B2":"Сильный уровень — дальше тонкости грамматики и идиомы.","B2+":"Отличный результат! Дальше — шлифовка и живая речь."}[lv];
  app.innerHTML=`
  <div class="card">
    <span class="scene">🌙 День закончен</span>
    <p class="muted">Твой уровень</p>
    <div class="level">${lv}</div>
    <p>${desc}</p>
    <div class="blocks">${BLOCKS.map((b,k)=>`<div class="blk ${(counts[k]||0)>=4&&(scores[k]||0)/(counts[k]||1)>=0.75?'pass':''}"><b>${b.lvl}</b>${blkText(k)}</div>`).join('')}</div>
  </div>
  <div class="card">
    <h2>Последний шаг (по желанию)</h2>
    <p class="muted">Напиши 2–3 предложения о себе по-испански: где живёшь, чем занимаешься, что любишь. Как получится — ошибки не страшны.</p>
    <textarea id="about" placeholder="Me llamo… Vivo en…"></textarea>
  </div>
  <div class="card">
    <h2>📩 Отправь результат Дарье</h2>
    <p class="muted">Нажми «Скопировать» и вставь сообщение в чат с Дарьей.</p>
    <pre class="copy" id="out"></pre>
    <button class="btn wide" id="cp">📋 Скопировать</button>
    <span class="toast" id="toast" hidden>Скопировано ✓</span>
  </div>
  <div class="card">
    <h2>Мои ответы</h2>
    <div class="list">${log.map(l=>`<div>${l.ok?'✅':'❌'} <b>${l.lvl}</b> · ${esc(l.q.length>60?l.q.slice(0,60)+'…':l.q)}<br><span class="muted">Ответ: ${esc(l.your)}${l.ok?'':' → правильно: '+esc(l.right)}</span></div>`).join('')}</div>
    <button class="ghost" id="again">🔁 Пройти тест заново</button>
  </div>`;
  const out=document.getElementById('out'), about=document.getElementById('about');
  const build=()=>{
    const errs=log.filter(l=>!l.ok).map(l=>`• [${l.lvl}] ${l.q} — ответ: ${l.your} (правильно: ${l.right})`).join('\n')||'• нет';
    out.textContent=`🇪🇸 Результат теста по испанскому\nУровень: ${lv}\nПо блокам: ${BLOCKS.map((b,k)=>b.lvl+' '+blkText(k)).join(', ')}\n\nОшибки:\n${errs}\n\nО себе по-испански:\n${about.value.trim()||'(не написал)'}`;
  };
  build(); about.oninput=build;
  document.getElementById('cp').onclick=async()=>{
    build();
    try{ await navigator.clipboard.writeText(out.textContent); }
    catch(e){ const r=document.createRange(); r.selectNodeContents(out); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
    const t=document.getElementById('toast'); t.hidden=false; setTimeout(()=>t.hidden=true,2000);
  };
  document.getElementById('again').onclick=()=>{bi=0;qi=0;answers=BLOCKS.map(b=>Array(b.items.length).fill(null));recalc();save();start();};
  window.scrollTo({top:0});
}

load();
start();
</script>
