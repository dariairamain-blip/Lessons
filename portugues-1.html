.pics{font-size:22px;line-height:1.2;margin-top:2px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:230px;padding:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.frame{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.fin{display:flex;flex-direction:column;gap:7px;width:100%}
.fl{display:flex;align-items:flex-start;gap:8px}.fl .fp{font-size:24px;min-width:44px;text-align:center}.fl>div{min-width:0}
.big{font-size:70px;line-height:1.1}

.nw{color:var(--sea);display:inline-block;animation:pop .6s .2s both}
.tcap{text-align:center;font-weight:800;color:var(--sea);min-height:1.3em}
.sc{display:inline-block;font-size:34px;animation:snip 1.1s both}
.fall{display:inline-block;animation:fall 1s 1.1s both}
.pop{animation:pop .5s ease-out both}.pop2{animation:fadeup .5s .25s both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes snip{0%{transform:translateY(-70px);opacity:0}45%{transform:translateY(0) rotate(0);opacity:1}65%{transform:rotate(-25deg)}85%{transform:rotate(15deg)}100%{transform:rotate(0)}}
@keyframes fall{to{transform:translateY(110px) rotate(40deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.nw,.sc,.fall,.pop,.pop2{animation:none}}
.ttr{color:var(--muted);font-size:16px;font-weight:600}
.flag{font-size:13px;font-weight:800;color:var(--sea);background:var(--sel);border-radius:999px;padding:3px 10px}
.stick{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--bg);padding-block:6px;box-shadow:0 -6px 12px -8px rgba(0,0,0,.25);border-radius:12px;flex-wrap:nowrap}
.stick .btn{flex:1;padding:11px 8px;font-size:14px;white-space:nowrap}
.lg{border-radius:12px;padding:8px 10px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:2px;font-size:14px}
.lg.ok{border-left:4px solid var(--ok)}.lg.bad{border-left:4px solid var(--bad)}.lq{font-weight:700}
.own{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{max-width:420px;display:flex;flex-direction:column;gap:8px}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

const FORMS=(pic,r,ru)=>S2(pic,`${r}<b class="nw">o</b> · ${r}<b class="nw">a</b> · ${r}<b class="nw">amos</b>`,ru,"eu -o · você -a · nós -amos");
FORMS.say=0;
const VERB=(pic,inf,r,ruInf,ruForms,sent,ruSent)=>[W(pic,inf,ruInf,"🎬 Новый глагол"),CUT(r),
  Object.assign(FORMS(pic,r,ruForms),{say:`eu ${r}o, você ${r}a, nós ${r}amos`}),S2(pic,sent,ruSent,"Пример")];
const WHO=[["👩 я (eu)",null],["👨 ты (você)",null],["👩👨 мы (nós)",null]];
const LH="Смотри на окончание: -o = я, -a = ты, -amos = мы.";
/* TITLE: Português 1 */
const CFG={n:1,key:"pt-br-1",readT:"Сообщение от Мигела 💬",who:"Miguel 🌴 (Rio de Janeiro)",
 intro:`<div class="pic">🇧🇷👋</div><div class="eyebrow">Португальский · Урок 1</div><h1>Olá! Eu, você, nós</h1>
 <p>Что в этом уроке:</p>
 <div class="card"><p>👫 <b>Часть 1:</b> «я», «ты», «мы» по-португальски<br>✂️ <b>Часть 2:</b> как меняются глаголы: говорить, петь, готовить<br>🏠 <b>Часть 3:</b> жить, работать, учиться<br>💬 <b>Часть 4:</b> сообщение от друга из Рио и фразы из слов</p></div>
 <p class="sub">🇧🇷 Основа — бразильский вариант. Где в Португалии иначе, увидишь значок 🇵🇹. 🔊 — послушать, 🌐 — перевод.</p>`,
 fin:()=>`<div class="card"><table class="tbl"><tr><td>👩 eu</td><td>fal<span class="end">o</span></td><td class="tr">говорю</td></tr><tr><td>👨 você</td><td>fal<span class="end">a</span></td><td class="tr">говоришь</td></tr><tr><td>👩👨 nós</td><td>fal<span class="end">amos</span></td><td class="tr">говорим</td></tr><tr><td>🇵🇹 tu</td><td>fal<span class="end">as</span></td><td class="tr">говоришь (Португалия)</td></tr></table></div>
 <p>Теперь ты можешь сказать:</p>${esLine("Eu moro perto do mar, trabalho numa clínica e estudo português.","Я живу у моря, работаю в клинике и учу португальский.","es","🏠🌊 · 🦷 · 📚")}`};
const MODS=[
 {n:"Eu · você · nós",e:"👫",s:"я · ты · мы",pages:[
  {k:"toon",t:"🎬 Eu · você · nós",steps:[
    W("👩","eu","я","1 / 3"),W("👨","você","ты","2 / 3"),W("👩👨","nós","мы","3 / 3"),
    S2("👩 + 👨","Eu e você... nós!","Я и ты... мы!","eu + você = nós"),

   fin:[["👩","eu","я"],["👨","você","ты"],["👩👨","nós","мы"],["🇵🇹","tu","ты (в Португалии)","pt-PT"]]},
  {k:"ch",pic:"👩☝️",q:"Ты говоришь о себе. Какое слово?",opts:[["eu","я"],["você","ты"],["nós","мы"]],a:0,why:"О себе — <b>eu</b> = я.",hint:"Я = …"},
  {k:"ch",pic:"👩➡️👨",q:"Ты обращаешься к другу в Бразилии. Какое слово?",opts:[["nós","мы"],["você","ты"],["eu","я"]],a:1,why:"Собеседник в Бразилии — <b>você</b> = ты.",hint:"Тот, с кем говоришь."},

 {n:"Глагол falar",e:"✂️",s:"-o · -a · -amos",pages:[

  {k:"ch",pic:"👩🇩🇪",q:"Выбери правильную форму (falar — говорить).",es:"Eu ___ alemão.",tr:"Я говорю по-немецки.",opts:[["falo","говорю"],["fala","говоришь"],["falamos","говорим"]],a:0,why:"<b>eu</b> → -o: fal<b>o</b>.",hint:"eu → -o"},

   <div class="chips">${shuffled.map(wi=>`<button type="button" class="chip" data-pk="${wi}"${st.pick.includes(wi)||st.res!=null?" disabled":""}>${esc(P.w[wi])}</button>`).join("")}</div>`;
  const full=P.w.join(" ");
  if(st.res==null)h+=`<div class="row"><button type="button" class="btn pri" data-chk${st.pick.length<P.w.length?" disabled":""}>Проверить</button></div><button type="button" class="skip" data-hint style="text-decoration:none">💡 Подсказка</button><p class="hint" id="hint" hidden>Первое слово — с большой буквы, в последнем — точка или знак вопроса.</p>`;
  else if(st.res)h+=`<div class="fb ok"><b>✅ Perfeito!</b>${P.why}</div>${esLine(full,P.q)}<div class="row stick"><button type="button" class="btn pri" data-next>Следующее задание →</button></div>`;
  else h+=`<div class="fb bad"><b>❌ Правильно: ${esc(full)}</b>${P.why}</div><div class="row stick"><button type="button" class="btn sec" data-retry>🔁 Ещё раз</button><button type="button" class="btn pri" data-next>Следующее задание →</button></div>`;
  return h}

/* ---------- events ---------- */
function wireIn(root){
  root.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say,b.dataset.lang));
  root.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{const t=b.closest(".opt,.vc,div:not(.esl)").querySelector(".trv");if(t)t.hidden=!t.hidden});}
function logIt(e){S.log=S.log||{};S.log[key()]=Object.assign({m:S.m,p:S.p,t:Date.now()},e);save()}
function logView(){const L=S.log||{};const ks=Object.keys(L).sort((a,b)=>{const[x1,y1]=a.split("-").map(Number),[x2,y2]=b.split("-").map(Number);return x1-x2||y1-y2});
  const ok=ks.filter(k=>L[k].ok).length;let h=`<h1>📋 Мои ответы</h1><p class="sub">При повторном прохождении ответ на задание перезаписывается.</p>`;
  if(!ks.length)return h+`<p>Пока нет ответов. Пройди задания — здесь появится каждый ответ.</p><button type="button" class="btn sec" data-tomenu>← В меню</button>`;
  h+=`<div class="card"><b>${"✅ {ok} · ❌ {bad}".replace("{ok}",ok).replace("{bad}",ks.length-ok)}</b></div>`;let cur=-1;
  ks.forEach(k=>{const e=L[k];if(e.m!==cur){cur=e.m;h+=`<h2>Часть ${e.m+1}. ${esc(MODS[e.m]?MODS[e.m].n:"")}</h2>`}
    h+=`<div class="lg ${e.ok?"ok":"bad"}"><div class="lq">${e.ok?"✅":"❌"} ${esc(e.q)}</div><div>Твой ответ: <b>${esc(e.your)}</b></div>${e.ok?"":`<div>Правильно: <b>${esc(e.right)}</b></div>`}</div>`});
  return h+`<button type="button" class="btn sec" data-tomenu>← В меню</button>`}
function afterBuild(ok,txt,lang){const k=key(),v=S.v,same=()=>key()===k&&S.v===v;
  if(!S.auto){afterAnswer(ok,txt,lang);return}
  if(ok){stopAll();let done=false;const go=()=>{if(done)return;done=true;setTimeout(()=>{if(same())next()},600)};
    setTimeout(()=>{if(same())utter(txt,go,lang);else done=true},250);setTimeout(go,7000)}
  else setTimeout(()=>{if(same())say(txt,lang)},700)}
function afterAnswer(ok,txt,lang){const k=key(),v=S.v,same=()=>key()===k&&S.v===v;
  if(ok)setTimeout(()=>{if(same())next()},1100);else if(txt)setTimeout(()=>{if(same())say(txt,lang)},1000)}
function wire(){
  const pg=$("#page");
  wireIn(pg);const tr=$("#treplay");if(tr)tr.onclick=playToon;
  pg.querySelectorAll("[data-hint]").forEach(b=>b.onclick=()=>{const t=$("#hint");t.hidden=!t.hidden});
  pg.querySelectorAll("[data-skip],[data-next]").forEach(b=>b.onclick=next);
  pg.querySelectorAll("[data-log]").forEach(b=>b.onclick=()=>{S.v="log";save();render()});
  pg.querySelectorAll("[data-tomenu]").forEach(b=>b.onclick=()=>{S.v="menu";save();render()});
  pg.querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>{S.v="mod";S.m=+b.dataset.mod;S.p=0;save();render()});
  pg.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const P=MODS[S.m].pages[S.p],o=+b.dataset.o;S.ans[key()]=o;logIt({q:P.q+(P.es?" — "+P.es:"")+(P.listen?" 🎧 "+P.listen:""),your:P.opts[o][0],right:P.opts[P.a][0],ok:o===P.a});save();render();afterAnswer(o===P.a,P.opts[P.a][1]?P.opts[P.a][0]:null,P.lang)});
  pg.querySelectorAll("[data-retry]").forEach(b=>b.onclick=()=>{delete S.ans[key()];const P=MODS[S.m].pages[S.p];delete P.sh;save();render()});
  const bd=()=>S.ans[key()]||(S.ans[key()]={pick:[],res:null});
  pg.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{bd().pick.push(+b.dataset.pk);save();render()});
  pg.querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{bd().pick.splice(+b.dataset.un,1);save();render()});
  pg.querySelectorAll("[data-chk]").forEach(b=>b.onclick=()=>{const s=bd(),P=MODS[S.m].pages[S.p];s.res=s.pick.every((w,i)=>w===i)&&s.pick.length===P.w.length;logIt({q:P.q,your:s.pick.map(i=>P.w[i]).join(" "),right:P.w.join(" "),ok:s.res});save();render();afterBuild(s.res,P.w.join(" "),P.lang)});
  const go=$("#go");if(go){const tryc=()=>{if(CODES.includes(norm($("#code").value))){S.ok=true;save();render()}else $("#err").textContent="Неверный код. Попробуй ещё раз."};
    go.onclick=tryc;$("#code").onkeydown=e=>{if(e.key==="Enter")tryc()}}
}
function next(){
  if(S.v==="intro"){S.v="mod";S.m=0;S.p=0}
  else if(S.v==="mdone"){if(S.m<MODS.length-1){S.m++;S.p=0;S.v="mod"}else S.v="menu"}
  else{const M=MODS[S.m];if(S.p<M.pages.length-1)S.p++;else{S.done[S.m]=true;S.v="mdone"}}
  save();render()}
function back(){
  if(S.v==="intro"){S.v="menu"}
  else if(S.v==="mdone"){S.v="mod";S.p=MODS[S.m].pages.length-1}
  else if(S.p>0)S.p--;else S.v=S.m===0?"intro":"menu";
  save();render()}
$("#next").onclick=next;$("#back").onclick=back;
$("#mbtn").onclick=()=>{S.v="menu";save();render()};
$("#home").onclick=()=>{$("#hm").hidden=false};$("#hmc").onclick=()=>{$("#hm").hidden=true};
render();
</script>

</body>
