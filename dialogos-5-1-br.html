<style>

}

 ["ti","Atenção: o embarque para São Paulo vai começar em cinco minutos.","Внимание: посадка на Сан-Паулу начнётся через пять минут."],

 ["la","Tá bom. Desculpa, eu tô sem fôlego.","Хорошо. Простите, я запыхалась."],
 ["ca","Respira. Me passa o seu cartão de embarque, por favor.","Отдышитесь. Дайте мне ваш посадочный, пожалуйста."],
 ["la","Tá aqui. E agora? Tem outro voo pra Recife hoje?","Вот. И что теперь? Сегодня есть ещё рейс в Ресифи?"],
 ["ca","Tem um às três e quinze da tarde e outro às nove da noite.","Есть один в три пятнадцать дня и ещё один в девять вечера."],
 ["la","Às três e quinze, por favor! O mais cedo possível.","На три пятнадцать, пожалуйста! Как можно раньше."],
 ["ca","Deixa eu ver… O das três e quinze está lotado.","Сейчас посмотрю… Рейс на три пятнадцать полностью заполнен."],
 ["la","Lotado? Nem um lugarzinho?","Полный? Ни одного местечка?"],
 ["ca","Posso colocar a senhora na lista de espera. Mas o das nove é garantido.","Могу поставить вас в лист ожидания. А на девять — гарантированно."],
 ["la","Então faz as duas coisas, por favor. Lista de espera e o das nove.","Тогда сделайте, пожалуйста, и то и другое. Лист ожидания и рейс на девять."],
 ["ca","Combinado. E a senhora tem direito a um voucher de alimentação.","Договорились. И вам полагается ваучер на питание."],
 ["la","Voucher? De quanto?","Ваучер? На сколько?"],
 ["ca","Sessenta reais, pra usar em qualquer restaurante do terminal.","Шестьдесят реалов, можно потратить в любом ресторане терминала."],
 ["la","Pelo menos isso. E a minha mala?","Хоть так. А мой чемодан?"],
 ["ca","A mala vai ser transferida automaticamente pro novo voo.","Чемодан будет автоматически переброшен на новый рейс."],
 ["la","Tem certeza? Eu tenho medo de perder a mala.","Вы уверены? Я боюсь потерять чемодан."],
 ["ca","Tenho. A etiqueta da mala já está no sistema.","Уверена. Бирка чемодана уже в системе."],
 ["la","E se eu conseguir o voo das três? A mala vai junto?","А если я попаду на рейс в три? Чемодан полетит вместе со мной?"],
 ["ca","Vai tentar ir junto. Se não der tempo, vai no voo seguinte.","Его постараются отправить вместе. Если не успеют — следующим рейсом."],
 ["la","Tá. Onde eu espero a lista de espera?","Ладно. Где мне ждать по листу ожидания?"],
 ["ca","No portão quinze, a partir das duas e meia. Fala com o meu colega lá.","У выхода пятнадцать, с двух тридцати. Поговорите там с моим коллегой."],
 ["so","Lara! Você também perdeu? Eu cheguei atrasada, igualzinha a você!","Лара! Ты тоже опоздала? Я пришла поздно, точно как ты!"],
 ["la","Dona Socorro! Perdi. Agora tô na lista de espera das três.","Дона Сокорру! Опоздала. Теперь я в листе ожидания на три часа."],
 ["so","Eu também! Então vamos almoçar juntas com esse voucher.","Я тоже! Тогда пойдём пообедаем вместе по этому ваучеру."],
 ["la","Boa ideia. Moça, muito obrigada pela paciência.","Хорошая мысль. Девушка, большое спасибо за терпение."],
 ["ca","Imagina. Boa sorte na lista de espera!","Не за что. Удачи с листом ожидания!"],
 ["so","Sorte a gente tem. A gente se encontrou, não foi?","Удача у нас есть. Мы же встретились, правда?"]
 ],

{t:"No avião",ru:"Обмен местами, бортпроводница и турбулентность",e:"💺",
 lines:[
 ["la","Consegui! Lugar vinte e três E. Dona Socorro, e a senhora?","Получилось! Место двадцать три E. Дона Сокорру, а у вас?"],
 ["so","Vinte e três C. Do outro lado do corredor. Quase juntas!","Двадцать три C. По другую сторону прохода. Почти вместе!"],
 ["la","Com licença, moço. Esse lugar do meio é o meu.","Извините, молодой человек. Это среднее место — моё."],
 ["di","Ah, claro. Pode passar.","А, конечно. Проходите."],
 ["la","Posso te pedir um favor? Você trocaria de lugar com a minha amiga?","Можно попросить тебя об одолжении? Ты бы поменялся местами с моей подругой?"],
 ["di","Depende. Qual é o lugar dela?","Смотря какое. Какое у неё место?"],
 ["so","É no corredor, meu filho. Dá pra esticar as pernas.","У прохода, сынок. Можно вытянуть ноги."],
 ["di","No corredor? Fechado! Eu sou alto, as minhas pernas agradecem.","У прохода? Договорились! Я высокий, мои ноги скажут спасибо."],
 ["so","Obrigada, querido. Você é um anjo.","Спасибо, дорогой. Ты просто ангел."],
 ["br","Senhores passageiros, apertem os cintos e coloquem os assentos na posição vertical.","Уважаемые пассажиры, пристегните ремни и приведите спинки кресел в вертикальное положение."],
 ["la","Dona Socorro, a senhora tem medo de avião?","Дона Сокорру, вы боитесь летать?"],
 ["so","Medo, não. Mas na decolagem eu sempre rezo um pouquinho.","Бояться — нет. Но на взлёте я всегда немножко молюсь."],
 ["br","Boa tarde! Água, suco ou café?","Добрый день! Вода, сок или кофе?"],
 ["la","Um suco de laranja, por favor. Sem gelo.","Апельсиновый сок, пожалуйста. Без льда."],
 ["so","Pra mim, um cafezinho com bastante açúcar.","Мне кофеёк с большим количеством сахара."],
 ["br","E pra comer, temos um lanche: sanduíche de queijo ou bolinho de chocolate.","А из еды у нас есть перекус: сэндвич с сыром или шоколадный кекс."],
 ["la","Sanduíche, por favor. Eu não almocei direito.","Сэндвич, пожалуйста. Я толком не пообедала."],
 ["so","E aquele almoço com o voucher? Você só comeu salada!","А тот обед по ваучеру? Ты же съела только салат!"],
 ["la","É verdade, eu tava nervosa. Agora eu tô com fome.","Это правда, я нервничала. А теперь я проголодалась."],
 ["br","Atenção: vamos passar por uma área de turbulência. Permaneçam sentados.","Внимание: мы проходим зону турбулентности. Оставайтесь на местах."],
 ["la","Ai! O avião tá balançando muito!","Ой! Самолёт сильно трясёт!"],
 ["so","Segura a minha mão. É igual a ônibus em estrada de terra.","Держись за мою руку. Это как автобус на грунтовой дороге."],
 ["di","Calma, turbulência é normal. Eu sou piloto de drone, sei dessas coisas.","Спокойно, турбулентность — это нормально. Я пилот дрона, разбираюсь в этом."],
 ["so","Piloto de drone? Então segura o avião pra gente!","Пилот дрона? Тогда подержи самолёт для нас!"],
 ["la","Hahaha! Pronto, já parou. Obrigada pela mão, Dona Socorro.","Ха-ха-ха! Всё, уже прекратилось. Спасибо за руку, Дона Сокорру."],
 ["so","De nada. Agora me conta: o vestido é de que cor?","Не за что. А теперь расскажи: платье какого цвета?"],
 ["la","É verde-água, longo, com as costas abertas.","Цвета морской волны, длинное, с открытой спиной."],
 ["so","Ai, que chique! Recife inteiro vai olhar pra você.","Ой, как шикарно! Весь Ресифи будет на тебя смотреть."],
 ["la","Recife inteiro, não. Só os convidados!","Не весь Ресифи. Только гости!"],
 ["br","Senhores passageiros, iniciamos a descida para Recife. A temperatura local é de trinta graus.","Уважаемые пассажиры, мы начинаем снижение в Ресифи. Температура в городе — тридцать градусов."],
 ["la","Trinta graus! E o meu protetor solar ficou em Porto Alegre…","Тридцать градусов! А мой солнцезащитный крем остался в Порту-Алегри…"],
 ["so","Não tem problema. Amanhã eu te levo na farmácia do meu bairro.","Не проблема. Завтра я отведу тебя в аптеку в моём районе."]
 ],

{t:"Cadê minha mala?",ru:"Багажная лента пуста: заявление о пропаже",e:"🔍",
 lines:[
 ["la","A esteira parou… e a minha mala não apareceu.","Лента остановилась… а мой чемодан так и не появился."],
 ["so","A minha chegou. Como é a sua?","Мой приехал. А твой какой?"],
 ["la","Vermelha, de rodinhas, com uma fita amarela na alça.","Красный, на колёсиках, с жёлтой ленточкой на ручке."],
 ["so","Não vi nenhuma vermelha. Vamos no balcão de bagagens.","Красного я не видела. Пошли к стойке розыска багажа."],
 ["pr","Boa noite. Posso ajudar?","Добрый вечер. Чем могу помочь?"],
 ["la","Boa noite. A minha mala não chegou. Eu perdi a conexão em Guarulhos.","Добрый вечер. Мой чемодан не прилетел. Я опоздала на пересадку в Гуарульюсе."],
 ["pr","Entendi. Isso acontece quando a pessoa muda de voo. A senhora tem a etiqueta?","Понятно. Так бывает, когда человек меняет рейс. У вас есть багажная бирка?"],
 ["la","Tenho, tá colada atrás do cartão de embarque.","Есть, она приклеена на обороте посадочного."],
 ["pr","Ótimo. Deixa eu ver no sistema… Achei. A mala ficou em São Paulo.","Отлично. Сейчас посмотрю в системе… Нашла. Чемодан остался в Сан-Паулу."],
 ["la","Em São Paulo? Mas me disseram que ia junto!","В Сан-Паулу? Но мне сказали, что он полетит со мной!"],
 ["pr","Não deu tempo de transferir. Ela vem no primeiro voo de amanhã.","Не успели переложить. Он прилетит первым рейсом завтра."],
 ["la","E o que eu faço agora?","И что мне теперь делать?"],
 ["pr","A senhora preenche esse formulário. Eu ajudo.","Вы заполните этот бланк. Я помогу."],
 ["pr","Nome completo, telefone e o endereço onde a senhora vai ficar.","Полное имя, телефон и адрес, где вы остановитесь."],
 ["la","Vou ficar no hotel Mar Azul, em Boa Viagem.","Я остановлюсь в отеле «Мар Азул», в районе Боа-Виажень."],
 ["pr","Perfeito. A gente entrega a mala no hotel, sem custo.","Отлично. Мы доставим чемодан в отель бесплатно."],
 ["la","Que horas, mais ou menos?","Примерно во сколько?"],
 ["pr","Amanhã à tarde, mais ou menos. A senhora recebe uma mensagem antes.","Завтра во второй половине дня, примерно. Перед этим вам придёт сообщение."],
 ["pr","E o que tem dentro da mala?","А что внутри чемодана?"],
 ["la","Roupa, sapato, maquiagem… nada de especial.","Одежда, обувь, косметика… ничего особенного."],
 ["pr","Algum objeto de valor? Joia, eletrônico?","Какие-нибудь ценные вещи? Украшения, электроника?"],
 ["la","Não, graças a Deus. E o vestido do casamento tá aqui comigo!","Нет, слава богу. А платье для свадьбы — здесь, со мной!"],
 ["so","Viu? Foi a melhor decisão do dia: o vestido na mão.","Видишь? Лучшее решение за день — платье в руках."],
 ["pr","A senhora também tem direito a um kit de higiene. Tá aqui.","Вам также полагается гигиенический набор. Вот он."],
 ["la","Escova de dente, pasta, desodorante… e uma camiseta enorme!","Зубная щётка, паста, дезодорант… и огромная футболка!"],
 ["pr","Tamanho único. Serve pra dormir.","Один размер на всех. Сгодится, чтобы спать."],
 ["so","Serve pra dormir e pra dançar frevo!","Сгодится и спать, и танцевать фрево!"],
 ["la","Aqui está o formulário. Tá tudo certo?","Вот бланк. Всё правильно?"],
 ["pr","Tá. Esse é o número do seu processo. Com ele a senhora acompanha no site.","Да. Это номер вашего заявления. По нему вы сможете отслеживать на сайте."],
 ["la","Vou tirar uma foto. Obrigada, Priscila.","Сфотографирую. Спасибо, Присцила."],
 ["pr","De nada. Desculpa o transtorno e bem-vinda a Recife!","Не за что. Простите за неудобства и добро пожаловать в Ресифи!"],
 ["so","Agora vamos. Meu genro tá esperando lá fora. A gente te deixa no hotel.","А теперь пошли. Мой зять ждёт снаружи. Мы довезём тебя до отеля."],
 ["la","Dona Socorro, a senhora é a melhor coisa dessa viagem.","Дона Сокорру, вы — лучшее, что случилось в этой поездке."]
 ],

{t:"A mala chegou!",ru:"Курьер, ресепшн и проверка вещей",e:"📦",
 lines:[
 ["ed","Alô? É a senhora Lara? Aqui é o Edson, da entrega de bagagens.","Алло? Это сеньора Лара? Это Эдсон, из службы доставки багажа."],
 ["la","Sou eu! Bom dia, Edson! Você tá com a minha mala?","Это я! Доброе утро, Эдсон! Мой чемодан у вас?"],
 ["ed","Tô sim. Uma mala vermelha, com uma fita amarela. Confere?","Да. Красный чемодан с жёлтой ленточкой. Сходится?"],
 ["la","Confere! Que alegria! Você chega que horas?","Сходится! Какая радость! Во сколько вы приедете?"],
 ["ed","Tô a uns vinte minutos do hotel. O trânsito tá tranquilo.","Я минутах в двадцати от отеля. Пробок нет."],
 ["la","Ótimo. Eu espero na recepção.","Отлично. Я подожду на ресепшене."],
 ["ed","Combinado. Vou precisar do seu documento pra entregar, tá?","Договорились. Мне понадобится ваш документ, чтобы отдать, хорошо?"],
 ["la","Tá bom. Até já!","Хорошо. До скорого!"],

 if(popEl&&!e.target.closest('.pop'))closePop()},true);

/* exp: build the growing phrase */
function taskExp(box,idx,chain){const st=chain[X.stage],prev=X.stage>0?chain[X.stage-1]:null;
 const tgt=st[0].split(' ').filter(Boolean);const tl=tgt.map(w=>w.replace(/[.,!?]/g,''));
 let tiles;const pv=prev?prev[0].split(' '):null;let pos=-1;
 if(pv){for(let a=0;a+pv.length<=tl.length;a++){if(pv.every((w,j)=>tl[a+j]===w)){pos=a;break}}}
 if(pos>=0)tiles=[...tl.slice(0,pos),pv.join(' '),...tl.slice(pos+pv.length)];else tiles=tl.slice();
 const chunkTxt=pos>=0?pv.join(' '):null;
 tiles.push(st[2]);
 let order=shuf(tiles.map((t,n)=>n));let tries=0;while(tries++<8&&order.slice(0,tiles.length-1).every((v,n)=>v===n))order=shuf(order);
 box.innerHTML=`<div class="steps">${chain.map((_,n)=>`<span class="dot${n<=X.stage?' on':''}"></span>`).join('')}<span>Шаг ${X.stage+1} из ${chain.length} · задание ${X.pos+1} из ${X.list.length}</span></div>
 ${prev?`<div class="model"><div class="q">Было:</div><div class="row"><div class="pt">${wordsHTML(prev[0])}</div><button class="sb" id="pvS" aria-label="Послушать">🔊</button><button class="sb" id="pvG" aria-label="Перевод фразы">🌐</button></div><div class="tr" hidden>${esc(prev[1])}</div></div>`:''}
 <div class="q">Собери по-португальски:<br><b>«${esc(st[1])}»</b></div>
 <div class="ansbox" id="ab" aria-live="polite"></div>
 <div class="tiles" id="tl">${order.map(n=>`<button class="tile${tiles[n]===chunkTxt?' chunk':''}" data-n="${n}">${esc(tiles[n])}</button>`).join('')}</div>
 <div class="fb"></div>`;
 const ab=box.querySelector('#ab'),tlb=box.querySelector('#tl');let placed=[];
 const need=tl.length;
 const count=()=>placed.reduce((s,n)=>s+tiles[n].split(' ').length,0);
 const speakPrev=()=>{if(prev)say(prev[0],DV,()=>{})};
 bindExBar(speakPrev);
 if(prev){box.querySelector('#pvS').onclick=speakPrev;box.querySelector('#pvG').onclick=()=>{const t=box.querySelector('.model .tr');t.hidden=!t.hidden}}
 const nextStage=()=>{if(X.stage<chain.length-1){X.stage++;renderTask()}else{X.stage=0;X.pos++;renderTask()}};

function setWho(){const c=normCode(lsGet('code',''));EV_WHO=(!c||c===TEACHER)?'Дарья (тест)':(META.who||'Ученик')}
function startVisit(){setWho();setTimeout(()=>sendEvent('visit',document.title),800)}
if(META.gate&&!gateOk())showGate();else{home();startVisit()}
})();
</script>
