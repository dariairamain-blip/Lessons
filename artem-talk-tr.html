<style>

.wrap{max-width:560px;margin:0 auto;padding-block:0 var(--dockh,170px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}

h1{font:800 26px/1.15 var(--display);margin:4px 0 0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-weight:600;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{display:grid;gap:4px;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:12px;cursor:pointer;box-shadow:0 4px 0 var(--line);font:inherit}

.chat{display:grid;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg .av{font-size:30px;line-height:1;flex:none}
.bub{border-radius:18px 18px 18px 4px;padding:10px 12px;background:var(--card);border:2px solid var(--line);max-width:85%;min-width:0;display:grid;gap:6px}

.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.hint{font-size:13px;color:var(--muted);font-weight:600;margin:6px auto 0;max-width:560px}
.note{font-size:13.5px;color:var(--muted);font-weight:600;margin:0}

.help .ex{display:flex;gap:6px;align-items:flex-start}.help .ex small{display:block;color:var(--muted)}

.chip{border:2px solid #F2B632;background:#FFF6DC;color:#7A5200;border-radius:999px;padding:4px 10px;font:800 13.5px var(--body);cursor:pointer}
.help .x{margin-left:auto}
.msg.me .new{border-bottom:2px dotted currentColor}
.modal{position:fixed;inset:0;background:#0008;z-index:30;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--card);color:var(--ink);border-radius:18px;padding:16px;max-width:460px;max-height:86vh;overflow:auto;display:grid;gap:10px;font-size:15px;line-height:1.4}
.modal h2{margin:0;font-size:19px}.modal ol{margin:0;padding-left:20px;display:grid;gap:6px}.modal p{margin:0;color:var(--muted);font-size:14px}
.modal .box{position:relative;max-height:78vh;font-size:14.5px;padding-top:14px}.modal ol{font-size:14.5px;gap:4px}.modal h2{padding-right:40px;font-size:18px}
.modal .mx{position:sticky;top:0;justify-self:end;margin:-6px -6px -40px 0;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font:900 17px var(--body);cursor:pointer;z-index:2}
.modal .box > .ok:last-child{position:sticky;bottom:-16px;box-shadow:0 -8px 12px var(--card)}
.modal .ok{border:0;border-radius:14px;background:#6C3BF5;color:#fff;font:900 16px var(--body);padding:12px;cursor:pointer}
.mics{max-width:560px;margin:0 auto 8px;display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
.mic{border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:900 15px var(--body);min-height:48px;padding:6px 10px;cursor:pointer}
.mic.on{background:#E2482F;border-color:#E2482F;color:#fff;animation:pulse 1.2s ease-in-out infinite}

.codebox{display:grid;gap:10px}.codebox input{width:100%;min-width:0;box-sizing:border-box}.codebox input{font:800 20px var(--body);text-align:center;letter-spacing:.15em;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.mtag{display:block;margin-top:4px;font-size:12px;font-weight:800;color:var(--muted)}
.rep{display:grid;gap:8px}.rep h2{margin:0;font-size:19px}.rep .lv{font-weight:900;color:#6C3BF5}
.rep .mi{background:var(--fix);color:var(--fixink);border-radius:12px;padding:8px 10px;font-size:14px}
.rep .mi b{display:block}.rep .row{display:flex;gap:8px;flex-wrap:wrap}
.rep button.sec{border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 14px var(--body);border-radius:14px;padding:10px 12px;cursor:pointer;flex:1 1 auto}
.rep .day{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:left;background:var(--card);color:var(--ink);font:600 14px var(--body);cursor:pointer;display:grid;gap:2px}

.prog{margin-top:12px;width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);font:900 16px var(--body);border-radius:16px;padding:12px;cursor:pointer}
.dash{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:8px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.dash .st{display:flex;gap:10px;flex-wrap:wrap;font-weight:900;font-size:15px}
.dash small{color:var(--muted);font-weight:700;font-size:13px}
.barx{height:12px;background:var(--sel);border-radius:99px;overflow:hidden}.barx i{display:block;height:100%;background:linear-gradient(90deg,var(--sea),var(--pink));border-radius:99px}
.sit{background:var(--card);border:2px solid #F2B632;border-radius:18px;padding:12px;display:grid;gap:6px}
.sit .k{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#B7791F}
.sit b{font-size:16px}.sit small{color:var(--muted);font-weight:700;font-size:13.5px}
.sit button,.pbtn{border:0;border-radius:14px;background:var(--sea);color:#fff;font:900 15px var(--body);padding:10px 12px;cursor:pointer}
.tools2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools2 .tool:last-child:nth-child(odd){grid-column:1/-1}
.tool{border:2px solid var(--line);background:var(--card);color:var(--ink);font:900 14.5px var(--body);border-radius:14px;padding:11px 8px;cursor:pointer;min-height:48px}
.goal{background:#FFF6DC;color:#7A5200;border:2px solid #F2B632;border-radius:14px;padding:8px 10px;font-size:14px;font-weight:800}
.rep .card{min-width:min(260px,70vw);border:2px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px;text-align:center}
.rep .card .f{font:800 24px/1.2 var(--display);overflow-wrap:anywhere}.rep .card .bk{font-size:17px;color:var(--muted)}
.rep .vrow{display:flex;flex-wrap:wrap;gap:6px}.rep .vrow button{border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 13px var(--body);border-radius:999px;padding:6px 10px;cursor:pointer}

.rep input,.rep textarea{font:700 16px var(--body);border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}

.rep small{font-size:13px}
.addk{border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 13px var(--body);cursor:pointer;padding:4px 9px;border-radius:999px}
.bub .tools button.stopm{background:#E2482F;border-color:#E2482F;color:#fff}
.pv{max-width:560px;margin:0 auto 8px;display:flex;align-items:center;gap:8px;background:#FFF6DC;border:2px solid #F2B632;color:#7A5200;border-radius:14px;padding:8px 10px;font:800 14px var(--body)}
.pv span{flex:1}.pv button{border:2px solid #F2B632;background:#fff;color:#7A5200;border-radius:999px;font:900 14px var(--body);padding:6px 12px;cursor:pointer}
.gsel{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gsel button{font:800 15px var(--body);padding:8px 6px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.gsel button.on{border-color:#6D4AFF;background:#ECE6FF;color:#2A1A6E}
.opts{display:flex;flex-direction:column;gap:6px;margin:2px 0 6px 42px}
.opts .op{display:flex;align-items:center;gap:6px}
.opts .op button.say{flex:1;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 12px;font:800 15px var(--body);cursor:pointer}

.opts .op button.tr{border:0;background:none;font-size:15px;cursor:pointer;padding:4px}
.opts .op small{display:block;font:600 13px var(--body);color:var(--muted)}
.opts .hd{font:800 12.5px var(--body);color:var(--muted);letter-spacing:.02em}
.tgt{max-width:560px;margin:0 auto 8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#E9F7EF;border:2px solid #2E9E6A;color:#14532D;border-radius:14px;padding:8px 10px;font:800 14.5px var(--body)}
.tgt span{flex:1 1 180px}.tgt button{border:2px solid #2E9E6A;background:#fff;color:#14532D;border-radius:999px;font:800 13.5px var(--body);padding:5px 10px;cursor:pointer}
.warn{background:var(--fix);color:var(--fixink);border-radius:14px;padding:12px;font-size:14.5px}
</style>

async function cheap(prompt){ try{ return await sample.json(prompt, {modelTier: "quick", model: "haiku"}); }catch(e){ if(e && (e.code === "network" || e.code === "badcode")) throw e; return await sample.json(prompt, {modelTier: "quick"}); } }
const W1C = {};
async function oneWord(w, ctx){ const k = w.toLowerCase() + "|" + ctx; if(W1C[k]) return W1C[k]; const r = await cheap(W1(w, ctx)); const t = String(r.tr || "").trim(); if(!t) throw 0; return W1C[k] = t; }

// ---- repair an AI answer that is not clean JSON (extra commas, or cut off at the end)
function repairJSON(t){
  const i0 = t.indexOf("{"); if(i0 < 0) return null; let s = t.slice(i0);
  const tryP = x => { try{ return JSON.parse(x); }catch(e){ try{ return JSON.parse(x.replace(/,\s*([}\]])/g, "$1")); }catch(e2){ return null; } } };
  let st = [], inS = false, esc = false, safe = null;
  for(let i = 0; i < s.length; i++){ const c = s[i];
    if(inS){ if(esc) esc = false; else if(c === "\\") esc = true; else if(c === '"') inS = false; continue; }
    if(c === '"') inS = true;
    else if(c === "{" || c === "["){ st.push(c === "{" ? "}" : "]"); }
    else if(c === "}" || c === "]"){ st.pop(); safe = {i: i + 1, st: st.slice()}; if(!st.length){ const r = tryP(s.slice(0, i + 1)); if(r) return r; break; } }
    else if(c === ","){ safe = {i, st: st.slice()}; }
  }
  if(!safe) return null;
  return tryP(s.slice(0, safe.i) + safe.st.slice().reverse().join(""));
}

// ================= Daily summaries (one per date) =================
const DAYS = (() => {
  const KS = "artem_daysum", DAY = 864e5;
  const load = (k, d) => { try{ return JSON.parse(localStorage.getItem(k) || "null") || d; }catch(e){ return d; } };
  const store = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
  const dkey = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const dname = k => fromKey(k).toLocaleDateString("ru-RU", {day: "numeric", month: "long"});
  const btn = (txt, cls, fn) => { const x = h("button", cls || "sec", txt); x.type = "button"; x.onclick = fn; return x; };
  const reported = () => load("artem_sessions", []).filter(x => x.report);
  const byDay = () => { const g = {}; reported().forEach(x => { (g[dkey(x.date)] = g[dkey(x.date)] || []).push(x); }); return g; };
  const mins = k => Math.round(((load("artem_days", {})[k] || {}).s || 0) / 60);
  const DPROMPT = (k, reps) => `Daily summary of Artyom's Turkish conversation practice on ${k} (Russian speaker). Talk reports of this day:
${reps.map(r => r.hero + " | level " + r.report.level + " | topic: " + (r.report.topic || "") + " | mistakes: " + (r.report.mistakes || []).map(m => m.bad + "→" + m.good).join("; ") + " | words: " + (r.report.words || []).map(w => w[0] + "=" + w[1]).join(", ")).join("\n").slice(0, 6000)}
Reply in Russian with only JSON: {"level": "level of the day, e.g. A0+", "praise": "1–2 warm sentences: what went well today", "mistakes": [{"bad": "mistake", "good": "correct form", "why": "max 10 Russian words"}] (max 3, no repeats), "words": [["Turkish", "Russian"]] (max 8), "tip": "one tip for tomorrow, max 15 Russian words"}`;
  function fromOne(x){ const r = x.report; return {n: 1, level: r.level, praise: r.praise, mistakes: r.mistakes || [], words: r.words || [], tip: r.tip}; }
  async function make(k, reps){
    const D = load(KS, {});
    if(reps.length === 1){ D[k] = fromOne(reps[0]); store(KS, D); return D[k]; }
    const r = await sample.json(DPROMPT(k, reps), {modelTier: "quick"});
    D[k] = {n: reps.length, level: String(r.level || ""), praise: String(r.praise || ""), mistakes: Array.isArray(r.mistakes) ? r.mistakes.slice(0, 3) : [], words: Array.isArray(r.words) ? r.words.slice(0, 8) : [], tip: String(r.tip || "")};

    b.append(h("h2", "", "📅 " + dname(k) + (today ? " · сегодня" : "")), h("div", "", reps.length + " разг." + (mins(k) ? " · " + mins(k) + " мин" : "")));
    const draw = d => { const box = h("div", "rep");
      const lv = h("div", ""); lv.append("Уровень дня: "); lv.append(h("span", "lv", d.level || "—")); box.append(lv);
      if(d.praise) box.append(h("div", "", "🎉 " + d.praise));
      (d.mistakes || []).forEach(x => { const q = h("div", "mi"); q.append(h("span", "", "«" + x.bad + "» → "), h("b", "", x.good), h("small", "", x.why || "")); box.append(q); });
      if((d.words || []).length) box.append(h("div", "", "🆕 " + d.words.map(w => w[0] + " — " + w[1]).join(" · ")));
      if(d.tip) box.append(h("div", "", "👉 " + d.tip)); return box; };
    const slot = h("div", ""); b.append(slot);

    b.append(h("b", "", "💬 Разговоры этого дня"));
    reps.slice().sort((a, c) => a.id - c.id).forEach(x => { const d = h("button", "day"); d.type = "button";
      d.append(h("span", "", new Date(x.date).toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"}) + " · " + x.hero), h("small", "", "Уровень " + x.report.level + (x.report.topic ? " · " + x.report.topic : "")));

      x.onclick = () => dayModal(k, reps, show); b.append(x);
    });
  }
  return {list, auto};
})();
