<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Мой мир на новом языке</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-sized card per page, emoji tiles in a grid, sticky nav at the bottom */
:root{
  --bg:#eef3f7; --card:#ffffff; --ink:#14233a; --muted:#5c6b80;
  --sea:#1f5fa8; --sun:#f2b632; --sel:#e3eefb; --line:#d5dfea;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1724; --card:#16233a; --ink:#e8eef6; --muted:#9aa9bd;
  --sea:#6ea8ef; --sun:#f2b632; --sel:#1d3657; --line:#2a3b55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1724; --card:#16233a; --ink:#e8eef6; --muted:#9aa9bd;
  --sea:#6ea8ef; --sun:#f2b632; --sel:#1d3657; --line:#2a3b55; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;padding-block:12px 96px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:15px}
.logo{width:30px;height:30px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;font-size:13px;letter-spacing:.5px}
.prog{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;max-width:160px}
.prog i{display:block;height:100%;background:var(--sun);transition:width .3s}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--sea);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.15;margin:2px 0 0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;line-height:1.4}
.grp{font-weight:700;margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.g2 .tile{flex-direction:row;justify-content:flex-start;text-align:left;padding:8px 8px;gap:6px;font-size:12.5px}
.g2 .tile .e{font-size:20px}
.more{align-self:stretch;background:var(--card);border:2px dashed var(--sea);color:var(--sea);border-radius:12px;padding:10px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.more.less{border-style:solid;border-color:var(--line);color:var(--muted)}
.cnt{font-size:12px;color:var(--muted);text-align:center;margin-top:-2px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:7px 4px 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:inherit;color:inherit;
  font-size:12.5px;line-height:1.2;text-align:center;position:relative;min-width:0}
.tile .e{font-size:28px;line-height:1.1}
.g4 .tile .e{font-size:24px}
.g4 .tile{font-size:11.5px}
.tile[aria-pressed="true"]{border-color:var(--sea);background:var(--sel)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:3px;right:5px;width:17px;height:17px;border-radius:50%;
  background:var(--sea);color:var(--card);font-size:11px;display:grid;place-items:center;font-weight:700}
.tile:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input[type=text],textarea{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font:inherit;padding:9px 11px}
textarea{min-height:90px;resize:vertical}
.skip{align-self:flex-start;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:2px 0;text-decoration:underline}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav div{max-width:520px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.btn.pri{background:var(--sea);color:var(--card)}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--line);flex:0 0 32%}
.hero{background:var(--card);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.hero .big{font-size:46px}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps span{background:var(--sel);border-radius:999px;padding:5px 10px;font-size:13px}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:13px;line-height:1.45;max-height:46vh;overflow:auto}
.copied{color:var(--sea);font-weight:700;min-height:1.2em}
.own{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.vbtn{align-self:flex-start;background:var(--sel);border:0;border-radius:999px;color:var(--sea);font:inherit;font-weight:700;font-size:13px;padding:6px 12px;cursor:pointer}
.tile.cur{outline:3px solid var(--sun);outline-offset:1px}
body.vmode .wrap{padding-bottom:250px}
.vp{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--sun);
  box-shadow:0 -4px 14px rgba(0,0,0,.08);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));z-index:5}
.vp>div{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.vp .vh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:8px}
.vp .vl{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.2;min-height:1.2em}
.vp .vr{display:flex;gap:8px}
.vp .vr button{flex:1;border:0;border-radius:12px;padding:12px 6px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.vp .yes{background:#2e8b57;color:#fff}.vp .no{background:#c8453c;color:#fff}
.vp .sm{flex:0 0 52px!important;background:var(--sel);color:var(--ink)}
.vp .st{font-size:12.5px;color:var(--muted);min-height:1.2em}
.vp .off{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
.ov{position:fixed;inset:0;background:rgba(10,20,35,.55);display:grid;place-items:center;z-index:9;padding:16px}
.ov .box{background:var(--card);border-radius:18px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px}
.ov .box .btn{flex:none}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand"><span class="logo">DB</span>Daria Botina</div>
    <div class="prog" aria-hidden="true"><i id="bar"></i></div>
  </div>
  <main id="page"></main>
  <div class="own">© Собственность Daria Botina</div>
</div>
<div class="vp" id="vp" hidden><div>

  <div class="vl" id="vlab"></div>
  <div class="vr"><button type="button" class="yes" id="vyes">✅ Да</button><button type="button" class="no" id="vno">❌ Нет</button>
    <button type="button" class="sm" id="vrep" aria-label="Повторить">🔁</button><button type="button" class="sm" id="vpau" aria-label="Пауза">⏸</button></div>
  <div class="vh"><span class="st" id="vst"></span><button type="button" class="off" id="voff">📖 Выключить озвучку</button></div>
</div></div>
<div class="ov" id="ov" hidden><div class="box" id="ovb"></div></div>
<nav class="nav"><div>
  <button class="btn sec" id="back" type="button">← Назад</button>
  <button class="btn pri" id="next" type="button">Далее →</button>
</div></nav>

let ans={},i=0;const OPEN={};let MODE=null,VP=0;
try{ans=JSON.parse(localStorage.getItem("anketa-ru")||"{}");i=+localStorage.getItem("anketa-ru-i")||0;MODE=localStorage.getItem("anketa-ru-mode");VP=+localStorage.getItem("anketa-ru-vp")||0}catch(e){}
if(i>=PAGES.length)i=0;
const $=s=>document.querySelector(s);
function save(){try{localStorage.setItem("anketa-ru",JSON.stringify(ans));localStorage.setItem("anketa-ru-i",i);localStorage.setItem("anketa-ru-vp",VP);if(MODE)localStorage.setItem("anketa-ru-mode",MODE)}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function summary(){
  let out="📝 Анкета: "+((ans[1]&&ans[1].txt)||"(без имени)")+"\n";
  PAGES.forEach((p,pi)=>{
    if(!p.t||p.name)return;
    const a=ans[pi]||{};const sel=(a.sel||[]);const txt=(a.txt||"").trim();
    if(!sel.length&&!txt)return;
    out+="\n▸ "+p.t+"\n";
    if(sel.length)out+=sel.join(", ")+"\n";
    if(txt)out+="✍️ "+txt+"\n";
  });
  return out;
}

function render(keep){
  const p=PAGES[i];
  $("#bar").style.width=(i/(PAGES.length-1)*100)+"%";
  $("#back").hidden=i===0;

    h=`<div class="hero"><div class="big">👋🌍</div>

      <p class="sub">Правильных и неправильных ответов нет. В конце скопируй результат и отправь преподавателю.</p></div>`;
  }else if(p.final){
    const s=summary();
    h=`<div class="eyebrow">Готово 🎉</div><h1>Спасибо!</h1>
      <p class="sub">Скопируй результат и отправь его преподавателю в мессенджере. По нему будут готовиться твои личные уроки.</p>
      <div class="res" id="res">${esc(s)}</div>
      <button class="btn pri" id="copy" type="button">📋 Скопировать результат</button>
      <div class="copied" id="copied" aria-live="polite"></div>`;
  }else{
    const a=ans[i]||(ans[i]={sel:[],txt:""});

    if(p.groups&&MODE!=="voice")h+=`<button type="button" class="vbtn" id="von">🎧 Озвучить варианты</button>`;
    (p.groups||[]).forEach((g,gi)=>{
      if(g.q)h+=`<p class="grp">${g.q}</p>`;
      const key=(g.q?g.q+": ":""),per=g.per||g.items.length,pages=Math.ceil(g.items.length/per),ok=i+"-"+gi;
      if(OPEN[ok]==null){let need=1;g.items.forEach(([e,l],ix)=>{if(a.sel.includes(key+l))need=Math.max(need,Math.floor(ix/per)+1)});OPEN[ok]=need}
      const shown=g.items.slice(0,OPEN[ok]*per);
      h+=`<div class="grid${p.cols4?" g4":p.cols2?" g2":""}">`+shown.map(([e,l])=>{
        const k=key+l;
        return `<button type="button" class="tile" data-k="${esc(k)}" aria-pressed="${a.sel.includes(k)}"><span class="e">${e}</span>${esc(l)}</button>`}).join("")+`</div>`;
      if(pages>1){
        const left=g.items.length-shown.length;
        h+=left>0?`<button type="button" class="more" data-g="${ok}" data-d="1">▾ Показать ещё (${Math.min(left,per)} из ${left}) · стр. ${OPEN[ok]}/${pages}</button>`
                 :`<button type="button" class="more less" data-g="${ok}" data-d="0">▴ Свернуть</button>`;
      }
    });
    if(p.name)h+=`<input type="text" id="t${i}" placeholder="Имя" value="${esc(a.txt)}">`;
    if(p.text)h+=`<input type="text" id="t${i}" placeholder="${esc(p.text)}" value="${esc(a.txt)}">`;
    if(p.area)h+=`<textarea id="t${i}" placeholder="${esc(p.area)}">${esc(a.txt)}</textarea>`;
    h+=`<button type="button" class="skip" id="skip">⏭ Пропустить эту страницу</button>`;
  }
  const m=$("#page");m.innerHTML=`<div style="display:flex;flex-direction:column;gap:9px">${h}</div>`;
  m.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
    const a=ans[i],k=b.dataset.k,on=a.sel.includes(k);
    a.sel=on?a.sel.filter(x=>x!==k):[...a.sel,k];b.setAttribute("aria-pressed",!on);save();
  });
  m.querySelectorAll(".more").forEach(b=>b.onclick=()=>{
    const k=b.dataset.g;
    if(b.dataset.d==="1"){OPEN[k]++;const y=b.getBoundingClientRect().top+scrollY;render(true);window.scrollTo(0,y-80)}
    else{OPEN[k]=1;render(true);const g=m.querySelector('[data-g="'+k+'"]');if(g)g.scrollIntoView({block:"center"})}
  });
  const t=$("#t"+i);if(t)t.oninput=()=>{ans[i].txt=t.value;save()};
  const sk=$("#skip");if(sk)sk.onclick=()=>go(1);
  const vo=$("#von");if(vo)vo.onclick=()=>voiceOn();
  const c=$("#copy");if(c)c.onclick=()=>{
    const s=summary();
    const done=()=>{$("#copied").textContent="✅ Скопировано! Вставь в чат с преподавателем."};
    const fallback=()=>{const r=document.createRange();r.selectNodeContents($("#res"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
      $("#copied").textContent="Текст выделен — нажми и удерживай, затем «Скопировать»."};
    try{navigator.clipboard.writeText(s).then(done,fallback)}catch(e){fallback()}
  };
  if(!keep)window.scrollTo(0,0);
}
function go(d){vStop();i=Math.max(0,Math.min(PAGES.length-1,i+d));VP=0;save();render();if(MODE==="voice"&&VRUN)setTimeout(step,250)}
$("#next").onclick=()=>{if(PAGES[i].final){vStop();i=0;VP=0;save();render()}else if(PAGES[i].intro&&!MODE)offer();else go(1)};
$("#back").onclick=()=>go(-1);
/* ---------- voice mode: reads question + every option, answer "да"/"нет" by voice or buttons ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let VRUN=false,TOK=0,REC=null,WAIT=false,NOMIC=false,RETRY=0;
function ruVoice(){const v=(speechSynthesis.getVoices()||[]).filter(x=>/^ru/i.test(x.lang));return v.find(x=>/google|milena|yandex/i.test(x.name))||v[0]||null}
function sayable(s){return String(s).replace(/\((-?[а-яё]{1,4}|-[^)]*)\)/gi,"").replace(/\s*\(([^)]*)\)/g,", $1").replace(/[«»"]/g,"").replace(/\s*\/\s*/g," или ").replace(/[^\p{L}\p{N}\s.,:;!?–—-]/gu,"").replace(/\s+/g," ").trim()}
function speak(t,cb){
  const my=++TOK;let done=false;const fin=()=>{if(done||my!==TOK)return;done=true;cb&&cb()};
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(sayable(t));u.lang="ru-RU";const v=ruVoice();if(v)u.voice=v;u.rate=1;
    u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)}catch(e){}
  setTimeout(fin,Math.max(2500,sayable(t).length*95+1800));
}
function flat(p){const r=[];(p.groups||[]).forEach((g,gi)=>g.items.forEach(([e,l],ix)=>r.push({gi,ix,q:g.q||"",l,k:(g.q?g.q+": ":"")+l,per:g.per||g.items.length})));return r}
function setStatus(t){const s=$("#vst");if(s)s.textContent=t}
function panel(show){$("#vp").hidden=!show;document.body.classList.toggle("vmode",!!show)}
function vStop(){TOK++;WAIT=false;try{speechSynthesis.cancel()}catch(e){}if(REC){try{REC.onend=null;REC.abort()}catch(e){}REC=null}$("#vmic").textContent=""}
function voiceOn(){MODE="voice";VRUN=true;save();render();step()}
function voiceOff(){vStop();VRUN=false;MODE="read";save();panel(false);render(true)}
function pause(){if(VRUN){VRUN=false;vStop();$("#vpau").textContent="▶";setStatus("Пауза. Нажми ▶, чтобы продолжить.")}else{VRUN=true;$("#vpau").textContent="⏸";step()}}
function hilite(k){document.querySelectorAll(".tile.cur").forEach(t=>t.classList.remove("cur"));
  const t=[...document.querySelectorAll(".tile")].find(x=>x.dataset.k===k);if(t){t.classList.add("cur");t.scrollIntoView({block:"center",behavior:"smooth"})}return t}
function step(){
  if(MODE!=="voice"||!VRUN)return;
  const p=PAGES[i];panel(true);$("#vpau").textContent="⏸";
  const yn=on=>{$("#vyes").disabled=!on;$("#vno").disabled=!on};
  if(p.intro){go(1);return}
  if(p.final){yn(false);$("#vpos").textContent="🎧 Готово";$("#vlab").textContent="Спасибо! 🎉";speak("Готово, спасибо! Нажми кнопку «Скопировать результат» и отправь его преподавателю.");setStatus("");return}
  const items=flat(p);
  if(!items.length){yn(false);$("#vpos").textContent="🎧 "+p.lvl;$("#vlab").textContent="✍️ Напиши ответ";
    setStatus("Напиши ответ и нажми «Далее» — озвучка продолжится.");speak(p.t+" "+p.s+" Напиши ответ и нажми Далее.");return}
  if(VP>=items.length){
    yn(false);$("#vlab").textContent="➡️ Дальше";
    const msg=p.text?"Если хочешь, допиши ответ своими словами — можно и позже. Переходим к следующему вопросу.":"Переходим к следующему вопросу.";
    speak(msg,()=>{if(VRUN)go(1)});return}
  const it=items[VP],ok=i+"-"+it.gi,need=Math.floor(it.ix/it.per)+1;
  if((OPEN[ok]||1)<need){OPEN[ok]=need;render(true)}
  hilite(it.k);yn(true);
  const sel=(ans[i]&&ans[i].sel||[]).includes(it.k);
  $("#vpos").textContent=`🎧 Вариант ${VP+1} из ${items.length}`;$("#vlab").textContent=it.l;
  let pre="";
  if(VP===0||!STARTED)pre=(STARTED?"":"Продолжаем. ")+p.t+" Отвечай да или нет. ";
  if(it.q&&(VP===0||!STARTED||it.gi!==items[VP-1].gi))pre+=it.q+". ";
  STARTED=true;
  setStatus("");
  speak(pre+it.l+(sel?". Уже отмечено.":"")+"?",()=>listen());
}
let STARTED=true;
function answer(yes){
  if(MODE!=="voice")return;vStop();
  const p=PAGES[i],items=flat(p),it=items[VP];if(!it)return;
  const a=ans[i]||(ans[i]={sel:[],txt:""}),on=a.sel.includes(it.k);
  if(yes&&!on)a.sel.push(it.k);if(!yes&&on)a.sel=a.sel.filter(x=>x!==it.k);
  const t=[...document.querySelectorAll(".tile")].find(x=>x.dataset.k===it.k);if(t)t.setAttribute("aria-pressed",yes);
  VP++;save();setStatus(yes?"✅ Записано":"➡️ Дальше");
  VRUN=true;setTimeout(step,yes?450:250);
}
function parse(t){
  const w=t.toLowerCase().replace(/ё/g,"е").split(/[^a-zа-я]+/).filter(Boolean);
  const has=a=>w.some(x=>a.includes(x));
  if(has(["стоп","пауза","хватит","подожди"]))return"stop";
  if(w.some(x=>x.startsWith("повтор")))return"rep";
  if(has(["нет","неа","не","no","nope","дальше","пропусти","пропустить","следующий","мимо"]))return"no";
  if(has(["да","ага","угу","конечно","yes","ок","окей","давай","точно","верно","записывай","отметь"]))return"yes";
  return null;
}
function listen(){
  if(!VRUN)return;WAIT=true;
  if(!SR||NOMIC){setStatus("Нажми ✅ Да или ❌ Нет");return}
  const my=TOK;
  try{REC=new SR();REC.lang="ru-RU";REC.interimResults=false;REC.maxAlternatives=3;REC.continuous=false}catch(e){NOMIC=true;setStatus("Нажми ✅ Да или ❌ Нет");return}
  let got=false;
  REC.onresult=e=>{const alts=[...e.results[0]].map(r=>r.transcript);let c=null;for(const t of alts){c=parse(t);if(c)break}
    if(!c){setStatus("Не расслышал: «"+alts[0]+"». Скажи «да» или «нет».");return}
    got=true;RETRY=0;
    if(c==="yes")answer(true);else if(c==="no")answer(false);else if(c==="rep"){vStop();step()}else if(c==="stop")pause();};
  REC.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){NOMIC=true;$("#vmic").textContent="";setStatus("Микрофон не разрешён — отвечай кнопками ✅ / ❌")}};
  REC.onend=()=>{$("#vmic").textContent="";REC=null;if(!got&&WAIT&&VRUN&&my===TOK&&!NOMIC){if(++RETRY<=4)setTimeout(()=>{if(WAIT&&VRUN&&my===TOK)listen()},250);else{RETRY=0;setStatus("Нажми ✅ Да или ❌ Нет (или 🔁, чтобы послушать снова)")}}};
  try{REC.start();$("#vmic").textContent="🎙️ слушаю…";setStatus("Скажи «да» или «нет»")}catch(e){setStatus("Нажми ✅ Да или ❌ Нет")}
}
$("#vyes").onclick=()=>answer(true);$("#vno").onclick=()=>answer(false);
$("#vrep").onclick=()=>{vStop();VRUN=true;STARTED=true;step()};$("#vpau").onclick=pause;$("#voff").onclick=voiceOff;
document.addEventListener("click",e=>{const t=e.target.closest(".tile");if(t&&MODE==="voice"&&VRUN){const items=flat(PAGES[i]);const n=items.findIndex(x=>x.k===t.dataset.k);if(n===VP&&n>=0){/* tap on current option = answered by tap */vStop();VP++;save();setTimeout(step,350)}}});
function overlay(html){$("#ovb").innerHTML=html;$("#ov").hidden=false}
function closeOv(){$("#ov").hidden=true}
function offer(){
  overlay(`<div style="font-size:40px">🎧</div><h1 style="font-size:21px">Озвучить вопросы и варианты?</h1>
   <p class="sub">Я буду читать каждый вариант вслух, а ты отвечаешь голосом «да» или «нет» (или кнопками). Удобно на ходу, в наушниках. Экран телефона при этом не выключай.</p>
   <button class="btn pri" id="o1" type="button">🎧 Да, озвучить</button>
   <button class="btn sec" id="o2" type="button">📖 Нет, буду читать сам(а)</button>
   <p class="sub" style="font-size:12.5px">Озвучку можно включить или выключить на любой странице.</p>`);
  $("#o1").onclick=()=>{closeOv();MODE="voice";VRUN=true;STARTED=true;save();go(1)};
  $("#o2").onclick=()=>{closeOv();MODE="read";save();go(1)};
}
function welcome(){
  const p=PAGES[i];
  const done=Object.values(ans).filter(a=>a&&((a.sel&&a.sel.length)||(a.txt&&a.txt.trim()))).length;
  if(!(i>0&&!p.final))return;
  const items=flat(p),where=p.t?`«${esc(p.t)}»`+(MODE==="voice"&&VP>0&&VP<items.length?`, вариант ${VP+1} из ${items.length}`:""):"";
  overlay(`<div style="font-size:40px">👋</div><h1 style="font-size:21px">С возвращением!</h1>
   <p class="sub">Все ответы сохранены (заполнено вопросов: ${done}). Продолжим с места, где ты остановился(-ась): ${where}.</p>
   <button class="btn pri" id="w1" type="button">${MODE==="voice"?"🎧 Продолжить с озвучкой":"▶ Продолжить"}</button>
   ${MODE==="voice"?`<button class="btn sec" id="w2" type="button">📖 Продолжить без звука</button>`:`<button class="btn sec" id="w2" type="button">🎧 Продолжить с озвучкой</button>`}
   <button class="skip" id="w3" type="button">↩ К началу анкеты (ответы останутся)</button>`);
  const v=()=>{closeOv();MODE="voice";VRUN=true;STARTED=false;save();render();step()};
  const r=()=>{closeOv();MODE="read";VRUN=false;save();render()};
  $("#w1").onclick=MODE==="voice"?v:r;$("#w2").onclick=MODE==="voice"?r:v;
  $("#w3").onclick=()=>{closeOv();i=0;VP=0;save();render()};
}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
render();
welcome();
</script>

</body>
</html>
