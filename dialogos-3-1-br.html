{t:"Visitando o apartamento",ru:"Смотрим квартиру с агентом",e:"🔑",
 lines:[
 ["ro","Oi, Vera! Achou fácil o prédio?","Привет, Вера! Легко нашла дом?"],
 ["v","Achei, sim! O motorista do Uber conhecia a rua.","Да, нашла! Водитель Uber знал эту улицу."],
 ["ro","Que bom. É no terceiro andar. Vamos de elevador?","Хорошо. Это на третьем этаже. Поедем на лифте?"],
 ["v","Vamos. O prédio parece bem tranquilo.","Поехали. Дом кажется очень спокойным."],
 ["ro","É, sim. Aqui moram muitas famílias e alguns aposentados.","Да. Здесь живёт много семей и несколько пенсионеров."],
 ["ro","Pronto, chegamos. Pode entrar!","Всё, пришли. Можешь заходить!"],
 ["v","Nossa, que sala clara! Bate muito sol aqui?","Ого, какая светлая гостиная! Здесь много солнца?"],
 ["ro","De manhã bate sol na sala inteira. À tarde fica mais fresquinho.","Утром солнце во всей гостиной. Днём становится прохладнее."],
 ["v","E cadê a famosa vista pro mar?","А где же знаменитый вид на море?"],
 ["ro","Vem cá, na varanda. Olha ali, entre os dois prédios!","Иди сюда, на балкон. Смотри вон туда, между двумя домами!"],
 ["v","Haha, é um pedacinho de mar bem pequenininho!","Ха-ха, это совсем крошечный кусочек моря!"],
 ["ro","Mas é mar! No anúncio não é mentira, viu?","Но это же море! В объявлении нет обмана, видишь?"],
 ["v","Tá bom, tá bom. E a cozinha?","Ладно, ладно. А кухня?"],
 ["ro","A cozinha é americana. Tem geladeira, fogão, micro-ondas e máquina de lavar.","Кухня совмещена с гостиной. Есть холодильник, плита, микроволновка и стиральная машина."],
 ["v","Ótimo. O fogão é a gás?","Отлично. Плита газовая?"],
 ["ro","É a gás, de botijão. Quando acabar, você liga e eles trazem um novo.","Газовая, с баллоном. Когда закончится, звонишь — и привозят новый."],
 ["v","E o banheiro? Posso ver?","А ванная? Можно посмотреть?"],
 ["ro","Claro. O chuveiro é elétrico, como na maioria das casas no Brasil.","Конечно. Душ электрический, как в большинстве домов в Бразилии."],
 ["v","Chuveiro elétrico? Isso é seguro?","Электрический душ? Это безопасно?"],
 ["ro","É seguro, sim. Só não mexe nele com a mão molhada, haha.","Безопасно, да. Только не трогай его мокрой рукой, ха-ха."],
 ["v","Vou lembrar disso! Tem ar-condicionado no quarto?","Запомню! В спальне есть кондиционер?"],
 ["ro","Tem, no quarto e na sala. No verão aqui faz muito calor.","Есть, в спальне и в гостиной. Летом здесь очень жарко."],
 ["v","E esse cantinho perto da janela? Dá pra colocar uma mesa?","А этот уголок у окна? Можно поставить туда стол?"],
 ["ro","Dá, sim. Já tem uma mesa e uma cadeira no depósito. É o seu escritório!","Можно, да. Стол и стул уже есть в кладовке. Вот твой кабинет!"],
 ["v","Perfeito. E a internet? Qual é a velocidade?","Идеально. А интернет? Какая скорость?"],
 ["ro","É fibra, trezentos mega. Dá pra fazer videochamada sem problema.","Оптоволокно, триста мегабит. Можно делать видеозвонки без проблем."],
 ["v","Isso é muito importante pra mim. E o barulho? A rua é movimentada?","Это очень важно для меня. А шум? Улица оживлённая?"],
 ["ro","De dia passa um ou outro carro. De noite é bem silencioso.","Днём проезжает разве что одна-две машины. Ночью очень тихо."],
 ["v","Tem vaga de garagem?","Есть место на парковке?"],
 ["ro","Tem uma vaga, mas você não tem carro, né?","Есть одно место, но у тебя ведь нет машины?"],
 ["v","Não tenho. Mas talvez eu alugue uma bicicleta.","Нет. Но, может быть, я возьму в аренду велосипед."],
 ["ro","Então a vaga é da bicicleta! E aí, o que achou?","Тогда место для велосипеда! Ну что, как тебе?"],
 ["v","Gostei muito! Quanto é o aluguel?","Мне очень понравилось! Сколько стоит аренда?"],
 ["ro","Três mil e duzentos com tudo. Mas o dono é gente boa. Quer conversar com ele?","Три тысячи двести со всем. Но хозяин хороший человек. Хочешь поговорить с ним?"]
 ],

{t:"Negociando com o dono",ru:"Торгуемся с хозяином о цене и залоге",e:"🤝",
 lines:[
 ["va","Boa tarde, Vera! O Rodrigo me falou muito de você.","Добрый день, Вера! Родригу мне много о тебе рассказывал."],
 ["v","Boa tarde, Seu Valdir! Coisas boas, espero.","Добрый день, сеу Валдир! Надеюсь, хорошее."],
 ["va","Só coisas boas! Gostou do apartamento?","Только хорошее! Тебе понравилась квартира?"],
 ["v","Gostei muito. Mas o preço está um pouco acima do meu orçamento.","Очень понравилась. Но цена немного выше моего бюджета."],
 ["va","Hum. Quanto você pensou em pagar?","Хм. Сколько ты думала платить?"],
 ["v","Eu pensei em dois mil e oitocentos, com tudo incluído.","Я думала о двух тысячах восьмистах, всё включено."],
 ["va","Dois e oitocentos? Assim você me quebra, minha filha!","Две восемьсот? Так ты меня разоришь, дочка!"],
 ["v","Haha! Mas eu sou uma inquilina tranquila. Não faço festa, não tenho cachorro...","Ха-ха! Но я спокойная жилица. Вечеринок не устраиваю, собаки нет…"],
 ["va","E fuma?","А куришь?"],
 ["v","Não, nunca fumei. E trabalho em casa, então cuido bem do apartamento.","Нет, никогда не курила. И я работаю дома, так что буду хорошо следить за квартирой."],
 ["va","Isso é bom. O último inquilino quebrou duas cadeiras e sumiu.","Это хорошо. Прошлый жилец сломал два стула и исчез."],
 ["v","Nossa! Eu prometo não quebrar nada.","Ничего себе! Обещаю ничего не ломать."],
 ["va","Vamos fazer assim: três mil, com internet incluída. Fechado?","Давай так: три тысячи, интернет включён. Договорились?"],
 ["v","Pode ser dois mil e novecentos? Aí eu fecho hoje.","Может, две тысячи девятьсот? Тогда я подпишу сегодня."],
 ["va","Você negocia melhor que a minha mulher! Tá bom, dois e novecentos.","Ты торгуешься лучше моей жены! Ладно, две девятьсот."],
 ["v","Muito obrigada! E como funciona a garantia?","Большое спасибо! А как работает гарантия?"],
 ["va","Normalmente eu peço fiador. Você tem alguém aqui que possa ser fiador?","Обычно я прошу поручителя. У тебя есть здесь кто-нибудь, кто может стать поручителем?"],
 ["v","Não tenho. Eu não conheço quase ninguém no Brasil ainda.","Нет. Я пока почти никого не знаю в Бразилии."],
 ["va","Então pode ser caução. São três meses de aluguel adiantado.","Тогда можно залог. Это три месяца аренды вперёд."],
 ["v","Três meses de uma vez? É bastante dinheiro.","Три месяца сразу? Это довольно много денег."],
 ["va","Eu sei. Mas no fim do contrato eu devolvo tudo, se estiver tudo certo.","Я знаю. Но в конце договора я всё верну, если всё будет в порядке."],
 ["v","E tem outra opção?","А есть другой вариант?"],
 ["va","Tem o seguro-fiança. Você paga um valor por mês para uma seguradora.","Есть страховка вместо поручителя. Ты платишь сумму каждый месяц страховой компании."],
 ["v","Acho que a caução é melhor. Pelo menos o dinheiro volta pra mim.","Думаю, залог лучше. По крайней мере, деньги ко мне вернутся."],
 ["va","Concordo. E as contas de luz e gás ficam no seu nome, tá?","Согласен. А счета за свет и газ будут на твоё имя, хорошо?"],
 ["v","Tudo bem. E se precisar consertar alguma coisa?","Хорошо. А если нужно будет что-то починить?"],
 ["va","Problema da casa é comigo: cano, chuveiro, geladeira. Lâmpada é com você, haha.","Проблемы с домом — ко мне: трубы, душ, холодильник. Лампочки — на тебе, ха-ха."],
 ["v","Justo! Posso pagar o aluguel por Pix?","Справедливо! Могу платить аренду через Pix?"],
 ["va","Pode, até o dia cinco de cada mês.","Можно, до пятого числа каждого месяца."],
 ["v","Combinado. Quando a gente assina o contrato?","Договорились. Когда мы подписываем договор?"],
 ["va","Amanhã, na imobiliária. O Rodrigo prepara tudo.","Завтра, в агентстве. Родригу всё подготовит."],
 ["v","Ótimo. Foi um prazer, Seu Valdir!","Отлично. Было приятно, сеу Валдир!"],
 ["va","O prazer foi meu. E cuida bem das minhas cadeiras, hein!","Взаимно. И береги мои стулья, слышишь!"]
 ],

{t:"O contrato e as chaves",ru:"Подписываем договор и получаем ключи",e:"📝",
 lines:[
 ["ro","Bom dia, Vera! Trouxe os documentos?","Доброе утро, Вера! Принесла документы?"],
 ["v","Trouxe! Passaporte e CPF. Precisa de mais alguma coisa?","Принесла! Паспорт и CPF. Нужно что-нибудь ещё?"],
 ["ro","Só um comprovante de renda. Pode ser um extrato do banco.","Только подтверждение дохода. Можно выписку из банка."],
 ["v","Tenho aqui no celular. Posso te mandar por e-mail?","У меня есть в телефоне. Могу прислать тебе по почте?"],
 ["ro","Pode. Enquanto isso, vamos ler o contrato juntos.","Можно. Пока что давай вместе прочитаем договор."],
 ["v","Boa ideia. Meu português ainda não é perfeito.","Хорошая мысль. Мой португальский пока не идеальный."],
 ["ro","Fica tranquila. Aqui diz: prazo de seis meses, de primeiro de março a trinta e um de agosto.","Не волнуйся. Тут написано: срок шесть месяцев, с первого марта по тридцать первое августа."],
 ["v","Certo. E se eu quiser ficar mais tempo?","Хорошо. А если я захочу остаться подольше?"],
 ["ro","É só avisar com trinta dias de antecedência e a gente renova.","Нужно просто предупредить за тридцать дней, и мы продлим."],
 ["v","E se eu precisar sair antes?","А если мне придётся уехать раньше?"],
 ["ro","Aí tem uma multa de um mês de aluguel. Está nessa cláusula aqui.","Тогда штраф в размере месячной аренды. Это вот в этом пункте."],
 ["v","Entendi. Espero não precisar disso!","Поняла. Надеюсь, это не понадобится!"],
 ["ro","Agora a vistoria. Eu tirei fotos de tudo: paredes, móveis, eletrodomésticos.","Теперь осмотр. Я сфотографировал всё: стены, мебель, бытовую технику."],
 ["v","Pra que serve a vistoria?","Для чего нужен осмотр?"],
 ["ro","No fim do contrato, a gente compara. Se estiver igual, você recebe a caução de volta.","В конце договора мы сравним. Если всё будет так же, ты получишь залог обратно."],
 ["v","Olha, nessa foto o sofá já tem uma mancha.","Смотри, на этой фотографии на диване уже есть пятно."],
 ["ro","Boa! Vou anotar: mancha no sofá, já existia. Assim ninguém briga depois.","Молодец! Запишу: пятно на диване, было раньше. Так потом никто не будет спорить."],
 ["v","E as regras do condomínio?","А правила дома?"],
 ["ro","Silêncio depois das dez da noite e o lixo reciclável vai na lixeira azul.","Тишина после десяти вечера, а мусор на переработку — в синий бак."],
 ["v","Posso receber visitas?","Можно принимать гостей?"],
 ["ro","Claro! Só avisa o porteiro, pra ele liberar a entrada.","Конечно! Только предупреди консьержа, чтобы он пропустил."],
 ["v","Tem porteiro vinte e quatro horas?","Консьерж работает круглосуточно?"],
 ["ro","Tem. O Bruno trabalha de dia e o Seu Nilo de noite.","Да. Бруно работает днём, а сеу Нилу — ночью."],
 ["v","Ótimo, me sinto mais segura assim. Onde eu assino?","Отлично, так я чувствую себя спокойнее. Где мне подписать?"],
 ["ro","Aqui, aqui e aqui. E rubrica em todas as páginas.","Здесь, здесь и здесь. И инициалы на всех страницах."],
 ["v","Todas? São dez páginas!","На всех? Тут десять страниц!"],
 ["ro","Bem-vinda ao Brasil, a terra dos papéis, haha!","Добро пожаловать в Бразилию, страну бумажек, ха-ха!"],
 ["v","Pronto, assinei tudo. Minha mão está doendo!","Всё, подписала. У меня рука болит!"],
 ["ro","E aqui estão as chaves: essa é da porta, essa da portaria e esse é o controle do portão.","А вот ключи: этот от двери, этот от подъезда, а это пульт от ворот."],
 ["v","Que emoção! Meu primeiro apê no Brasil!","Как волнительно! Моя первая квартира в Бразилии!"],
 ["ro","Parabéns! Quando você faz a mudança?","Поздравляю! Когда ты переезжаешь?"],
 ["v","Sábado de manhã. Uma amiga vai me ajudar.","В субботу утром. Подруга мне поможет."],
 ["ro","Então boa mudança! Qualquer coisa, me chama no WhatsApp.","Тогда удачного переезда! Если что — пиши мне в WhatsApp."]
 ],

{t:"Dia de mudança",ru:"Переезд, консьерж и новая соседка",e:"📦",
 lines:[
 ["li","Bom dia, vizinha nova! Trouxe café e pão de queijo pra dar energia.","Доброе утро, новая соседка! Принесла кофе и сырные булочки для энергии."],
 ["v","Lívia, você é um anjo! Só tenho duas malas, mas comprei muita coisa ontem.","Ливия, ты ангел! У меня только два чемодана, но вчера я купила кучу всего."],
 ["li","Tô vendo: travesseiro, panelas, plantas... Você comprou uma loja inteira?","Вижу: подушка, кастрюли, растения… Ты купила целый магазин?"],
 ["v","Quase! Quero que o apê fique com a minha cara.","Почти! Хочу, чтобы квартира была в моём стиле."],
 ["br","Bom dia! Você é a moradora nova do trezentos e dois?","Доброе утро! Ты новая жилица из триста второй?"],
 ["v","Sou eu! Vera. Prazer!","Это я! Вера. Очень приятно!"],
 ["br","Prazer, eu sou o Bruno, o porteiro. Quer usar o elevador de serviço pras caixas?","Очень приятно, я Бруно, консьерж. Хочешь воспользоваться грузовым лифтом для коробок?"],
 ["v","Quero, sim! Tem um elevador só pra isso?","Да, хочу! Есть лифт специально для этого?"],
 ["br","Tem. Mudança sempre pelo de serviço. É regra do condomínio.","Есть. Переезд всегда через грузовой. Это правило дома."],
 ["li","Bruno, você pode segurar a porta pra gente?","Бруно, можешь придержать нам дверь?"],
 ["br","Claro. Cuidado com a planta, que ela é maior que você, haha!","Конечно. Осторожно с растением, оно больше тебя, ха-ха!"],
 ["v","Ufa, chegamos! Onde eu coloco essa caixa pesada?","Уф, пришли! Куда мне поставить эту тяжёлую коробку?"],
 ["li","Deixa ali na cozinha. Depois a gente arruma com calma.","Оставь там, на кухне. Потом спокойно разберём."],
 ["ci","Com licença, meninas! Eu sou a Dona Cida, do trezentos e um.","Простите, девочки! Я дона Сида, из триста первой."],
 ["v","Oi, Dona Cida! Eu sou a Vera, a nova vizinha.","Здравствуйте, дона Сида! Я Вера, новая соседка."],
 ["ci","Seja bem-vinda, querida! Trouxe um bolo de fubá, que eu fiz agora de manhã.","Добро пожаловать, дорогая! Принесла кукурузный пирог, я испекла его сегодня утром."],
 ["v","Que gentileza! A senhora mora aqui faz tempo?","Как мило! Вы давно здесь живёте?"],
 ["ci","Faz vinte anos! Conheço o prédio inteiro. Se precisar de alguma coisa, é só bater na minha porta.","Двадцать лет! Знаю весь дом. Если что-нибудь понадобится, просто постучи ко мне в дверь."],
 ["v","Muito obrigada! A senhora sabe onde tem um mercado aqui perto?","Большое спасибо! Вы не знаете, где здесь поблизости магазин?"],
 ["ci","Tem um na esquina e a feira é na quinta. Lá as frutas são bem mais baratas.","Есть на углу, а рынок по четвергам. Там фрукты намного дешевле."],
 ["v","Ótima dica! E o lixo? Tem dia certo pra colocar?","Отличная подсказка! А мусор? Есть определённый день, чтобы выносить?"],
 ["ci","O comum é todo dia, lá embaixo. O reciclável é terça e sexta.","Обычный — каждый день, внизу. На переработку — по вторникам и пятницам."],
 ["li","Olha quem chegou! Que gato lindo!","Смотрите, кто пришёл! Какой красивый кот!"],
 ["ci","Ai, é o Bolacha! Ele adora visitar os vizinhos. Bolacha, vem cá!","Ой, это Болаша! Он обожает ходить в гости к соседам. Болаша, иди сюда!"],
 ["v","Ele já deitou no meu sofá! Acho que ele aprovou o apartamento.","Он уже улёгся на мой диван! Кажется, он одобрил квартиру."],
 ["ci","Se o Bolacha gostou, é porque a casa tem energia boa!","Если Болаше понравилось, значит, у дома хорошая энергия!"],
 ["li","Vera, e a internet? Já funciona?","Вера, а интернет? Уже работает?"],
 ["v","Deixa eu ver... O nome da rede é «NãoTemSenha».","Сейчас посмотрю… Сеть называется «НетПароля»."],
 ["li","E qual é a senha?","А какой пароль?"],
 ["v","Tem senha, sim! Tá escrita atrás do roteador: um, dois, três, quatro.","Пароль есть! Написан на обратной стороне роутера: раз, два, три, четыре."],
 ["ci","Ai, o Valdir não muda! Coloca uma senha mais difícil, minha filha.","Ох, Валдир не меняется! Поставь пароль посложнее, дочка."],
 ["v","Vou trocar hoje mesmo. Dona Cida, aceita um café com a gente?","Сменю сегодня же. Дона Сида, выпьете с нами кофе?"],
 ["ci","Aceito! Mas só um pouquinho, que o Bolacha precisa almoçar.","С удовольствием! Но совсем немножко, Болаше пора обедать."]
 ],

{t:"O chuveiro deu choque!",ru:"Поломка: звоним хозяину и мастеру",e:"🚿",
 lines:[
 ["v","Alô, Seu Valdir? Bom dia, aqui é a Vera, do apartamento do Campeche.","Алло, сеу Валдир? Доброе утро, это Вера, из квартиры в Кампеши."],
 ["va","Oi, Vera! Tudo bem por aí?","Привет, Вера! У тебя всё в порядке?"],
 ["v","Mais ou menos. O chuveiro deu choque hoje de manhã!","Так себе. Душ сегодня утром ударил током!"],
 ["va","Choque? Você se machucou?","Током? Ты не поранилась?"],
 ["v","Não, foi só um susto. Mas agora a água só sai fria.","Нет, я только испугалась. Но теперь идёт только холодная вода."],
 ["va","Ih, deve ser a resistência. Ela queimou.","Ох, наверное, нагревательный элемент. Он сгорел."],
 ["v","Resistência? O que é isso?","Нагревательный элемент? Что это?"],
 ["va","É a pecinha que esquenta a água. Não se preocupe, eu mando o Toninho aí.","Это деталька, которая греет воду. Не волнуйся, я пришлю к тебе Тониньо."],
 ["v","Quem é o Toninho?","А кто такой Тониньо?"],
 ["va","É o meu eletricista de confiança. Ele conserta tudo!","Это мой проверенный электрик. Он всё чинит!"],
 ["v","Ele pode vir hoje? Tenho uma videochamada importante à tarde.","Он может прийти сегодня? У меня днём важный видеозвонок."],
 ["va","Vou ligar pra ele agora e te aviso.","Сейчас позвоню ему и сообщу тебе."],
 ["br","Vera, tem um senhor aqui embaixo. Diz que veio consertar o chuveiro.","Вера, тут внизу какой-то сеньор. Говорит, что пришёл чинить душ."],
 ["v","Ah, é o Seu Toninho! Pode deixar subir, Bruno. Obrigada!","А, это сеу Тониньо! Можешь пропустить его, Бруно. Спасибо!"],
 ["to","Bom dia, moça! Cadê o chuveiro bravo?","Доброе утро, девушка! Где тут злой душ?"],
 ["v","Haha, bom dia! Ali no banheiro. Eu desliguei o disjuntor, como o Seu Valdir falou.","Ха-ха, доброе утро! Вон там, в ванной. Я выключила автомат, как сказал сеу Валдир."],
 ["to","Muito bem! Você fez certo. Deixa eu dar uma olhada.","Очень хорошо! Ты всё правильно сделала. Дай-ка я взгляну."],
 ["v","É muito grave?","Это очень серьёзно?"],
 ["to","Que nada! A resistência queimou mesmo. E o fio estava meio solto, por isso deu choque.","Да ну что ты! Элемент действительно сгорел. И провод немного отошёл, поэтому и ударило током."],
 ["v","Nossa! Ainda bem que o senhor veio rápido.","Ничего себе! Хорошо, что вы быстро пришли."],
 ["to","Eu trouxe uma resistência nova. Em vinte minutos fica pronto.","Я принёс новый элемент. Через двадцать минут будет готово."],
 ["v","Quer um café enquanto isso?","Хотите кофе пока что?"],
 ["to","Aceito! Café é o combustível do eletricista, haha.","Не откажусь! Кофе — топливо электрика, ха-ха."],
 ["to","Pronto, moça. Pode ligar o disjuntor e testar.","Готово, девушка. Можешь включать автомат и проверять."],
 ["v","Deixa eu ver... Que maravilha, água quentinha!","Сейчас посмотрю… Какая прелесть, тёпленькая вода!"],
 ["to","Uma dica: no verão, usa a posição verão. Gasta menos luz.","Совет: летом ставь режим «лето». Тратит меньше электричества."],
 ["v","Boa dica! Quanto eu te devo?","Хороший совет! Сколько я вам должна?"],
 ["to","Nada, não. Quem paga é o Seu Valdir. Conserto da casa é com o dono.","Ничего. Платит сеу Валдир. Ремонт по дому — за хозяином."],
 ["v","Ah, é verdade, está no contrato. Muito obrigada, Seu Toninho!","А, точно, это есть в договоре. Большое спасибо, сеу Тониньо!"],
 ["to","Por nada. E qualquer barulho estranho, me liga, viu?","Не за что. И если будет какой-то странный шум, звони мне, слышишь?"],
 ["v","Alô, Seu Valdir? O Toninho já consertou. Deu tudo certo!","Алло, сеу Валдир? Тониньо уже починил. Всё получилось!"],
 ["va","Que bom! Desculpa o susto, Vera. E boa sorte na videochamada!","Вот хорошо! Прости за испуг, Вера. И удачи на видеозвонке!"],
 ["v","Obrigada! Agora posso trabalhar de cabelo lavado, haha.","Спасибо! Теперь могу работать с вымытой головой, ха-ха."]
 ],

{t:"Me sinto em casa",ru:"Полгода спустя: продлеваем договор",e:"🏡",
 lines:[
 ["li","Vera, não acredito que já se passaram cinco meses!","Вера, не верится, что прошло уже пять месяцев!"],
 ["v","Nem eu! Parece que eu cheguei ontem com as minhas duas malas.","Мне тоже! Кажется, я приехала вчера со своими двумя чемоданами."],
 ["li","Duas malas e uma planta gigante, haha. E agora? Vai voltar pra Rússia?","Два чемодана и гигантское растение, ха-ха. И что теперь? Вернёшься в Россию?"],
 ["v","Pois é, eu estava pensando nisso. Acho que quero ficar mais seis meses.","Вот как раз думала об этом. Кажется, я хочу остаться ещё на шесть месяцев."],
 ["li","Sério? Que notícia boa! O que fez você decidir?","Серьёзно? Какая хорошая новость! Что тебя убедило?"],
 ["v","Tudo! O mar, as pessoas, a feira de quinta, o pão de queijo...","Всё! Море, люди, рынок по четвергам, сырные булочки…"],
 ["ci","E a vizinha do lado, espero!","И соседка за стеной, надеюсь!"],
 ["v","Dona Cida! Claro, a senhora em primeiro lugar. E o Bolacha também.","Дона Сида! Конечно, вы на первом месте. И Болаша тоже."],
 ["ci","Ele passa mais tempo no seu sofá do que no meu, aquele traidor!","Он больше времени проводит на твоём диване, чем на моём, предатель!"],
 ["li","E o trabalho? Dá pra continuar trabalhando daqui?","А работа? Можно продолжать работать отсюда?"],
 ["v","Dá, sim. Meus clientes nem perceberam que eu me mudei. Só acham que estou mais bronzeada.","Можно, да. Мои клиенты даже не заметили, что я переехала. Только думают, что я загорела."],
 ["ci","Então liga logo pro Rodrigo, antes que o Valdir aumente o aluguel!","Тогда звони скорее Родригу, пока Валдир не поднял аренду!"],
 ["v","Boa ideia. O contrato diz que tenho que avisar com trinta dias de antecedência.","Хорошая мысль. В договоре написано, что нужно предупредить за тридцать дней."],
 ["ro","Imobiliária Ilha Bela, Rodrigo falando.","Агентство «Илья Бела», Родригу слушает."],
 ["v","Oi, Rodrigo! É a Vera, do Campeche. Tudo bom?","Привет, Родригу! Это Вера, из Кампеши. Как дела?"],
 ["ro","Vera! Tudo ótimo. E o chuveiro, tá comportado?","Вера! Всё отлично. А душ, ведёт себя хорошо?"],
 ["v","Haha, tá ótimo, graças ao Seu Toninho. Olha, eu quero renovar o contrato.","Ха-ха, отлично, спасибо сеу Тониньо. Слушай, я хочу продлить договор."],
 ["ro","Que maravilha! Por mais seis meses?","Как здорово! Ещё на шесть месяцев?"],
 ["v","Isso. E queria saber se o valor continua o mesmo.","Да. И хотела узнать, остаётся ли сумма прежней."],
 ["ro","Normalmente tem o reajuste anual, mas o seu contrato ainda não fez um ano.","Обычно бывает ежегодная индексация, но твоему договору ещё нет года."],
 ["v","Então continua dois e novecentos?","Значит, остаётся две девятьсот?"],
 ["ro","Vou confirmar com o Seu Valdir, mas acho que sim. Ele diz que você é a melhor inquilina que ele já teve.","Уточню у сеу Валдира, но думаю, что да. Он говорит, что ты лучшая жилица, которая у него была."],
 ["v","Até agora não quebrei nenhuma cadeira!","Пока я не сломала ни одного стула!"],
 ["ro","Haha, ele vai gostar de saber. Te mando o aditivo do contrato amanhã.","Ха-ха, ему будет приятно это узнать. Пришлю тебе дополнение к договору завтра."],
 ["v","Perfeito. Posso assinar pelo celular?","Отлично. Можно подписать через телефон?"],
 ["ro","Pode, é assinatura digital. Nada de rubricar dez páginas dessa vez!","Можно, это электронная подпись. В этот раз никаких инициалов на десяти страницах!"],

<script>
(function(){

const DV=META.dv||'f';
function lsGet(k,d){try{const v=localStorage.getItem(LSK+k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(LSK+k,JSON.stringify(v))}catch(e){}}

const WRE=/[A-Za-zÀ-ÿ]+(?:-[A-Za-zÀ-ÿ]+)*/g;
function wordsHTML(t){let out='',last=0;t.replace(WRE,(m,i)=>{out+=esc(t.slice(last,i))+'<span class="w" data-w="'+esc(m)+'">'+esc(m)+'</span>';last=i+m.length;return m});return out+esc(t.slice(last))}

const S=window.speechSynthesis;let voices=[];
function loadV(){try{const all=S.getVoices();const re=META.tts==='pt-PT'?/^pt[-_]PT/i:/^pt[-_]BR/i;voices=all.filter(v=>re.test(v.lang));if(!voices.length)voices=all.filter(v=>/^pt/i.test(v.lang))}catch(e){}}

const FEM=/luciana|francisca|fernanda|vit[oó]ria|maria|thalita|leila|raquel|joana|catarina|in[eê]s|google portugu|female|feminin/i;
const MAL=/felipe|daniel|ant[oô]nio|ricardo|donato|f[aá]bio|humberto|j[uú]lio|duarte|cristiano|male|masculin/i;
function pickVoice(g){const f=voices.filter(v=>FEM.test(v.name)&&!MAL.test(v.name)),m=voices.filter(v=>MAL.test(v.name)&&!/female/i.test(v.name));
 if(g==='m'&&m.length)return{v:m[0],p:1};if(g==='f'&&f.length)return{v:f[0],p:1};
 return{v:voices[0]||null,p:g==='m'?0.8:1.15}}
function clean(t){return t.replace(/[^\p{L}\p{N}\s.,!?;:'\-]/gu,' ').replace(/\s+/g,' ').trim()}
let tok=0,safety=null;
function stopSpeech(){tok++;clearTimeout(safety);try{S&&S.cancel()}catch(e){}}
function say(text,g,cb){const my=++tok;clearTimeout(safety);

 const txt=clean(text);
 if(!opt.sound||!S||!txt){safety=setTimeout(fin,Math.max(1400,txt.split(' ').length*430));return}
 try{S.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=META.tts;const pv=pickVoice(g);if(pv.v)u.voice=pv.v;u.pitch=pv.p;u.rate=0.88;
  u.onend=fin;u.onerror=fin;S.speak(u)}catch(e){}

/* ---------- PLAYER (generic over items on page) ---------- */
let P={items:[],cur:0,playing:false,onEnd:null};
function setCur(i,scroll){P.items.forEach((it,k)=>{it.el.classList.toggle('cur',k===i);const t=it.el.querySelector('.tr');if(t&&!t.dataset.man)t.hidden=!(opt.subs&&k===i)});P.cur=i;
 if(scroll&&P.items[i])P.items[i].el.scrollIntoView({block:'center',behavior:'smooth'});updBar()}
function playFrom(i){if(i>=P.items.length){P.playing=false;setCur(-1);updBar();P.onEnd&&P.onEnd();return}
 P.playing=true;setCur(i,true);const it=P.items[i];
 say(it.say,it.g,()=>{if(!P.playing)return;if(opt.auto)setTimeout(()=>{if(P.playing&&P.cur===i)playFrom(i+1)},650);else{P.playing=false;P.cur=Math.min(i+1,P.items.length-1);setCur(P.cur);updBar()}})}
function pause(){P.playing=false;stopSpeech();updBar()}
function toggle(){if(P.playing)pause();else playFrom(Math.max(0,P.cur))}
function playOne(i){P.playing=false;setCur(i,false);say(P.items[i].say,P.items[i].g,()=>{})}
function updBar(){const pb=document.getElementById('pp');if(pb)pb.textContent=P.playing?'⏸':'▶';
 const c=document.getElementById('cnt');if(c)c.textContent=(P.cur>=0?P.cur+1:0)+'/'+P.items.length;

function barHTML(title,backLabel){return `<div class="bar gut"><div class="col">

 <div class="r2"><button class="ib" id="prevB" aria-label="Предыдущая фраза">⏮</button><button class="ib play" id="pp" aria-label="Пауза / слушать">▶</button><button class="ib" id="nextB" aria-label="Следующая фраза">⏭</button><button class="ib" id="rptB" aria-label="Сначала">🔁</button><span class="cnt" id="cnt"></span></div>
 <div class="r3"><button class="ib" id="autoB" aria-pressed="true">▶▶ Авто</button><button class="ib" id="sndB" aria-pressed="true">🔊 Звук</button><button class="ib" id="subB" aria-pressed="false">💬 Субтитры</button></div>
</div></div>`}
function bindBar(onBack,onVoc){
 document.getElementById('backB').onclick=()=>{pause();onBack()};
 document.getElementById('vocB').onclick=()=>{pause();onVoc()};
 document.getElementById('pp').onclick=toggle;
 document.getElementById('prevB').onclick=()=>{const i=Math.max(0,P.cur-1);if(P.playing)playFrom(i);else playOne(i)};
 document.getElementById('nextB').onclick=()=>{const i=Math.min(P.items.length-1,P.cur+1);if(P.playing)playFrom(i);else playOne(i)};

/* exp: build the growing phrase */
function taskExp(box,idx,chain){const st=chain[X.stage],prev=X.stage>0?chain[X.stage-1]:null;
 const tgt=st[0].split(' ').filter(Boolean);const tl=tgt.map(w=>w.replace(/[.,!?]/g,''));
 let tiles;const pv=prev?prev[0].split(' '):null;let pos=-1;
 if(pv){for(let a=0;a+pv.length<=tl.length;a++){if(pv.every((w,j)=>tl[a+j]===w)){pos=a;break}}}
 if(pos>=0)tiles=[...tl.slice(0,pos),pv.join(' '),...tl.slice(pos+pv.length)];else tiles=tl.slice();
 const chunkTxt=pos>=0?pv.join(' '):null;
 tiles.push(st[2]);
 let order=shuf(tiles.map((t,n)=>n));let tries=0;while(tries++<8&&order.slice(0,tiles.length-1).every((v,n)=>v===n))order=shuf(order);
 box.innerHTML=`<div class="steps">${chain.map((_,n)=>`<span class="dot${n<=X.stage?' on':''}"></span>`).join('')}<span>Шаг ${X.stage+1} из ${chain.length} · задание ${X.pos+1} из ${X.list.length}</span></div>
 ${prev?`<div class="model"><div class="q">Было:</div><div class="row"><div class="pt">${wordsHTML(prev[0])}</div><button class="sb" id="pvS" aria-label="Послушать">🔊</button><button class="sb" id="pvG" aria-label="Перевод фразы">🌐</button></div><div class="tr" hidden>${esc(prev[1])}</div></div>`:''}
 <div class="q">Собери по-португальски:<br><b>«${esc(st[1])}»</b></div>
 <div class="ansbox" id="ab" aria-live="polite"></div>
 <div class="tiles" id="tl">${order.map(n=>`<button class="tile${tiles[n]===chunkTxt?' chunk':''}" data-n="${n}">${esc(tiles[n])}</button>`).join('')}</div>
 <div class="fb"></div>`;
 const ab=box.querySelector('#ab'),tlb=box.querySelector('#tl');let placed=[];
 const need=tl.length;
 const count=()=>placed.reduce((s,n)=>s+tiles[n].split(' ').length,0);
 const speakPrev=()=>{if(prev)say(prev[0],DV,()=>{})};
 bindExBar(speakPrev);
 if(prev){box.querySelector('#pvS').onclick=speakPrev;box.querySelector('#pvG').onclick=()=>{const t=box.querySelector('.model .tr');t.hidden=!t.hidden}}
 const nextStage=()=>{if(X.stage<chain.length-1){X.stage++;renderTask()}else{X.stage=0;X.pos++;renderTask()}};
 const check=()=>{const a=placed.map(n=>tiles[n]).join(' ');const okList=[st[0],...(st[3]||[])].map(norm);const ok=okList.includes(norm(a));
  tlb.querySelectorAll('.tile').forEach(b=>b.disabled=true);ab.querySelectorAll('.tile').forEach(b=>b.disabled=true);
  if(X.stage===chain.length-1||!ok)record(idx,ok&&!(idx in X.first&&!X.first[idx]),`${chain[chain.length-1][1]}`,ok?st[0]:a,st[0]);
  if(ok){ab.classList.add('ok');okBox(box,'Верно: '+esc(cap(st[0])),()=>say(st[0],DV,()=>setTimeout(nextStage,700)))}
  else{ab.classList.add('bad');const extra=placed.map(n=>tiles[n]).includes(st[2])?`<br>Лишнее слово: <b>${esc(st[2])}</b>`:'';
   wrongBox(box,`Правильно: <b>${esc(cap(st[0]))}</b>${extra}`,()=>renderTask(),nextStage,()=>say(st[0],DV,()=>{}))}};
 const draw=()=>{ab.innerHTML=placed.map(n=>`<button class="tile${tiles[n]===chunkTxt?' chunk':''}" data-n="${n}">${esc(tiles[n])}</button>`).join('');
  tlb.querySelectorAll('.tile').forEach(b=>b.hidden=placed.includes(+b.dataset.n));if(count()>=need)check()};
 tlb.onclick=e=>{const b=e.target.closest('.tile');if(!b||b.disabled)return;placed.push(+b.dataset.n);say(tiles[+b.dataset.n],DV,()=>{});draw()};
 ab.onclick=e=>{const b=e.target.closest('.tile');if(!b||b.disabled)return;placed=placed.filter(n=>n!==+b.dataset.n);draw()};
 if(opt.auto&&prev)setTimeout(speakPrev,300)}

/* options shared by sub & ant */
function buildOpts(okT,bads){const opts=[okT,...bads];let ord=shuf([0,1,2]);if(ord[0]===0)ord=[ord[1],ord[0],ord[2]];return ord.map(n=>({t:opts[n],ok:n===0}))}
function optsHTML(o){return `<div class="opts">${o.map((x,n)=>`<div class="orow"><button class="opt" data-n="${n}">${esc(x.t)}</button><button class="sb osay" data-n="${n}" aria-label="Послушать вариант">🔊</button></div>`).join('')}</div>`}
function bindOpts(box,o,idx,q,okT,why,readFirst){const els=[...box.querySelectorAll('.opt')];
 const readAll=()=>{const l=(readFirst?[{t:readFirst.t,el:readFirst.el}]:[]).concat(els.map((el,n)=>({t:o[n].t,el})));sayList(l,0,()=>{clearRd();box.querySelector('.opts').scrollIntoView({block:'nearest',behavior:'smooth'})})};
 box.querySelectorAll('.osay').forEach(b=>b.onclick=()=>{stopSpeech();clearRd();say(o[+b.dataset.n].t,DV,()=>{})});
 els.forEach((b,n)=>b.onclick=()=>{stopSpeech();clearRd();els.forEach(e=>e.disabled=true);const ok=o[n].ok;
  record(idx,ok,q,o[n].t,okT);
  if(ok){b.classList.add('ok');okBox(box,'Верно!',()=>say(okT,DV,()=>setTimeout(()=>{X.pos++;renderTask()},700)))}
  else{b.classList.add('bad');els[o.findIndex(x=>x.ok)].classList.add('ok');
   wrongBox(box,`Правильно: <b>${esc(okT)}</b><br>💡 ${esc(why)}`,()=>renderTask(),()=>{X.pos++;renderTask()},()=>say(okT,DV,()=>{}))}});
 return readAll}

/* sub: substitution drill */
function taskSub(box,idx,it){const [m,mru,cue,okT,b1,b2,why]=it;const o=buildOpts(okT,[b1,b2]);
 box.innerHTML=`<div class="model"><div class="q">Образец:</div><div class="row"><div class="pt" id="mT">${wordsHTML(m)}</div><button class="sb" id="mS" aria-label="Послушать">🔊</button><button class="sb" id="mG" aria-label="Перевод фразы">🌐</button></div><div class="tr" hidden>${esc(mru)}</div></div>
 <div class="q">Замени на: <b>${esc(cue)}</b></div>${optsHTML(o)}<div class="fb"></div>`;
 const readAll=bindOpts(box,o,idx,`${m} → ${cue}`,okT,why,{t:m,el:box.querySelector('.model')});
 box.querySelector('#mS').onclick=()=>say(m,DV,()=>{});
 box.querySelector('#mG').onclick=()=>{const t=box.querySelector('.model .tr');t.hidden=!t.hidden};
 bindExBar(readAll);if(opt.auto)setTimeout(readAll,300)}

/* ant: anticipation — say it first, then check */
function taskAnt(box,idx,it){const [ru,okT,b1,b2,why]=it;const o=buildOpts(okT,[b1,b2]);
 box.innerHTML=`<div class="q">${META.antQ||'Как сказать по-португальски?'}</div><div class="rucard">${esc(ru)}</div>
 <div class="cd" id="cd"><b id="cdn">4</b><span>🗣 Скажи вслух сама…</span><button class="pill" id="cdSkip">Показать варианты</button></div>
 <div id="ow" hidden>${optsHTML(o)}</div><div class="fb"></div>`;
 const readAll=bindOpts(box,o,idx,ru,okT,why,null);
 let n=4;const show=()=>{clearTimeout(cdT);box.querySelector('#cd').hidden=true;box.querySelector('#ow').hidden=false;if(opt.auto)readAll()};
 const tick=()=>{n--;const c=box.querySelector('#cdn');if(!c)return;if(n<=0)return show();c.textContent=n;cdT=setTimeout(tick,1000)};
 cdT=setTimeout(tick,1000);box.querySelector('#cdSkip').onclick=show;
 bindExBar(()=>{if(!box.querySelector('#ow').hidden)readAll()})}

function exEnd(){const tot=X.list.length,good=X.list.filter(i=>X.first[i]===true).length;
 if(X.mode==='main'){xs[X.i+'-'+X.k]=good+'/'+tot;lsSet('xs',xs)}
 const t=XT.find(t=>t.k===X.k);const ki=XT.findIndex(t=>t.k===X.k);
 app.innerHTML=simpleBar(t.n,'← Назад')+`<div class="gut"><div class="col page">
 <button class="skip" id="skipE">⏭ Пропустить эту страницу</button>
 <div class="end"><h2>${good===tot?'🎉 Всё верно!':'💪 Готово!'}</h2><div style="font-size:17px">Верно с первого раза: <b>${good} из ${tot}</b></div>
 ${X.wrong.length?`<div class="fbm bad">Работа над ошибками? Повторим ${X.wrong.length} ${X.wrong.length===1?'задание':'задания'} с ошибкой.</div><div class="btnrow"><button class="big" id="fixY">Да</button><button class="big sec" id="fixN">Нет</button></div>`:''}
 <div id="after" ${X.wrong.length?'hidden':''} style="display:flex;flex-direction:column;gap:8px">
 ${ki<XT.length-1?`<button class="big" id="nxE"><span>➡️</span><span>Следующее: ${XT[ki+1].n}</span></button>`:''}
 <button class="big ${ki<XT.length-1?'sec':''}" id="mnE"><span>🏋️</span><span>К упражнениям диалога</span></button></div>
 </div></div></div>`;
 scrollTo(0,0);const i=X.i,w=X.wrong.slice(),k=X.k;
 const after=()=>{const a=document.getElementById('after');a.hidden=false;const y=document.getElementById('fixY');if(y)y.closest('.btnrow').remove();a.scrollIntoView({block:'end',behavior:'smooth'})};
 document.getElementById('backB').onclick=()=>exMenu(i);
 document.getElementById('skipE').onclick=()=>exMenu(i);
 const y=document.getElementById('fixY');if(y){y.onclick=()=>runEx(i,k,w,'fix');document.getElementById('fixN').onclick=after}
 const nx=document.getElementById('nxE');if(nx)nx.onclick=()=>runEx(i,XT[ki+1].k);
 document.getElementById('mnE').onclick=()=>exMenu(i)}

function myAnswers(back){closePop();stopSpeech();
 const keys=Object.keys(ans);
 const body=DLG.map((d,i)=>{const parts=XT.map(t=>{const ks=keys.filter(k=>k.startsWith(i+'-'+t.k+'-')).sort((a,b)=>+a.split('-')[2]-+b.split('-')[2]);if(!ks.length)return'';
   return `<div class="q"><b>${t.n}</b></div>`+ks.map(k=>{const a=ans[k];return `<div class="mya">${a.ok?'✅':'❌'} ${esc(a.q)}<br>Мой ответ: ${esc(a.a)}${a.ok?'':`<br><span class="c">Правильно: ${esc(a.c)}</span>`}</div>`}).join('')}).join('');
  return parts?`<div class="sec-h">${d.e} ${i+1}. ${esc(d.t)}</div><div class="myl">${parts}</div>`:''}).join('');
 app.innerHTML=simpleBar('📋 Мои ответы','← Назад')+`<div class="gut"><div class="col page">
 <button class="skip" id="skipA">⏭ Пропустить эту страницу</button>
 ${body||'<div class="hint">Здесь появятся твои ответы из упражнений: что верно, где ошибка и правильный вариант. При повторном прохождении ответ перезаписывается.</div>'}
 </div></div>`;
 scrollTo(0,0);document.getElementById('backB').onclick=back;document.getElementById('skipA').onclick=back}

/* ---------- NAVIGATION (from any page to any dialogue / exercise) ---------- */
function navPop(){closePop();stopSpeech();if(typeof pause==='function')pause();clearTimeout(cdT);
 const old=document.querySelector('.ov');if(old)old.remove();
 const ov=document.createElement('div');ov.className='ov';
 const cell=(i,k,ic,lbl)=>{const here=CUR.i===i&&CUR.k===k;const dn=k==='dlg'?done.includes(i):!!xs[i+'-'+k];
  return `<button class="nb ex${here?' here':''}${dn?' dn':''}" data-i="${i}" data-k="${k}" aria-label="${lbl} ${i+1}">${ic}</button>`};
 ov.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><button class="x" aria-label="Закрыть">✕</button><h3>🧭 Куда перейти?</h3>
 <div class="navtop"><button class="big sec" data-go="home">🏠 Меню</button><button class="big sec" data-go="all">📚 Все слова</button><button class="big sec" data-go="my">📋 Ответы</button></div>
 <div class="nav"><span class="hd l">Диалог</span><span class="hd">➕</span><span class="hd">🔄</span><span class="hd">🎯</span><span class="hd">📚</span>
 ${DLG.map((d,i)=>`<button class="nb dl${CUR.i===i&&CUR.k==='dlg'?' here':''}${done.includes(i)?' dn':''}" data-i="${i}" data-k="dlg"><span>${d.e}</span><span class="nt">${i+1}. ${esc(d.t)}</span></button>${cell(i,'exp','➕','Расширяем фразу')}${cell(i,'sub','🔄','Замени слово')}${cell(i,'ant','🎯','Скажи раньше')}${cell(i,'voc','📚','Слова')}`).join('')}
 </div>
 <div class="legend">➕ Расширяем фразу · 🔄 Замени слово · 🎯 Скажи раньше, чем услышишь · 📚 Слова и конструкции · ✓ пройдено</div></div>`;
 document.body.appendChild(ov);
 const c=()=>ov.remove();ov.querySelector('.x').onclick=c;ov.onclick=e=>{if(e.target===ov)c()};
 ov.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{c();const g=b.dataset.go;if(g==='home')home();else if(g==='all')vocab(-1,home);else myAnswers(home)});
 ov.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{c();const i=+b.dataset.i,k=b.dataset.k;
  if(k==='dlg')openDlg(i);else if(k==='voc')vocab(i,()=>openDlg(i));else runEx(i,k)});}
document.addEventListener('click',e=>{if(e.target.closest('.navB')){e.preventDefault();navPop()}});

function normCode(v){let t=String(v||'').toLowerCase().replace(/[\s.\-_]/g,'');
 t=t.replace(/^(дарья|дария|дариа|даря|дарjа|дарjа)/,'daria').replace(/^(darja|darya|darija|dariya|daria)/,'daria');
 t=t.replace(/[бвbв]2$/,'b2').replace(/[вb]$/,'b');return t}
const TEACHER='dariab2';
const CODES=[TEACHER].concat((META.codes||[]).map(normCode));
function gateOk(){return CODES.includes(normCode(lsGet('code','')))}
function showGate(){const g=document.createElement('div');g.className='gate';
 g.innerHTML=`<form class="gb" id="gf" autocomplete="off"><div class="gi">🔒</div><h2>${META.h1}</h2><p>Введи, пожалуйста, свой код, чтобы открыть урок.</p>
 <input id="gc" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Код" placeholder="Код">
 <p class="err" id="ge" aria-live="polite"></p><button class="big" type="submit">Открыть урок</button><div class="own">© Daria Botina</div></form>`;
 document.body.appendChild(g);
 g.querySelector('#gf').addEventListener('submit',e=>{e.preventDefault();const v=g.querySelector('#gc').value.trim();
  if(CODES.includes(normCode(v))){lsSet('code',v);g.remove();home();startVisit()}
  else{g.querySelector('#ge').textContent=v?'Код не подходит. Проверь, пожалуйста, и попробуй ещё раз.':'Введи, пожалуйста, код.'}})}
function setWho(){const c=normCode(lsGet('code',''));EV_WHO=(!c||c===TEACHER)?'Дарья (тест)':(META.who||'Ученик')}
function startVisit(){setWho();setTimeout(()=>sendEvent('visit',document.title),800)}
if(META.gate&&!gateOk())showGate();else{home();startVisit()}
})();
</script>
