 ["sr","Pois, nota-se um bocadinho! Mas está ótimo.","Да, немножко заметно! Но всё отлично."],

{t:"No alojamento local",ru:"Заселение в квартиру в Алфаме",e:"🔑",
 lines:[
 ["dg","Boa tarde! São a Daria e o Fatih?","Добрый день! Вы Дарья и Фатих?"],
 ["d","Somos, sim! Boa tarde. A senhora é a Dona Graça?","Да! Добрый день. Вы дона Граса?"],
 ["dg","Sou eu. Sejam bem-vindos a Alfama! Fizeram boa viagem?","Это я. Добро пожаловать в Алфаму! Хорошо доехали?"],
 ["f","Fizemos, obrigado. Mas as escadas aqui... uf!","Хорошо, спасибо. Но лестницы здесь... уф!"],
 ["dg","Pois é, Alfama é assim. E o apartamento é no terceiro andar.","Да уж, Алфама такая. А квартира на третьем этаже."],
 ["d","E há elevador?","А лифт есть?"],
 ["dg","Infelizmente, não há. O prédio tem mais de cem anos.","К сожалению, нет. Дому больше ста лет."],
 ["f","Então eu levo as malas. Tu levas as compras, amor.","Тогда я несу чемоданы. А ты — покупки, любимая."],
 ["dg","Pronto, chegámos. Aqui está a chave da porta da rua e esta é a do apartamento.","Ну вот, пришли. Вот ключ от подъезда, а этот — от квартиры."],
 ["d","Duas chaves. Qual é a da porta da rua?","Два ключа. Какой от подъезда?"],
 ["dg","A grande, a amarela. A porta da rua às vezes fica presa. Tem de empurrar com força.","Большой, жёлтый. Входная дверь иногда заедает. Надо толкать посильнее."],
 ["f","Empurrar com força. Está bem.","Толкать посильнее. Понятно."],
 ["dg","Aqui é a sala, a cozinha é ali e a casa de banho é ao fundo do corredor.","Здесь гостиная, кухня вон там, а ванная — в конце коридора."],
 ["d","Que bonito! E esta janela dá para o rio!","Как красиво! И это окно выходит на реку!"],
 ["dg","Dá para o Tejo. Ao fim da tarde, a luz é linda.","На Тежу. Под вечер свет очень красивый."],
 ["f","Qual é a palavra-passe do wi-fi?","Какой пароль от вай-фая?"],
 ["dg","Está escrita no frigorífico, por baixo do íman do elétrico.","Написан на холодильнике, под магнитом с трамваем."],
 ["d","E onde deitamos o lixo?","А куда выбрасывать мусор?"],
 ["dg","Há contentores no fim da rua. O plástico vai no amarelo e o papel no azul.","В конце улицы есть контейнеры. Пластик — в жёлтый, бумага — в синий."],
 ["d","E o vidro no verde, certo?","А стекло — в зелёный, правильно?"],
 ["dg","Exatamente! Vejo que já conhece as regras.","Точно! Вижу, вы уже знаете правила."],
 ["f","Há máquina de lavar roupa?","Есть стиральная машина?"],
 ["dg","Há, na cozinha. Mas não há máquina de secar. Aqui estendemos a roupa na janela.","Есть, на кухне. Но сушильной машины нет. Здесь мы развешиваем бельё за окном."],
 ["d","Como nos filmes! Adoro.","Как в кино! Обожаю."],
 ["dg","Mais uma coisa: depois das onze, por favor, façam pouco barulho. Os vizinhos são idosos.","Ещё одно: после одиннадцати, пожалуйста, не шумите. Соседи пожилые."],
 ["f","Claro, sem problema. Nós também gostamos de dormir cedo.","Конечно, без проблем. Мы тоже любим рано ложиться."],
 ["d","Dona Graça, onde há um supermercado aqui perto?","Дона Граса, где здесь рядом супермаркет?"],
 ["dg","Há uma mercearia aqui em baixo, ao lado da igreja. É pequena, mas tem tudo.","Внизу есть продуктовая лавка, рядом с церковью. Маленькая, но там есть всё."],
 ["d","E a que horas fecha?","А во сколько она закрывается?"],
 ["dg","Fecha às oito da noite. Ao domingo está fechada.","Закрывается в восемь вечера. В воскресенье закрыта."],
 ["f","E o check-out? A que horas temos de sair?","А выезд? Во сколько нам нужно выехать?"],
 ["dg","Até às onze da manhã. Deixem as chaves em cima da mesa.","До одиннадцати утра. Оставьте ключи на столе."],
 ["d","Perfeito. Muito obrigada, Dona Graça.","Отлично. Большое спасибо, дона Граса."],
 ["dg","Não tem de quê! Qualquer coisa, liguem-me. Boas férias!","Не за что! Если что — звоните мне. Хорошего отпуска!"]
 ],

{t:"Na pastelaria",ru:"Завтрак в кондитерской с Руем",e:"🥮",
 lines:[
 ["ru","Daria! Fatih! Finalmente! Então, estão a gostar de Lisboa?","Дарья! Фатих! Наконец-то! Ну, нравится вам Лиссабон?"],
 ["d","Rui! Estamos a adorar! Só as subidas é que são difíceis.","Руй! Мы в восторге! Только подъёмы тяжёлые."],
 ["ru","Haha, aqui ninguém precisa de ginásio. Venham, esta pastelaria é a melhor do bairro.","Ха-ха, здесь никому не нужен спортзал. Пойдёмте, эта кондитерская — лучшая в районе."],
 ["f","Que cheiro tão bom!","Как вкусно пахнет!"],
 ["em","Bom dia! O que vai ser?","Доброе утро! Что будете?"],
 ["ru","Para mim, uma bica e um pastel de nata, se faz favor.","Мне бику и паштел-де-ната, пожалуйста."],
 ["d","Uma bica? O que é isso?","Бика? Что это?"],
 ["ru","É um café curto, como um expresso. Em Lisboa chamamos-lhe bica.","Это маленький кофе, как эспрессо. В Лиссабоне мы называем его «бика»."],
 ["d","E no Porto?","А в Порту?"],
 ["ru","No Porto pedes «um cimbalino». Cada cidade tem a sua palavra.","В Порту просишь «симбалину». У каждого города своё слово."],
 ["d","Que confusão! Então para mim, um galão e um pastel de nata.","Вот путаница! Тогда мне галао и паштел-де-ната."],
 ["em","O galão é com leite, num copo alto. Pode ser?","Галао — с молоком, в высоком стакане. Подойдёт?"],
 ["d","Pode ser, perfeito.","Подойдёт, отлично."],
 ["f","Eu quero um chá e uma torrada, se faz favor.","Мне чай и тост, пожалуйста."],
 ["em","Torrada com manteiga?","Тост с маслом?"],
 ["f","Sim, com manteiga. Obrigado.","Да, с маслом. Спасибо."],
 ["ru","Fatih, uma torrada aqui são duas fatias grossas de pão. Vais ficar cheio!","Фатих, тост здесь — это два толстых ломтя хлеба. Наешься!"],
 ["f","Melhor! Hoje vamos andar muito.","Тем лучше! Сегодня будем много ходить."],
 ["em","Aqui está. Os pastéis estão quentinhos, acabaram de sair do forno.","Пожалуйста. Пирожные тёпленькие, только что из печи."],
 ["ru","Agora, atenção: põe canela por cima. É assim que se come.","А теперь внимание: посыпь сверху корицей. Так их и едят."],
 ["d","Canela... e açúcar em pó também?","Корица... и сахарная пудра тоже?"],
 ["ru","Isso já é contigo. Eu só ponho canela.","Это уж как хочешь. Я сыплю только корицу."],
 ["d","Hmm! A massa é estaladiça e o creme ainda está quente. Que maravilha!","Ммм! Тесто хрустящее, а крем ещё тёплый. Чудо!"],
 ["ru","Viste? Agora já não podes voltar para a Turquia sem isto.","Видишь? Теперь ты не сможешь вернуться в Турцию без этого."],
 ["f","Rui, o que significa «fixe»? Ouvi muitas vezes ontem.","Руй, что значит «fixe»? Я вчера много раз слышал."],
 ["ru","«Fixe» quer dizer «legal», «muito bom». É muito português.","«Fixe» значит «классно», «очень хорошо». Очень по-португальски."],
 ["f","Então este pastel de nata é fixe!","Значит, этот паштел-де-ната — fixe!"],
 ["ru","Exatamente, pá! Já falas como um lisboeta.","Именно, приятель! Ты уже говоришь как лиссабонец."],
 ["d","E «pá»? Também ouvi muito.","А «pá»? Тоже часто слышала."],
 ["ru","«Pá» é tipo «cara» no Brasil. Usamos entre amigos.","«Pá» — это как «cara» в Бразилии. Мы так говорим между друзьями."],
 ["d","Ok. Rui, hoje sou eu que pago, está bem?","Ладно. Руй, сегодня плачу я, хорошо?"],
 ["ru","Nem pensar! Vocês são meus convidados. Aqui paga-se ao balcão.","И не думай! Вы мои гости. Здесь платят у стойки."],
 ["em","São seis euros e quarenta, se faz favor.","С вас шесть евро сорок, пожалуйста."],
 ["d","Só? Na Turquia isto custava o dobro!","Всего? В Турции это стоило бы вдвое больше!"],
 ["ru","Bem-vinda a Portugal!","Добро пожаловать в Португалию!"]
 ],

{t:"No elétrico 28",ru:"Поездка на трамвае 28",e:"🚋",
 lines:[
 ["d","Olha a fila para o elétrico vinte e oito! É enorme!","Смотри, какая очередь на трамвай двадцать восемь! Огромная!"],
 ["ru","Pois é, é o elétrico mais famoso de Lisboa. Mas vale a pena.","Да, это самый знаменитый трамвай Лиссабона. Но оно того стоит."],
 ["f","Quanto tempo temos de esperar?","Сколько нам ждать?"],
 ["ru","Uns vinte minutos. Mas eu conheço um truque: apanhamos na paragem seguinte.","Минут двадцать. Но я знаю хитрость: сядем на следующей остановке."],
 ["d","A sério? E lá há menos gente?","Правда? А там меньше людей?"],
 ["ru","Muito menos. Vamos a pé, são só cinco minutos.","Гораздо меньше. Пойдём пешком, всего пять минут."],
 ["mo","Bom dia! Têm bilhete?","Доброе утро! Билеты есть?"],
 ["d","Temos o bilhete de vinte e quatro horas. Passamos aqui?","У нас билет на двадцать четыре часа. Прикладываем здесь?"],
 ["mo","Sim, passem o cartão na máquina, à frente.","Да, приложите карту к валидатору, впереди."],
 ["ru","Eu pago o bilhete aqui. Quanto é?","Я плачу за билет здесь. Сколько?"],
 ["mo","Dentro do elétrico são três euros e cinquenta.","В трамвае — три евро пятьдесят."],
 ["ru","Está bem, está bem. Aqui tem.","Ладно, ладно. Вот, пожалуйста."],
 ["f","Que barulho! E o elétrico abana muito!","Какой шум! И трамвай сильно трясёт!"],
 ["ru","É de madeira e tem quase cem anos. Segurem-se bem nas curvas.","Он деревянный, ему почти сто лет. Держитесь крепче на поворотах."],
 ["d","Ai! Quase caí em cima daquele senhor!","Ой! Чуть не упала на того сеньора!"],
 ["ru","Haha, acontece a todos. E atenção às carteiras.","Ха-ха, со всеми бывает. И осторожно с кошельками."],
 ["f","Às carteiras? Porquê?","С кошельками? Почему?"],
 ["ru","Há muitos carteiristas no vinte e oito. Ponham o telemóvel no bolso da frente.","В двадцать восьмом много карманников. Положите телефон в передний карман."],
 ["d","Boa dica. Eu tenho a mala à frente, fechada.","Хороший совет. У меня сумка спереди, закрыта."],
 ["f","Olha pela janela! As ruas são tão estreitas!","Посмотри в окно! Улицы такие узкие!"],
 ["ru","Às vezes o elétrico passa a dez centímetros das casas.","Иногда трамвай проходит в десяти сантиметрах от домов."],
 ["d","Dá para tocar nas paredes! Que loucura!","Можно дотронуться до стен! Безумие!"],
 ["ru","Por favor, não toques! Mantém as mãos dentro.","Пожалуйста, не трогай! Держи руки внутри."],
 ["d","Está bem, está bem. Onde saímos?","Ладно, ладно. Где выходим?"],
 ["ru","Na Graça. Lá há um miradouro com a melhor vista de Lisboa.","На Грасе. Там смотровая площадка с лучшим видом на Лиссабон."],
 ["f","Miradouro? É uma esplanada?","Мирадору? Это летнее кафе?"],
 ["ru","Não, é um lugar alto para ver a cidade. Mas muitos têm esplanada, sim.","Нет, это высокое место, откуда смотрят на город. Но во многих есть и кафе на улице."],
 ["mo","Próxima paragem: Graça!","Следующая остановка: Граса!"],
 ["ru","É a nossa! Carreguem no botão.","Наша! Нажмите кнопку."],
 ["d","Onde está o botão?","Где кнопка?"],
 ["ru","É aquela corda por cima da janela. Puxa!","Это вон та верёвка над окном. Дёрни!"],
 ["d","Puxei! Que giro, é como uma campainha antiga.","Дёрнула! Как мило, как старинный звонок."],
 ["mo","Graça! Cuidado ao sair, o degrau é alto.","Граса! Осторожно при выходе, ступенька высокая."],
 ["f","Obrigado! Tenha um bom dia.","Спасибо! Хорошего дня."],
 ["ru","Agora, cinco minutos a subir e chegamos ao miradouro. Vamos!","А теперь пять минут в гору — и мы на смотровой. Пошли!"]
 ],

{t:"Numa tasca",ru:"Обед в таверне: куверт и треска",e:"🐟",
 lines:[
 ["tq","Boa tarde! Mesa para três?","Добрый день! Столик на троих?"],
 ["ru","Para três, sim. Pode ser cá fora, na esplanada?","Да, на троих. Можно снаружи, на веранде?"],
 ["tq","Pode. Sentem-se ali, naquela mesa ao sol.","Можно. Садитесь вон туда, за тот столик на солнце."],

 ["tq","Então à sombra, debaixo do toldo. Aqui está a ementa.","Тогда в тени, под навесом. Вот меню."],
 ["f","Já trouxeram pão, azeitonas e manteiga. Que simpáticos!","Уже принесли хлеб, оливки и масло. Как мило!"],
 ["ru","Cuidado! Isso é o couvert. Não é oferta, paga-se.","Осторожно! Это куверт. Это не подарок, за него платят."],
 ["d","A sério? Mas nós não pedimos nada!","Правда? Но мы ничего не заказывали!"],
 ["ru","Se comerem, pagam. Se não quiserem, podem dizer «não, obrigado».","Если съедите — платите. Если не хотите, можно сказать «нет, спасибо»."],
 ["f","Hmm, o pão está quente... Eu quero!","Ммм, хлеб тёплый... Я хочу!"],
 ["d","Senhor Manuel, qual é o prato do dia?","Сеньор Мануэл, какое блюдо дня?"],
 ["tq","Hoje temos bacalhau à Brás e sardinhas assadas.","Сегодня у нас треска «а Браш» и жареные сардины."],
 ["d","O que é bacalhau à Brás?","Что такое треска «а Браш»?"],
 ["tq","É bacalhau desfiado com batata palha, ovo e cebola. É uma delícia.","Это треска волокнами с картошкой-соломкой, яйцом и луком. Объедение."],
 ["d","Então para mim, bacalhau à Brás.","Тогда мне треску «а Браш»."],
 ["f","E eu quero as sardinhas. Vêm com quê?","А я хочу сардины. С чем подаются?"],
 ["tq","Com batata cozida e salada. São cinco sardinhas.","С отварной картошкой и салатом. Пять сардин."],
 ["f","Cinco? Ótimo, estou com muita fome.","Пять? Отлично, я очень голоден."],
 ["ru","Para mim, o mesmo que o Fatih. E para beber, uma garrafa de água.","Мне то же, что Фатиху. А попить — бутылку воды."],
 ["tq","Água com gás ou sem gás? Fresca ou natural?","Газированную или без газа? Холодную или комнатной температуры?"],
 ["ru","Sem gás e fresca, se faz favor.","Без газа и холодную, пожалуйста."],
 ["d","Rui, como se come a sardinha? Com as espinhas?","Руй, как едят сардину? С косточками?"],
 ["ru","Abres ao meio e tiras a espinha do meio. Alguns comem em cima do pão.","Разрезаешь пополам и вынимаешь хребет. Некоторые едят прямо на хлебе."],
 ["f","Em cima do pão? Porquê?","На хлебе? Зачем?"],
 ["ru","O pão fica com o sabor da sardinha. É o melhor da festa!","Хлеб пропитывается вкусом сардины. Это самое лучшее!"],
 ["tq","Aqui está. Bom apetite!","Пожалуйста. Приятного аппетита!"],
 ["d","Que cheiro! O bacalhau está perfeito.","Какой запах! Треска идеальная."],
 ["f","As sardinhas também. Rui, tinhas razão sobre o pão!","Сардины тоже. Руй, ты был прав насчёт хлеба!"],
 ["tq","Querem sobremesa? Temos arroz doce e baba de camelo.","Десерт будете? У нас рисовый пудинг и «баба-де-камелу»."],
 ["d","Baba de camelo? Que nome estranho!","«Слюна верблюда»? Какое странное название!"],
 ["tq","É uma mousse de leite condensado. Não tem nada de camelo, prometo!","Это мусс из сгущёнки. Никакого верблюда там нет, обещаю!"],
 ["d","Haha, então quero provar. E a conta, se faz favor.","Ха-ха, тогда хочу попробовать. И счёт, пожалуйста."],
 ["tq","Com certeza. Querem número de contribuinte na fatura?","Конечно. Нужен ИНН в счёте?"],
 ["ru","Não, obrigado. Eles são turistas, e eu não preciso.","Нет, спасибо. Они туристы, а мне не нужно."],
 ["d","Senhor Manuel, estava tudo ótimo. Muito obrigada!","Сеньор Мануэл, всё было отлично. Большое спасибо!"]
 ],

{t:"De comboio para Sintra",ru:"На поезде в Синтру",e:"🏰",
 lines:[
 ["d","Bom dia! Dois bilhetes para Sintra, se faz favor.","Доброе утро! Два билета до Синтры, пожалуйста."],
 ["bi","Só ida ou ida e volta?","Только туда или туда и обратно?"],
 ["d","Ida e volta. Podemos usar o cartão de vinte e quatro horas?","Туда и обратно. Можно использовать карту на двадцать четыре часа?"],
 ["bi","Não, esse cartão não dá para o comboio. Precisam de carregar o cartão com viagens de comboio.","Нет, эта карта не действует на поезд. Нужно пополнить карту поездками на поезд."],
 ["f","E quanto custa?","А сколько стоит?"],
 ["bi","Dois euros e trinta e cinco cada viagem. Ida e volta para dois, nove euros e quarenta.","Два евро тридцать пять каждая поездка. Туда и обратно на двоих — девять евро сорок."],
 ["d","Está bem. De que linha parte o comboio?","Хорошо. С какого пути отправляется поезд?"],
 ["bi","Da linha dois. Parte às nove e onze.","Со второго пути. Отправляется в девять одиннадцать."],
 ["f","Às nove e onze? Faltam só três minutos!","В девять одиннадцать? Осталось всего три минуты!"],
 ["bi","Não se preocupem, há um comboio de vinte em vinte minutos.","Не волнуйтесь, поезда ходят каждые двадцать минут."],
 ["d","Ufa! Quanto tempo demora a viagem?","Уф! Сколько ехать?"],
 ["bi","Cerca de quarenta minutos. Sintra é a última estação.","Около сорока минут. Синтра — конечная станция."],
 ["d","Obrigada! Corre, Fatih, ainda conseguimos!","Спасибо! Бежим, Фатих, ещё успеваем!"],
 ["f","Conseguimos! Mas está cheio. Não há lugares.","Успели! Но битком. Мест нет."],
 ["d","Ali, ao fundo, há dois lugares livres.","Вон там, в конце, два свободных места."],
 ["f","Desculpe, este lugar está ocupado?","Извините, это место занято?"],
 ["ru","Não, está livre. Podem sentar-se. Oh, Fatih! Daria! Que coincidência!","Нет, свободно. Садитесь. О, Фатих! Дарья! Какое совпадение!"],
 ["d","Rui! Também vais para Sintra?","Руй! Ты тоже едешь в Синтру?"],
 ["ru","Vou visitar a minha tia. Ela mora lá. E vocês, o que vão ver?","Еду навестить тётю. Она там живёт. А вы что будете смотреть?"],
 ["d","O Palácio da Pena. Vimos fotos, é tão colorido!","Дворец Пена. Мы видели фото, он такой яркий!"],
 ["ru","É lindo. Mas fica no alto da serra. Não vão a pé, é muito longe.","Он прекрасен. Но он высоко в горах. Не идите пешком, это очень далеко."],
 ["f","Então como subimos?","Тогда как подняться?"],
 ["ru","Apanhem o autocarro quatrocentos e trinta e quatro à saída da estação.","Садитесь на автобус четыреста тридцать четыре у выхода со станции."],
 ["d","Quatrocentos e trinta e quatro. Anotado! E os bilhetes do palácio?","Четыреста тридцать четыре. Записала! А билеты во дворец?"],
 ["ru","Comprem online, no telemóvel. Assim não esperam na fila.","Купите онлайн, в телефоне. Так не будете стоять в очереди."],
 ["d","Boa ideia. Vou comprar já.","Хорошая идея. Сейчас куплю."],
 ["ru","E levem um casaco. Em Sintra há sempre nevoeiro e está mais frio.","И возьмите куртку. В Синтре всегда туман и холоднее."],
 ["f","Mais frio? Mas em Lisboa estão vinte e cinco graus!","Холоднее? Но в Лиссабоне двадцать пять градусов!"],
 ["ru","Pois, mas a serra tem o seu próprio clima. Vão ver.","Да, но у гор свой климат. Вот увидите."],
 ["d","Ainda bem que trouxe o casaco na mochila.","Хорошо, что я взяла куртку в рюкзаке."],
 ["ru","E não percam a Quinta da Regaleira, com o poço iniciático.","И не пропустите Кинта-да-Регалейра с «посвятительным колодцем»."],
 ["d","Já está na lista! Rui, o que é aquilo ali, no alto?","Уже в списке! Руй, а что это там, наверху?"],
 ["ru","É o Castelo dos Mouros. Daqui a pouco vão vê-lo de perto.","Это Мавританский замок. Скоро увидите его вблизи."],
 ["f","Que vista! Valeu mesmo a pena acordar cedo.","Какой вид! Правда стоило рано встать."],
 ["ru","Chegámos! Divirtam-se e mandem-me fotos!","Приехали! Развлекайтесь и присылайте мне фото!"]
 ],

{t:"Em Cascais",ru:"Пляж в Кашкайше и прощание",e:"🌊",
 lines:[
 ["ru","Último dia! Que tal Cascais? É só meia hora de comboio.","Последний день! Как насчёт Кашкайша? Всего полчаса на поезде."],

 ["ru","Bem-vindo ao Atlântico, pá! Mas experimenta, é bom para a saúde.","Добро пожаловать в Атлантику, приятель! Но попробуй, это полезно для здоровья."],

 ["d","Cone, com duas bolas: pastel de nata e manga.","Рожок, два шарика: паштел-де-ната и манго."],

 ["ru","E eu, maracujá. Hoje pago eu, e não aceito «não»!","А мне маракуйю. Сегодня плачу я, и «нет» не принимается!"],
 ["d","Rui, já pagaste tantas vezes! Não é justo.","Руй, ты уже столько раз платил! Это несправедливо."],
 ["ru","Então, para a próxima, vocês recebem-me em Antália.","Тогда в следующий раз вы принимаете меня в Анталии."],
 ["f","Combinado! Mostramos-te as praias e as montanhas.","Договорились! Покажем тебе пляжи и горы."],
 ["d","E vais ver como o mar é quente!","И увидишь, какое тёплое море!"],
 ["ru","Isso convence-me! Vou já marcar férias para o verão.","Вот это меня убеждает! Сейчас же запланирую отпуск на лето."],
 ["d","Sabes, Rui? Já tenho saudades de Lisboa, e ainda nem saí.","Знаешь, Руй? Я уже скучаю по Лиссабону, а ещё даже не уехала."],
 ["ru","Isso é a saudade portuguesa. É uma palavra que só nós temos.","Это и есть португальская «саудади». Это слово есть только у нас."],
 ["f","Em turco também temos uma palavra parecida: «özlem».","В турецком тоже есть похожее слово: «özlem»."],

 ["ru","A que horas é o vosso voo amanhã?","Во сколько у вас завтра рейс?"],
 ["f","Às dez da manhã. Temos de sair do apartamento às sete.","В десять утра. Нам нужно выйти из квартиры в семь."],

 ["ru","Vamos, então. Lisboa ainda tem uma surpresa para vocês.","Тогда пошли. У Лиссабона для вас ещё есть сюрприз."]

<script>
(function(){
const app=document.getElementById('app');
const LSK=META.lsk;
function lsGet(k,d){try{const v=localStorage.getItem(LSK+k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(LSK+k,JSON.stringify(v))}catch(e){}}
let opt={auto:lsGet('auto',true),sound:lsGet('sound',true),subs:lsGet('subs',false)};
let done=lsGet('done',[]);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WRE=/[A-Za-zÀ-ÿ]+(?:-[A-Za-zÀ-ÿ]+)*/g;
function wordsHTML(t){let out='',last=0;t.replace(WRE,(m,i)=>{out+=esc(t.slice(last,i))+'<span class="w" data-w="'+esc(m)+'">'+esc(m)+'</span>';last=i+m.length;return m});return out+esc(t.slice(last))}

/* ---------- SPEECH ---------- */
const S=window.speechSynthesis;let voices=[];
function loadV(){try{const all=S.getVoices();const re=META.tts==='pt-PT'?/^pt[-_]PT/i:/^pt[-_]BR/i;voices=all.filter(v=>re.test(v.lang));if(!voices.length)voices=all.filter(v=>/^pt/i.test(v.lang))}catch(e){}}
if(S){loadV();S.onvoiceschanged=loadV}
const FEM=/luciana|francisca|fernanda|vit[oó]ria|maria|thalita|leila|raquel|joana|catarina|in[eê]s|google portugu|female|feminin/i;
const MAL=/felipe|daniel|ant[oô]nio|ricardo|donato|f[aá]bio|humberto|j[uú]lio|duarte|cristiano|male|masculin/i;
function pickVoice(g){const f=voices.filter(v=>FEM.test(v.name)&&!MAL.test(v.name)),m=voices.filter(v=>MAL.test(v.name)&&!/female/i.test(v.name));
 if(g==='m'&&m.length)return{v:m[0],p:1};if(g==='f'&&f.length)return{v:f[0],p:1};
 return{v:voices[0]||null,p:g==='m'?0.8:1.15}}
function clean(t){return t.replace(/[^\p{L}\p{N}\s.,!?;:'\-]/gu,' ').replace(/\s+/g,' ').trim()}
let tok=0,safety=null;
function stopSpeech(){tok++;clearTimeout(safety);try{S&&S.cancel()}catch(e){}}
function say(text,g,cb){const my=++tok;clearTimeout(safety);
 const fin=()=>{if(my!==tok)return;clearTimeout(safety);cb&&cb()};
 const txt=clean(text);
 if(!opt.sound||!S||!txt){safety=setTimeout(fin,Math.max(1400,txt.split(' ').length*430));return}
 try{S.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=META.tts;const pv=pickVoice(g);if(pv.v)u.voice=pv.v;u.pitch=pv.p;u.rate=0.88;
  u.onend=fin;u.onerror=fin;S.speak(u)}catch(e){}

/* ---------- PLAYER (generic over items on page) ---------- */
let P={items:[],cur:0,playing:false,onEnd:null};
function setCur(i,scroll){P.items.forEach((it,k)=>{it.el.classList.toggle('cur',k===i);const t=it.el.querySelector('.tr');if(t&&!t.dataset.man)t.hidden=!(opt.subs&&k===i)});P.cur=i;

function playFrom(i){if(i>=P.items.length){P.playing=false;setCur(-1);updBar();P.onEnd&&P.onEnd();return}
 P.playing=true;setCur(i,true);const it=P.items[i];
 say(it.say,it.g,()=>{if(!P.playing)return;if(opt.auto)setTimeout(()=>{if(P.playing&&P.cur===i)playFrom(i+1)},650);else{P.playing=false;P.cur=Math.min(i+1,P.items.length-1);setCur(P.cur);updBar()}})}
function pause(){P.playing=false;stopSpeech();updBar()}
function toggle(){if(P.playing)pause();else playFrom(Math.max(0,P.cur))}
function playOne(i){P.playing=false;setCur(i,false);say(P.items[i].say,P.items[i].g,()=>{})}
function updBar(){const pb=document.getElementById('pp');if(pb)pb.textContent=P.playing?'⏸':'▶';

 const sb=document.getElementById('subB');if(sb){sb.classList.toggle('on',opt.subs);sb.setAttribute('aria-pressed',opt.subs)}

function barHTML(title,backLabel){return `<div class="bar gut"><div class="col">
 <div class="r1"><button class="ib" id="backB">${backLabel}</button><button class="ttl navB" aria-label="Навигация: все диалоги и упражнения"><span class="tt">${title}</span><span class="car">▾</span></button><button class="ib" id="vocB" aria-label="Слова и конструкции">📚</button></div>
 <div class="r2"><button class="ib" id="prevB" aria-label="Предыдущая фраза">⏮</button><button class="ib play" id="pp" aria-label="Пауза / слушать">▶</button><button class="ib" id="nextB" aria-label="Следующая фраза">⏭</button><button class="ib" id="rptB" aria-label="Сначала">🔁</button><span class="cnt" id="cnt"></span></div>
 <div class="r3"><button class="ib" id="autoB" aria-pressed="true">▶▶ Авто</button><button class="ib" id="sndB" aria-pressed="true">🔊 Звук</button><button class="ib" id="subB" aria-pressed="false">💬 Субтитры</button></div>
</div></div>`}
function bindBar(onBack,onVoc){
 document.getElementById('backB').onclick=()=>{pause();onBack()};
 document.getElementById('vocB').onclick=()=>{pause();onVoc()};
 document.getElementById('pp').onclick=toggle;
 document.getElementById('prevB').onclick=()=>{const i=Math.max(0,P.cur-1);if(P.playing)playFrom(i);else playOne(i)};
 document.getElementById('nextB').onclick=()=>{const i=Math.min(P.items.length-1,P.cur+1);if(P.playing)playFrom(i);else playOne(i)};
 document.getElementById('rptB').onclick=()=>{playFrom(0)};
 document.getElementById('autoB').onclick=()=>{opt.auto=!opt.auto;lsSet('auto',opt.auto);updBar()};
 document.getElementById('sndB').onclick=()=>{opt.sound=!opt.sound;lsSet('sound',opt.sound);if(!opt.sound)try{S&&S.cancel()}catch(e){};if(P.playing)playFrom(P.cur);updBar()};
 document.getElementById('subB').onclick=()=>{opt.subs=!opt.subs;lsSet('subs',opt.subs);setCur(P.cur)};
 updBar()}

/* ---------- WORD POPUP ---------- */
let popEl=null,selW=null;
function closePop(){if(popEl){popEl.remove();popEl=null}if(selW){selW.classList.remove('sel');selW=null}}
function showWord(span){closePop();const w=span.dataset.w,k=w.toLowerCase();const tr=DICT[k]||'—';

 popEl.innerHTML=`<button class="sb" aria-label="Послушать слово">🔊</button><div style="flex:1;min-width:0"><div class="pw">${esc(w)}</div><div class="pr">${esc(tr)}</div></div><button class="x" aria-label="Закрыть">✕</button>`;
 document.body.appendChild(popEl);
 const r=span.getBoundingClientRect(),pw=popEl.offsetWidth,ph=popEl.offsetHeight,vw=innerWidth;
 let left=Math.min(Math.max(16,r.left+r.width/2-pw/2),vw-16-pw);let top=r.bottom+8;if(top+ph>innerHeight-10)top=r.top-ph-8;
 popEl.style.left=left+'px';popEl.style.top=top+'px';
 popEl.querySelector('.sb').onclick=e=>{e.stopPropagation();const was=P.playing;if(was)pause();say(w,'f',()=>{})};
 popEl.querySelector('.x').onclick=e=>{e.stopPropagation();closePop()};
 if(opt.sound){if(P.playing)pause();say(w,'f',()=>{})}}
document.addEventListener('click',e=>{const w=e.target.closest('.w');if(w){e.stopPropagation();showWord(w);return}

addEventListener('scroll',()=>{if(popEl)closePop()},{passive:true});

function home(){CUR={i:-1,k:'home'};pause();closePop();P={items:[],cur:0,playing:false,onEnd:null};

  const g=e.target.closest('.glob');if(g){const t=g.closest('.ccard').querySelector('.tr');t.hidden=!t.hidden;if(t.hidden)delete t.dataset.man;else t.dataset.man='1'}});

/* ---------- EXERCISES ---------- */
const XT=[
 {k:'exp',n:'➕ Расширяем фразу',d:'Фраза растёт кусочек за кусочком — собери её из слов'},
 {k:'sub',n:'🔄 Замени слово',d:'Берём фразу-образец, меняем одну часть — выбери верный вариант'},
 {k:'ant',n:'🎯 Скажи раньше, чем услышишь',d:'Скажи фразу вслух сама, потом выбери и сверь'}];
let ans=lsGet('ans',{}),xs=lsGet('xs',{});
let X=null,cdT=null;
const norm=t=>t.toLowerCase().replace(/[.,!?;:«»"]/g,'').replace(/\s+/g,' ').trim();
const toks=t=>norm(t).split(' ');
function shuf(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function cap(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function sayList(list,i,done){if(i>=list.length){done&&done();return}const it=list[i];
 document.querySelectorAll('.rd').forEach(e=>e.classList.remove('rd'));if(it.el)it.el.classList.add('rd');

function clearRd(){document.querySelectorAll('.rd').forEach(e=>e.classList.remove('rd'))}

function simpleBar(title,back){return `<div class="bar gut"><div class="col"><div class="r1"><button class="ib" id="backB">${back}</button><button class="ttl navB" aria-label="Навигация: все диалоги и упражнения"><span class="tt">${title}</span><span class="car">▾</span></button></div></div></div>`}

function exMenu(i){CUR={i,k:'menu'};closePop();stopSpeech();clearTimeout(cdT);
 app.innerHTML=simpleBar(`🏋️ ${i+1}. ${esc(DLG[i].t)}: упражнения`,'← К диалогу')+`<div class="gut"><div class="col page">
 <button class="skip" id="skipM">⏭ Пропустить эту страницу</button>
 <div class="list">${XT.map((t,k)=>{const n=t.k==='exp'?EX[i].exp.length:EX[i][t.k].length;const sc=xs[i+'-'+t.k];
  return `<button class="xcard" data-k="${t.k}"><span class="tx"><b>${t.n}</b><span>${t.d} · ${n} заданий</span></span>${sc?`<span class="sc">✓ ${sc}</span>`:''}</button>`}).join('')}</div>
 <button class="big sec" id="myM"><span>📋</span><span>Мои ответы</span></button>
 ${i<DLG.length-1?`<button class="big" id="nxM"><span>${DLG[i+1].e}</span><span>Дальше: ${i+2}. ${esc(DLG[i+1].t)} →</span></button>`:`<button class="big" id="nxM"><span>🏁</span><span>Повторить все слова и конструкции</span></button>`}
 </div></div>`;
 scrollTo(0,0);
 document.getElementById('backB').onclick=()=>openDlgQuiet(i);
 app.querySelectorAll('.xcard').forEach(b=>b.onclick=()=>runEx(i,b.dataset.k));
 document.getElementById('myM').onclick=()=>myAnswers(()=>exMenu(i));
 document.getElementById('skipM').onclick=()=>{i<DLG.length-1?openDlg(i+1):vocab(-1,home)};
 document.getElementById('nxM').onclick=()=>{i<DLG.length-1?openDlg(i+1):vocab(-1,home)};}
function openDlgQuiet(i){const a=opt.auto;opt.auto=false;openDlg(i);opt.auto=a;updBar()}

function runEx(i,k,list,mode){const all=EX[i][k].map((_,n)=>n);
 X={i,k,list:list||all,pos:0,stage:0,first:{},wrong:[],mode:mode||'main'};renderTask()}

function exBar(){const t=XT.find(t=>t.k===X.k);return `<div class="bar gut"><div class="col">
 <div class="r1"><button class="ib" id="backB">← Назад</button><button class="ttl navB" aria-label="Навигация: все диалоги и упражнения"><span class="tt">${t.n}${X.mode==='fix'?' · ошибки':''}</span><span class="car">▾</span></button><button class="ib" id="myB" aria-label="Мои ответы">📋</button></div>
 <div class="r2"><button class="ib" id="prevB" aria-label="Предыдущее задание">⏮</button><button class="ib play" id="sayB" aria-label="Послушать снова">🔊</button><button class="ib" id="nextB" aria-label="Следующее задание">⏭</button><button class="ib" id="rptB" aria-label="Начать упражнение заново">🔁</button><span class="cnt">${X.pos+1}/${X.list.length}</span></div>
 <div class="r3"><button class="ib" id="autoB">▶▶ Авто</button><button class="ib" id="sndB">🔊 Звук</button></div>
</div></div>`}
function bindExBar(speakFn){
 document.getElementById('backB').onclick=()=>{stopSpeech();clearTimeout(cdT);exMenu(X.i)};
 document.getElementById('myB').onclick=()=>{stopSpeech();clearTimeout(cdT);const s={...X};myAnswers(()=>{X=s;renderTask()})};
 document.getElementById('prevB').onclick=()=>{if(X.pos>0){X.pos--;X.stage=0;renderTask()}};
 document.getElementById('nextB').onclick=()=>{X.pos++;X.stage=0;renderTask()};
 document.getElementById('rptB').onclick=()=>runEx(X.i,X.k,null,'main');
 document.getElementById('sayB').onclick=()=>speakFn&&speakFn();
 document.getElementById('autoB').onclick=()=>{opt.auto=!opt.auto;lsSet('auto',opt.auto);updBar()};
 document.getElementById('sndB').onclick=()=>{opt.sound=!opt.sound;lsSet('sound',opt.sound);if(!opt.sound)stopSpeech();updBar()};
 updBar()}
function record(idx,ok,q,a,c){if(!(idx in X.first)){X.first[idx]=ok;if(!ok)X.wrong.push(idx)}
 ans[X.i+'-'+X.k+'-'+idx]={q,a,ok,c};lsSet('ans',ans)}

function renderTask(){CUR={i:X.i,k:X.k};closePop();stopSpeech();clearTimeout(cdT);
 if(X.pos>=X.list.length)return exEnd();
 const idx=X.list[X.pos],it=EX[X.i][X.k][idx];
 app.innerHTML=exBar()+`<div class="gut"><div class="col page"><button class="skip" id="skipT">⏭ Пропустить эту страницу</button><div class="task" id="task"></div></div></div>`;
 scrollTo(0,0);
 document.getElementById('skipT').onclick=()=>{X.pos++;X.stage=0;renderTask()};
 const box=document.getElementById('task');
 if(X.k==='exp')taskExp(box,idx,it);else if(X.k==='sub')taskSub(box,idx,it);else taskAnt(box,idx,it)}

function wrongBox(box,html,retry,next,speakOk){const fb=box.querySelector('.fb');
 fb.innerHTML=`<div class="fbm bad">${html}</div><div class="btnrow"><button class="big sec" id="again">🔁 Ещё раз</button><button class="big" id="goOn">Дальше →</button></div>`;
 fb.scrollIntoView({block:'end',behavior:'smooth'});
 document.getElementById('again').onclick=retry;document.getElementById('goOn').onclick=next;
 setTimeout(()=>speakOk&&speakOk(),900)}
function okBox(box,txt,next){const fb=box.querySelector('.fb');fb.innerHTML=`<div class="fbm ok">✅ ${txt}</div>`;fb.scrollIntoView({block:'end',behavior:'smooth'});next()}

/* exp: build the growing phrase */
function taskExp(box,idx,chain){const st=chain[X.stage],prev=X.stage>0?chain[X.stage-1]:null;
 const tgt=st[0].split(' ').filter(Boolean);const tl=tgt.map(w=>w.replace(/[.,!?]/g,''));
 let tiles;const pv=prev?prev[0].split(' '):null;let pos=-1;
 if(pv){for(let a=0;a+pv.length<=tl.length;a++){if(pv.every((w,j)=>tl[a+j]===w)){pos=a;break}}}
 if(pos>=0)tiles=[...tl.slice(0,pos),pv.join(' '),...tl.slice(pos+pv.length)];else tiles=tl.slice();
 const chunkTxt=pos>=0?pv.join(' '):null;
 tiles.push(st[2]);
 let order=shuf(tiles.map((t,n)=>n));let tries=0;while(tries++<8&&order.slice(0,tiles.length-1).every((v,n)=>v===n))order=shuf(order);
 box.innerHTML=`<div class="steps">${chain.map((_,n)=>`<span class="dot${n<=X.stage?' on':''}"></span>`).join('')}<span>Шаг ${X.stage+1} из ${chain.length} · задание ${X.pos+1} из ${X.list.length}</span></div>
 ${prev?`<div class="model"><div class="q">Было:</div><div class="row"><div class="pt">${wordsHTML(prev[0])}</div><button class="sb" id="pvS" aria-label="Послушать">🔊</button><button class="sb" id="pvG" aria-label="Перевод фразы">🌐</button></div><div class="tr" hidden>${esc(prev[1])}</div></div>`:''}
 <div class="q">Собери по-португальски:<br><b>«${esc(st[1])}»</b></div>
 <div class="ansbox" id="ab" aria-live="polite"></div>
 <div class="tiles" id="tl">${order.map(n=>`<button class="tile${tiles[n]===chunkTxt?' chunk':''}" data-n="${n}">${esc(tiles[n])}</button>`).join('')}</div>
 <div class="fb"></div>`;
 const ab=box.querySelector('#ab'),tlb=box.querySelector('#tl');let placed=[];
 const need=tl.length;
 const count=()=>placed.reduce((s,n)=>s+tiles[n].split(' ').length,0);
 const speakPrev=()=>{if(prev)say(prev[0],'f',()=>{})};
 bindExBar(speakPrev);
 if(prev){box.querySelector('#pvS').onclick=speakPrev;box.querySelector('#pvG').onclick=()=>{const t=box.querySelector('.model .tr');t.hidden=!t.hidden}}
 const nextStage=()=>{if(X.stage<chain.length-1){X.stage++;renderTask()}else{X.stage=0;X.pos++;renderTask()}};
 const check=()=>{const a=placed.map(n=>tiles[n]).join(' ');const okList=[st[0],...(st[3]||[])].map(norm);const ok=okList.includes(norm(a));
  tlb.querySelectorAll('.tile').forEach(b=>b.disabled=true);ab.querySelectorAll('.tile').forEach(b=>b.disabled=true);
  if(X.stage===chain.length-1||!ok)record(idx,ok&&!(idx in X.first&&!X.first[idx]),`${chain[chain.length-1][1]}`,ok?st[0]:a,st[0]);
  if(ok){ab.classList.add('ok');okBox(box,'Верно: '+esc(cap(st[0])),()=>say(st[0],'f',()=>setTimeout(nextStage,700)))}
  else{ab.classList.add('bad');const extra=placed.map(n=>tiles[n]).includes(st[2])?`<br>Лишнее слово: <b>${esc(st[2])}</b>`:'';
   wrongBox(box,`Правильно: <b>${esc(cap(st[0]))}</b>${extra}`,()=>renderTask(),nextStage,()=>say(st[0],'f',()=>{}))}};
 const draw=()=>{ab.innerHTML=placed.map(n=>`<button class="tile${tiles[n]===chunkTxt?' chunk':''}" data-n="${n}">${esc(tiles[n])}</button>`).join('');
  tlb.querySelectorAll('.tile').forEach(b=>b.hidden=placed.includes(+b.dataset.n));if(count()>=need)check()};
 tlb.onclick=e=>{const b=e.target.closest('.tile');if(!b||b.disabled)return;placed.push(+b.dataset.n);say(tiles[+b.dataset.n],'f',()=>{});draw()};
 ab.onclick=e=>{const b=e.target.closest('.tile');if(!b||b.disabled)return;placed=placed.filter(n=>n!==+b.dataset.n);draw()};
 if(opt.auto&&prev)setTimeout(speakPrev,300)}

/* options shared by sub & ant */
function buildOpts(okT,bads){const opts=[okT,...bads];let ord=shuf([0,1,2]);if(ord[0]===0)ord=[ord[1],ord[0],ord[2]];return ord.map(n=>({t:opts[n],ok:n===0}))}
function optsHTML(o){return `<div class="opts">${o.map((x,n)=>`<div class="orow"><button class="opt" data-n="${n}">${esc(x.t)}</button><button class="sb osay" data-n="${n}" aria-label="Послушать вариант">🔊</button></div>`).join('')}</div>`}
function bindOpts(box,o,idx,q,okT,why,readFirst){const els=[...box.querySelectorAll('.opt')];
 const readAll=()=>{const l=(readFirst?[{t:readFirst.t,el:readFirst.el}]:[]).concat(els.map((el,n)=>({t:o[n].t,el})));sayList(l,0,()=>{clearRd();box.querySelector('.opts').scrollIntoView({block:'nearest',behavior:'smooth'})})};
 box.querySelectorAll('.osay').forEach(b=>b.onclick=()=>{stopSpeech();clearRd();say(o[+b.dataset.n].t,'f',()=>{})});
 els.forEach((b,n)=>b.onclick=()=>{stopSpeech();clearRd();els.forEach(e=>e.disabled=true);const ok=o[n].ok;
  record(idx,ok,q,o[n].t,okT);
  if(ok){b.classList.add('ok');okBox(box,'Верно!',()=>say(okT,'f',()=>setTimeout(()=>{X.pos++;renderTask()},700)))}
  else{b.classList.add('bad');els[o.findIndex(x=>x.ok)].classList.add('ok');
   wrongBox(box,`Правильно: <b>${esc(okT)}</b><br>💡 ${esc(why)}`,()=>renderTask(),()=>{X.pos++;renderTask()},()=>say(okT,'f',()=>{}))}});
 return readAll}

/* sub: substitution drill */
function taskSub(box,idx,it){const [m,mru,cue,okT,b1,b2,why]=it;const o=buildOpts(okT,[b1,b2]);
 box.innerHTML=`<div class="model"><div class="q">Образец:</div><div class="row"><div class="pt" id="mT">${wordsHTML(m)}</div><button class="sb" id="mS" aria-label="Послушать">🔊</button><button class="sb" id="mG" aria-label="Перевод фразы">🌐</button></div><div class="tr" hidden>${esc(mru)}</div></div>
 <div class="q">Замени на: <b>${esc(cue)}</b></div>${optsHTML(o)}<div class="fb"></div>`;
 const readAll=bindOpts(box,o,idx,`${m} → ${cue}`,okT,why,{t:m,el:box.querySelector('.model')});
 box.querySelector('#mS').onclick=()=>say(m,'f',()=>{});
 box.querySelector('#mG').onclick=()=>{const t=box.querySelector('.model .tr');t.hidden=!t.hidden};
 bindExBar(readAll);if(opt.auto)setTimeout(readAll,300)}

/* ant: anticipation — say it first, then check */
function taskAnt(box,idx,it){const [ru,okT,b1,b2,why]=it;const o=buildOpts(okT,[b1,b2]);
 box.innerHTML=`<div class="q">${META.antQ||'Как сказать по-португальски?'}</div><div class="rucard">${esc(ru)}</div>
 <div class="cd" id="cd"><b id="cdn">4</b><span>🗣 Скажи вслух сама…</span><button class="pill" id="cdSkip">Показать варианты</button></div>
 <div id="ow" hidden>${optsHTML(o)}</div><div class="fb"></div>`;
 const readAll=bindOpts(box,o,idx,ru,okT,why,null);
 let n=4;const show=()=>{clearTimeout(cdT);box.querySelector('#cd').hidden=true;box.querySelector('#ow').hidden=false;if(opt.auto)readAll()};
 const tick=()=>{n--;const c=box.querySelector('#cdn');if(!c)return;if(n<=0)return show();c.textContent=n;cdT=setTimeout(tick,1000)};
 cdT=setTimeout(tick,1000);box.querySelector('#cdSkip').onclick=show;
 bindExBar(()=>{if(!box.querySelector('#ow').hidden)readAll()})}

function exEnd(){const tot=X.list.length,good=X.list.filter(i=>X.first[i]===true).length;
 if(X.mode==='main'){xs[X.i+'-'+X.k]=good+'/'+tot;lsSet('xs',xs)}
 const t=XT.find(t=>t.k===X.k);const ki=XT.findIndex(t=>t.k===X.k);
 app.innerHTML=simpleBar(t.n,'← Назад')+`<div class="gut"><div class="col page">
 <button class="skip" id="skipE">⏭ Пропустить эту страницу</button>
 <div class="end"><h2>${good===tot?'🎉 Всё верно!':'💪 Готово!'}</h2><div style="font-size:17px">Верно с первого раза: <b>${good} из ${tot}</b></div>
 ${X.wrong.length?`<div class="fbm bad">Работа над ошибками? Повторим ${X.wrong.length} ${X.wrong.length===1?'задание':'задания'} с ошибкой.</div><div class="btnrow"><button class="big" id="fixY">Да</button><button class="big sec" id="fixN">Нет</button></div>`:''}
 <div id="after" ${X.wrong.length?'hidden':''} style="display:flex;flex-direction:column;gap:8px">
 ${ki<XT.length-1?`<button class="big" id="nxE"><span>➡️</span><span>Следующее: ${XT[ki+1].n}</span></button>`:''}
 <button class="big ${ki<XT.length-1?'sec':''}" id="mnE"><span>🏋️</span><span>К упражнениям диалога</span></button></div>
 </div></div></div>`;
 scrollTo(0,0);const i=X.i,w=X.wrong.slice(),k=X.k;
 const after=()=>{const a=document.getElementById('after');a.hidden=false;const y=document.getElementById('fixY');if(y)y.closest('.btnrow').remove();a.scrollIntoView({block:'end',behavior:'smooth'})};
 document.getElementById('backB').onclick=()=>exMenu(i);
 document.getElementById('skipE').onclick=()=>exMenu(i);
 const y=document.getElementById('fixY');if(y){y.onclick=()=>runEx(i,k,w,'fix');document.getElementById('fixN').onclick=after}
 const nx=document.getElementById('nxE');if(nx)nx.onclick=()=>runEx(i,XT[ki+1].k);
 document.getElementById('mnE').onclick=()=>exMenu(i)}

function myAnswers(back){closePop();stopSpeech();
 const keys=Object.keys(ans);
 const body=DLG.map((d,i)=>{const parts=XT.map(t=>{const ks=keys.filter(k=>k.startsWith(i+'-'+t.k+'-')).sort((a,b)=>+a.split('-')[2]-+b.split('-')[2]);if(!ks.length)return'';
   return `<div class="q"><b>${t.n}</b></div>`+ks.map(k=>{const a=ans[k];return `<div class="mya">${a.ok?'✅':'❌'} ${esc(a.q)}<br>Мой ответ: ${esc(a.a)}${a.ok?'':`<br><span class="c">Правильно: ${esc(a.c)}</span>`}</div>`}).join('')}).join('');
  return parts?`<div class="sec-h">${d.e} ${i+1}. ${esc(d.t)}</div><div class="myl">${parts}</div>`:''}).join('');
 app.innerHTML=simpleBar('📋 Мои ответы','← Назад')+`<div class="gut"><div class="col page">
 <button class="skip" id="skipA">⏭ Пропустить эту страницу</button>
 ${body||'<div class="hint">Здесь появятся твои ответы из упражнений: что верно, где ошибка и правильный вариант. При повторном прохождении ответ перезаписывается.</div>'}
 </div></div>`;
 scrollTo(0,0);document.getElementById('backB').onclick=back;document.getElementById('skipA').onclick=back}

/* ---------- NAVIGATION (from any page to any dialogue / exercise) ---------- */
function navPop(){closePop();stopSpeech();if(typeof pause==='function')pause();clearTimeout(cdT);
 const old=document.querySelector('.ov');if(old)old.remove();
 const ov=document.createElement('div');ov.className='ov';
 const cell=(i,k,ic,lbl)=>{const here=CUR.i===i&&CUR.k===k;const dn=k==='dlg'?done.includes(i):!!xs[i+'-'+k];
  return `<button class="nb ex${here?' here':''}${dn?' dn':''}" data-i="${i}" data-k="${k}" aria-label="${lbl} ${i+1}">${ic}</button>`};
 ov.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><button class="x" aria-label="Закрыть">✕</button><h3>🧭 Куда перейти?</h3>
 <div class="navtop"><button class="big sec" data-go="home">🏠 Меню</button><button class="big sec" data-go="all">📚 Все слова</button><button class="big sec" data-go="my">📋 Ответы</button></div>
 <div class="nav"><span class="hd l">Диалог</span><span class="hd">➕</span><span class="hd">🔄</span><span class="hd">🎯</span><span class="hd">📚</span>
 ${DLG.map((d,i)=>`<button class="nb dl${CUR.i===i&&CUR.k==='dlg'?' here':''}${done.includes(i)?' dn':''}" data-i="${i}" data-k="dlg"><span>${d.e}</span><span class="nt">${i+1}. ${esc(d.t)}</span></button>${cell(i,'exp','➕','Расширяем фразу')}${cell(i,'sub','🔄','Замени слово')}${cell(i,'ant','🎯','Скажи раньше')}${cell(i,'voc','📚','Слова')}`).join('')}
 </div>
 <div class="legend">➕ Расширяем фразу · 🔄 Замени слово · 🎯 Скажи раньше, чем услышишь · 📚 Слова и конструкции · ✓ пройдено</div></div>`;
 document.body.appendChild(ov);
 const c=()=>ov.remove();ov.querySelector('.x').onclick=c;ov.onclick=e=>{if(e.target===ov)c()};
 ov.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{c();const g=b.dataset.go;if(g==='home')home();else if(g==='all')vocab(-1,home);else myAnswers(home)});
 ov.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{c();const i=+b.dataset.i,k=b.dataset.k;
  if(k==='dlg')openDlg(i);else if(k==='voc')vocab(i,()=>openDlg(i));else runEx(i,k)});}
document.addEventListener('click',e=>{if(e.target.closest('.navB')){e.preventDefault();navPop()}});

function normCode(v){let t=String(v||'').toLowerCase().replace(/[\s.\-_]/g,'');
 t=t.replace(/^(дарья|дария|дариа|даря|дарjа|дарjа)/,'daria').replace(/^(darja|darya|darija|dariya|daria)/,'daria');
 t=t.replace(/[бвbв]2$/,'b2').replace(/[вb]$/,'b');return t}
const TEACHER='dariab2';
const CODES=[TEACHER].concat((META.codes||[]).map(normCode));
function gateOk(){return CODES.includes(normCode(lsGet('code','')))}
function showGate(){const g=document.createElement('div');g.className='gate';
 g.innerHTML=`<form class="gb" id="gf" autocomplete="off"><div class="gi">🔒</div><h2>${META.h1}</h2><p>Введи, пожалуйста, свой код, чтобы открыть урок.</p>
 <input id="gc" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Код" placeholder="Код">
 <p class="err" id="ge" aria-live="polite"></p><button class="big" type="submit">Открыть урок</button><div class="own">© Daria Botina</div></form>`;
 document.body.appendChild(g);
 g.querySelector('#gf').addEventListener('submit',e=>{e.preventDefault();const v=g.querySelector('#gc').value.trim();
  if(CODES.includes(normCode(v))){lsSet('code',v);g.remove();home()}
  else{g.querySelector('#ge').textContent=v?'Код не подходит. Проверь, пожалуйста, и попробуй ещё раз.':'Введи, пожалуйста, код.'}})}
if(META.gate&&!gateOk())showGate();else home();
})();
</script>
