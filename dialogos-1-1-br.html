<style>
/* Layout: phone-first column; sticky control header on dialogue pages; chat bubbles (Daria on the right) */
:root{
  --bg:#f1f6f3; --card:#ffffff; --ink:#10302a; --muted:#52695f; --accent:#0a7a5a; --accent-ink:#ffffff;
  --sun:#f2c12e; --me:#dcf1e6; --line:#d2e1d9; --hl:#fff1bd; --tr:#3d5a50;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1916; --card:#14261f; --ink:#e5f0eb; --muted:#97b0a6; --accent:#3cc393; --accent-ink:#06281d;
  --sun:#f2c12e; --me:#1a3a2d; --line:#24403a; --hl:#3b3418; --tr:#b9cec5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1916; --card:#14261f; --ink:#e5f0eb; --muted:#97b0a6; --accent:#3cc393; --accent-ink:#06281d;
  --sun:#f2c12e; --me:#1a3a2d; --line:#24403a; --hl:#3b3418; --tr:#b9cec5; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* HOME */
.home{padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:15px}
.logo{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;letter-spacing:.5px}
.pill{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--sun);opacity:.35}
.eyebrow{font-size:12.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:800}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;margin:0;text-wrap:balance;position:relative}
.sub{color:var(--muted);margin:0;font-size:14.5px;position:relative}
.hint{font-size:13.5px;color:var(--muted);background:var(--me);border-radius:12px;padding:9px 12px;line-height:1.45}
.big{border:0;border-radius:14px;padding:13px 14px;font-weight:800;font-size:16px;background:var(--accent);color:var(--accent-ink);text-align:left;display:flex;gap:10px;align-items:center}
.big.sec{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.list{display:flex;flex-direction:column;gap:8px}
.dcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.dcard .em{font-size:26px;width:40px;height:40px;display:grid;place-items:center;background:var(--bg);border-radius:12px;flex:none}
.dcard .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.dcard b{font-family:var(--display);font-size:17px;font-weight:800}
.dcard span{font-size:13px;color:var(--muted)}
.dcard .ok{font-size:13px;font-weight:800;color:var(--accent);flex:none}
.own{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px}
.skip{align-self:flex-start;background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px 0}

/* STICKY HEADER */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar .col{padding-block:8px;display:flex;flex-direction:column;gap:6px}
.r1{display:flex;align-items:center;gap:8px}
.r1 .ttl{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--bg);border-radius:10px;height:36px;padding:0 10px;text-align:left}
.r1 .ttl .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r1 .ttl .car{flex:none;color:var(--accent);font-size:14px}
.nav{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,40px);gap:5px;align-items:center}
.nav .hd{font-size:12.5px;font-weight:800;color:var(--muted);text-align:center}
.nav .hd.l{text-align:left}
.nb{height:38px;border:2px solid var(--line);background:var(--card);border-radius:9px;font-size:14px;font-weight:700;padding:0 6px;display:flex;align-items:center;gap:5px;min-width:0;position:relative}
.nb.dl{justify-content:flex-start;text-align:left}.nb.dl .nt{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.nb.ex{justify-content:center;padding:0}
.nb.here{border-color:var(--accent);background:var(--me);box-shadow:0 0 0 2px var(--accent)}
.nb.dn::after{content:"✓";position:absolute;top:-6px;right:-5px;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:18px;height:18px;font-size:12px;display:grid;place-items:center}
.navtop{display:flex;gap:6px}.navtop .big{flex:1;padding:9px 10px;font-size:14px;justify-content:center}
.legend{font-size:12.5px;color:var(--muted);line-height:1.5}
.ib{border:2px solid var(--line);background:var(--card);border-radius:10px;min-width:38px;height:36px;padding:0 9px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px;flex:none}
.r2{display:flex;align-items:center;gap:6px}
.r3{display:flex;gap:6px}.r3 .ib{flex:1 1 0;min-width:0;font-size:13px;padding:0 4px;white-space:nowrap}
.ib.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ib.play{min-width:46px;font-size:16px}
.cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:38px;text-align:center}

/* DIALOGUE */
.page{padding-block:10px 40px;display:flex;flex-direction:column;gap:10px}
.prep{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chat{display:flex;flex-direction:column;gap:10px}
.ln{display:flex;gap:8px;align-items:flex-end;scroll-margin-top:175px;scroll-margin-bottom:80px}
.ln.me{flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:17px;flex:none}
.bb{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 11px 6px;max-width:82%;min-width:0;transition:background .2s,box-shadow .2s}
.me .bb{background:var(--me);border-radius:16px 16px 4px 16px}
.ln.cur .bb{box-shadow:0 0 0 3px var(--sun)}
.nm{font-size:12.5px;font-weight:800;color:var(--accent)}
.pt{font-size:17.5px;line-height:1.45;overflow-wrap:break-word}
.w{cursor:pointer;border-radius:4px;-webkit-tap-highlight-color:transparent}
.w.sel{background:var(--hl)}
.acts{display:flex;justify-content:flex-end;gap:4px;margin-top:2px}
.sb{border:0;background:transparent;font-size:15px;width:32px;height:28px;border-radius:8px;padding:0}
.sb:active{background:var(--bg)}
.tr{font-size:14.5px;color:var(--tr);font-style:italic;border-top:1px dashed var(--line);margin-top:4px;padding-top:4px}
.end{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;scroll-margin-bottom:20px;scroll-margin-top:175px}
.end h2{font-family:var(--display);margin:0;font-size:20px}

/* VOCAB */
.sec-h{font-family:var(--display);font-weight:800;font-size:19px;margin:8px 0 0}
.vgrid{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vrow{display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--line);scroll-margin-top:175px}
.vrow:first-child{border-top:0}
.vrow.cur{background:var(--hl)}
.vrow .pt2{font-weight:800;flex:1 1 50%;min-width:0;font-size:15.5px}
.vrow .ru2{flex:1 1 50%;min-width:0;color:var(--muted);font-size:14px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;scroll-margin-top:175px}
.ccard.cur{box-shadow:0 0 0 3px var(--sun)}
.ccard .pat{font-weight:800;font-size:16px}
.ccard .mean{font-size:14px;color:var(--muted)}
.ccard .ex{display:flex;align-items:flex-start;gap:4px;margin-top:2px}
.ccard .ex .pt{font-size:16px;flex:1;min-width:0}
details.vd{background:transparent}
details.vd>summary{list-style:none;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:800;display:flex;gap:8px;align-items:center}
details.vd>summary::-webkit-details-marker{display:none}
details.vd>summary::after{content:"▾";margin-left:auto;color:var(--muted)}
details.vd[open]>summary::after{content:"▴"}
.vbody{display:flex;flex-direction:column;gap:8px;padding-top:8px}

.pop{position:fixed;z-index:60;background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:8px 10px;box-shadow:0 8px 24px #0004;max-width:min(290px,calc(100vw - 32px));display:flex;gap:8px;align-items:flex-start}
.pop .pw{font-weight:800}
.pop .pr{font-size:14.5px}
.pop .x{border:0;background:none;font-size:16px;padding:0 2px;color:var(--muted)}
.ov{position:fixed;inset:0;z-index:70;background:#0008;display:grid;place-items:center;padding:16px}
.mbox{background:var(--card);border-radius:18px;padding:16px;max-width:400px;width:100%;max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:10px;position:relative}
.mbox h3{margin:0;font-family:var(--display);font-size:19px;padding-right:30px}
.mbox .x{position:absolute;top:10px;right:10px;border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;font-size:15px}
.mbox ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
/* EXERCISES */
.xcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 12px}
.xcard .tx{display:flex;flex-direction:column;flex:1;min-width:0}.xcard b{font-size:16px}.xcard span{font-size:13px;color:var(--muted)}
.xcard .sc{font-weight:800;color:var(--accent);font-size:14px;flex:none}
.task{display:flex;flex-direction:column;gap:10px}
.steps{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}.dot.on{background:var(--accent)}
.q{font-size:15px;color:var(--muted)}.q b{color:var(--ink);font-size:17px}
.model{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.model .row{display:flex;gap:4px;align-items:flex-start}.model .pt{flex:1;min-width:0}
.rucard{background:var(--me);border-radius:14px;padding:14px;font-size:19px;font-weight:700;line-height:1.35}
.ansbox{min-height:52px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background:var(--card)}
.ansbox.ok{border-color:var(--accent);border-style:solid}.ansbox.bad{border-color:#d0573f;border-style:solid}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:16.5px;font-weight:700}
.tile.chunk{background:var(--me);border-color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;gap:6px;align-items:stretch}
.opt{flex:1;min-width:0;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16.5px;font-weight:600}
.opt.ok{border-color:var(--accent);background:var(--me)}.opt.bad{border-color:#d0573f;text-decoration:line-through;opacity:.8}
.opt.rd{box-shadow:0 0 0 3px var(--sun)}
.fb{display:flex;flex-direction:column;gap:8px;scroll-margin-bottom:24px}
.fbm{border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.45}
.fbm.ok{background:var(--me);font-weight:800}.fbm.bad{background:var(--hl)}
.btnrow{display:flex;gap:8px}.btnrow .big{flex:1;justify-content:center}
.cd{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.cd b{font-size:26px;color:var(--accent);font-variant-numeric:tabular-nums;width:28px;text-align:center}
.myl{display:flex;flex-direction:column;gap:6px}
.mya{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.4}
.mya .c{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

{t:"No Uber",ru:"В такси из аэропорта",e:"🚗",
 lines:[
 ["d","Oi! É o Marcos? Um Uber pra Copacabana.","Привет! Это Маркос? Uber до Копакабаны."],
 ["mo","Isso! Daria, né? Podem colocar as malas no porta-malas.","Да! Дарья, верно? Можете положить чемоданы в багажник."],
 ["f","Só temos uma mala... a outra ficou em Istambul.","У нас только один чемодан... второй остался в Стамбуле."],
 ["mo","Putz, que azar! Mas acontece muito. Entra aí.","Блин, вот невезение! Но такое часто бывает. Садитесь."],
 ["d","Quanto tempo leva até Copacabana?","Сколько ехать до Копакабаны?"],
 ["mo","Sem trânsito, uns quarenta minutos. Com trânsito, só Deus sabe!","Без пробок — минут сорок. С пробками — одному Богу известно!"],
 ["f","E hoje tem muito trânsito?","А сегодня много пробок?"],
 ["mo","Domingo de manhã é tranquilo. Vocês deram sorte.","В воскресенье утром спокойно. Вам повезло."],
 ["d","Posso abrir a janela? Quero sentir o ar do Rio.","Можно открыть окно? Хочу почувствовать воздух Рио."],
 ["mo","Pode, claro. Mas tá bem quente lá fora, hein!","Конечно, можно. Но снаружи очень жарко, имейте в виду!"],
 ["d","Pra mim, tá perfeito. Eu moro no litoral, na Turquia.","Для меня — идеально. Я живу на побережье, в Турции."],
 ["mo","Turquia? Nossa, que longe! Vocês falam português muito bem.","В Турции? Ничего себе, как далеко! Вы очень хорошо говорите по-португальски."],
 ["d","Ainda não! Estou aprendendo. Falo devagar.","Пока нет! Я учу. Говорю медленно."],
 ["mo","Tá ótimo, dá pra entender tudo. Vocês estão de férias?","Отлично, всё понятно. Вы в отпуске?"],
 ["f","Estamos. Duas semanas de praia e passeios.","Да. Две недели пляжа и прогулок."],
 ["mo","Então vocês têm que ir ao Pão de Açúcar e ao Cristo.","Тогда вам обязательно надо съездить на Сахарную Голову и к Христу."],
 ["d","Já estão na lista! O que mais você recomenda?","Уже в списке! Что ещё посоветуешь?"],
 ["mo","Vão a Santa Teresa. É um bairro antigo, cheio de arte.","Съездите в Санта-Терезу. Это старый район, полный искусства."],
 ["f","É longe de Copacabana?","Это далеко от Копакабаны?"],
 ["mo","Uns vinte minutos de carro. Ou de bondinho, que é mais divertido.","Минут двадцать на машине. Или на трамвайчике — так веселее."],
 ["d","Anotei! E onde a gente come bem e barato?","Записала! А где можно вкусно и недорого поесть?"],
 ["mo","Procurem um restaurante a quilo. Você paga pelo peso da comida.","Ищите ресторан «на кило». Платишь за вес еды."],
 ["f","Pelo peso? Que interessante!","За вес? Как интересно!"],
 ["mo","É bem brasileiro. Você pega o que quiser e pesa o prato.","Это очень по-бразильски. Берёшь что хочешь и взвешиваешь тарелку."],
 ["d","Olha, aquilo ali é o Maracanã?","Смотри, вон то — это Маракана?"],
 ["mo","Não, aquilo é só um shopping. O Maracanã fica do outro lado.","Нет, это просто торговый центр. Маракана на другой стороне."],
 ["d","Haha, desculpa! Eu ainda não conheço nada.","Ха-ха, извини! Я пока ничего тут не знаю."],
 ["mo","Tranquilo! Olha à direita agora... a Baía de Guanabara.","Ничего страшного! Посмотрите сейчас направо... залив Гуанабара."],
 ["d","Que lindo! Fatih, tira uma foto!","Какая красота! Фатих, сфотографируй!"],
 ["f","Tô tirando! Com o celular é difícil, o carro tá rápido.","Фотографирую! С телефона трудно, машина едет быстро."],
 ["mo","Pronto, chegamos. Avenida Atlântica, número mil e duzentos.","Всё, приехали. Авенида Атлантика, дом тысяча двести."],
 ["d","Já? Passou muito rápido! Posso pagar com cartão?","Уже? Так быстро пролетело! Можно заплатить картой?"],
 ["mo","Já tá pago pelo aplicativo. Não precisa fazer nada.","Уже оплачено через приложение. Ничего делать не нужно."],
 ["f","Ah, é verdade. Valeu, Marcos! Muito obrigado.","А, точно. Спасибо, Маркос! Большое спасибо."],
 ["mo","De nada! Aproveitem o Rio. E boa sorte com a mala!","Не за что! Наслаждайтесь Рио. И удачи с чемоданом!"]
 ],

{t:"No hotel",ru:"Заселение в отель",e:"🛎️",
 lines:[
 ["ca","Bom dia, sejam bem-vindos! Em que posso ajudar?","Добрый день, добро пожаловать! Чем могу помочь?"],
 ["d","Bom dia! Temos uma reserva no nome de Daria Botina.","Добрый день! У нас бронь на имя Дарьи Ботиной."],
 ["ca","Um momento, por favor... Achei! Quarto duplo, catorze noites.","Минутку, пожалуйста... Нашла! Двухместный номер, четырнадцать ночей."],
 ["d","Isso mesmo. Já podemos fazer o check-in?","Именно так. Можно уже заселиться?"],
 ["ca","O check-in é a partir das duas da tarde. Agora são dez horas.","Заселение с двух часов дня. Сейчас десять часов."],
 ["f","Ah, que pena. A gente viajou a noite inteira.","Ах, как жаль. Мы летели всю ночь."],
 ["ca","Entendo. Vou ver se tem algum quarto pronto.","Понимаю. Посмотрю, есть ли какой-нибудь готовый номер."],
 ["d","Muito obrigada. Estamos muito cansados.","Большое спасибо. Мы очень устали."],
 ["ca","Tenho um quarto pronto agora, mas fica no segundo andar, de frente pra rua.","Есть номер, готовый прямо сейчас, но он на втором этаже, окнами на улицу."],
 ["d","E com vista pro mar? A nossa reserva é com vista pro mar.","А с видом на море? Наша бронь — с видом на море."],
 ["ca","O quarto com vista pro mar fica pronto só às duas.","Номер с видом на море будет готов только к двум."],
 ["f","O que você acha, amor? Esperar ou subir agora?","Как думаешь, любимая? Подождать или подняться сейчас?"],
 ["d","Eu prefiro esperar. A vista pro mar é o sonho da viagem!","Я лучше подожду. Вид на море — мечта этой поездки!"],
 ["ca","Sem problema. Vocês podem deixar a mala aqui com a gente.","Без проблем. Можете оставить чемодан здесь, у нас."],
 ["f","Ótimo. E podemos usar a piscina enquanto esperamos?","Отлично. А можно пользоваться бассейном, пока ждём?"],
 ["ca","Podem, sim. A piscina fica no terraço, no último andar.","Да, можно. Бассейн на террасе, на последнем этаже."],
 ["d","E o café da manhã? Ainda dá tempo?","А завтрак? Ещё успеваем?"],
 ["ca","Dá, sim! O café vai até as dez e meia. É no restaurante, ali à esquerda.","Успеваете! Завтрак до половины одиннадцатого. В ресторане, вон там слева."],
 ["f","Perfeito. Tem wi-fi no hotel?","Отлично. В отеле есть вай-фай?"],
 ["ca","Tem. A senha está aqui neste cartão.","Есть. Пароль — вот на этой карточке."],
 ["d","Mais uma pergunta: a que horas é o check-out?","Ещё один вопрос: во сколько выезд?"],
 ["ca","O check-out é ao meio-dia.","Выезд в полдень."],
 ["d","Posso pedir um ferro de passar no quarto?","Можно заказать утюг в номер?"],
 ["ca","Pode. É só ligar pra recepção, número nove.","Можно. Просто позвоните на ресепшн, номер девять."],
 ["f","E onde a gente troca dinheiro aqui perto?","А где тут рядом поменять деньги?"],
 ["ca","Tem uma casa de câmbio na esquina. Mas aqui quase todo mundo aceita cartão e Pix.","На углу есть обменник. Но здесь почти все принимают карты и Pix."],
 ["d","Pix? O que é isso?","Pix? Что это?"],
 ["ca","É um pagamento instantâneo pelo celular. Todo brasileiro usa.","Это мгновенный платёж через телефон. Им пользуется каждый бразилец."],
 ["f","Mas a gente não tem conta no Brasil, né?","Но у нас ведь нет счёта в Бразилии, да?"],
 ["ca","Verdade. Pra vocês, o cartão de crédito é mais fácil.","Верно. Для вас кредитная карта проще."],
 ["d","Entendi. Bom, vamos tomar café, então!","Поняла. Ну что ж, тогда пойдём завтракать!"],
 ["ca","Bom apetite! Eu ligo pra vocês quando o quarto estiver pronto.","Приятного аппетита! Я позвоню вам, когда номер будет готов."],
 ["f","Obrigado, Camila. Você foi muito gentil.","Спасибо, Камила. Вы очень любезны."],
 ["ca","Imagina! Qualquer coisa, é só chamar.","Что вы! Если что — просто зовите."]
 ],

{t:"Na padaria",ru:"Завтрак в пекарне с подругой",e:"🥐",
 lines:[
 ["lu","Daria! Que saudade! Finalmente no Rio!","Дарья! Как я соскучилась! Наконец-то ты в Рио!"],
 ["d","Luana! Que bom te ver! Você tá linda!","Луана! Как я рада тебя видеть! Ты прекрасно выглядишь!"],
 ["lu","Imagina! E aí, como foi a viagem?","Да ладно тебе! Ну, как прошла поездка?"],
 ["d","Longa! E a mala do Fatih ficou em Istambul.","Долгая! И чемодан Фатиха остался в Стамбуле."],
 ["lu","Não acredito! Coitado! Cadê ele?","Не может быть! Бедняга! А где он?"],
 ["d","Foi comprar uma camiseta e uma escova de dente.","Пошёл купить футболку и зубную щётку."],
 ["lu","Haha, começou bem! Vamos sentar? Essa padaria é a melhor do bairro.","Ха-ха, хорошее начало! Давай сядем? Эта пекарня — лучшая в районе."],
 ["at","Bom dia, meninas! O que vão querer?","Доброе утро, девушки! Что будете?"],
 ["lu","Pra mim, um pingado e um pão na chapa.","Мне пингадо и хлеб на плите."],
 ["d","Pingado? O que é isso?","Пингадо? Что это?"],
 ["lu","É café com um pouquinho de leite. E pão na chapa é pão com manteiga na chapa quente.","Это кофе с капелькой молока. А «пан на шапе» — хлеб с маслом, поджаренный на горячей плите."],
 ["d","Hmm, parece bom. Mas eu quero experimentar o famoso pão de queijo.","Ммм, звучит вкусно. Но я хочу попробовать знаменитый пан-де-кейжу."],
 ["at","Quantos você quer? Tem pequeno e grande.","Сколько вам? Есть маленькие и большие."],
 ["d","Três pequenos, por favor. E um café coado.","Три маленьких, пожалуйста. И фильтр-кофе."],
 ["at","Com açúcar ou adoçante?","С сахаром или сахарозаменителем?"],
 ["d","Sem nada, obrigada. Eu gosto de café forte.","Без ничего, спасибо. Я люблю крепкий кофе."],
 ["lu","Você vai ver, o café aqui é bem fraquinho pra você.","Вот увидишь, здешний кофе для тебя слабоват."],
 ["at","E um suco? Hoje tem de maracujá, de caju e de acerola.","А сок? Сегодня есть маракуйя, кешью и ацерола."],
 ["d","Nunca experimentei caju! Me vê um suco de caju, por favor.","Никогда не пробовала кешью! Дайте мне сок кешью, пожалуйста."],
 ["at","Com gelo?","Со льдом?"],
 ["d","Com pouco gelo. Obrigada!","С небольшим количеством льда. Спасибо!"],
 ["lu","E aí, o que vocês querem fazer no Rio?","Ну а что вы хотите делать в Рио?"],
 ["d","Praia, claro! E quero dançar samba de verdade.","Пляж, конечно! И хочу потанцевать настоящую самбу."],
 ["lu","Sábado tem roda de samba na Pedra do Sal. Vamos juntas?","В субботу на Педра-ду-Сал будет рода-де-самба. Пойдём вместе?"],
 ["d","Vamos! Vou chamar o Fatih também.","Пойдём! Позову и Фатиха."],
 ["lu","Ótimo! Lá ninguém liga se você dança bem ou mal. O importante é se divertir.","Отлично! Там никому нет дела, хорошо ты танцуешь или плохо. Главное — веселиться."],
 ["at","Aqui está: pingado, pão na chapa, pão de queijo, café e suco de caju.","Пожалуйста: пингадо, хлеб на плите, пан-де-кейжу, кофе и сок кешью."],
 ["d","Nossa, o pão de queijo tá quentinho! Que delícia!","Ого, пан-де-кейжу тёпленький! Какая вкуснятина!"],
 ["lu","Viu? Agora você nunca mais vai esquecer o Brasil.","Видишь? Теперь ты никогда не забудешь Бразилию."],
 ["d","E o suco de caju é muito diferente. Meio azedinho, mas bom.","А сок кешью совсем другой. Кисловатый, но вкусный."],
 ["lu","Vamos pedir a conta? Hoje sou eu que pago.","Попросим счёт? Сегодня плачу я."],
 ["d","De jeito nenhum! Vamos rachar.","Ни в коем случае! Давай пополам."],
 ["lu","Nada disso! Você é minha convidada. Na próxima, você paga.","Ничего подобного! Ты моя гостья. В следующий раз платишь ты."],
 ["d","Tá bom, combinado. Mas o jantar é por minha conta!","Ладно, договорились. Но ужин — за мой счёт!"],
 ["lu","Fechado!","Договорились!"]
 ],

{t:"No Pão de Açúcar",ru:"Как добраться и билеты на Сахарную Голову",e:"🚡",
 lines:[
 ["d","Com licença, você pode me ajudar?","Извините, вы можете мне помочь?"],
 ["mc","Claro! O que você procura?","Конечно! Что вы ищете?"],
 ["d","Como a gente chega ao Pão de Açúcar?","Как нам добраться до Сахарной Головы?"],
 ["mc","Vocês estão a pé? É meio longe pra ir andando.","Вы пешком? Пешком туда далековато."],
 ["f","Estamos. Tem ônibus ou metrô?","Пешком. Есть автобус или метро?"],
 ["mc","O metrô não vai até lá. Melhor pegar o ônibus na Avenida Nossa Senhora de Copacabana.","Метро туда не идёт. Лучше сесть на автобус на Авенида Носса-Сеньора-ди-Копакабана."],
 ["d","Qual ônibus?","Какой автобус?"],
 ["mc","Qualquer um que diga Urca na frente. Desçam no ponto final.","Любой, на котором спереди написано «Urca». Выходите на конечной."],
 ["f","E onde fica o ponto?","А где остановка?"],
 ["mc","Sigam reto nesta rua, duas quadras, e virem à direita. O ponto fica em frente ao banco.","Идите прямо по этой улице два квартала и поверните направо. Остановка напротив банка."],
 ["d","Duas quadras, à direita, em frente ao banco. Entendi!","Два квартала, направо, напротив банка. Поняла!"],

const S=window.speechSynthesis;let voices=[];
function loadV(){try{voices=S.getVoices().filter(v=>/^pt[-_]BR/i.test(v.lang));if(!voices.length)voices=S.getVoices().filter(v=>/^pt/i.test(v.lang)&&!/PT$/i.test(v.lang))}catch(e){}}
if(S){loadV();S.onvoiceschanged=loadV}
const FEM=/luciana|francisca|fernanda|vit[oó]ria|maria|thalita|leila|raquel|google portugu|female|feminin/i;
const MAL=/felipe|daniel|ant[oô]nio|ricardo|donato|f[aá]bio|humberto|j[uú]lio|male|masculin/i;
function pickVoice(g){const f=voices.filter(v=>FEM.test(v.name)&&!MAL.test(v.name)),m=voices.filter(v=>MAL.test(v.name)&&!/female/i.test(v.name));
 if(g==='m'&&m.length)return{v:m[0],p:1};if(g==='f'&&f.length)return{v:f[0],p:1};
 return{v:voices[0]||null,p:g==='m'?0.8:1.15}}
function clean(t){return t.replace(/[^\p{L}\p{N}\s.,!?;:'\-]/gu,' ').replace(/\s+/g,' ').trim()}
let tok=0,safety=null;
function stopSpeech(){tok++;clearTimeout(safety);try{S&&S.cancel()}catch(e){}}
function say(text,g,cb){const my=++tok;clearTimeout(safety);
 const fin=()=>{if(my!==tok)return;clearTimeout(safety);cb&&cb()};
 const txt=clean(text);
 if(!opt.sound||!S||!txt){safety=setTimeout(fin,Math.max(1400,txt.split(' ').length*430));return}
 try{S.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='pt-BR';const pv=pickVoice(g);if(pv.v)u.voice=pv.v;u.pitch=pv.p;u.rate=0.88;
  u.onend=fin;u.onerror=fin;S.speak(u)}catch(e){}
 safety=setTimeout(fin,txt.length*110+4000)}

 say(it.say,it.g,()=>{if(!P.playing)return;if(opt.auto)setTimeout(()=>{if(P.playing&&P.cur===i)playFrom(i+1)},650);else{P.playing=false;P.cur=Math.min(i+1,P.items.length-1);setCur(P.cur);updBar()}})}
function pause(){P.playing=false;stopSpeech();updBar()}

 <div class="r1"><button class="ib" id="backB">← Назад</button><button class="ttl navB" aria-label="Навигация: все диалоги и упражнения"><span class="tt">${t.n}${X.mode==='fix'?' · ошибки':''}</span><span class="car">▾</span></button><button class="ib" id="myB" aria-label="Мои ответы">📋</button></div>
 <div class="r2"><button class="ib" id="prevB" aria-label="Предыдущее задание">⏮</button><button class="ib play" id="sayB" aria-label="Послушать снова">🔊</button><button class="ib" id="nextB" aria-label="Следующее задание">⏭</button><button class="ib" id="rptB" aria-label="Начать упражнение заново">🔁</button><span class="cnt">${X.pos+1}/${X.list.length}</span></div>
 <div class="r3"><button class="ib" id="autoB">▶▶ Авто</button><button class="ib" id="sndB">🔊 Звук</button></div>
</div></div>`}
function bindExBar(speakFn){
 document.getElementById('backB').onclick=()=>{stopSpeech();clearTimeout(cdT);exMenu(X.i)};
 document.getElementById('myB').onclick=()=>{stopSpeech();clearTimeout(cdT);const s={...X};myAnswers(()=>{X=s;renderTask()})};
 document.getElementById('prevB').onclick=()=>{if(X.pos>0){X.pos--;X.stage=0;renderTask()}};
 document.getElementById('nextB').onclick=()=>{X.pos++;X.stage=0;renderTask()};
 document.getElementById('rptB').onclick=()=>runEx(X.i,X.k,null,'main');
 document.getElementById('sayB').onclick=()=>speakFn&&speakFn();
 document.getElementById('autoB').onclick=()=>{opt.auto=!opt.auto;lsSet('auto',opt.auto);updBar()};
 document.getElementById('sndB').onclick=()=>{opt.sound=!opt.sound;lsSet('sound',opt.sound);if(!opt.sound)stopSpeech();updBar()};
 updBar()}
function record(idx,ok,q,a,c){if(!(idx in X.first)){X.first[idx]=ok;if(!ok)X.wrong.push(idx)}
 ans[X.i+'-'+X.k+'-'+idx]={q,a,ok,c};lsSet('ans',ans)}

function renderTask(){CUR={i:X.i,k:X.k};closePop();stopSpeech();clearTimeout(cdT);
 if(X.pos>=X.list.length)return exEnd();
 const idx=X.list[X.pos],it=EX[X.i][X.k][idx];
 app.innerHTML=exBar()+`<div class="gut"><div class="col page"><button class="skip" id="skipT">⏭ Пропустить эту страницу</button><div class="task" id="task"></div></div></div>`;
 scrollTo(0,0);
 document.getElementById('skipT').onclick=()=>{X.pos++;X.stage=0;renderTask()};
 const box=document.getElementById('task');
 if(X.k==='exp')taskExp(box,idx,it);else if(X.k==='sub')taskSub(box,idx,it);else taskAnt(box,idx,it)}

function wrongBox(box,html,retry,next,speakOk){const fb=box.querySelector('.fb');
 fb.innerHTML=`<div class="fbm bad">${html}</div><div class="btnrow"><button class="big sec" id="again">🔁 Ещё раз</button><button class="big" id="goOn">Дальше →</button></div>`;
 fb.scrollIntoView({block:'end',behavior:'smooth'});
 document.getElementById('again').onclick=retry;document.getElementById('goOn').onclick=next;
 setTimeout(()=>speakOk&&speakOk(),900)}
function okBox(box,txt,next){const fb=box.querySelector('.fb');fb.innerHTML=`<div class="fbm ok">✅ ${txt}</div>`;fb.scrollIntoView({block:'end',behavior:'smooth'});next()}

/* exp: build the growing phrase */
function taskExp(box,idx,chain){const st=chain[X.stage],prev=X.stage>0?chain[X.stage-1]:null;
 const tgt=st[0].split(' ').filter(Boolean);const tl=tgt.map(w=>w.replace(/[.,!?]/g,''));
 let tiles;const pv=prev?prev[0].split(' '):null;let pos=-1;
 if(pv){for(let a=0;a+pv.length<=tl.length;a++){if(pv.every((w,j)=>tl[a+j]===w)){pos=a;break}}}
 if(pos>=0)tiles=[...tl.slice(0,pos),pv.join(' '),...tl.slice(pos+pv.length)];else tiles=tl.slice();
 const chunkTxt=pos>=0?pv.join(' '):null;
 tiles.push(st[2]);
 let order=shuf(tiles.map((t,n)=>n));let tries=0;while(tries++<8&&order.slice(0,tiles.length-1).every((v,n)=>v===n))order=shuf(order);
 box.innerHTML=`<div class="steps">${chain.map((_,n)=>`<span class="dot${n<=X.stage?' on':''}"></span>`).join('')}<span>Шаг ${X.stage+1} из ${chain.length} · задание ${X.pos+1} из ${X.list.length}</span></div>
 ${prev?`<div class="model"><div class="q">Было:</div><div class="row"><div class="pt">${wordsHTML(prev[0])}</div><button class="sb" id="pvS" aria-label="Послушать">🔊</button><button class="sb" id="pvG" aria-label="Перевод фразы">🌐</button></div><div class="tr" hidden>${esc(prev[1])}</div></div>`:''}
 <div class="q">Собери по-португальски:<br><b>«${esc(st[1])}»</b></div>
 <div class="ansbox" id="ab" aria-live="polite"></div>
 <div class="tiles" id="tl">${order.map(n=>`<button class="tile${tiles[n]===chunkTxt?' chunk':''}" data-n="${n}">${esc(tiles[n])}</button>`).join('')}</div>
 <div class="fb"></div>`;
 const ab=box.querySelector('#ab'),tlb=box.querySelector('#tl');let placed=[];
 const need=tl.length;
 const count=()=>placed.reduce((s,n)=>s+tiles[n].split(' ').length,0);
 const speakPrev=()=>{if(prev)say(prev[0],'f',()=>{})};
 bindExBar(speakPrev);
 if(prev){box.querySelector('#pvS').onclick=speakPrev;box.querySelector('#pvG').onclick=()=>{const t=box.querySelector('.model .tr');t.hidden=!t.hidden}}
 const nextStage=()=>{if(X.stage<chain.length-1){X.stage++;renderTask()}else{X.stage=0;X.pos++;renderTask()}};
 const check=()=>{const a=placed.map(n=>tiles[n]).join(' ');const okList=[st[0],...(st[3]||[])].map(norm);const ok=okList.includes(norm(a));
  tlb.querySelectorAll('.tile').forEach(b=>b.disabled=true);ab.querySelectorAll('.tile').forEach(b=>b.disabled=true);
  if(X.stage===chain.length-1||!ok)record(idx,ok&&!(idx in X.first&&!X.first[idx]),`${chain[chain.length-1][1]}`,ok?st[0]:a,st[0]);
  if(ok){ab.classList.add('ok');okBox(box,'Верно: '+esc(cap(st[0])),()=>say(st[0],'f',()=>setTimeout(nextStage,700)))}
  else{ab.classList.add('bad');const extra=placed.map(n=>tiles[n]).includes(st[2])?`<br>Лишнее слово: <b>${esc(st[2])}</b>`:'';
   wrongBox(box,`Правильно: <b>${esc(cap(st[0]))}</b>${extra}`,()=>renderTask(),nextStage,()=>say(st[0],'f',()=>{}))}};
 const draw=()=>{ab.innerHTML=placed.map(n=>`<button class="tile${tiles[n]===chunkTxt?' chunk':''}" data-n="${n}">${esc(tiles[n])}</button>`).join('');
  tlb.querySelectorAll('.tile').forEach(b=>b.hidden=placed.includes(+b.dataset.n));if(count()>=need)check()};
 tlb.onclick=e=>{const b=e.target.closest('.tile');if(!b||b.disabled)return;placed.push(+b.dataset.n);say(tiles[+b.dataset.n],'f',()=>{});draw()};
 ab.onclick=e=>{const b=e.target.closest('.tile');if(!b||b.disabled)return;placed=placed.filter(n=>n!==+b.dataset.n);draw()};
 if(opt.auto&&prev)setTimeout(speakPrev,300)}

/* options shared by sub & ant */
function buildOpts(okT,bads){const opts=[okT,...bads];let ord=shuf([0,1,2]);if(ord[0]===0)ord=[ord[1],ord[0],ord[2]];return ord.map(n=>({t:opts[n],ok:n===0}))}
function optsHTML(o){return `<div class="opts">${o.map((x,n)=>`<div class="orow"><button class="opt" data-n="${n}">${esc(x.t)}</button><button class="sb osay" data-n="${n}" aria-label="Послушать вариант">🔊</button></div>`).join('')}</div>`}
function bindOpts(box,o,idx,q,okT,why,readFirst){const els=[...box.querySelectorAll('.opt')];
 const readAll=()=>{const l=(readFirst?[{t:readFirst.t,el:readFirst.el}]:[]).concat(els.map((el,n)=>({t:o[n].t,el})));sayList(l,0,()=>{clearRd();box.querySelector('.opts').scrollIntoView({block:'nearest',behavior:'smooth'})})};
 box.querySelectorAll('.osay').forEach(b=>b.onclick=()=>{stopSpeech();clearRd();say(o[+b.dataset.n].t,'f',()=>{})});
 els.forEach((b,n)=>b.onclick=()=>{stopSpeech();clearRd();els.forEach(e=>e.disabled=true);const ok=o[n].ok;
  record(idx,ok,q,o[n].t,okT);
  if(ok){b.classList.add('ok');okBox(box,'Верно!',()=>say(okT,'f',()=>setTimeout(()=>{X.pos++;renderTask()},700)))}
  else{b.classList.add('bad');els[o.findIndex(x=>x.ok)].classList.add('ok');
   wrongBox(box,`Правильно: <b>${esc(okT)}</b><br>💡 ${esc(why)}`,()=>renderTask(),()=>{X.pos++;renderTask()},()=>say(okT,'f',()=>{}))}});
 return readAll}

/* sub: substitution drill */
function taskSub(box,idx,it){const [m,mru,cue,okT,b1,b2,why]=it;const o=buildOpts(okT,[b1,b2]);
 box.innerHTML=`<div class="model"><div class="q">Образец:</div><div class="row"><div class="pt" id="mT">${wordsHTML(m)}</div><button class="sb" id="mS" aria-label="Послушать">🔊</button><button class="sb" id="mG" aria-label="Перевод фразы">🌐</button></div><div class="tr" hidden>${esc(mru)}</div></div>
 <div class="q">Замени на: <b>${esc(cue)}</b></div>${optsHTML(o)}<div class="fb"></div>`;
 const readAll=bindOpts(box,o,idx,`${m} → ${cue}`,okT,why,{t:m,el:box.querySelector('.model')});
 box.querySelector('#mS').onclick=()=>say(m,'f',()=>{});
 box.querySelector('#mG').onclick=()=>{const t=box.querySelector('.model .tr');t.hidden=!t.hidden};
 bindExBar(readAll);if(opt.auto)setTimeout(readAll,300)}

/* ant: anticipation — say it first, then check */
function taskAnt(box,idx,it){const [ru,okT,b1,b2,why]=it;const o=buildOpts(okT,[b1,b2]);
 box.innerHTML=`<div class="q">Как сказать по-португальски?</div><div class="rucard">${esc(ru)}</div>
 <div class="cd" id="cd"><b id="cdn">4</b><span>🗣 Скажи вслух сама…</span><button class="pill" id="cdSkip">Показать варианты</button></div>
 <div id="ow" hidden>${optsHTML(o)}</div><div class="fb"></div>`;
 const readAll=bindOpts(box,o,idx,ru,okT,why,null);
 let n=4;const show=()=>{clearTimeout(cdT);box.querySelector('#cd').hidden=true;box.querySelector('#ow').hidden=false;if(opt.auto)readAll()};
 const tick=()=>{n--;const c=box.querySelector('#cdn');if(!c)return;if(n<=0)return show();c.textContent=n;cdT=setTimeout(tick,1000)};
 cdT=setTimeout(tick,1000);box.querySelector('#cdSkip').onclick=show;
 bindExBar(()=>{if(!box.querySelector('#ow').hidden)readAll()})}

function exEnd(){const tot=X.list.length,good=X.list.filter(i=>X.first[i]===true).length;
 if(X.mode==='main'){xs[X.i+'-'+X.k]=good+'/'+tot;lsSet('xs',xs)}
 const t=XT.find(t=>t.k===X.k);const ki=XT.findIndex(t=>t.k===X.k);
 app.innerHTML=simpleBar(t.n,'← Назад')+`<div class="gut"><div class="col page">
 <button class="skip" id="skipE">⏭ Пропустить эту страницу</button>
 <div class="end"><h2>${good===tot?'🎉 Всё верно!':'💪 Готово!'}</h2><div style="font-size:17px">Верно с первого раза: <b>${good} из ${tot}</b></div>
 ${X.wrong.length?`<div class="fbm bad">Работа над ошибками? Повторим ${X.wrong.length} ${X.wrong.length===1?'задание':'задания'} с ошибкой.</div><div class="btnrow"><button class="big" id="fixY">Да</button><button class="big sec" id="fixN">Нет</button></div>`:''}
 <div id="after" ${X.wrong.length?'hidden':''} style="display:flex;flex-direction:column;gap:8px">
 ${ki<XT.length-1?`<button class="big" id="nxE"><span>➡️</span><span>Следующее: ${XT[ki+1].n}</span></button>`:''}
 <button class="big ${ki<XT.length-1?'sec':''}" id="mnE"><span>🏋️</span><span>К упражнениям диалога</span></button></div>
 </div></div></div>`;
 scrollTo(0,0);const i=X.i,w=X.wrong.slice(),k=X.k;
 const after=()=>{const a=document.getElementById('after');a.hidden=false;const y=document.getElementById('fixY');if(y)y.closest('.btnrow').remove();a.scrollIntoView({block:'end',behavior:'smooth'})};
 document.getElementById('backB').onclick=()=>exMenu(i);
 document.getElementById('skipE').onclick=()=>exMenu(i);
 const y=document.getElementById('fixY');if(y){y.onclick=()=>runEx(i,k,w,'fix');document.getElementById('fixN').onclick=after}
 const nx=document.getElementById('nxE');if(nx)nx.onclick=()=>runEx(i,XT[ki+1].k);
 document.getElementById('mnE').onclick=()=>exMenu(i)}

function myAnswers(back){closePop();stopSpeech();
 const keys=Object.keys(ans);
 const body=DLG.map((d,i)=>{const parts=XT.map(t=>{const ks=keys.filter(k=>k.startsWith(i+'-'+t.k+'-')).sort((a,b)=>+a.split('-')[2]-+b.split('-')[2]);if(!ks.length)return'';
   return `<div class="q"><b>${t.n}</b></div>`+ks.map(k=>{const a=ans[k];return `<div class="mya">${a.ok?'✅':'❌'} ${esc(a.q)}<br>Мой ответ: ${esc(a.a)}${a.ok?'':`<br><span class="c">Правильно: ${esc(a.c)}</span>`}</div>`}).join('')}).join('');
  return parts?`<div class="sec-h">${d.e} ${i+1}. ${esc(d.t)}</div><div class="myl">${parts}</div>`:''}).join('');
 app.innerHTML=simpleBar('📋 Мои ответы','← Назад')+`<div class="gut"><div class="col page">
 <button class="skip" id="skipA">⏭ Пропустить эту страницу</button>
 ${body||'<div class="hint">Здесь появятся твои ответы из упражнений: что верно, где ошибка и правильный вариант. При повторном прохождении ответ перезаписывается.</div>'}
 </div></div>`;
 scrollTo(0,0);document.getElementById('backB').onclick=back;document.getElementById('skipA').onclick=back}

/* ---------- NAVIGATION (from any page to any dialogue / exercise) ---------- */
function navPop(){closePop();stopSpeech();if(typeof pause==='function')pause();clearTimeout(cdT);
 const old=document.querySelector('.ov');if(old)old.remove();
 const ov=document.createElement('div');ov.className='ov';
 const cell=(i,k,ic,lbl)=>{const here=CUR.i===i&&CUR.k===k;const dn=k==='dlg'?done.includes(i):!!xs[i+'-'+k];
  return `<button class="nb ex${here?' here':''}${dn?' dn':''}" data-i="${i}" data-k="${k}" aria-label="${lbl} ${i+1}">${ic}</button>`};
 ov.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><button class="x" aria-label="Закрыть">✕</button><h3>🧭 Куда перейти?</h3>
 <div class="navtop"><button class="big sec" data-go="home">🏠 Меню</button><button class="big sec" data-go="all">📚 Все слова</button><button class="big sec" data-go="my">📋 Ответы</button></div>
 <div class="nav"><span class="hd l">Диалог</span><span class="hd">➕</span><span class="hd">🔄</span><span class="hd">🎯</span><span class="hd">📚</span>
 ${DLG.map((d,i)=>`<button class="nb dl${CUR.i===i&&CUR.k==='dlg'?' here':''}${done.includes(i)?' dn':''}" data-i="${i}" data-k="dlg"><span>${d.e}</span><span class="nt">${i+1}. ${esc(d.t)}</span></button>${cell(i,'exp','➕','Расширяем фразу')}${cell(i,'sub','🔄','Замени слово')}${cell(i,'ant','🎯','Скажи раньше')}${cell(i,'voc','📚','Слова')}`).join('')}
 </div>
 <div class="legend">➕ Расширяем фразу · 🔄 Замени слово · 🎯 Скажи раньше, чем услышишь · 📚 Слова и конструкции · ✓ пройдено</div></div>`;
 document.body.appendChild(ov);
 const c=()=>ov.remove();ov.querySelector('.x').onclick=c;ov.onclick=e=>{if(e.target===ov)c()};
 ov.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{c();const g=b.dataset.go;if(g==='home')home();else if(g==='all')vocab(-1,home);else myAnswers(home)});
 ov.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{c();const i=+b.dataset.i,k=b.dataset.k;
  if(k==='dlg')openDlg(i);else if(k==='voc')vocab(i,()=>openDlg(i));else runEx(i,k)});}
document.addEventListener('click',e=>{if(e.target.closest('.navB')){e.preventDefault();navPop()}});

home();
})();
</script>

</body>
