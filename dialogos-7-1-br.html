 ["de","Pode deixar. Ninguém mexe no carro.","Не волнуйтесь. Никто машину не тронет."],
 ["po","Renata, isso é normal aqui?","Рената, это тут нормально?"],
 ["re","Em quase toda cidade brasileira. Não é oficial, mas é costume.","Почти в каждом бразильском городе. Это неофициально, но так принято."],
 ["po","E se eu não pagar?","А если я не заплачу?"],
 ["re","Melhor pagar. É pouco, e o carro fica mais seguro.","Лучше заплатить. Это немного, а машине спокойнее."],
 ["po","Entendi. E aquela placa ali, Zona Azul?","Поняла. А вон тот знак, «Синяя зона»?"],
 ["re","Ah, boa! Zona Azul é estacionamento pago. Tem que ativar no aplicativo.","О, точно! «Синяя зона» — это платная парковка. Надо активировать в приложении."],
 ["po","Tem aplicativo pra isso?","Для этого есть приложение?"],
 ["re","Tem. Você coloca a placa do carro e paga por hora.","Есть. Вводишь номер машины и платишь почасово."],
 ["po","Então eu pago o aplicativo e o flanelinha?","То есть я плачу и приложению, и фланелинье?"],
 ["re","É, às vezes os dois. Bem-vinda ao Brasil!","Ага, иногда обоим. Добро пожаловать в Бразилию!"],
 ["po","Ai, ai… Pronto, ativei. Duas horas.","Ох-ох… Всё, активировала. Два часа."],
 ["re","Agora sim: praia, água de coco e caranguejo!","Вот теперь: пляж, кокосовая вода и крабы!"],
 ["po","Caranguejo? No almoço?","Крабы? На обед?"],
 ["re","Em Fortaleza, quinta-feira é dia de caranguejo! É tradição.","В Форталезе четверг — день крабов! Это традиция."],
 ["po","Então hoje eu vou provar. Com martelinho e tudo?","Тогда сегодня попробую. С молоточком и всё такое?"],
 ["re","Com martelinho e tudo! Você vai ver que delícia.","С молоточком и всё такое! Увидишь, какая вкуснятина."]
 ],

{t:"Pneu furado!",ru:"Прокол на трассе",e:"🛞",
 lines:[
 ["po","Renata, tá ouvindo esse barulho? Tum, tum, tum…","Рената, слышишь этот звук? Тук, тук, тук…"],
 ["re","Tô. E o carro tá puxando pra direita.","Слышу. И машину тянет вправо."],
 ["po","Acho que furou o pneu. Vou parar no acostamento.","Кажется, проколола колесо. Остановлюсь на обочине."],
 ["re","Liga o pisca-alerta!","Включи аварийку!"],
 ["po","Liguei. Vamos descer e olhar.","Включила. Давай выйдем и посмотрим."],
 ["re","Ih, olha só: o pneu de trás tá completamente murcho.","Ой, смотри: заднее колесо совсем спущено."],
 ["po","Que azar! E agora? Você sabe trocar pneu?","Вот невезение! И что теперь? Ты умеешь менять колесо?"],
 ["re","Na teoria, sim. Na prática, nunca troquei.","В теории — да. На практике никогда не меняла."],
 ["po","Eu também não. Mas tem o estepe e o macaco no porta-malas.","Я тоже. Но в багажнике есть запаска и домкрат."],
 ["re","Olha, ali na frente tem uma borracharia! Bem pertinho.","Смотри, впереди шиномонтаж! Совсем близко."],
 ["po","Sério? Que sorte! Vamos devagar até lá.","Правда? Вот повезло! Поедем туда потихоньку."],
 ["to","Boa tarde, meninas! Pneu furado?","Добрый день, девушки! Прокол?"],
 ["po","Furado. Começou a fazer barulho e pronto.","Прокол. Начал шуметь — и всё."],
 ["to","Deixa eu olhar… Ó, um prego! Bem no meio.","Дайте посмотреть… Вот, гвоздь! Прямо посередине."],
 ["re","Um prego! Da estrada?","Гвоздь! С дороги?"],
 ["to","Da estrada. Acontece muito por aqui. Mas dá pra consertar.","С дороги. Тут такое часто. Но можно починить."],
 ["po","Não precisa trocar o pneu?","Не нужно менять шину?"],
 ["to","Não. Faço um remendo e fica bom. Coisa de vinte minutos.","Нет. Поставлю заплатку, и будет нормально. Дело двадцати минут."],
 ["po","Quanto fica?","Сколько будет стоить?"],
 ["to","Quarenta reais.","Сорок реалов."],
 ["po","Só quarenta? Achei que ia ser bem mais caro.","Всего сорок? Я думала, будет гораздо дороже."],
 ["to","Que nada! Aproveitem e tomem uma água de coco ali na barraca.","Да что вы! Пока ждёте, выпейте кокосовой воды вон в палатке."],
 ["re","Boa ideia! Tá um calor danado.","Хорошая мысль! Жара страшная."],
 ["to","Pronto, meninas! Remendo feito, pneu calibrado.","Готово, девушки! Заплатка стоит, колесо подкачано."],
 ["po","Obrigada, Seu Toninho! O senhor salvou a nossa viagem.","Спасибо, Сеу Тониньу! Вы спасли нашу поездку."],
 ["to","Por nada. Ah, e o seguro do carro cobre pneu?","Не за что. А страховка машины покрывает шины?"],
 ["po","Cobre! Eu fiz o seguro completo.","Покрывает! Я взяла полную страховку."],
 ["to","Então guarda o recibo e pede o reembolso na locadora.","Тогда сохраните квитанцию и попросите возмещение в прокате."],
 ["po","Boa! Pode me dar um recibo, por favor?","Отлично! Можете дать мне квитанцию, пожалуйста?"],
 ["to","Claro. Aqui está. Boa viagem, e cuidado com os pregos!","Конечно. Вот. Счастливого пути, и осторожнее с гвоздями!"],
 ["re","Viu? O seguro completo valeu a pena!","Видишь? Полная страховка того стоила!"]
 ],

{t:"Segue reto!",ru:"Дорога с навигатором",e:"🧭",
 lines:[
 ["re","Agora, no GPS: em quinhentos metros, vira à esquerda.","Теперь по навигатору: через пятьсот метров поворот налево."],
 ["po","À esquerda… nessa rua aqui?","Налево… на эту улицу?"],
 ["re","Não, na próxima! Nessa é contramão!","Нет, на следующую! Тут встречка!"],
 ["po","Ufa! Quase. E agora?","Фух! Чуть не. А теперь?"],
 ["re","Segue reto até a rotatória.","Прямо до кругового движения."],
 ["po","Rotatória… Já vi. Qual saída?","Круговое… Вижу. Какой съезд?"],
 ["re","Segunda saída. Pega a estrada pra Canoa Quebrada.","Второй съезд. Выезжай на дорогу на Каноа-Кебраду."],
 ["po","Peguei. E o limite de velocidade aqui?","Выехала. А какое тут ограничение скорости?"],
 ["re","Oitenta. Mas olha a placa: radar a duzentos metros.","Восемьдесят. Но смотри на знак: камера через двести метров."],
 ["po","Tô a oitenta e cinco… Freando, freando!","У меня восемьдесят пять… Торможу, торможу!"],
 ["re","Pronto, setenta e oito. Passou o radar.","Всё, семьдесят восемь. Камеру проехали."],
 ["po","Ai, que nervoso! A multa aqui é cara?","Ох, как я понервничала! Штраф тут дорогой?"],
 ["re","Depende. Por pouco acima do limite, uns cento e trinta reais.","Смотря какой. За небольшое превышение — реалов сто тридцать."],
 ["po","E a multa vai pra quem? Pra mim ou pra locadora?","А штраф приходит кому? Мне или в прокат?"],
 ["re","Vai pra locadora, e a locadora passa pra você. E ainda cobra uma taxa.","В прокат, а прокат перевыставляет тебе. И ещё берёт сбор."],
 ["po","Então vou dirigir igual a uma vovó.","Тогда буду ездить как бабушка."],
 ["re","Cuidado com as lombadas também. Ali vem uma!","И осторожнее с лежачими полицейскими. Вон один!"],
 ["po","Lombada? O que é isso?","Ломбада? Что это?"],
 ["re","Aquele quebra-molas no asfalto. É pra reduzir a velocidade.","Вон тот «лежачий полицейский» на асфальте. Чтобы снижать скорость."],
 ["po","Ah, eu vi! Passei devagarzinho.","А, видела! Проехала потихонечку."],
 ["re","Perfeito. Agora tem uma bifurcação: pega a da direita.","Отлично. Сейчас развилка: бери правую."],
 ["po","Direita. E depois?","Правую. А потом?"],
 ["re","Depois é só seguir reto por uns trinta quilômetros.","Потом только прямо километров тридцать."],
 ["po","Ótimo. Bota uma música, então!","Отлично. Тогда включи музыку!"],
 ["re","Forró ou MPB?","Форро или бразильскую поп-музыку?"],
 ["po","Forró! Tô no Ceará, né?","Форро! Я же в Сеаре!"],
 ["re","Isso aí! Olha, já dá pra ver as falésias!","Вот это правильно! Смотри, уже видны скалы!"],
 ["po","Meu Deus, que lindo! Vermelhas!","Боже мой, как красиво! Красные!"],
 ["re","Essa é a Canoa Quebrada. Estaciona ali, que a gente desce pra ver o pôr do sol.","Это и есть Каноа-Кебрада. Паркуйся вон там, спустимся посмотреть закат."],
 ["po","Valeu a viagem inteira!","Ради этого стоило ехать!"]
 ],

{t:"Devolvendo o carro",ru:"Возвращаем машину",e:"🔑",
 lines:[
 ["je","Boa tarde, Polina! Voltou bem?","Добрый день, Полина! Хорошо доехали?"],
 ["po","Boa tarde, Jefferson! Voltei, sim. Cansada, mas feliz.","Добрый день, Джефферсон! Да. Устала, но счастлива."],
 ["je","Que bom! Vamos fazer a vistoria de devolução?","Отлично! Сделаем осмотр при возврате?"],
 ["po","Vamos. Olha, o tanque tá cheio. Enchi no posto da esquina.","Давайте. Смотрите, бак полный. Заправилась на углу."],
 ["je","Perfeito. E a quilometragem… oitocentos quilômetros! Rodou bastante, hein?","Отлично. А пробег… восемьсот километров! Хорошо накатали, а?"],
 ["po","Fui a Cumbuco e a Canoa Quebrada. Valeu muito a pena.","Съездила в Кумбуку и Каноа-Кебраду. Очень того стоило."],
 ["je","E teve algum problema com o carro?","А с машиной были проблемы?"],
 ["po","Furou um pneu na estrada. Um prego. Mas um borracheiro consertou.","На трассе прокололи колесо. Гвоздь. Но шиномонтажник починил."],
 ["je","Você tem o recibo?","У вас есть квитанция?"],
 ["po","Tenho, aqui. Quarenta reais.","Есть, вот. Сорок реалов."],
 ["je","Como você fez o seguro completo, a gente devolve esse valor.","Раз у вас полная страховка, мы вернём эту сумму."],
 ["po","Que ótimo! Eu sabia que valia a pena.","Как здорово! Я знала, что это того стоит."],
 ["je","Agora deixa eu olhar a lataria… O arranhão do para-choque já estava, né?","Теперь дайте посмотрю кузов… Царапина на бампере уже была, да?"],
 ["po","Já! Tá na foto e na ficha.","Была! Она на фото и в акте."],
 ["je","Tá certo. Hum… mas o carro tá com muita areia dentro.","Верно. Хм… но в машине внутри много песка."],
 ["po","Ai, é verdade. A praia veio junto com a gente!","Ой, правда. Пляж поехал вместе с нами!"],
 ["je","Normalmente a gente cobra uma taxa de limpeza…","Обычно мы берём плату за уборку…"],
 ["po","Ah, não! Quanto é?","Ой, нет! Сколько?"],
 ["je","Cinquenta reais. Mas… vou aliviar dessa vez. É só areia.","Пятьдесят реалов. Но… в этот раз прощу. Это всего лишь песок."],
 ["po","Muito obrigada, Jefferson! Você é um anjo.","Большое спасибо, Джефферсон! Вы ангел."],
 ["je","E se chegar alguma multa, a gente avisa por email.","А если придёт штраф, мы сообщим по почте."],
 ["po","Não vai chegar. Dirigi igual a uma vovó!","Не придёт. Я ездила как бабушка!"],
 ["je","Ah, ah! Assim que eu gosto. Vou liberar a caução hoje mesmo.","Ха-ха! Вот это я понимаю. Сегодня же сниму блокировку залога."],
 ["po","Em quantos dias aparece no cartão?","Через сколько дней это будет видно на карте?"],
 ["je","Depende do banco. Normalmente em uns cinco dias úteis.","Зависит от банка. Обычно дней через пять рабочих."],
 ["po","Tá bom. E se eu quiser alugar de novo no ano que vem?","Хорошо. А если я захочу снова арендовать в следующем году?"],
 ["je","É só reservar pelo site. E fala que é cliente antiga: tem desconto.","Просто бронируйте через сайт. И скажите, что вы постоянный клиент: будет скидка."],
 ["po","Pode deixar! Até o ano que vem, então.","Обязательно! Тогда до следующего года."],
 ["je","Até! E volta sempre ao Ceará!","До встречи! И возвращайтесь в Сеару!"],
 ["po","Com certeza. Já tô com saudade!","Конечно. Я уже скучаю!"]
 ],

<script>

/* ---------- SPEECH ---------- */
const S=window.speechSynthesis;let voices=[];
function loadV(){try{const all=S.getVoices();const re=META.tts==='pt-PT'?/^pt[-_]PT/i:/^pt[-_]BR/i;voices=all.filter(v=>re.test(v.lang));if(!voices.length)voices=all.filter(v=>/^pt/i.test(v.lang))}catch(e){}}
if(S){loadV();S.onvoiceschanged=loadV}
const FEM=/luciana|francisca|fernanda|vit[oó]ria|maria|thalita|leila|raquel|joana|catarina|in[eê]s|google portugu|female|feminin/i;
const MAL=/felipe|daniel|ant[oô]nio|ricardo|donato|f[aá]bio|humberto|j[uú]lio|duarte|cristiano|male|masculin/i;
function pickVoice(g){const f=voices.filter(v=>FEM.test(v.name)&&!MAL.test(v.name)),m=voices.filter(v=>MAL.test(v.name)&&!/female/i.test(v.name));
 if(g==='m'&&m.length)return{v:m[0],p:1};if(g==='f'&&f.length)return{v:f[0],p:1};
 return{v:voices[0]||null,p:g==='m'?0.8:1.15}}
function clean(t){return t.replace(/[^\p{L}\p{N}\s.,!?;:'\-]/gu,' ').replace(/\s+/g,' ').trim()}
let tok=0,safety=null;
function stopSpeech(){tok++;clearTimeout(safety);try{S&&S.cancel()}catch(e){}}
function say(text,g,cb){const my=++tok;clearTimeout(safety);
 const fin=()=>{if(my!==tok)return;clearTimeout(safety);cb&&cb()};

 if(!opt.sound||!S||!txt){safety=setTimeout(fin,Math.max(1400,txt.split(' ').length*430));return}
 try{S.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=META.tts;const pv=pickVoice(g);if(pv.v)u.voice=pv.v;u.pitch=pv.p;u.rate=0.88;

/* ---------- PLAYER (generic over items on page) ---------- */
let P={items:[],cur:0,playing:false,onEnd:null};

 if(scroll&&P.items[i])P.items[i].el.scrollIntoView({block:'center',behavior:'smooth'});updBar()}

 say(it.say,it.g,()=>{if(!P.playing)return;if(opt.auto)setTimeout(()=>{if(P.playing&&P.cur===i)playFrom(i+1)},650);else{P.playing=false;P.cur=Math.min(i+1,P.items.length-1);setCur(P.cur);updBar()}})}
function pause(){P.playing=false;stopSpeech();updBar()}
function toggle(){if(P.playing)pause();else playFrom(Math.max(0,P.cur))}
function playOne(i){P.playing=false;setCur(i,false);say(P.items[i].say,P.items[i].g,()=>{})}

function barHTML(title,backLabel){return `<div class="bar gut"><div class="col">

</div></div>`}

 <div class="chat">${d.lines.map((l,k)=>{const s=SPK[l[0]];return `<div class="ln${s.me?' me':''}" data-k="${k}"><div class="av" aria-hidden="true">${s.e}</div><div class="bb"><div class="nm">${esc(s.n)}</div><div class="pt">${wordsHTML(l[1])}</div><div class="tr" hidden>${esc(l[2])}</div><div class="acts"><button class="sb say" aria-label="Послушать">🔊</button><button class="sb glob" aria-label="Перевод фразы">🌐</button></div></div></div>`}).join('')}</div>
 <div class="end" id="endB"><h2>🎉 Диалог пройден!</h2>
  <button class="big" id="endEx"><span>🏋️</span><span>Упражнения к диалогу (3)</span></button>
  <button class="big sec" id="endVoc"><span>📚</span><span>Слова и конструкции этого диалога</span></button>
  <button class="big sec" id="endRe"><span>🔁</span><span>Послушать ещё раз</span></button>
  ${i<DLG.length-1?`<button class="big sec" id="endNext"><span>${DLG[i+1].e}</span><span>Дальше: ${i+2}. ${esc(DLG[i+1].t)} →</span></button>`:`<button class="big" id="endAll"><span>🏁</span><span>Повторить все слова и конструкции</span></button><button class="big sec" id="endMenu"><span>🏠</span><span>В меню</span></button>`}
 </div></div></div>`;
 scrollTo(0,0);
 const lines=[...app.querySelectorAll('.ln')];
 P={items:lines.map((el,k)=>({el,say:d.lines[k][1],g:SPK[d.lines[k][0]].g})),cur:0,playing:false,onEnd:()=>finish(i)};
 lines.forEach((el,k)=>{el.querySelector('.say').onclick=()=>playOne(k);
  el.querySelector('.glob').onclick=()=>{const t=el.querySelector('.tr');t.hidden=!t.hidden;if(t.hidden)delete t.dataset.man;else t.dataset.man='1'}});
 bindBar(home,()=>vocab(i,()=>openDlg(i)));
 document.getElementById('skipD').onclick=()=>{pause();i<DLG.length-1?openDlg(i+1):home()};
 document.getElementById('prepD').onclick=()=>{pause();vocab(i,()=>openDlg(i))};
 document.getElementById('endVoc').onclick=()=>{pause();vocab(i,()=>openDlg(i))};
 document.getElementById('endRe').onclick=()=>playFrom(0);
 document.getElementById('endEx').onclick=()=>{pause();exMenu(i)};
 document.getElementById('exD').onclick=()=>{pause();exMenu(i)};
 const n=document.getElementById('endNext');if(n)n.onclick=()=>{pause();openDlg(i+1)};
 const a=document.getElementById('endAll');if(a)a.onclick=()=>{pause();vocab(-1,home)};
 const m=document.getElementById('endMenu');if(m)m.onclick=home;
 setCur(0);
 if(opt.auto)playFrom(0);}
function finish(i){if(!done.includes(i)){done.push(i);lsSet('done',done)}
 const e=document.getElementById('endB');if(e)e.scrollIntoView({block:'end',behavior:'smooth'});
 if(i===DLG.length-1&&!evDone){evDone=true;sendEvent('lessonDone',document.title,'Все 7 диалогов прослушаны')}}

/* ---------- VOCAB ---------- */
function vocBlock(d,i){return `<div class="sec-h">Слова</div><div class="vgrid">${d.voc.map(v=>`<div class="vrow" data-say="${esc(v[0])}"><button class="sb say" aria-label="Послушать">🔊</button><span class="pt2">${esc(v[0])}</span><span class="ru2">${esc(v[1])}</span></div>`).join('')}</div>
 <div class="sec-h">Конструкции</div>${d.con.map(c=>`<div class="ccard" data-say="${esc(c[2])}"><div class="pat">${esc(c[0])}</div><div class="mean">${esc(c[1])}</div><div class="ex"><div class="pt">${wordsHTML(c[2])}</div><button class="sb say" aria-label="Послушать">🔊</button><button class="sb glob" aria-label="Перевод фразы">🌐</button></div><div class="tr" hidden>${esc(c[3])}</div></div>`).join('')}`}
function vocab(i,back){CUR={i,k:'voc'};closePop();
 const title=i<0?'📚 Все слова и конструкции':`📚 ${i+1}. ${esc(DLG[i].t)}: слова`;
 const body=i<0?DLG.map((d,k)=>`<details class="vd"${k===0?' open':''}><summary><span>${d.e}</span><span>${k+1}. ${esc(d.t)}</span></summary><div class="vbody">${vocBlock(d,k)}</div></details>`).join(''):vocBlock(DLG[i],i);
 app.innerHTML=barHTML(title,'← Назад')+`<div class="gut"><div class="col page">
 <button class="skip" id="skipV">⏭ Пропустить эту страницу</button>
 ${i<0?'<div class="hint">Открой нужный диалог. ▶ читает вслух слова и примеры по порядку.</div>':''}
 ${body}
 <div class="end" id="endV"><h2>✅ Готово!</h2>${i<0?'<button class="big" id="vGo"><span>✈️</span><span>К диалогам</span></button>':`<button class="big" id="vGo"><span>${DLG[i].e}</span><span>К диалогу ${i+1}. ${esc(DLG[i].t)}</span></button>`}</div>
 </div></div>`;
 scrollTo(0,0);
 const collect=()=>{const els=[...app.querySelectorAll('.vrow,.ccard')].filter(el=>!el.closest('details:not([open])'));return els.map(el=>({el,say:el.dataset.say,g:DV}))};
 P={items:collect(),cur:0,playing:false,onEnd:()=>{const e=document.getElementById('endV');e&&e.scrollIntoView({block:'end',behavior:'smooth'})}};
 app.querySelectorAll('details').forEach(dt=>dt.addEventListener('toggle',()=>{pause();P.items=collect();P.cur=0;setCur(-1);updBar()}));
 app.querySelector('.page').addEventListener('click',e=>{const b=e.target.closest('.say');if(b&&b.closest('.page')){const el=b.closest('.vrow,.ccard');const k=P.items.findIndex(it=>it.el===el);if(k>=0)playOne(k)}
  const g=e.target.closest('.glob');if(g){const t=g.closest('.ccard').querySelector('.tr');t.hidden=!t.hidden;if(t.hidden)delete t.dataset.man;else t.dataset.man='1'}});
 bindBar(back,()=>{});document.getElementById('vocB').hidden=true;
 document.getElementById('skipV').onclick=()=>{pause();back()};
 document.getElementById('vGo').onclick=()=>{pause();i<0?openDlg(0):openDlg(i)};
 setCur(0);
 if(opt.auto)playFrom(0);}

/* ---------- EXERCISES ---------- */
const XT=[
 {k:'exp',n:'➕ Расширяем фразу',d:'Фраза растёт кусочек за кусочком — собери её из слов'},
 {k:'sub',n:'🔄 Замени слово',d:'Берём фразу-образец, меняем одну часть — выбери верный вариант'},
 {k:'ant',n:'🎯 Скажи раньше, чем услышишь',d:'Скажи фразу вслух сама, потом выбери и сверь'}];
let ans=lsGet('ans',{}),xs=lsGet('xs',{});
let X=null,cdT=null;
const norm=t=>t.toLowerCase().replace(/[.,!?;:«»"]/g,'').replace(/\s+/g,' ').trim();
const toks=t=>norm(t).split(' ');
function shuf(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function cap(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function sayList(list,i,done){if(i>=list.length){done&&done();return}const it=list[i];
 document.querySelectorAll('.rd').forEach(e=>e.classList.remove('rd'));if(it.el)it.el.classList.add('rd');
 say(it.t,DV,()=>setTimeout(()=>sayList(list,i+1,done),350))}
function clearRd(){document.querySelectorAll('.rd').forEach(e=>e.classList.remove('rd'))}

function simpleBar(title,back){return `<div class="bar gut"><div class="col"><div class="r1"><button class="ib" id="backB">${back}</button><button class="ttl navB" aria-label="Навигация: все диалоги и упражнения"><span class="tt">${title}</span><span class="car">▾</span></button></div></div></div>`}

function exMenu(i){CUR={i,k:'menu'};closePop();stopSpeech();clearTimeout(cdT);
 app.innerHTML=simpleBar(`🏋️ ${i+1}. ${esc(DLG[i].t)}: упражнения`,'← К диалогу')+`<div class="gut"><div class="col page">
 <button class="skip" id="skipM">⏭ Пропустить эту страницу</button>
 <div class="list">${XT.map((t,k)=>{const n=t.k==='exp'?EX[i].exp.length:EX[i][t.k].length;const sc=xs[i+'-'+t.k];
  return `<button class="xcard" data-k="${t.k}"><span class="tx"><b>${t.n}</b><span>${t.d} · ${n} заданий</span></span>${sc?`<span class="sc">✓ ${sc}</span>`:''}</button>`}).join('')}</div>
 <button class="big sec" id="myM"><span>📋</span><span>Мои ответы</span></button>
 ${i<DLG.length-1?`<button class="big" id="nxM"><span>${DLG[i+1].e}</span><span>Дальше: ${i+2}. ${esc(DLG[i+1].t)} →</span></button>`:`<button class="big" id="nxM"><span>🏁</span><span>Повторить все слова и конструкции</span></button>`}
 </div></div>`;
 scrollTo(0,0);
 document.getElementById('backB').onclick=()=>openDlgQuiet(i);
 app.querySelectorAll('.xcard').forEach(b=>b.onclick=()=>runEx(i,b.dataset.k));
 document.getElementById('myM').onclick=()=>myAnswers(()=>exMenu(i));
 document.getElementById('skipM').onclick=()=>{i<DLG.length-1?openDlg(i+1):vocab(-1,home)};
 document.getElementById('nxM').onclick=()=>{i<DLG.length-1?openDlg(i+1):vocab(-1,home)};}
function openDlgQuiet(i){const a=opt.auto;opt.auto=false;openDlg(i);opt.auto=a;updBar()}

function runEx(i,k,list,mode){const all=EX[i][k].map((_,n)=>n);
 X={i,k,list:list||all,pos:0,stage:0,first:{},wrong:[],mode:mode||'main'};renderTask()}

function exBar(){const t=XT.find(t=>t.k===X.k);return `<div class="bar gut"><div class="col">
 <div class="r1"><button class="ib" id="backB">← Назад</button><button class="ttl navB" aria-label="Навигация: все диалоги и упражнения"><span class="tt">${t.n}${X.mode==='fix'?' · ошибки':''}</span><span class="car">▾</span></button><button class="ib" id="myB" aria-label="Мои ответы">📋</button></div>
 <div class="r2"><button class="ib" id="prevB" aria-label="Предыдущее задание">⏮</button><button class="ib play" id="sayB" aria-label="Послушать снова">🔊</button><button class="ib" id="nextB" aria-label="Следующее задание">⏭</button><button class="ib" id="rptB" aria-label="Начать упражнение заново">🔁</button><span class="cnt">${X.pos+1}/${X.list.length}</span></div>
 <div class="r3"><button class="ib" id="autoB">▶▶ Авто</button><button class="ib" id="sndB">🔊 Звук</button></div>
</div></div>`}
function bindExBar(speakFn){
 document.getElementById('backB').onclick=()=>{stopSpeech();clearTimeout(cdT);exMenu(X.i)};
 document.getElementById('myB').onclick=()=>{stopSpeech();clearTimeout(cdT);const s={...X};myAnswers(()=>{X=s;renderTask()})};
 document.getElementById('prevB').onclick=()=>{if(X.pos>0){X.pos--;X.stage=0;renderTask()}};
 document.getElementById('nextB').onclick=()=>{X.pos++;X.stage=0;renderTask()};
 document.getElementById('rptB').onclick=()=>runEx(X.i,X.k,null,'main');
 document.getElementById('sayB').onclick=()=>speakFn&&speakFn();
 document.getElementById('autoB').onclick=()=>{opt.auto=!opt.auto;lsSet('auto',opt.auto);updBar()};
 document.getElementById('sndB').onclick=()=>{opt.sound=!opt.sound;lsSet('sound',opt.sound);if(!opt.sound)stopSpeech();updBar()};
 updBar()}
function record(idx,ok,q,a,c){if(!(idx in X.first)){X.first[idx]=ok;if(!ok)X.wrong.push(idx)}
 ans[X.i+'-'+X.k+'-'+idx]={q,a,ok,c};lsSet('ans',ans)}

function renderTask(){CUR={i:X.i,k:X.k};closePop();stopSpeech();clearTimeout(cdT);
 if(X.pos>=X.list.length)return exEnd();
 const idx=X.list[X.pos],it=EX[X.i][X.k][idx];
 app.innerHTML=exBar()+`<div class="gut"><div class="col page"><button class="skip" id="skipT">⏭ Пропустить эту страницу</button><div class="task" id="task"></div></div></div>`;
 scrollTo(0,0);
 document.getElementById('skipT').onclick=()=>{X.pos++;X.stage=0;renderTask()};
 const box=document.getElementById('task');
 if(X.k==='exp')taskExp(box,idx,it);else if(X.k==='sub')taskSub(box,idx,it);else taskAnt(box,idx,it)}

function wrongBox(box,html,retry,next,speakOk){const fb=box.querySelector('.fb');
 fb.innerHTML=`<div class="fbm bad">${html}</div><div class="btnrow"><button class="big sec" id="again">🔁 Ещё раз</button><button class="big" id="goOn">Дальше →</button></div>`;
 fb.scrollIntoView({block:'end',behavior:'smooth'});
 document.getElementById('again').onclick=retry;document.getElementById('goOn').onclick=next;
 setTimeout(()=>speakOk&&speakOk(),900)}
function okBox(box,txt,next){const fb=box.querySelector('.fb');fb.innerHTML=`<div class="fbm ok">✅ ${txt}</div>`;fb.scrollIntoView({block:'end',behavior:'smooth'});next()}

/* exp: build the growing phrase */
function taskExp(box,idx,chain){const st=chain[X.stage],prev=X.stage>0?chain[X.stage-1]:null;
 const tgt=st[0].split(' ').filter(Boolean);const tl=tgt.map(w=>w.replace(/[.,!?]/g,''));
 let tiles;const pv=prev?prev[0].split(' '):null;let pos=-1;
 if(pv){for(let a=0;a+pv.length<=tl.length;a++){if(pv.every((w,j)=>tl[a+j]===w)){pos=a;break}}}
 if(pos>=0)tiles=[...tl.slice(0,pos),pv.join(' '),...tl.slice(pos+pv.length)];else tiles=tl.slice();
 const chunkTxt=pos>=0?pv.join(' '):null;
 tiles.push(st[2]);
 let order=shuf(tiles.map((t,n)=>n));let tries=0;while(tries++<8&&order.slice(0,tiles.length-1).every((v,n)=>v===n))order=shuf(order);
 box.innerHTML=`<div class="steps">${chain.map((_,n)=>`<span class="dot${n<=X.stage?' on':''}"></span>`).join('')}<span>Шаг ${X.stage+1} из ${chain.length} · задание ${X.pos+1} из ${X.list.length}</span></div>
 ${prev?`<div class="model"><div class="q">Было:</div><div class="row"><div class="pt">${wordsHTML(prev[0])}</div><button class="sb" id="pvS" aria-label="Послушать">🔊</button><button class="sb" id="pvG" aria-label="Перевод фразы">🌐</button></div><div class="tr" hidden>${esc(prev[1])}</div></div>`:''}
 <div class="q">Собери по-португальски:<br><b>«${esc(st[1])}»</b></div>
 <div class="ansbox" id="ab" aria-live="polite"></div>
 <div class="tiles" id="tl">${order.map(n=>`<button class="tile${tiles[n]===chunkTxt?' chunk':''}" data-n="${n}">${esc(tiles[n])}</button>`).join('')}</div>
 <div class="fb"></div>`;
 const ab=box.querySelector('#ab'),tlb=box.querySelector('#tl');let placed=[];
 const need=tl.length;
 const count=()=>placed.reduce((s,n)=>s+tiles[n].split(' ').length,0);
 const speakPrev=()=>{if(prev)say(prev[0],DV,()=>{})};
 bindExBar(speakPrev);
 if(prev){box.querySelector('#pvS').onclick=speakPrev;box.querySelector('#pvG').onclick=()=>{const t=box.querySelector('.model .tr');t.hidden=!t.hidden}}
 const nextStage=()=>{if(X.stage<chain.length-1){X.stage++;renderTask()}else{X.stage=0;X.pos++;renderTask()}};
 const check=()=>{const a=placed.map(n=>tiles[n]).join(' ');const okList=[st[0],...(st[3]||[])].map(norm);const ok=okList.includes(norm(a));
  tlb.querySelectorAll('.tile').forEach(b=>b.disabled=true);ab.querySelectorAll('.tile').forEach(b=>b.disabled=true);
  if(X.stage===chain.length-1||!ok)record(idx,ok&&!(idx in X.first&&!X.first[idx]),`${chain[chain.length-1][1]}`,ok?st[0]:a,st[0]);
  if(ok){ab.classList.add('ok');okBox(box,'Верно: '+esc(cap(st[0])),()=>say(st[0],DV,()=>setTimeout(nextStage,700)))}
  else{ab.classList.add('bad');const extra=placed.map(n=>tiles[n]).includes(st[2])?`<br>Лишнее слово: <b>${esc(st[2])}</b>`:'';
   wrongBox(box,`Правильно: <b>${esc(cap(st[0]))}</b>${extra}`,()=>renderTask(),nextStage,()=>say(st[0],DV,()=>{}))}};
 const draw=()=>{ab.innerHTML=placed.map(n=>`<button class="tile${tiles[n]===chunkTxt?' chunk':''}" data-n="${n}">${esc(tiles[n])}</button>`).join('');
  tlb.querySelectorAll('.tile').forEach(b=>b.hidden=placed.includes(+b.dataset.n));if(count()>=need)check()};
 tlb.onclick=e=>{const b=e.target.closest('.tile');if(!b||b.disabled)return;placed.push(+b.dataset.n);say(tiles[+b.dataset.n],DV,()=>{});draw()};
 ab.onclick=e=>{const b=e.target.closest('.tile');if(!b||b.disabled)return;placed=placed.filter(n=>n!==+b.dataset.n);draw()};
 if(opt.auto&&prev)setTimeout(speakPrev,300)}

/* options shared by sub & ant */
function buildOpts(okT,bads){const opts=[okT,...bads];let ord=shuf([0,1,2]);if(ord[0]===0)ord=[ord[1],ord[0],ord[2]];return ord.map(n=>({t:opts[n],ok:n===0}))}
function optsHTML(o){return `<div class="opts">${o.map((x,n)=>`<div class="orow"><button class="opt" data-n="${n}">${esc(x.t)}</button><button class="sb osay" data-n="${n}" aria-label="Послушать вариант">🔊</button></div>`).join('')}</div>`}
function bindOpts(box,o,idx,q,okT,why,readFirst){const els=[...box.querySelectorAll('.opt')];
 const readAll=()=>{const l=(readFirst?[{t:readFirst.t,el:readFirst.el}]:[]).concat(els.map((el,n)=>({t:o[n].t,el})));sayList(l,0,()=>{clearRd();box.querySelector('.opts').scrollIntoView({block:'nearest',behavior:'smooth'})})};
 box.querySelectorAll('.osay').forEach(b=>b.onclick=()=>{stopSpeech();clearRd();say(o[+b.dataset.n].t,DV,()=>{})});
 els.forEach((b,n)=>b.onclick=()=>{stopSpeech();clearRd();els.forEach(e=>e.disabled=true);const ok=o[n].ok;
  record(idx,ok,q,o[n].t,okT);
  if(ok){b.classList.add('ok');okBox(box,'Верно!',()=>say(okT,DV,()=>setTimeout(()=>{X.pos++;renderTask()},700)))}
  else{b.classList.add('bad');els[o.findIndex(x=>x.ok)].classList.add('ok');
   wrongBox(box,`Правильно: <b>${esc(okT)}</b><br>💡 ${esc(why)}`,()=>renderTask(),()=>{X.pos++;renderTask()},()=>say(okT,DV,()=>{}))}});
 return readAll}

/* sub: substitution drill */
function taskSub(box,idx,it){const [m,mru,cue,okT,b1,b2,why]=it;const o=buildOpts(okT,[b1,b2]);
 box.innerHTML=`<div class="model"><div class="q">Образец:</div><div class="row"><div class="pt" id="mT">${wordsHTML(m)}</div><button class="sb" id="mS" aria-label="Послушать">🔊</button><button class="sb" id="mG" aria-label="Перевод фразы">🌐</button></div><div class="tr" hidden>${esc(mru)}</div></div>
 <div class="q">Замени на: <b>${esc(cue)}</b></div>${optsHTML(o)}<div class="fb"></div>`;
 const readAll=bindOpts(box,o,idx,`${m} → ${cue}`,okT,why,{t:m,el:box.querySelector('.model')});
 box.querySelector('#mS').onclick=()=>say(m,DV,()=>{});
 box.querySelector('#mG').onclick=()=>{const t=box.querySelector('.model .tr');t.hidden=!t.hidden};
 bindExBar(readAll);if(opt.auto)setTimeout(readAll,300)}

/* ant: anticipation — say it first, then check */
function taskAnt(box,idx,it){const [ru,okT,b1,b2,why]=it;const o=buildOpts(okT,[b1,b2]);
 box.innerHTML=`<div class="q">${META.antQ||'Как сказать по-португальски?'}</div><div class="rucard">${esc(ru)}</div>
 <div class="cd" id="cd"><b id="cdn">4</b><span>🗣 Скажи вслух сама…</span><button class="pill" id="cdSkip">Показать варианты</button></div>
 <div id="ow" hidden>${optsHTML(o)}</div><div class="fb"></div>`;
 const readAll=bindOpts(box,o,idx,ru,okT,why,null);
 let n=4;const show=()=>{clearTimeout(cdT);box.querySelector('#cd').hidden=true;box.querySelector('#ow').hidden=false;if(opt.auto)readAll()};
 const tick=()=>{n--;const c=box.querySelector('#cdn');if(!c)return;if(n<=0)return show();c.textContent=n;cdT=setTimeout(tick,1000)};
 cdT=setTimeout(tick,1000);box.querySelector('#cdSkip').onclick=show;
 bindExBar(()=>{if(!box.querySelector('#ow').hidden)readAll()})}

function exEnd(){const tot=X.list.length,good=X.list.filter(i=>X.first[i]===true).length;
 if(X.mode==='main'){xs[X.i+'-'+X.k]=good+'/'+tot;lsSet('xs',xs)}
 const t=XT.find(t=>t.k===X.k);const ki=XT.findIndex(t=>t.k===X.k);
 app.innerHTML=simpleBar(t.n,'← Назад')+`<div class="gut"><div class="col page">
 <button class="skip" id="skipE">⏭ Пропустить эту страницу</button>
 <div class="end"><h2>${good===tot?'🎉 Всё верно!':'💪 Готово!'}</h2><div style="font-size:17px">Верно с первого раза: <b>${good} из ${tot}</b></div>
 ${X.wrong.length?`<div class="fbm bad">Работа над ошибками? Повторим ${X.wrong.length} ${X.wrong.length===1?'задание':'задания'} с ошибкой.</div><div class="btnrow"><button class="big" id="fixY">Да</button><button class="big sec" id="fixN">Нет</button></div>`:''}
 <div id="after" ${X.wrong.length?'hidden':''} style="display:flex;flex-direction:column;gap:8px">
 ${ki<XT.length-1?`<button class="big" id="nxE"><span>➡️</span><span>Следующее: ${XT[ki+1].n}</span></button>`:''}
 <button class="big ${ki<XT.length-1?'sec':''}" id="mnE"><span>🏋️</span><span>К упражнениям диалога</span></button></div>
 </div></div></div>`;
 scrollTo(0,0);const i=X.i,w=X.wrong.slice(),k=X.k;
 const after=()=>{const a=document.getElementById('after');a.hidden=false;const y=document.getElementById('fixY');if(y)y.closest('.btnrow').remove();a.scrollIntoView({block:'end',behavior:'smooth'})};
 document.getElementById('backB').onclick=()=>exMenu(i);
 document.getElementById('skipE').onclick=()=>exMenu(i);
 const y=document.getElementById('fixY');if(y){y.onclick=()=>runEx(i,k,w,'fix');document.getElementById('fixN').onclick=after}
 const nx=document.getElementById('nxE');if(nx)nx.onclick=()=>runEx(i,XT[ki+1].k);
 document.getElementById('mnE').onclick=()=>exMenu(i)}

function myAnswers(back){closePop();stopSpeech();
 const keys=Object.keys(ans);
 const body=DLG.map((d,i)=>{const parts=XT.map(t=>{const ks=keys.filter(k=>k.startsWith(i+'-'+t.k+'-')).sort((a,b)=>+a.split('-')[2]-+b.split('-')[2]);if(!ks.length)return'';
   return `<div class="q"><b>${t.n}</b></div>`+ks.map(k=>{const a=ans[k];return `<div class="mya">${a.ok?'✅':'❌'} ${esc(a.q)}<br>Мой ответ: ${esc(a.a)}${a.ok?'':`<br><span class="c">Правильно: ${esc(a.c)}</span>`}</div>`}).join('')}).join('');
  return parts?`<div class="sec-h">${d.e} ${i+1}. ${esc(d.t)}</div><div class="myl">${parts}</div>`:''}).join('');
 app.innerHTML=simpleBar('📋 Мои ответы','← Назад')+`<div class="gut"><div class="col page">
 <button class="skip" id="skipA">⏭ Пропустить эту страницу</button>
 ${body||'<div class="hint">Здесь появятся твои ответы из упражнений: что верно, где ошибка и правильный вариант. При повторном прохождении ответ перезаписывается.</div>'}
 </div></div>`;
 scrollTo(0,0);document.getElementById('backB').onclick=back;document.getElementById('skipA').onclick=back}

/* ---------- GRAMMAR TABLES ---------- */
function gramPage(back){CUR={i:-1,k:'gram'};closePop();stopSpeech();pause();
 const G=(typeof GRAM!=='undefined'?GRAM:[]);
 app.innerHTML=simpleBar('📐 Грамматика урока','← Назад')+`<div class="gut"><div class="col page">
 <button class="skip" id="skipG">⏭ Пропустить эту страницу</button>
 <div class="hint">Нажмите на любую форму или пример — услышите произношение.</div>
 ${G.map((g,gi)=>`<div class="gcard"><h2>${esc(g.t)}</h2>${g.when?`<p class="gwhen">${esc(g.when)}</p>`:''}
  <div class="gtw"><table class="gt"><thead><tr><th></th>${g.verbs.map(v=>`<th><b>${esc(v[0])}</b>${esc(v[1])}</th>`).join('')}</tr></thead><tbody>
  ${g.rows.map(r=>`<tr><td class="gp">${r[0]}</td>${r[1].map(f=>`<td class="gf" data-s="${esc(f[0]+f[1])}">${esc(f[0])}${f[1]?`<span class="ge">${esc(f[1])}</span>`:''}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div>
  ${g.tip?`<p class="gtip">${esc(g.tip)}</p>`:''}
  ${g.ex&&g.ex.length?`<div class="gex">${g.ex.map(x=>`<div class="gexl" data-s="${esc(x[0].replace(/<[^>]+>/g,''))}">${x[0]}<span class="ru">${esc(x[1])}</span></div>`).join('')}</div>`:''}
  ${g.diff&&g.diff.length?`<div class="gflag">${g.diff.map(d=>`<span>${esc(d)}</span>`).join('')}</div>`:''}
  ${g.tips&&g.tips.length?`<button class="gtipb" data-g="${gi}">💡 Как запомнить</button><div class="gtips" id="gtips${gi}" hidden>${g.tips.map(t=>`<div class="glh"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></div>`).join('')}</div>`:''}
 </div>`).join('')}
 <div class="end"><h2>✅ Готово!</h2><button class="big" id="gGo"><span>${DLG[0].e}</span><span>К диалогам</span></button></div>
 </div></div>`;
 scrollTo(0,0);
 document.getElementById('backB').onclick=()=>{stopSpeech();back()};
 document.getElementById('skipG').onclick=()=>{stopSpeech();back()};
 document.getElementById('gGo').onclick=()=>{stopSpeech();openDlg(0)};
 app.querySelectorAll('[data-s]').forEach(el=>el.addEventListener('click',()=>{app.querySelectorAll('.rd').forEach(e=>e.classList.remove('rd'));el.classList.add('rd');sayF(el.dataset.s,()=>el.classList.remove('rd'))}));
 app.querySelectorAll('.gtipb').forEach(b=>b.onclick=()=>{const x=document.getElementById('gtips'+b.dataset.g);x.hidden=!x.hidden;b.textContent=x.hidden?'💡 Как запомнить':'💡 Скрыть подсказки'});}
/* speech that ignores the 🔊 toggle: used where the sound IS the task (tables, similar words) */
function sayF(t,cb,rate){const s=opt.sound;opt.sound=true;say(t,DV,cb);opt.sound=s}

/* ---------- SIMILAR WORDS ---------- */
function pairsPage(back){CUR={i:-1,k:'pairs'};closePop();stopSpeech();pause();
 const PR=(typeof PAIRS!=='undefined'?PAIRS:[]),ROUNDS=3;
 let started=false,fromTap=false,pi=0,mode='intro',q=[],qi=0,target=0,busy=false,runId=0;
 app.innerHTML=simpleBar('👂 Похожие слова','← Назад')+`<div class="gut"><div class="col page pz">
 <button class="skip" id="skipP">⏭ Пропустить эту страницу</button>
 <div class="pstart" id="pst"><p>Слова из этого урока, которые звучат почти одинаково. Сначала слушаем оба, потом угадываем. На iPhone звук включается только после касания — нажмите, и слова зазвучат сами.</p><button class="big" id="pgo"><span>▶</span><span>Начать</span></button></div>
 <div id="pmain" hidden>
  <div class="pprog"><span id="pN"></span><span class="pdots" id="pD"></span></div>
  <div class="pstage" id="pS"></div><p class="phint" id="pH"></p>
  <div class="pspk" id="pK" hidden>👂</div>
  <div class="ppair"><button class="pw" id="w0"><span class="pt"></span><span class="ru"></span><span class="snd">нажмите — послушать</span></button><button class="pw" id="w1"><span class="pt"></span><span class="ru"></span><span class="snd">нажмите — послушать</span></button></div>
  <p class="pfb" id="pF"></p><div class="pwhy" id="pY" hidden></div>
  <div class="btnrow" id="pI"><button class="big sec" id="pA">🔁 Ещё раз</button><button class="big" id="pR">Готова? Угадываем</button></div>
  <div class="btnrow" id="pQ" hidden><button class="big sec" id="pP">🔁 Повторить слово</button><button class="big" id="pX" hidden>Дальше</button></div>
  <div class="end" id="pE" hidden><h2>✅ Готово!</h2><button class="big" id="pBk"><span>🏠</span><span>В меню урока</span></button></div>
 </div></div></div>`;
 scrollTo(0,0);
 const $=id=>document.getElementById(id),W=[$('w0'),$('w1')];
 const word=i=>i===0?PR[pi].a[1]:PR[pi].b[1];
 const clr=()=>W.forEach(w=>w.classList.remove('speak','ok','bad'));
 const leave=()=>{runId++;stopSpeech();back()};
 $('backB').onclick=leave;$('skipP').onclick=leave;$('pBk').onclick=leave;
 function intro(now){busy=true;const my=++runId,seq=[0,1,0,1];let k=0;
  const step=()=>{if(my!==runId)return;clr();if(k>=seq.length||mode!=='intro'){busy=false;return}const i=seq[k++];W[i].classList.add('speak');sayF(word(i),()=>setTimeout(step,450))};
  if(now)step();else setTimeout(step,500)}
 function render(){const p=PR[pi];
  $('pN').textContent='Пара '+(pi+1)+' из '+PR.length;$('pD').innerHTML=PR.map((_,i)=>'<i class="'+(i<=pi?'on':'')+'"></i>').join('');
  [p.a,p.b].forEach((x,i)=>{W[i].querySelector('.pt').innerHTML=x[0];W[i].querySelector('.ru').textContent=x[2]});
  clr();$('pF').textContent='';$('pF').className='pfb';$('pY').hidden=true;
  if(mode==='intro'){$('pS').textContent='① Знакомство';$('pH').textContent='Сначала слушаем оба слова. Оранжевым подсвечено то, что звучит сейчас.';
   $('pI').hidden=false;$('pQ').hidden=true;$('pK').hidden=true;W.forEach(w=>{w.disabled=false;w.querySelector('.snd').hidden=false});intro(fromTap);fromTap=false}
  else{$('pS').textContent='② Угадай: задание '+(qi+1)+' из '+ROUNDS;$('pH').textContent='Послушайте и нажмите на слово, которое прозвучало.';
   $('pI').hidden=true;$('pQ').hidden=false;$('pX').hidden=true;$('pK').hidden=false;W.forEach(w=>{w.disabled=false;w.querySelector('.snd').hidden=true});
   target=q[qi];busy=true;runId++;const go=()=>sayF(word(target),()=>{busy=false});if(fromTap){fromTap=false;go()}else setTimeout(go,400)}}
 W.forEach((w,i)=>w.addEventListener('click',()=>{
  if(mode==='intro'){if(busy)return;clr();w.classList.add('speak');sayF(word(i),()=>w.classList.remove('speak'));return}
  if(busy||!$('pX').hidden)return;const p=PR[pi];
  if(i===target){w.classList.add('ok');$('pF').textContent='Верно! ✅';$('pF').className='pfb ok';W.forEach(x=>x.disabled=true);setTimeout(()=>{fromTap=false;next()},1100)}
  else{w.classList.add('bad');W[target].classList.add('ok');$('pF').textContent='Прозвучало: «'+word(target)+'» — '+(target===0?p.a[2]:p.b[2]);$('pF').className='pfb bad';
   $('pY').innerHTML='<b>Почему:</b> '+esc(p.why);$('pY').hidden=false;W.forEach(x=>x.disabled=true);
   setTimeout(()=>{W[target].classList.add('speak');sayF(word(target),()=>W[target].classList.remove('speak'))},500);$('pX').hidden=false;
   setTimeout(()=>$('pX').scrollIntoView({block:'nearest',behavior:'smooth'}),60)}}));
 function next(){qi++;if(qi<ROUNDS){render();return}
  pi++;if(pi<PR.length){mode='intro';render();return}
  $('pS').textContent='Все пары пройдены 🎉';$('pH').textContent='';$('pQ').hidden=true;$('pK').hidden=true;$('pE').hidden=false;$('pE').scrollIntoView({block:'nearest',behavior:'smooth'})}
 $('pX').onclick=()=>{fromTap=true;next()};
 $('pA').onclick=()=>{if(!busy)intro(true)};
 $('pR').onclick=()=>{fromTap=true;mode='quiz';qi=0;q=shuf([0,1,Math.random()<.5?0:1]);render()};
 $('pP').onclick=()=>{if(busy)return;busy=true;sayF(word(target),()=>{busy=false})};
 $('pgo').onclick=()=>{started=true;fromTap=true;$('pst').hidden=true;$('pmain').hidden=false;render()};}

/* ---------- NAVIGATION (from any page to any dialogue / exercise) ---------- */
function navPop(){closePop();stopSpeech();if(typeof pause==='function')pause();clearTimeout(cdT);
 const old=document.querySelector('.ov');if(old)old.remove();
 const ov=document.createElement('div');ov.className='ov';
 const cell=(i,k,ic,lbl)=>{const here=CUR.i===i&&CUR.k===k;const dn=k==='dlg'?done.includes(i):!!xs[i+'-'+k];
  return `<button class="nb ex${here?' here':''}${dn?' dn':''}" data-i="${i}" data-k="${k}" aria-label="${lbl} ${i+1}">${ic}</button>`};
 ov.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><button class="x" aria-label="Закрыть">✕</button><h3>🧭 Куда перейти?</h3>
 <div class="navtop"><button class="big sec" data-go="home">🏠 Меню</button><button class="big sec" data-go="all">📚 Все слова</button><button class="big sec" data-go="my">📋 Ответы</button></div>${(typeof GRAM!=='undefined'&&GRAM.length)||(typeof PAIRS!=='undefined'&&PAIRS.length)?`<div class="navtop">${typeof GRAM!=='undefined'&&GRAM.length?'<button class="big sec" data-go="gram">📐 Грамматика</button>':''}${typeof PAIRS!=='undefined'&&PAIRS.length?'<button class="big sec" data-go="pairs">👂 Похожие слова</button>':''}</div>`:''}
 <div class="nav"><span class="hd l">Диалог</span><span class="hd">➕</span><span class="hd">🔄</span><span class="hd">🎯</span><span class="hd">📚</span>
 ${DLG.map((d,i)=>`<button class="nb dl${CUR.i===i&&CUR.k==='dlg'?' here':''}${done.includes(i)?' dn':''}" data-i="${i}" data-k="dlg"><span>${d.e}</span><span class="nt">${i+1}. ${esc(d.t)}</span></button>${cell(i,'exp','➕','Расширяем фразу')}${cell(i,'sub','🔄','Замени слово')}${cell(i,'ant','🎯','Скажи раньше')}${cell(i,'voc','📚','Слова')}`).join('')}
 </div>
 <div class="legend">➕ Расширяем фразу · 🔄 Замени слово · 🎯 Скажи раньше, чем услышишь · 📚 Слова и конструкции · ✓ пройдено</div></div>`;
 document.body.appendChild(ov);
 const c=()=>ov.remove();ov.querySelector('.x').onclick=c;ov.onclick=e=>{if(e.target===ov)c()};
 ov.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{c();const g=b.dataset.go;if(g==='home')home();else if(g==='all')vocab(-1,home);else if(g==='gram')gramPage(home);else if(g==='pairs')pairsPage(home);else myAnswers(home)});
 ov.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{c();const i=+b.dataset.i,k=b.dataset.k;
  if(k==='dlg')openDlg(i);else if(k==='voc')vocab(i,()=>openDlg(i));else runEx(i,k)});}
document.addEventListener('click',e=>{if(e.target.closest('.navB')){e.preventDefault();navPop()}});

function normCode(v){let t=String(v||'').toLowerCase().replace(/[\s.\-_]/g,'');
 t=t.replace(/^(дарья|дария|дариа|даря|дарjа|дарjа)/,'daria').replace(/^(darja|darya|darija|dariya|daria)/,'daria');
 t=t.replace(/[бвbв]2$/,'b2').replace(/[вb]$/,'b');return t}
const TEACHER='dariab2';
const CODES=[TEACHER].concat((META.codes||[]).map(normCode));
function gateOk(){return CODES.includes(normCode(lsGet('code','')))}
function showGate(){const g=document.createElement('div');g.className='gate';
 g.innerHTML=`<form class="gb" id="gf" autocomplete="off"><div class="gi">🔒</div><h2>${META.h1}</h2><p>Введи, пожалуйста, свой код, чтобы открыть урок.</p>
 <input id="gc" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Код" placeholder="Код">
 <p class="err" id="ge" aria-live="polite"></p><button class="big" type="submit">Открыть урок</button><div class="own">© Daria Botina</div></form>`;
 document.body.appendChild(g);
 g.querySelector('#gf').addEventListener('submit',e=>{e.preventDefault();const v=g.querySelector('#gc').value.trim();
  if(CODES.includes(normCode(v))){lsSet('code',v);g.remove();home();startVisit()}
  else{g.querySelector('#ge').textContent=v?'Код не подходит. Проверь, пожалуйста, и попробуй ещё раз.':'Введи, пожалуйста, код.'}})}
function setWho(){const c=normCode(lsGet('code',''));EV_WHO=(!c||c===TEACHER)?'Дарья (тест)':(META.who||'Ученик')}
function startVisit(){setWho();setTimeout(()=>sendEvent('visit',document.title),800)}
if(META.gate&&!gateOk())showGate();else{home();startVisit()}
})();
</script>
