C.cquiz.forEach((c, i) => S.push({k: "cq", i}));
S.push({k: "bridge"});
B.tips.forEach((c, i) => S.push({k: "tip", i}));
B.quiz.forEach((c, i) => S.push({k: "q", i}));
S.push({k: "plan"}); S.push({k: "promise"});
function nav(nextLabel, disabled){
  const row = el("div", "row");
  const bb = el("button", "btn ghost", B.back); bb.style.flex = "0 0 64px"; bb.onclick = () => go(step - 1);
  const nb = el("button", "btn", nextLabel || B.next); nb.disabled = !!disabled; nb.onclick = () => go(step + 1);
  row.append(bb, nb); return [row, nb];
}
function quizCard(title, q, opts, correct, fbt, onOk){
  const c = el("div", "card");
  c.append(el("h2", "", title), el("p", "q", esc(q)));
  const o = el("div", "opts"), fb = el("div", "fb"); let done = false;
  const [row, nb] = nav(null, true);
  opts.forEach((lab, idx) => {
    const b = el("button", "opt", esc(lab));
    b.onclick = () => { if(done) return; done = true; const ok = idx === correct; if(ok) onOk(); b.classList.add(ok ? "ok" : "bad"); if(!ok) o.children[correct].classList.add("ok"); fb.textContent = (ok ? "✅ " : "❌ ") + fbt; nb.disabled = false; };
    o.append(b);
  });
  if(opts.length > 2) o.style.gridTemplateColumns = "1fr";
  c.append(o, fb);
  return [c, row];
}
function render(){
  const app = $("#app"); app.innerHTML = "";
  const top = el("div", "top"); const bar = el("div", "bar", "<i></i>"); bar.firstChild.style.width = Math.round(step / (S.length - 1) * 100) + "%"; top.append(bar); app.append(top);
  const st = S[step];
  if(st.k === "hero"){
    const h = el("div", "hero"); h.append(el("div", "emo", C.flag), el("h1", "", esc(C.title)), el("p", "", esc(C.sub)));
    const b = el("button", "btn", B.start); b.onclick = () => go(1); h.append(b); app.append(h);
  } else if(st.k === "cult"){
    const [e, h2, p] = C.culture[st.i];
    const c = el("div", "card"); c.append(el("div", "part", esc(C.partCulture)), el("div", "emo", e), el("h2", "", esc(h2)), el("p", "", p));
    app.append(c); app.append(nav()[0]);
  } else if(st.k === "words"){
    const c = el("div", "card"); c.append(el("div", "part", esc(C.partCulture)), el("div", "emo", "🔤"), el("h2", "", esc(C.wordsTitle)), el("p", "", esc(C.wordsSub)));
    const g = el("div", "words");
    C.words.forEach(([f, n, x]) => {
      const w = el("button", "wcard"); w.innerHTML = '<div class="f">' + esc(f) + '</div><div class="n">❓</div>';
      w.onclick = () => { w.innerHTML = '<div class="f">' + esc(f) + '</div><div class="n">' + esc(n) + '</div>' + (x ? '<div class="x">' + esc(x) + '</div>' : ""); say(f); };
      g.append(w);
    });
    c.append(g); app.append(c); app.append(nav()[0]);
  } else if(st.k === "cq"){
    if(st.i === 0) cscore = 0;
    const [q, opts, cor, fbt] = C.cquiz[st.i];
    const [c, row] = quizCard("🎲 " + esc(C.cquizTitle) + " (" + fa(st.i + 1) + "/" + fa(C.cquiz.length) + ")", q, opts, cor, fbt, () => cscore++);
    app.append(c, row);
  } else if(st.k === "bridge"){
    const c = el("div", "card"); c.append(el("div", "emo", "🧠"), el("h2", "", esc(C.bridgeTitle)), el("p", "", esc(C.bridgeText)));
    app.append(c); app.append(nav()[0]);
  } else if(st.k === "tip"){
    const [e, h2, p, tip, src] = B.tips[st.i];
    const c = el("div", "card");
    c.append(el("div", "part", esc(C.partHow)), el("div", "emo", e), el("h2", "", fa(st.i + 1) + ". " + esc(h2)), el("p", "", esc(p)), el("div", "tip", "💡 " + esc(tip)), el("div", "src", "📚 " + esc(src)));
    app.append(c); app.append(nav()[0]);
  } else if(st.k === "q"){
    if(st.i === 0) score = 0;
    const [q, ans, fbt] = B.quiz[st.i];
    const [c, row] = quizCard("🧠 " + esc(B.quizTitle) + " (" + fa(st.i + 1) + "/" + fa(B.quiz.length) + ")", q, [B.truth, B.myth], ans ? 0 : 1, fbt, () => score++);
    app.append(c, row);
  } else if(st.k === "plan"){
    const c = el("div", "card");
    c.append(el("div", "emo", "📝"), el("h2", "", esc(B.planTitle)));
    c.append(el("label", "fl", esc(C.why)));
    const w = el("textarea"); w.rows = 2; w.placeholder = B.whyPh; w.value = plan.why; w.oninput = () => { plan.why = w.value; save(); }; c.append(w);
    c.append(el("label", "fl", esc(B.minutes)));
    const ch = el("div", "chips");
    [5, 10, 15, 20, 30].forEach(m => { const b = el("button", "chip" + (plan.min === m ? " on" : ""), fa(m) + " دقیقه"); b.onclick = () => { plan.min = m; save(); [...ch.children].forEach(x => x.classList.toggle("on", x === b)); }; ch.append(b); });
    c.append(ch, el("label", "fl", esc(B.when)));
    const ch2 = el("div", "chips");
    B.whenOpts.forEach((wo, i) => { const b = el("button", "chip" + (plan.when === i ? " on" : ""), esc(wo)); b.onclick = () => { plan.when = i; save(); [...ch2.children].forEach(x => x.classList.toggle("on", x === b)); }; ch2.append(b); });
    c.append(ch2, el("label", "fl", esc(B.goal)));
    const g = el("input"); g.type = "text"; g.placeholder = B.goalPh; g.value = plan.goal; g.oninput = () => { plan.goal = g.value; save(); }; c.append(g);
    app.append(c); app.append(nav(B.make)[0]);
  } else {
    const pr = el("div", "promise");
    const whyTxt = plan.why.trim() || "…", goalTxt = plan.goal.trim() || "…";
    pr.append(el("h2", "", esc(B.promiseTitle)),
      el("p", "", esc(C.pWhy) + " <b>" + esc(whyTxt) + "</b>."),
      el("p", "", esc(B.pDaily) + " <b>" + fa(plan.min) + "</b> " + esc(B.pMin) + " <b>" + esc(B.whenOpts[plan.when]) + "</b>."),
      el("p", "", esc(B.pGoal) + " <b>" + esc(goalTxt) + "</b>."));
    app.append(pr);
    const txt = B.promiseTitle + "\n" + C.pWhy + " " + whyTxt + ".\n" + B.pDaily + " " + fa(plan.min) + " " + B.pMin + " " + B.whenOpts[plan.when] + ".\n" + B.pGoal + " " + goalTxt + ".";
    const cp = el("button", "btn ghost", B.copy); cp.style.marginTop = "16px";
    cp.onclick = () => { const ok = () => cp.textContent = B.copied; if(navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, ok); else ok(); };
    app.append(cp, el("p", "note", esc(B.shot)));
    const end = el("div", "card"); end.style.marginTop = "18px";
    end.append(el("div", "emo", "🏁"), el("h2", "", esc(B.endTitle)), el("p", "", esc(C.endText)));
    if(C.firstUrl){ const a = el("a", "btn", esc(C.firstLabel)); a.href = C.firstUrl; a.style.textDecoration = "none"; a.style.marginTop = "14px"; end.append(a); }
    app.append(end);
    const ag = el("button", "btn ghost", B.again); ag.style.marginTop = "16px"; ag.onclick = () => go(0); app.append(ag);
  }
  if(step < S.length - 1){ const sk = el("button", "btn ghost", "⏭ رد شدن از این صفحه"); sk.style.marginTop = "18px"; sk.style.boxShadow = "none"; sk.style.color = "var(--muted)"; sk.onclick = () => go(step + 1); app.append(sk); }
  app.append(el("p", "foot", B.foot));
  window.scrollTo(0, 0);
}
function go(n){ step = Math.max(0, Math.min(S.length - 1, n)); render(); }
render();
</script>
</body>
</html>
