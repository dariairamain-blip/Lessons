<style>
/* Layout: phone-first column; sticky control header on dialogue pages; chat bubbles (Daria on the right) */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{
  --bg:#0c1916; --card:#14261f; --ink:#e5f0eb; --muted:#97b0a6; --accent:#3cc393; --accent-ink:#06281d;

html,body{min-height:100%}

/* HOME */
.home{padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px}

.xcard .tx{display:flex;flex-direction:column;flex:1;min-width:0}.xcard b{font-size:16px}.xcard span{font-size:13px;color:var(--muted)}

.model{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}

{t:"No Mercado Central",ru:"Сыр, доси-ди-лейти и Дона Зезé",e:"🧀",

 ["ca","Nina, bem-vinda ao Mercado Central! Aqui tem de tudo: queijo, doce, panela, até passarinho.","Нина, добро пожаловать на Центральный рынок! Тут есть всё: сыр, сладости, кастрюли, даже птички."],

 ["ca","Pelo queijo, claro. Você está em Minas! Vem, a banca da Dona Zezé é ali.","С сыра, конечно. Ты же в Минас! Пойдём, прилавок Доны Зезé вон там."],
 ["ze","Ô, Caio, meu filho! Sumido! Quem é essa moça?","О, Кайу, сынок! Совсем пропал! Кто эта девушка?"],

 ["ze","Da Rússia! Então você veio ao lugar certo. Já provou queijo canastra?","Из России! Тогда ты пришла по адресу. Уже пробовала сыр канастра?"],
 ["n","Ainda não. Qual é a diferença entre os queijos?","Ещё нет. Какая разница между сырами?"],
 ["ze","Esse aqui é o minas frescal: branquinho, macio, pra comer no café da manhã.","Вот это минас фрескал: беленький, мягкий, на завтрак."],
 ["ze","Esse outro é o meia-cura, mais firme. E aquele lá no fundo é o canastra curado, de seis meses.","Этот — полувыдержанный, плотнее. А вон тот, в глубине, — выдержанная канастра, шесть месяцев."],

 ["n","Pode cortar uns trezentos gramas?","Можешь отрезать граммов триста?"],
 ["ze","Posso. Deu trezentos e dez. Trinta e sete e vinte. Tudo bem?","Могу. Получилось триста десять. Тридцать семь двадцать. Хорошо?"],
 ["n","Tudo bem. E um minas frescal pequeno também.","Хорошо. И маленький минас фрескал тоже."],
 ["ca","Nina, pede o doce de leite também. O da Dona Zezé é famoso.","Нина, попроси ещё доси-ди-лейти. У Доны Зезé он знаменитый."],
 ["ze","Ah, esse é receita da minha avó. Cozinho no tacho de cobre, devagarinho, quatro horas.","Ах, это рецепт моей бабушки. Варю в медном тазу, потихоньку, четыре часа."],
 ["n","Quatro horas! Eu não tenho paciência nem pra esperar o micro-ondas.","Четыре часа! Мне терпения не хватает даже микроволновку подождать."],
 ["ze","Por isso você compra aqui! Quer de corte ou cremoso?","Вот поэтому ты и покупаешь здесь! Хочешь твёрдый или кремовый?"],
 ["n","Qual a senhora recomenda?","Какой вы посоветуете?"],
 ["ze","Pra levar de presente, o de corte. Ele viaja melhor.","Для подарка — твёрдый. Он лучше переносит дорогу."],
 ["n","Ótimo, porque eu quero levar um pra minha mãe em Moscou.","Отлично, потому что я хочу отвезти один маме в Москву."],
 ["ze","Então eu embalo a vácuo. Assim o queijo também aguenta a viagem.","Тогда я упакую в вакуум. Так и сыр выдержит дорогу."],
 ["n","Que bom! Quanto deu tudo?","Отлично! Сколько всего?"],
 ["ze","Trinta e sete e vinte do canastra, dezoito do frescal e vinte e cinco do doce. Oitenta e vinte.","Тридцать семь двадцать за канастру, восемнадцать за фрескал и двадцать пять за доси. Восемьдесят двадцать."],
 ["ze","Mas pra amiga do Caio, eu faço oitenta redondo.","Но для подруги Кайу сделаю ровно восемьдесят."],
 ["n","A senhora é um amor! Aceita cartão?","Вы прелесть! Принимаете карту?"],
 ["ze","Aceito. Débito ou crédito?","Принимаю. Дебетовая или кредитная?"],
 ["n","Débito, por favor.","Дебетовая, пожалуйста."],
 ["ze","Pode passar. E volta sempre, viu? Na próxima, eu te ensino a comer queijo com goiabada. É o nosso Romeu e Julieta.","Прикладывай. И приходи ещё, слышишь? В следующий раз научу тебя есть сыр с гуавовым мармеладом. Это наш «Ромео и Джульетта»."],

 ],

{t:"Na loja de roupas",ru:"Примерочная, размер и «ficou lindo»",e:"👗",
 lines:[

 ["n","Oi! Estou procurando um vestido para uma festa de aniversário.","Привет! Я ищу платье на день рождения."],

 ["n","De dia, num sítio. Vai ser um almoço ao ar livre.","Днём, за городом. Будет обед на свежем воздухе."],

 ["n","É bonito. Vocês têm em outra cor?","Красивое. У вас есть другого цвета?"],
 ["je","Tem em verde e em amarelo. Qual é o seu tamanho?","Есть зелёное и жёлтое. Какой у тебя размер?"],
 ["n","Não sei o tamanho daqui. Na Rússia eu uso quarenta e quatro.","Не знаю здешний размер. В России я ношу сорок четвёртый."],
 ["je","Acho que aqui é M ou P. Experimenta os dois.","Думаю, здесь это M или P. Примерь оба."],
 ["n","Onde fica o provador?","Где примерочная?"],
 ["je","Ali no fundo, à direita. Pode levar até três peças.","Там в глубине, справа. Можно взять до трёх вещей."],
 ["n","Jéssica, o M ficou largo. Você pode me trazer o P?","Жессика, M велико. Можешь принести мне P?"],
 ["je","Claro! Toma. E o verde, quer experimentar também?","Конечно! Держи. А зелёное тоже хочешь примерить?"],
 ["n","Quero. Pronto. O que você acha?","Хочу. Готово. Что скажешь?"],
 ["je","Ficou lindo em você! O verde combina com os seus olhos.","Тебе очень идёт! Зелёный подходит к твоим глазам."],
 ["n","Você fala isso pra todas as clientes?","Ты всем клиенткам так говоришь?"],
 ["je","Não! Ontem eu falei pra uma cliente que o vestido parecia uma cortina. Ela levou mesmo assim.","Нет! Вчера я сказала одной клиентке, что платье похоже на штору. Она всё равно его купила."],
 ["n","Sério? Então eu confio em você. Quanto custa?","Серьёзно? Тогда я тебе доверяю. Сколько стоит?"],
 ["je","Cento e oitenta. Mas essa semana tem vinte por cento de desconto.","Сто восемьдесят. Но на этой неделе скидка двадцать процентов."],
 ["n","Então fica cento e quarenta e quatro?","Тогда получается сто сорок четыре?"],
 ["je","Isso! Você é boa de conta.","Точно! Ты хорошо считаешь."],
 ["n","E vocês têm sandália? Eu calço trinta e sete, mas não sei o número daqui.","А у вас есть сандалии? Я ношу тридцать седьмой, но не знаю, какой это здесь."],
 ["je","No Brasil a numeração é diferente. Experimenta a trinta e cinco.","В Бразилии другая нумерация. Примерь тридцать пятый."],
 ["n","Ficou perfeita! E é confortável.","Идеально! И удобные."],
 ["je","Essa sandália é de couro e é feita aqui em Minas.","Эти сандалии кожаные и сделаны здесь, в Минас."],
 ["n","Quanto é?","Сколько?"],
 ["je","Cento e vinte. A sandália não está em promoção, desculpa.","Сто двадцать. Сандалии не по акции, извини."],
 ["n","Tudo bem. Posso parcelar no cartão?","Ничего. Можно в рассрочку по карте?"],
 ["je","Pode, em até três vezes sem juros.","Можно, до трёх платежей без процентов."],
 ["n","Então em duas vezes. E se não servir, posso trocar?","Тогда в два платежа. А если не подойдёт, можно обменять?"],
 ["je","Pode trocar em até trinta dias, com a nota fiscal e a etiqueta.","Можно обменять в течение тридцати дней, с чеком и биркой."],
 ["n","Perfeito. Obrigada pela paciência, Jéssica!","Отлично. Спасибо за терпение, Жессика!"],
 ["je","Imagina! Aproveita a festa!","Не за что! Хорошо тебе повеселиться!"]

{t:"No supermercado",ru:"Список покупок, очередь и «CPF na nota?»",e:"🛒",
 lines:[
 ["ca","Nina, você fez a lista?","Нина, ты составила список?"],
 ["n","Fiz. Arroz, feijão, ovos, café, leite, pão de forma e detergente.","Составила. Рис, фасоль, яйца, кофе, молоко, хлеб для тостов и средство для посуды."],
 ["ca","Vai pegar um carrinho ou uma cestinha?","Возьмёшь тележку или корзинку?"],
 ["n","Uma cestinha. A lista é pequena.","Корзинку. Список маленький."],
 ["ca","Você fala isso agora. Todo mundo entra com lista pequena e sai com carrinho cheio.","Это ты сейчас так говоришь. Все заходят с маленьким списком и выходят с полной тележкой."],
 ["n","Eu não! Eu sou disciplinada. Onde fica o arroz?","Только не я! Я дисциплинированная. Где рис?"],
 ["ca","No corredor cinco, junto com o feijão.","В пятом ряду, вместе с фасолью."],
 ["n","Tem tantos tipos de feijão! Qual eu compro?","Столько видов фасоли! Какую мне купить?"],
 ["ca","Aqui em Minas a gente come mais feijão carioca. O preto é mais do Rio.","Здесь, в Минас, едят в основном фасоль «кариока». Чёрная — больше в Рио."],
 ["n","Então carioca. Olha, esse café está em promoção: leve três, pague dois!","Тогда кариока. Смотри, этот кофе по акции: возьми три, заплати за два!"],
 ["ca","Mas você precisa de três pacotes de café?","Но тебе нужно три пачки кофе?"],
 ["n","Preciso. Agora eu preciso. É promoção!","Нужно. Теперь нужно. Это же акция!"],
 ["ca","Disciplinada, né?","Дисциплинированная, да?"],
 ["n","Tá bom, tá bom. Onde ficam os ovos?","Ладно, ладно. Где яйца?"],
 ["ca","Lá no fundo, perto do açougue e da padaria.","Там в глубине, рядом с мясным отделом и пекарней."],
 ["n","Ai, que cheiro de pão quentinho! Vou levar uns pães de queijo também.","Ой, как пахнет тёплым хлебом! Возьму ещё сырных булочек."],
 ["ca","E essa barra de chocolate? E esse biscoito? Isso estava na lista?","А эта плитка шоколада? А это печенье? Это было в списке?"],
 ["n","Não estava. Mas acho que eu vou precisar de um carrinho.","Не было. Но, кажется, мне понадобится тележка."],
 ["ca","Eu te falei! Vem, a fila do caixa rápido está menor.","Я же говорил! Пойдём, очередь в экспресс-кассу короче."],
 ["n","O caixa rápido é até quantos itens?","Экспресс-касса — до скольких товаров?"],
 ["ca","Até quinze. Você tem... dezenove. Fila normal!","До пятнадцати. У тебя… девятнадцать. В обычную очередь!"],
 ["cx","Boa tarde! CPF na nota?","Добрый день! CPF в чек?"],
 ["n","Eu não tenho CPF. Pode ser sem.","У меня нет CPF. Можно без."],
 ["cx","Sem problema. Precisa de sacola? Cada uma é vinte centavos.","Без проблем. Нужен пакет? Каждый — двадцать сентаво."],
 ["n","Não precisa, eu trouxe a minha sacola.","Не нужно, я принесла свою сумку."],
 ["cx","Que ótimo! Débito, crédito ou dinheiro?","Отлично! Дебетовая, кредитная или наличные?"],
 ["n","Dinheiro. Deu quanto?","Наличными. Сколько вышло?"],
 ["cx","Cento e doze e cinquenta.","Сто двенадцать пятьдесят."],
 ["n","Aqui, cento e vinte.","Вот, сто двадцать."],
 ["cx","Seu troco: sete e cinquenta. Obrigada e volte sempre!","Ваша сдача: семь пятьдесят. Спасибо, приходите ещё!"],
 ["ca","Cento e doze reais por uma lista pequena...","Сто двенадцать реалов за маленький список…"],
 ["n","Caio, a lista era pequena. Só a minha fome era grande.","Кайу, список был маленький. Это мой голод был большой."],
 ["ca","Regra número um: nunca vá ao supermercado com fome.","Правило номер один: никогда не ходи в супермаркет голодной."]
 ],

{t:"A tira soltou!",ru:"Брак: обмен или деньги назад",e:"👡",
 lines:[
 ["n","Oi, Jéssica! Lembra de mim? Comprei esse vestido e essa sandália semana passada.","Привет, Жессика! Помнишь меня? Я купила это платье и эти сандалии на прошлой неделе."],
 ["je","Lembro, claro! E a festa?","Помню, конечно! Как праздник?"],
 ["n","A festa foi ótima. Mas a sandália, não. Olha: a tira soltou no segundo dia.","Праздник был отличный. А вот сандалии — нет. Смотри: ремешок оторвался на второй день."],
 ["je","Nossa, que chato! Você estava dançando?","Ой, как неприятно! Ты танцевала?"],
 ["n","Eu estava andando na grama, só isso. Não fiz nada de errado.","Я просто ходила по траве, и всё. Ничего плохого не делала."],
 ["je","Entendo. Pra defeito, eu preciso chamar o gerente. Um minutinho.","Понимаю. При браке мне нужно позвать управляющего. Минутку."],
 ["os","Boa tarde! Eu sou o Osvaldo, o gerente. Qual é o problema?","Добрый день! Я Освалду, управляющий. В чём проблема?"],
 ["n","A tira da sandália soltou. Eu gostaria de trocar.","Ремешок сандалии оторвался. Я хотела бы обменять."],
 ["os","Deixa eu ver. É, a cola não segurou. Isso é defeito de fábrica. Você tem a nota fiscal?","Дайте посмотреть. Да, клей не выдержал. Это заводской брак. У вас есть чек?"],
 ["n","Tenho, está aqui. E o comprovante do cartão também.","Есть, вот он. И квитанция по карте тоже."],
 ["os","Perfeito. Você prefere trocar por outra igual ou receber o dinheiro de volta?","Отлично. Вы предпочитаете обменять на такие же или получить деньги обратно?"],
 ["n","Tem outra igual no meu número?","Есть такие же моего размера?"],
 ["os","Jéssica, vê no estoque se tem a trinta e cinco marrom.","Жессика, посмотри на складе, есть ли тридцать пятый коричневый."],
 ["je","Na marrom só tem trinta e sete. Mas tem trinta e cinco na preta.","Коричневых только тридцать седьмой. Но тридцать пятый есть в чёрном."],
 ["n","Preta... Hum. Não sei. O vestido é verde.","Чёрные… Хм. Не знаю. Платье зелёное."],
 ["os","Preto combina com tudo, mas a decisão é sua.","Чёрный подходит ко всему, но решать вам."],
 ["n","E se eu escolher outro modelo?","А если я выберу другую модель?"],
 ["os","Pode. Se for mais caro, você paga a diferença. Se for mais barato, a gente te dá um vale.","Можно. Если дороже — доплачиваете разницу. Если дешевле — мы дадим вам купон."],
 ["n","Um vale? Eu não posso receber o dinheiro?","Купон? Я не могу получить деньги?"],
 ["os","Pode também. Mas no cartão, o estorno pode levar até duas faturas.","Тоже можно. Но по карте возврат может занять до двух выписок."],
 ["n","Duas faturas! É muito tempo.","Две выписки! Это долго."],
 ["os","É o prazo do banco, infelizmente. A loja devolve no mesmo dia.","Это срок банка, к сожалению. Магазин возвращает в тот же день."],
 ["n","Então eu vou dar uma olhada nos outros modelos.","Тогда я посмотрю другие модели."],
 ["je","Olha essa rasteirinha bege. Ela é costurada, não colada. Não solta nunca.","Посмотри на эти бежевые сандалии без каблука. Они прошиты, а не на клею. Никогда не оторвутся."],
 ["n","Nunca? Você promete?","Никогда? Обещаешь?"],
 ["je","Prometo! A minha avó usa uma igual há dez anos.","Обещаю! Моя бабушка носит такие же уже десять лет."],
 ["n","Que avó elegante! Quanto custa essa?","Какая элегантная бабушка! Сколько стоят эти?"],
 ["os","Noventa e cinco. Então sobram vinte e cinco de crédito pra você.","Девяносто пять. Значит, у вас остаётся двадцать пять на купоне."],
 ["n","Posso usar o vale outro dia?","Могу использовать купон в другой день?"],
 ["os","Pode, ele vale por seis meses. E desculpa pelo transtorno.","Можете, он действует шесть месяцев. И простите за неудобство."],
 ["n","Tudo bem. O senhor resolveu rápido. Obrigada!","Ничего. Вы быстро всё решили. Спасибо!"],
 ["je","E se quiser, com o vale dá pra comprar uma bolsinha que combina com o vestido verde!","А если хочешь, на купон можно купить сумочку под зелёное платье!"],
 ["n","Jéssica, você é uma ótima vendedora. Perigosa, mas ótima!","Жессика, ты отличная продавщица. Опасная, но отличная!"]
 ],

{t:"Na Feira Hippie",ru:"Подарки ручной работы и торг",e:"🎨",
 lines:[
 ["ca","Domingo em BH é dia de Feira Hippie. São milhares de barracas!","Воскресенье в Белу-Оризонти — день Фейры Хиппи. Там тысячи палаток!"],
 ["n","Milhares? A gente vai ficar aqui o dia inteiro.","Тысячи? Мы тут на весь день."],
 ["ca","Por isso a gente veio cedo. O que você quer comprar?","Поэтому мы и пришли рано. Что ты хочешь купить?"],
 ["n","Presentes pra minha família. Algo típico de Minas.","Подарки для семьи. Что-нибудь типично минейрское."],
 ["ca","Então pedra-sabão. Olha aquela barraca ali, das panelinhas.","Тогда изделия из мыльного камня. Смотри вон на ту палатку с кастрюльками."],
 ["ma","Bom dia! Pode olhar à vontade. É tudo feito à mão em Ouro Preto.","Доброе утро! Смотрите сколько хотите. Всё сделано вручную в Ору-Прету."],
 ["n","Que lindo! Pra que serve essa panelinha?","Как красиво! Для чего эта кастрюлька?"],
 ["ma","Pra cozinhar e servir. A pedra-sabão segura o calor por muito tempo. O feijão fica quentinho na mesa.","Чтобы готовить и подавать. Мыльный камень долго держит тепло. Фасоль остаётся горяченькой на столе."],
 ["n","E pesa muito? Eu vou levar no avião.","А она много весит? Я повезу её в самолёте."],
 ["ma","Essa pequena pesa uns oitocentos gramas. A grande, quase três quilos.","Эта маленькая весит граммов восемьсот. Большая — почти три килограмма."],
 ["n","Então a pequena! Quanto custa?","Тогда маленькую! Сколько стоит?"],
 ["ma","A pequena é setenta.","Маленькая — семьдесят."],
 ["ca","Nina, aqui dá pra pechinchar. Pede um desconto.","Нина, тут можно торговаться. Попроси скидку."],
 ["n","Marli, se eu levar duas, você faz por quanto?","Марли, если я возьму две, за сколько отдашь?"],
 ["ma","Duas por cento e trinta.","Две за сто тридцать."],
 ["n","E por cento e dez?","А за сто десять?"],
 ["ma","Ah, aí não dá. O meu marido passa dois dias fazendo cada uma. Cento e vinte e cinco.","Ах, так не получится. Мой муж делает каждую по два дня. Сто двадцать пять."],
 ["n","E se eu pagar à vista, no Pix?","А если я заплачу сразу, через Pix?"],
 ["ma","No Pix... Cento e vinte, e não se fala mais nisso!","Через Pix… Сто двадцать, и больше ни слова!"],
 ["n","Fechado!","Договорились!"],
 ["ma","E pra quem são os presentes?","А для кого подарки?"],
 ["n","Uma pra minha mãe e outra pra minha avó. A minha avó cozinha muito bem.","Одна для мамы, другая для бабушки. Бабушка очень хорошо готовит."],
 ["ma","Então fala pra ela: antes de usar, tem que curar a panela.","Тогда скажи ей: перед использованием кастрюлю нужно «вылечить»."],
 ["n","Curar? A panela está doente?","«Вылечить»? Кастрюля что, болеет?"],
 ["ma","Não! Curar é passar óleo e levar ao forno. Assim ela não racha.","Нет! «Вылечить» — значит смазать маслом и поставить в духовку. Так она не треснет."],
 ["n","Você pode escrever pra mim? Senão eu esqueço.","Можешь мне написать? Иначе я забуду."],
 ["ma","Escrevo, sim. Vou colocar o papel dentro da panelinha.","Напишу, конечно. Положу листок внутрь кастрюльки."],
 ["ma","E vou embrulhar com jornal e plástico-bolha, pra não quebrar na mala.","И заверну в газету и пупырчатую плёнку, чтобы не разбилась в чемодане."],
 ["n","Muito obrigada! Que atendimento!","Большое спасибо! Какое обслуживание!"],
 ["ca","Viu? Você pechinchou como uma mineira.","Видела? Ты торговалась, как настоящая минейра."],
 ["n","Eu aprendo rápido. Primeiro o sorriso, depois o preço!","Я быстро учусь. Сначала улыбка, потом цена!"],
 ["ca","E agora? Mais uma volta?","А теперь? Ещё кружок?"],
 ["n","Agora um pastel e um caldo de cana. Pechinchar dá fome!","А теперь пастель и сок сахарного тростника. От торга разыгрывается аппетит!"]
 ],

 if(g==='m'&&m.length)return{v:m[0],p:1};if(g==='f'&&f.length)return{v:f[0],p:1};
 return{v:voices[0]||null,p:g==='m'?0.8:1.15}}
function clean(t){return t.replace(/[^\p{L}\p{N}\s.,!?;:'\-]/gu,' ').replace(/\s+/g,' ').trim()}
let tok=0,safety=null;
function stopSpeech(){tok++;clearTimeout(safety);try{S&&S.cancel()}catch(e){}}
function say(text,g,cb){const my=++tok;clearTimeout(safety);
 const fin=()=>{if(my!==tok)return;clearTimeout(safety);cb&&cb()};
 const txt=clean(text);
 if(!opt.sound||!S||!txt){safety=setTimeout(fin,Math.max(1400,txt.split(' ').length*430));return}
 try{S.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=META.tts;const pv=pickVoice(g);if(pv.v)u.voice=pv.v;u.pitch=pv.p;u.rate=0.88;
  u.onend=fin;u.onerror=fin;S.speak(u)}catch(e){}
 safety=setTimeout(fin,txt.length*110+4000)}

/* exp: build the growing phrase */
function taskExp(box,idx,chain){const st=chain[X.stage],prev=X.stage>0?chain[X.stage-1]:null;
 const tgt=st[0].split(' ').filter(Boolean);const tl=tgt.map(w=>w.replace(/[.,!?]/g,''));
 let tiles;const pv=prev?prev[0].split(' '):null;let pos=-1;
 if(pv){for(let a=0;a+pv.length<=tl.length;a++){if(pv.every((w,j)=>tl[a+j]===w)){pos=a;break}}}
 if(pos>=0)tiles=[...tl.slice(0,pos),pv.join(' '),...tl.slice(pos+pv.length)];else tiles=tl.slice();
 const chunkTxt=pos>=0?pv.join(' '):null;
 tiles.push(st[2]);
 let order=shuf(tiles.map((t,n)=>n));let tries=0;while(tries++<8&&order.slice(0,tiles.length-1).every((v,n)=>v===n))order=shuf(order);
 box.innerHTML=`<div class="steps">${chain.map((_,n)=>`<span class="dot${n<=X.stage?' on':''}"></span>`).join('')}<span>Шаг ${X.stage+1} из ${chain.length} · задание ${X.pos+1} из ${X.list.length}</span></div>
 ${prev?`<div class="model"><div class="q">Было:</div><div class="row"><div class="pt">${wordsHTML(prev[0])}</div><button class="sb" id="pvS" aria-label="Послушать">🔊</button><button class="sb" id="pvG" aria-label="Перевод фразы">🌐</button></div><div class="tr" hidden>${esc(prev[1])}</div></div>`:''}
 <div class="q">Собери по-португальски:<br><b>«${esc(st[1])}»</b></div>
 <div class="ansbox" id="ab" aria-live="polite"></div>
 <div class="tiles" id="tl">${order.map(n=>`<button class="tile${tiles[n]===chunkTxt?' chunk':''}" data-n="${n}">${esc(tiles[n])}</button>`).join('')}</div>
 <div class="fb"></div>`;
 const ab=box.querySelector('#ab'),tlb=box.querySelector('#tl');let placed=[];
 const need=tl.length;
 const count=()=>placed.reduce((s,n)=>s+tiles[n].split(' ').length,0);
 const speakPrev=()=>{if(prev)say(prev[0],DV,()=>{})};
 bindExBar(speakPrev);
 if(prev){box.querySelector('#pvS').onclick=speakPrev;box.querySelector('#pvG').onclick=()=>{const t=box.querySelector('.model .tr');t.hidden=!t.hidden}}
 const nextStage=()=>{if(X.stage<chain.length-1){X.stage++;renderTask()}else{X.stage=0;X.pos++;renderTask()}};
 const check=()=>{const a=placed.map(n=>tiles[n]).join(' ');const okList=[st[0],...(st[3]||[])].map(norm);const ok=okList.includes(norm(a));
  tlb.querySelectorAll('.tile').forEach(b=>b.disabled=true);ab.querySelectorAll('.tile').forEach(b=>b.disabled=true);
  if(X.stage===chain.length-1||!ok)record(idx,ok&&!(idx in X.first&&!X.first[idx]),`${chain[chain.length-1][1]}`,ok?st[0]:a,st[0]);
  if(ok){ab.classList.add('ok');okBox(box,'Верно: '+esc(cap(st[0])),()=>say(st[0],DV,()=>setTimeout(nextStage,700)))}
  else{ab.classList.add('bad');const extra=placed.map(n=>tiles[n]).includes(st[2])?`<br>Лишнее слово: <b>${esc(st[2])}</b>`:'';
   wrongBox(box,`Правильно: <b>${esc(cap(st[0]))}</b>${extra}`,()=>renderTask(),nextStage,()=>say(st[0],DV,()=>{}))}};
 const draw=()=>{ab.innerHTML=placed.map(n=>`<button class="tile${tiles[n]===chunkTxt?' chunk':''}" data-n="${n}">${esc(tiles[n])}</button>`).join('');
  tlb.querySelectorAll('.tile').forEach(b=>b.hidden=placed.includes(+b.dataset.n));if(count()>=need)check()};
 tlb.onclick=e=>{const b=e.target.closest('.tile');if(!b||b.disabled)return;placed.push(+b.dataset.n);say(tiles[+b.dataset.n],DV,()=>{});draw()};

  return `<button class="nb ex${here?' here':''}${dn?' dn':''}" data-i="${i}" data-k="${k}" aria-label="${lbl} ${i+1}">${ic}</button>`};
 ov.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><button class="x" aria-label="Закрыть">✕</button><h3>🧭 Куда перейти?</h3>
 <div class="navtop"><button class="big sec" data-go="home">🏠 Меню</button><button class="big sec" data-go="all">📚 Все слова</button><button class="big sec" data-go="my">📋 Ответы</button></div>${(typeof GRAM!=='undefined'&&GRAM.length)||(typeof PAIRS!=='undefined'&&PAIRS.length)?`<div class="navtop">${typeof GRAM!=='undefined'&&GRAM.length?'<button class="big sec" data-go="gram">📐 Грамматика</button>':''}${typeof PAIRS!=='undefined'&&PAIRS.length?'<button class="big sec" data-go="pairs">👂 Похожие слова</button>':''}</div>`:''}
 <div class="nav"><span class="hd l">Диалог</span><span class="hd">➕</span><span class="hd">🔄</span><span class="hd">🎯</span><span class="hd">📚</span>
 ${DLG.map((d,i)=>`<button class="nb dl${CUR.i===i&&CUR.k==='dlg'?' here':''}${done.includes(i)?' dn':''}" data-i="${i}" data-k="dlg"><span>${d.e}</span><span class="nt">${i+1}. ${esc(d.t)}</span></button>${cell(i,'exp','➕','Расширяем фразу')}${cell(i,'sub','🔄','Замени слово')}${cell(i,'ant','🎯','Скажи раньше')}${cell(i,'voc','📚','Слова')}`).join('')}
 </div>
 <div class="legend">➕ Расширяем фразу · 🔄 Замени слово · 🎯 Скажи раньше, чем услышишь · 📚 Слова и конструкции · ✓ пройдено</div></div>`;
 document.body.appendChild(ov);
 const c=()=>ov.remove();ov.querySelector('.x').onclick=c;ov.onclick=e=>{if(e.target===ov)c()};
 ov.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{c();const g=b.dataset.go;if(g==='home')home();else if(g==='all')vocab(-1,home);else if(g==='gram')gramPage(home);else if(g==='pairs')pairsPage(home);else myAnswers(home)});
 ov.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{c();const i=+b.dataset.i,k=b.dataset.k;
  if(k==='dlg')openDlg(i);else if(k==='voc')vocab(i,()=>openDlg(i));else runEx(i,k)});}
document.addEventListener('click',e=>{if(e.target.closest('.navB')){e.preventDefault();navPop()}});

function normCode(v){let t=String(v||'').toLowerCase().replace(/[\s.\-_]/g,'');
 t=t.replace(/^(дарья|дария|дариа|даря|дарjа|дарjа)/,'daria').replace(/^(darja|darya|darija|dariya|daria)/,'daria');
 t=t.replace(/[бвbв]2$/,'b2').replace(/[вb]$/,'b');return t}
const TEACHER='dariab2';
const CODES=[TEACHER].concat((META.codes||[]).map(normCode));
function gateOk(){return CODES.includes(normCode(lsGet('code','')))}
function showGate(){const g=document.createElement('div');g.className='gate';
 g.innerHTML=`<form class="gb" id="gf" autocomplete="off"><div class="gi">🔒</div><h2>${META.h1}</h2><p>Введи, пожалуйста, свой код, чтобы открыть урок.</p>
 <input id="gc" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Код" placeholder="Код">
 <p class="err" id="ge" aria-live="polite"></p><button class="big" type="submit">Открыть урок</button><div class="own">© Daria Botina</div></form>`;
 document.body.appendChild(g);
 g.querySelector('#gf').addEventListener('submit',e=>{e.preventDefault();const v=g.querySelector('#gc').value.trim();
  if(CODES.includes(normCode(v))){lsSet('code',v);g.remove();home();startVisit()}
  else{g.querySelector('#ge').textContent=v?'Код не подходит. Проверь, пожалуйста, и попробуй ещё раз.':'Введи, пожалуйста, код.'}})}
function setWho(){const c=normCode(lsGet('code',''));EV_WHO=(!c||c===TEACHER)?'Дарья (тест)':(META.who||'Ученик')}
function startVisit(){setWho();setTimeout(()=>sendEvent('visit',document.title),800)}
if(META.gate&&!gateOk())showGate();else{home();startVisit()}
})();
</script>
