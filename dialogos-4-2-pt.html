<style>

/* HOME */

{t:"Na queijaria",ru:"Сыр Серра, ложка и вакуум",e:"🧀",
 lines:[
 ["go","Nina, se queres queijo a sério, é aqui. A D. Fátima tem o melhor queijo da Serra de Coimbra.","Нина, если хочешь настоящий сыр — тебе сюда. У Доны Фатимы лучший сыр Серра в Коимбре."],
 ["n","Queijo da Serra? É de uma montanha?","Сыр Серра? Он с горы?"],
 ["go","Da Serra da Estrela, a montanha mais alta de Portugal continental.","С Серра-да-Эштрела, самых высоких гор континентальной Португалии."],
 ["fa","Bom dia! Olha o Gonçalo! E traz uma amiga.","Доброе утро! Смотри-ка, Гонсалу! И с подругой."],
 ["go","Bom dia, D. Fátima. Esta é a Nina. É russa e está a viver em Coimbra.","Доброе утро, Дона Фатима. Это Нина. Она русская и живёт в Коимбре."],
 ["fa","Muito prazer, Nina! Já conhece o nosso queijo?","Очень приятно, Нина! Уже знаете наш сыр?"],

 ["n","Que delícia! Parece manteiga.","Какая вкуснятина! Похоже на сливочное масло."],

 ["n","E este pequenino?","А этот маленький?"],
 ["fa","É queijo fresco de cabra. Muito leve, bom com mel.","Это свежий козий сыр. Очень лёгкий, хорош с мёдом."],
 ["n","Quanto custa o amanteigado?","Сколько стоит «масляный»?"],
 ["fa","Este de um quilo está a vinte e oito euros.","Этот, на кило, стоит двадцать восемь евро."],
 ["n","É um bocado caro. Tem mais pequeno?","Дороговато. Есть поменьше?"],
 ["fa","Tenho este de meio quilo, a quinze euros.","Есть вот этот на полкило, за пятнадцать евро."],
 ["n","Fico com esse. E queria levar um para a minha mãe, em Moscovo.","Беру этот. И хотела бы отвезти один маме в Москву."],
 ["fa","Para viajar, é melhor o curado. O amanteigado não gosta de aviões.","Для поездки лучше выдержанный. «Масляный» не любит самолёты."],
 ["n","Coitado! Tem medo de voar?","Бедняжка! Боится летать?"],
 ["fa","Tem medo de ficar mole! Mas o curado eu embalo em vácuo e aguenta bem.","Боится растечься! А выдержанный я упакую в вакуум, и он хорошо перенесёт дорогу."],
 ["n","Perfeito. Então um curado pequeno.","Отлично. Тогда маленький выдержанный."],
 ["go","E o requeijão, Nina! Com doce de abóbora. É o pequeno-almoço perfeito.","И рекейжан, Нина! С тыквенным вареньем. Идеальный завтрак."],
 ["n","Requeijão? É como o nosso tvorog?","Рекейжан? Это как наш творог?"],
 ["fa","Parecido. É feito com o soro do queijo. Prove este.","Похоже. Его делают из сыворотки, которая остаётся от сыра. Попробуйте этот."],
 ["n","Hum! Levo também um requeijão e um frasco de doce de abóbora.","М-м! Возьму ещё рекейжан и баночку тыквенного варенья."],
 ["fa","Então: amanteigado, quinze. Curado, doze. Requeijão, três e meio. Doce, quatro. Trinta e quatro e cinquenta.","Итак: «масляный» — пятнадцать. Выдержанный — двенадцать. Рекейжан — три с половиной. Варенье — четыре. Тридцать четыре пятьдесят."],
 ["n","Aceita cartão?","Принимаете карту?"],
 ["fa","Aceito. Quer fatura com contribuinte?","Принимаю. Нужен счёт с налоговым номером?"],
 ["n","Não, obrigada. Não tenho NIF.","Нет, спасибо. У меня нет NIF."],
 ["fa","Então é só aproximar o cartão. Já está.","Тогда просто приложите карту. Готово."],
 ["n","Obrigada, D. Fátima! A minha mãe vai adorar.","Спасибо, Дона Фатима! Маме очень понравится."],
 ["fa","Diga-lhe que o queijo vai com um beijinho de Coimbra!","Скажите ей, что сыр едет с поцелуйчиком из Коимбры!"]

{t:"Na loja de roupa",ru:"Пальто для дома и «Fica-lhe bem!»",e:"🧥",
 lines:[
 ["le","Boa tarde! Posso ajudar?","Добрый день! Чем могу помочь?"],
 ["n","Boa tarde! Estou à procura de um casaco quente.","Добрый день! Я ищу тёплое пальто."],
 ["le","Para a chuva ou para o frio?","От дождя или от холода?"],

 ["n","Exatamente. Tem este em azul-escuro?","Именно. Есть такое тёмно-синее?"],
 ["le","Tenho. Que tamanho veste?","Есть. Какой размер вы носите?"],
 ["n","Na Rússia, o quarenta e quatro. Aqui não sei.","В России — сорок четвёртый. Здесь не знаю."],
 ["le","Aqui deve ser o trinta e oito, ou o M. Quer experimentar?","Здесь, наверное, 38-й, или M. Хотите примерить?"],
 ["n","Quero. Onde são os provadores?","Хочу. Где примерочные?"],
 ["le","Ao fundo, à esquerda.","В глубине, слева."],
 ["n","Já está. Acho que está um bocadinho apertado nos ombros.","Вот. Кажется, немного тесно в плечах."],
 ["le","Vou buscar o quarenta. Um momento.","Принесу сороковой. Минутку."],
 ["le","Aqui tem. Experimente este.","Вот, пожалуйста. Примерьте этот."],
 ["n","Este está melhor. Como é que me fica?","Этот лучше. Как он на мне?"],
 ["le","Fica-lhe muito bem! E as mangas estão no comprimento certo.","Вам очень идёт! И рукава как раз нужной длины."],
 ["n","É de lã?","Он шерстяной?"],
 ["le","Setenta por cento lã, trinta por cento poliéster. Aquece muito.","Семьдесят процентов шерсть, тридцать — полиэстер. Очень тёплый."],
 ["n","E quanto custa?","А сколько стоит?"],
 ["le","Está nos saldos: era cento e vinte, agora está a oitenta e quatro.","Он на распродаже: был сто двадцать, сейчас восемьдесят четыре."],
 ["n","Trinta por cento de desconto! Que sorte.","Скидка тридцать процентов! Повезло."],
 ["le","E temos estas botas também em saldo. Que número calça?","И эти сапоги тоже на распродаже. Какой у вас размер обуви?"],
 ["n","O trinta e sete.","Тридцать седьмой."],
 ["le","Em Portugal usamos a numeração europeia, por isso é igual. Quer experimentar?","В Португалии европейская нумерация, так что такой же. Хотите примерить?"],
 ["n","Não, obrigada. Hoje só o casaco. Senão fico sem dinheiro para o aquecedor!","Нет, спасибо. Сегодня только пальто. А то не останется денег на обогреватель!"],
 ["le","Tem razão. Paga com cartão?","Вы правы. Будете платить картой?"],
 ["n","Sim. E se não gostar, posso trocar?","Да. А если разонравится, можно обменять?"],
 ["le","Pode trocar no prazo de quinze dias, com o talão. Nos saldos não há reembolso, só troca ou vale.","Можно обменять в течение пятнадцати дней с чеком. На распродаже деньги не возвращаем, только обмен или ваучер."],
 ["n","Está bem. Podia tirar o alarme, por favor?","Хорошо. Не могли бы вы снять защитную бирку?"],
 ["le","Claro, já tiro. Quer saco? São dez cêntimos.","Конечно, сейчас сниму. Нужен пакет? Десять центов."],
 ["n","Não, levo-o vestido! Está frio.","Нет, пойду прямо в нём! Холодно."],
 ["le","Boa ideia! Fica mesmo bem. Bom resto de dia!","Хорошая мысль! Правда идёт. Хорошего дня!"]

{t:"No supermercado",ru:"Монетка для тележки и треска на всю жизнь",e:"🛒",
 lines:[
 ["go","Precisas de uma moeda de um euro para o carrinho.","Тебе нужна монета в один евро для тележки."],
 ["n","Para o carrinho? Paga-se o carrinho?","Для тележки? За тележку платят?"],
 ["go","Não, a moeda volta quando o devolves. Assim ninguém deixa os carrinhos no parque.","Нет, монета возвращается, когда ставишь тележку на место. Так никто не бросает тележки на парковке."],
 ["n","Que inteligente! Tens uma moeda? Eu só tenho notas.","Как умно! У тебя есть монета? У меня только купюры."],
 ["go","Toma. Depois pagas-me um café.","Держи. Потом угостишь меня кофе."],
 ["n","Combinado. Primeiro, a lista: arroz, massa, ovos, leite, pão e bacalhau.","Договорились. Сначала список: рис, макароны, яйца, молоко, хлеб и треска."],
 ["go","Onde é a massa? No corredor três. E o arroz está ao lado.","Где макароны? В третьем ряду. И рис рядом."],
 ["n","Tantos tipos de arroz! Carolino, agulha... Qual é a diferença?","Столько видов риса! Каролину, агулья… Какая разница?"],
 ["go","O carolino é para arroz de tomate ou arroz-doce. O agulha fica soltinho.","Каролину — для риса с томатами или рисового пудинга. Агулья получается рассыпчатым."],
 ["n","Então agulha. Agora o bacalhau. Onde fica?","Тогда агулья. Теперь треска. Где она?"],
 ["go","Ali, aquela secção enorme. Em Portugal, o bacalhau tem um corredor só para ele.","Вон там, тот огромный отдел. В Португалии у трески целый ряд для неё одной."],
 ["n","Mas está seco! E cheio de sal!","Но она сушёная! И вся в соли!"],
 ["go","Pois é. Tens de o pôr de molho dois dias e mudar a água.","Вот именно. Нужно замачивать её два дня и менять воду."],
 ["n","Dois dias? Eu queria jantar hoje!","Два дня? Я хотела поужинать сегодня!"],
 ["go","Então leva o bacalhau já demolhado, da arca congeladora. É mais fácil.","Тогда возьми уже вымоченную, из морозильника. Так проще."],
 ["n","Ainda bem! E os ovos?","Слава богу! А яйца?"],
 ["go","Ao pé do leite, ao fundo. Olha, a peixaria. Queres peixe fresco? Tira uma senha.","Рядом с молоком, в глубине. Смотри, рыбный отдел. Хочешь свежую рыбу? Возьми талончик."],
 ["n","Hoje não. Já tenho bacalhau para o resto da vida.","Сегодня нет. У меня теперь треска на всю жизнь."],
 ["go","Pão vais buscar à padaria, ali à saída. Está sempre quentinho.","За хлебом зайдёшь в пекарню, там у выхода. Он всегда тёплый."],
 ["n","Ótimo. Já está tudo, vamos para a caixa.","Отлично. Всё есть, пойдём на кассу."],
 ["op","Boa tarde. Tem cartão de cliente?","Добрый день. Есть карта покупателя?"],
 ["n","Não tenho.","Нет."],
 ["op","Quer fazer? É grátis e tem descontos.","Хотите оформить? Бесплатно, и есть скидки."],
 ["n","Hoje não, obrigada. Talvez para a próxima.","Сегодня нет, спасибо. Может, в следующий раз."],
 ["op","Contribuinte na fatura?","Налоговый номер в счёт?"],
 ["n","Não, obrigada.","Нет, спасибо."],
 ["op","Precisa de saco?","Нужен пакет?"],
 ["n","Não, trouxe o meu.","Нет, я принесла свой."],
 ["op","São vinte e três euros e quarenta.","Двадцать три евро сорок."],
 ["n","Pago com cartão. Pronto.","Плачу картой. Готово."],
 ["op","Obrigada. Quer o talão?","Спасибо. Чек нужен?"],
 ["n","Quero, sim. Obrigada, boa tarde!","Да, нужен. Спасибо, всего доброго!"],
 ["go","E a minha moeda?","А моя монета?"],
 ["n","A tua moeda está no carrinho! E o café é por minha conta.","Твоя монета в тележке! А кофе — за мой счёт."]
 ],

{t:"O fecho estragou-se",ru:"Брак на распродаже: ремонт, обмен или деньги",e:"🧾",
 lines:[
 ["n","Boa tarde, Leonor. Lembra-se de mim?","Добрый день, Леонор. Помните меня?"],
 ["le","Claro! A menina do casaco azul. Então, está quentinha?","Конечно! Девушка в синем пальто. Ну что, тепло вам?"],
 ["n","Estava. Mas olhe: o fecho estragou-se ao terceiro dia.","Было. Но посмотрите: молния сломалась на третий день."],
 ["le","Ai, que chatice! Deixe-me ver. Pois, saiu um dente do fecho.","Ой, какая досада! Дайте посмотреть. Да, выпал зубчик молнии."],
 ["n","E agora? Comprei nos saldos. Disse-me que nos saldos não há reembolso.","И что теперь? Я купила на распродаже. Вы сказали, что на распродаже деньги не возвращают."],
 ["le","Isso é quando a cliente muda de ideias. Com defeito, é diferente. Vou chamar o gerente.","Это когда клиентка передумала. При браке — другое дело. Позову управляющего."],
 ["cu","Boa tarde, sou o Custódio. Qual é o problema?","Добрый день, я Кустодиу. В чём проблема?"],
 ["n","O fecho deste casaco estragou-se. Comprei-o há uma semana.","Молния на этом пальто сломалась. Я купила его неделю назад."],
 ["cu","Tem o talão?","У вас есть чек?"],
 ["n","Tenho. Está aqui.","Есть. Вот."],
 ["cu","Muito bem. Os artigos com defeito têm garantia, mesmo nos saldos.","Хорошо. На товары с браком есть гарантия, даже на распродаже."],
 ["n","Ainda bem! Gostava de saber o que pode fazer.","Как хорошо! Хотела бы узнать, что вы можете сделать."],
 ["cu","Tem três opções: arranjamos o fecho, trocamos por um casaco igual ou devolvemos o dinheiro.","У вас три варианта: починим молнию, обменяем на такое же пальто или вернём деньги."],
 ["n","Quanto tempo demora o arranjo?","Сколько времени займёт ремонт?"],
 ["cu","Cerca de duas semanas. Vai para a costureira.","Около двух недель. Отправим швее."],
 ["n","Duas semanas sem casaco? Não, obrigada. Tem outro igual?","Две недели без пальто? Нет, спасибо. Есть такое же?"],
 ["le","Em azul-escuro, no quarenta, já não há. Só em cinzento.","Тёмно-синего сорокового уже нет. Только серое."],
 ["n","Cinzento... Posso experimentar?","Серое… Можно примерить?"],
 ["le","Claro. Os provadores são ali, como da outra vez.","Конечно. Примерочные там же, где и в прошлый раз."],
 ["n","Hum. Não sei. O cinzento faz-me parecer cansada.","Хм. Не знаю. В сером я выгляжу уставшей."],
 ["le","É verdade, o azul favorecia-a mais.","Правда, синее вам шло больше."],
 ["n","Então prefiro o reembolso. Como é que funciona?","Тогда предпочитаю вернуть деньги. Как это работает?"],
 ["cu","Pagou com cartão? Então o dinheiro volta para o mesmo cartão, em três a cinco dias úteis.","Вы платили картой? Тогда деньги вернутся на ту же карту через три–пять рабочих дней."],
 ["n","Perfeito. Preciso de assinar alguma coisa?","Отлично. Мне нужно что-то подписать?"],
 ["cu","Só este papel, com o seu nome e o motivo da devolução.","Только эту бумагу, с вашим именем и причиной возврата."],
 ["n","Motivo: fecho estragado. Já está.","Причина: сломанная молния. Готово."],
 ["cu","Muito obrigado, e peço desculpa pelo incómodo.","Большое спасибо, и простите за неудобство."],
 ["n","Não faz mal. Foram muito simpáticos. Nem precisei do Livro de Reclamações!","Ничего страшного. Вы были очень любезны. Даже Книга жалоб не понадобилась!"],
 ["cu","Ah, conhece o Livro de Reclamações? A menina já é mais portuguesa do que eu!","А, вы знаете про Книгу жалоб? Вы уже больше португалка, чем я!"],
 ["le","Nina, e agora vai continuar com frio? Temos uma camisola de lã em saldo...","Нина, а теперь вы так и будете мёрзнуть? У нас есть шерстяной свитер на распродаже…"],
 ["n","Uma camisola? Está bem, mas desta vez vou ver o fecho primeiro!","Свитер? Ладно, но на этот раз сначала проверю молнию!"],
 ["le","As camisolas não têm fecho!","У свитеров нет молнии!"],
 ["n","Então é perfeita!","Значит, он идеальный!"]
 ],

{t:"Na feira de velharias",ru:"Ласточки, азулежу и торг",e:"🏺",
 lines:[
 ["go","Ao sábado há feira de velharias na praça. Vais adorar.","По субботам на площади блошиный рынок. Тебе понравится."],
 ["n","Velharias? São coisas velhas?","«Velharias»? Это старые вещи?"],
 ["go","Coisas antigas: louça, livros, discos, azulejos. Às vezes há tesouros.","Старинные вещи: посуда, книги, пластинки, изразцы. Иногда попадаются сокровища."],
 ["n","Quero comprar presentes para a minha família. Algo bem português.","Хочу купить подарки семье. Что-нибудь очень португальское."],
 ["go","Então azulejos ou andorinhas. Olha aquela banca.","Тогда азулежу или ласточки. Смотри на тот прилавок."],
 ["am","Bom dia! Esteja à vontade.","Доброе утро! Смотрите спокойно."],
 ["n","Bom dia! Que andorinhas tão bonitas! São de cerâmica?","Доброе утро! Какие красивые ласточки! Керамические?"],
 ["am","São, de Bordallo Pinheiro. Em Portugal, põem-se andorinhas na parede para dar sorte à casa.","Да, Бордалу Пиньейру. В Португалии ласточек вешают на стену, чтобы дому везло."],
 ["n","Porquê andorinhas?","Почему ласточки?"],
 ["am","Porque a andorinha volta sempre ao mesmo ninho. É o símbolo da casa e da família.","Потому что ласточка всегда возвращается в то же гнездо. Это символ дома и семьи."],
 ["n","Que bonito! Quanto custam?","Как красиво! Сколько стоят?"],
 ["am","As pequenas são doze euros cada uma.","Маленькие — по двенадцать евро."],
 ["go","Nina, aqui pode-se regatear.","Нина, тут можно торговаться."],
 ["n","Se eu levar três, faz-me um desconto?","Если я возьму три, сделаете скидку?"],
 ["am","Três... Faço trinta e dois euros.","Три… Отдам за тридцать два."],
 ["n","E trinta?","А за тридцать?"],
 ["am","Ai, menina, a minha margem é pequenina como as andorinhas! Trinta e um.","Ой, девушка, моя наценка маленькая, как эти ласточки! Тридцать один."],
 ["n","E se eu pagar em dinheiro, já?","А если я заплачу наличными, прямо сейчас?"],
 ["am","Em dinheiro... Pronto, trinta. Mas não diga a ninguém!","Наличными… Ладно, тридцать. Но никому не говорите!"],
 ["n","Combinado! E este azulejo azul, é antigo?","Договорились! А этот синий изразец старинный?"],
 ["am","É do século dezanove, de uma casa aqui de Coimbra.","Девятнадцатого века, из одного дома здесь, в Коимбре."],
 ["n","E posso levá-lo para fora de Portugal?","А можно вывезти его из Португалии?"],
 ["am","Este pode, é uma peça simples e tem fatura. Mas nunca compre azulejos sem saber de onde vêm.","Этот можно, это простая вещь, и у неё есть счёт. Но никогда не покупайте азулежу, не зная, откуда они."],
 ["n","Porquê?","Почему?"],
 ["am","Porque há quem roube azulejos das fachadas antigas. É um crime e um pecado!","Потому что есть люди, которые воруют азулежу со старых фасадов. Это преступление и грех!"],
 ["n","Que horror! Então quanto é este, com fatura?","Какой ужас! Тогда сколько стоит этот, со счётом?"],
 ["am","Vinte e cinco euros.","Двадцать пять евро."],
 ["n","Fico com ele. Pode embrulhar bem? Vai de avião.","Беру. Можете хорошо завернуть? Полетит самолётом."],
 ["am","Embrulho em papel de jornal e em plástico de bolhas. Chega inteiro à Rússia.","Заверну в газету и пупырчатую плёнку. Доедет до России целым."],
 ["n","Muito obrigada, D. Amélia. Que manhã tão boa!","Большое спасибо, Дона Амелия. Какое хорошее утро!"],
 ["go","Regateaste como uma verdadeira portuguesa.","Ты торговалась, как настоящая португалка."],
 ["n","E comprei três andorinhas. Agora a primavera tem de chegar!","И купила трёх ласточек. Теперь весна обязана прийти!"],
 ["go","Conheces o ditado? Uma andorinha não faz a primavera.","Знаешь поговорку? Одна ласточка весны не делает."],
 ["n","Por isso comprei três!","Поэтому я купила трёх!"]
 ],

function say(text,g,cb){const my=++tok;clearTimeout(safety);
 const fin=()=>{if(my!==tok)return;clearTimeout(safety);cb&&cb()};
 const txt=clean(text);
 if(!opt.sound||!S||!txt){safety=setTimeout(fin,Math.max(1400,txt.split(' ').length*430));return}
 try{S.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=META.tts;const pv=pickVoice(g);if(pv.v)u.voice=pv.v;u.pitch=pv.p;u.rate=0.88;
  u.onend=fin;u.onerror=fin;S.speak(u)}catch(e){}
 safety=setTimeout(fin,txt.length*110+4000)}

/* ---------- PLAYER (generic over items on page) ---------- */
let P={items:[],cur:0,playing:false,onEnd:null};
function setCur(i,scroll){P.items.forEach((it,k)=>{it.el.classList.toggle('cur',k===i);const t=it.el.querySelector('.tr');if(t&&!t.dataset.man)t.hidden=!(opt.subs&&k===i)});P.cur=i;
 if(scroll&&P.items[i])P.items[i].el.scrollIntoView({block:'center',behavior:'smooth'});updBar()}
function playFrom(i){if(i>=P.items.length){P.playing=false;setCur(-1);updBar();P.onEnd&&P.onEnd();return}
 P.playing=true;setCur(i,true);const it=P.items[i];
 say(it.say,it.g,()=>{if(!P.playing)return;if(opt.auto)setTimeout(()=>{if(P.playing&&P.cur===i)playFrom(i+1)},650);else{P.playing=false;P.cur=Math.min(i+1,P.items.length-1);setCur(P.cur);updBar()}})}
function pause(){P.playing=false;stopSpeech();updBar()}
function toggle(){if(P.playing)pause();else playFrom(Math.max(0,P.cur))}
function playOne(i){P.playing=false;setCur(i,false);say(P.items[i].say,P.items[i].g,()=>{})}
function updBar(){const pb=document.getElementById('pp');if(pb)pb.textContent=P.playing?'⏸':'▶';
 const c=document.getElementById('cnt');if(c)c.textContent=(P.cur>=0?P.cur+1:0)+'/'+P.items.length;
 const a=document.getElementById('autoB');if(a){a.classList.toggle('on',opt.auto);a.setAttribute('aria-pressed',opt.auto)}
 const sb=document.getElementById('subB');if(sb){sb.classList.toggle('on',opt.subs);sb.setAttribute('aria-pressed',opt.subs)}
 const s=document.getElementById('sndB');if(s){s.textContent=opt.sound?'🔊 Звук':'🔇 Без звука';s.classList.toggle('on',opt.sound);s.setAttribute('aria-pressed',opt.sound)}}

function barHTML(title,backLabel){return `<div class="bar gut"><div class="col">
 <div class="r1"><button class="ib" id="backB">${backLabel}</button><button class="ttl navB" aria-label="Навигация: все диалоги и упражнения"><span class="tt">${title}</span><span class="car">▾</span></button><button class="ib" id="vocB" aria-label="Слова и конструкции">📚</button></div>
 <div class="r2"><button class="ib" id="prevB" aria-label="Предыдущая фраза">⏮</button><button class="ib play" id="pp" aria-label="Пауза / слушать">▶</button><button class="ib" id="nextB" aria-label="Следующая фраза">⏭</button><button class="ib" id="rptB" aria-label="Сначала">🔁</button><span class="cnt" id="cnt"></span></div>
 <div class="r3"><button class="ib" id="autoB" aria-pressed="true">▶▶ Авто</button><button class="ib" id="sndB" aria-pressed="true">🔊 Звук</button><button class="ib" id="subB" aria-pressed="false">💬 Субтитры</button></div>
</div></div>`}
function bindBar(onBack,onVoc){
 document.getElementById('backB').onclick=()=>{pause();onBack()};
 document.getElementById('vocB').onclick=()=>{pause();onVoc()};
 document.getElementById('pp').onclick=toggle;
 document.getElementById('prevB').onclick=()=>{const i=Math.max(0,P.cur-1);if(P.playing)playFrom(i);else playOne(i)};
 document.getElementById('nextB').onclick=()=>{const i=Math.min(P.items.length-1,P.cur+1);if(P.playing)playFrom(i);else playOne(i)};
 document.getElementById('rptB').onclick=()=>{playFrom(0)};
 document.getElementById('autoB').onclick=()=>{opt.auto=!opt.auto;lsSet('auto',opt.auto);updBar()};
 document.getElementById('sndB').onclick=()=>{opt.sound=!opt.sound;lsSet('sound',opt.sound);if(!opt.sound)try{S&&S.cancel()}catch(e){};if(P.playing)playFrom(P.cur);updBar()};
 document.getElementById('subB').onclick=()=>{opt.subs=!opt.subs;lsSet('subs',opt.subs);setCur(P.cur)};
 updBar()}

/* exp: build the growing phrase */
function taskExp(box,idx,chain){const st=chain[X.stage],prev=X.stage>0?chain[X.stage-1]:null;
 const tgt=st[0].split(' ').filter(Boolean);const tl=tgt.map(w=>w.replace(/[.,!?]/g,''));
 let tiles;const pv=prev?prev[0].split(' '):null;let pos=-1;
 if(pv){for(let a=0;a+pv.length<=tl.length;a++){if(pv.every((w,j)=>tl[a+j]===w)){pos=a;break}}}
 if(pos>=0)tiles=[...tl.slice(0,pos),pv.join(' '),...tl.slice(pos+pv.length)];else tiles=tl.slice();
 const chunkTxt=pos>=0?pv.join(' '):null;
 tiles.push(st[2]);
 let order=shuf(tiles.map((t,n)=>n));let tries=0;while(tries++<8&&order.slice(0,tiles.length-1).every((v,n)=>v===n))order=shuf(order);
 box.innerHTML=`<div class="steps">${chain.map((_,n)=>`<span class="dot${n<=X.stage?' on':''}"></span>`).join('')}<span>Шаг ${X.stage+1} из ${chain.length} · задание ${X.pos+1} из ${X.list.length}</span></div>
 ${prev?`<div class="model"><div class="q">Было:</div><div class="row"><div class="pt">${wordsHTML(prev[0])}</div><button class="sb" id="pvS" aria-label="Послушать">🔊</button><button class="sb" id="pvG" aria-label="Перевод фразы">🌐</button></div><div class="tr" hidden>${esc(prev[1])}</div></div>`:''}
 <div class="q">Собери по-португальски:<br><b>«${esc(st[1])}»</b></div>
 <div class="ansbox" id="ab" aria-live="polite"></div>
 <div class="tiles" id="tl">${order.map(n=>`<button class="tile${tiles[n]===chunkTxt?' chunk':''}" data-n="${n}">${esc(tiles[n])}</button>`).join('')}</div>
 <div class="fb"></div>`;
 const ab=box.querySelector('#ab'),tlb=box.querySelector('#tl');let placed=[];
 const need=tl.length;
 const count=()=>placed.reduce((s,n)=>s+tiles[n].split(' ').length,0);
 const speakPrev=()=>{if(prev)say(prev[0],DV,()=>{})};
 bindExBar(speakPrev);
 if(prev){box.querySelector('#pvS').onclick=speakPrev;box.querySelector('#pvG').onclick=()=>{const t=box.querySelector('.model .tr');t.hidden=!t.hidden}}
 const nextStage=()=>{if(X.stage<chain.length-1){X.stage++;renderTask()}else{X.stage=0;X.pos++;renderTask()}};
 const check=()=>{const a=placed.map(n=>tiles[n]).join(' ');const okList=[st[0],...(st[3]||[])].map(norm);const ok=okList.includes(norm(a));
  tlb.querySelectorAll('.tile').forEach(b=>b.disabled=true);ab.querySelectorAll('.tile').forEach(b=>b.disabled=true);
  if(X.stage===chain.length-1||!ok)record(idx,ok&&!(idx in X.first&&!X.first[idx]),`${chain[chain.length-1][1]}`,ok?st[0]:a,st[0]);
  if(ok){ab.classList.add('ok');okBox(box,'Верно: '+esc(cap(st[0])),()=>say(st[0],DV,()=>setTimeout(nextStage,700)))}
  else{ab.classList.add('bad');const extra=placed.map(n=>tiles[n]).includes(st[2])?`<br>Лишнее слово: <b>${esc(st[2])}</b>`:'';
   wrongBox(box,`Правильно: <b>${esc(cap(st[0]))}</b>${extra}`,()=>renderTask(),nextStage,()=>say(st[0],DV,()=>{}))}};
 const draw=()=>{ab.innerHTML=placed.map(n=>`<button class="tile${tiles[n]===chunkTxt?' chunk':''}" data-n="${n}">${esc(tiles[n])}</button>`).join('');
  tlb.querySelectorAll('.tile').forEach(b=>b.hidden=placed.includes(+b.dataset.n));if(count()>=need)check()};
 tlb.onclick=e=>{const b=e.target.closest('.tile');if(!b||b.disabled)return;placed.push(+b.dataset.n);say(tiles[+b.dataset.n],DV,()=>{});draw()};
 ab.onclick=e=>{const b=e.target.closest('.tile');if(!b||b.disabled)return;placed=placed.filter(n=>n!==+b.dataset.n);draw()};
 if(opt.auto&&prev)setTimeout(speakPrev,300)}

function buildOpts(okT,bads){const opts=[okT,...bads];let ord=shuf([0,1,2]);if(ord[0]===0)ord=[ord[1],ord[0],ord[2]];return ord.map(n=>({t:opts[n],ok:n===0}))}

function bindOpts(box,o,idx,q,okT,why,readFirst){const els=[...box.querySelectorAll('.opt')];
 const readAll=()=>{const l=(readFirst?[{t:readFirst.t,el:readFirst.el}]:[]).concat(els.map((el,n)=>({t:o[n].t,el})));sayList(l,0,()=>{clearRd();box.querySelector('.opts').scrollIntoView({block:'nearest',behavior:'smooth'})})};

 els.forEach((b,n)=>b.onclick=()=>{stopSpeech();clearRd();els.forEach(e=>e.disabled=true);const ok=o[n].ok;
  record(idx,ok,q,o[n].t,okT);
  if(ok){b.classList.add('ok');okBox(box,'Верно!',()=>say(okT,DV,()=>setTimeout(()=>{X.pos++;renderTask()},700)))}
  else{b.classList.add('bad');els[o.findIndex(x=>x.ok)].classList.add('ok');
   wrongBox(box,`Правильно: <b>${esc(okT)}</b><br>💡 ${esc(why)}`,()=>renderTask(),()=>{X.pos++;renderTask()},()=>say(okT,DV,()=>{}))}});
 return readAll}

 ov.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><button class="x" aria-label="Закрыть">✕</button><h3>🧭 Куда перейти?</h3>
 <div class="navtop"><button class="big sec" data-go="home">🏠 Меню</button><button class="big sec" data-go="all">📚 Все слова</button><button class="big sec" data-go="my">📋 Ответы</button></div>${(typeof GRAM!=='undefined'&&GRAM.length)||(typeof PAIRS!=='undefined'&&PAIRS.length)?`<div class="navtop">${typeof GRAM!=='undefined'&&GRAM.length?'<button class="big sec" data-go="gram">📐 Грамматика</button>':''}${typeof PAIRS!=='undefined'&&PAIRS.length?'<button class="big sec" data-go="pairs">👂 Похожие слова</button>':''}</div>`:''}
 <div class="nav"><span class="hd l">Диалог</span><span class="hd">➕</span><span class="hd">🔄</span><span class="hd">🎯</span><span class="hd">📚</span>
 ${DLG.map((d,i)=>`<button class="nb dl${CUR.i===i&&CUR.k==='dlg'?' here':''}${done.includes(i)?' dn':''}" data-i="${i}" data-k="dlg"><span>${d.e}</span><span class="nt">${i+1}. ${esc(d.t)}</span></button>${cell(i,'exp','➕','Расширяем фразу')}${cell(i,'sub','🔄','Замени слово')}${cell(i,'ant','🎯','Скажи раньше')}${cell(i,'voc','📚','Слова')}`).join('')}
 </div>
 <div class="legend">➕ Расширяем фразу · 🔄 Замени слово · 🎯 Скажи раньше, чем услышишь · 📚 Слова и конструкции · ✓ пройдено</div></div>`;
 document.body.appendChild(ov);
 const c=()=>ov.remove();ov.querySelector('.x').onclick=c;ov.onclick=e=>{if(e.target===ov)c()};
 ov.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{c();const g=b.dataset.go;if(g==='home')home();else if(g==='all')vocab(-1,home);else if(g==='gram')gramPage(home);else if(g==='pairs')pairsPage(home);else myAnswers(home)});
 ov.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{c();const i=+b.dataset.i,k=b.dataset.k;
  if(k==='dlg')openDlg(i);else if(k==='voc')vocab(i,()=>openDlg(i));else runEx(i,k)});}
document.addEventListener('click',e=>{if(e.target.closest('.navB')){e.preventDefault();navPop()}});

function normCode(v){let t=String(v||'').toLowerCase().replace(/[\s.\-_]/g,'');
 t=t.replace(/^(дарья|дария|дариа|даря|дарjа|дарjа)/,'daria').replace(/^(darja|darya|darija|dariya|daria)/,'daria');
 t=t.replace(/[бвbв]2$/,'b2').replace(/[вb]$/,'b');return t}
const TEACHER='dariab2';
const CODES=[TEACHER].concat((META.codes||[]).map(normCode));
function gateOk(){return CODES.includes(normCode(lsGet('code','')))}
function showGate(){const g=document.createElement('div');g.className='gate';
 g.innerHTML=`<form class="gb" id="gf" autocomplete="off"><div class="gi">🔒</div><h2>${META.h1}</h2><p>Введи, пожалуйста, свой код, чтобы открыть урок.</p>
 <input id="gc" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Код" placeholder="Код">
 <p class="err" id="ge" aria-live="polite"></p><button class="big" type="submit">Открыть урок</button><div class="own">© Daria Botina</div></form>`;
 document.body.appendChild(g);
 g.querySelector('#gf').addEventListener('submit',e=>{e.preventDefault();const v=g.querySelector('#gc').value.trim();
  if(CODES.includes(normCode(v))){lsSet('code',v);g.remove();home();startVisit()}
  else{g.querySelector('#ge').textContent=v?'Код не подходит. Проверь, пожалуйста, и попробуй ещё раз.':'Введи, пожалуйста, код.'}})}
function setWho(){const c=normCode(lsGet('code',''));EV_WHO=(!c||c===TEACHER)?'Дарья (тест)':(META.who||'Ученик')}
function startVisit(){setWho();setTimeout(()=>sendEvent('visit',document.title),800)}
if(META.gate&&!gateOk())showGate();else{home();startVisit()}
})();
</script>
