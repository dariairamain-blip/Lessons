const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if(c) e.className = c; if(x != null) e.textContent = x; return e; };
let S = {}; try{ S = JSON.parse(localStorage.getItem("klinik-frazy") || "{}"); }catch(e){}
const keep = () => { try{ localStorage.setItem("klinik-frazy", JSON.stringify(S)); }catch(e){} };
/* --- голос --- */
const BAD = /grandma|grandpa|eddy|\bflo\b|reed|rocko|sandy|shelley|бабушк|дедушк|эдди|\bфло\b|\bрид\b|рокко|сэнди|санди|шелли|albert|bad news|good news|bahh|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|ralph|\bfred\b|kathy/i;
const GOOD = /premium|enhanced|улучш|высок|neural|natural|improved/i;
const voices = () => ("speechSynthesis" in window) ? speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith("tr")) : [];
let VO = null;
function pick(){ const L = voices(); if(!L.length){ VO = null; return; }
  VO = (S.voice && L.find(v => v.name === S.voice)) || (() => { const ok = L.filter(v => !BAD.test(v.name)), p = ok.length ? ok : L; return p.find(v => GOOD.test(v.name)) || p.find(v => v.default) || p.find(v => v.localService) || p[0]; })();
  const sel = $("#vsel"); sel.innerHTML = "";
  L.forEach(v => { const o = el("option", "", v.name + (BAD.test(v.name) ? " 🎭" : "") + (GOOD.test(v.name) ? " ⭐" : "")); o.value = v.name; if(VO && v.name === VO.name) o.selected = true; sel.append(o); });
}
function say(t, onend){ if(!("speechSynthesis" in window) || S.mute) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "tr-TR"; if(VO) u.voice = VO; u.rate = S.rate || .9; if(onend){ u.onend = onend; u.onerror = onend; } speechSynthesis.speak(u); }
/* --- автоплей: после фразы сама начинается следующая (в пределах урока) --- */
const ALL = []; let TOK = 0;
function unmark(){ document.querySelectorAll(".ph.playing").forEach(x => x.classList.remove("playing")); }
function play(i){ const it = ALL[i]; if(!it || S.mute) return; const my = ++TOK; unmark(); it.box.classList.add("playing");
  try{ it.box.scrollIntoView({block: "center", behavior: "smooth"}); }catch(e){}
  say(it.tr, () => { if(my !== TOK) return; it.box.classList.remove("playing");
    const nx = ALL[i + 1]; if(S.auto !== false && nx && nx.ls === it.ls) setTimeout(() => { if(my === TOK) play(i + 1); }, 900); }); }
function stopChain(){ TOK++; unmark(); }
document.addEventListener("click", e => { if(!e.target.closest(".ph > .ln > .say") && !e.target.closest("#auto")) stopChain(); }, true);
function autoUI(){ const b = $("#auto"); b.textContent = S.auto === false ? "⏩ Подряд: выкл" : "⏩ Подряд: вкл"; b.classList.toggle("off", S.auto === false); }
$("#auto").onclick = () => { S.auto = S.auto === false; keep(); autoUI(); if(S.auto === false) stopChain(); };
autoUI();
function muteUI(){ const b = $("#mute"); b.textContent = S.mute ? "🔊 Включить звук" : "🔇 Выключить звук"; b.classList.toggle("off", !!S.mute); }
$("#mute").onclick = () => { S.mute = !S.mute; keep(); if(S.mute && "speechSynthesis" in window) speechSynthesis.cancel(); muteUI(); };
muteUI();
if("speechSynthesis" in window){ pick(); speechSynthesis.addEventListener("voiceschanged", pick); }
$("#vsel").onchange = e => { S.voice = e.target.value; keep(); pick(); say("Merhaba, size nasıl yardımcı olabilirim?"); };
$("#vtest").onclick = () => say("Merhaba, size nasıl yardımcı olabilirim?");
[["🐢", .65], ["обычно", .9], ["быстро", 1.1]].forEach(([n, r]) => { const b = el("button", "", n); b.type = "button"; if((S.rate || .9) === r) b.classList.add("on");
  b.onclick = () => { S.rate = r; keep(); document.querySelectorAll("#spd button").forEach(x => x.classList.toggle("on", x === b)); }; $("#spd").append(b); });
/* --- перевод слова --- */
const norm = w => w.toLowerCase().replace(/[’']/g, "").replace(/[^\p{L}]/gu, "");
function wordTr(w){ const k = norm(w); let g = GLOSS[k];
  if(!g){ for(let i = k.length - 1; i >= 3 && !g; i--){ const key = Object.keys(GLOSS).find(x => x === k.slice(0, i)); if(key) g = GLOSS[key]; } }
  return g || "перевода этого слова пока нет — нажми 🌐 для перевода всей фразы"; }
function phrase(tr, ru, who){
  const box = el("div", "ph"), ln = el("div", "ln");
  const idx = ALL.length; ALL.push({tr, box, ls: CUR}); const sb = el("button", "say", "🔊"); sb.type = "button"; sb.onclick = () => play(idx);
  const tx = el("div", "tx"); if(who) tx.append(el("span", "who", who));
  let gl = null;
  tr.split(/(\s+)/).forEach(part => { if(!part.trim()){ tx.append(part); return; }
    const w = el("span", "w", part);
    w.onclick = () => { box.querySelectorAll(".w.on").forEach(x => x.classList.remove("on"));
      if(gl && gl.dataset.w === part){ gl.remove(); gl = null; return; }
      if(gl) gl.remove(); w.classList.add("on");
      gl = el("div", "gl"); gl.dataset.w = part; const b = el("button", "", "🔊"); b.type = "button"; b.onclick = () => say(part.replace(/[^\p{L}' ]/gu, ""));
      gl.append(b, el("span", "", wordTr(part))); box.append(gl); };
    tx.append(w); });
  const tb = el("button", "tr", "🌐"); tb.type = "button";
  const r = el("div", "ru", ru); r.hidden = true;
  tb.onclick = () => { r.hidden = !r.hidden; tb.classList.toggle("on", !r.hidden); };
  ln.append(sb, tx, tb); box.append(ln, r); return box;
}
let CUR = 0; const DETS = [];
const START = (S.ls != null && S.ls < DATA.length) ? S.ls : 0;
DATA.forEach((d, i) => { CUR = i;
  const det = el("details", "ls"); if(i === START) det.open = true; DETS.push(det);
  det.addEventListener("toggle", () => { if(det.open){ $("#lsel").value = i; S.ls = i; keep(); } });
  const sm = el("summary"); sm.append(el("span", "", "Урок " + d.n + " · " + d.title), el("small", "", d.ph.length + " фраз"));
  const body = el("div", "body");
  body.append(el("div", "sec", "Фразы"));
  d.ph.forEach(p => body.append(phrase(p[0], p[1], p[2])));
  if(d.words.length){ body.append(el("div", "sec", "Слова")); d.words.forEach(w => body.append(phrase(w[0], w[1], ""))); }
  det.append(sm, body); $("#list").append(det);
});
/* --- выбор урока: открыть нужный и сразу перейти к нему --- */
DATA.forEach((d, i) => { const o = el("option", "", "📘 Урок " + d.n + " · " + d.title); o.value = i; $("#lsel").append(o); });
$("#lsel").value = START;
$("#lsel").onchange = e => { const i = +e.target.value; stopChain();
  DETS.forEach((x, j) => { x.open = j === i; });
  S.ls = i; keep();
  const bar = document.querySelector(".bar").offsetHeight;
  window.scrollTo({top: DETS[i].getBoundingClientRect().top + scrollY - bar - 8, behavior: "smooth"}); };
</script></body></html>
