<style>
/* Layout: one phone-sized screen at a time; header with logo + menu, fixed bottom nav */
:root{
  --bg:#eef3f7; --card:#ffffff; --ink:#14233a; --muted:#5c6b80;
  --sea:#1f5fa8; --sun:#f2b632; --sel:#e3eefb; --line:#d5dfea;
  --ok:#1e8a4c; --okbg:#e2f5ea; --bad:#c2412d; --badbg:#fbe7e3;
  --chat:#dff3e8; --chatbg:linear-gradient(160deg,#cfe6f7,#f7e6c4);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1724; --card:#16233a; --ink:#e8eef6; --muted:#9aa9bd; --sea:#6ea8ef; --sel:#1d3657; --line:#2a3b55;
  --ok:#5fd28f; --okbg:#173a2a; --bad:#f08a78; --badbg:#3e1f1b; --chat:#1f3a2e; --chatbg:linear-gradient(160deg,#16324d,#3a2f1a); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1724; --card:#16233a; --ink:#e8eef6; --muted:#9aa9bd; --sea:#6ea8ef; --sel:#1d3657; --line:#2a3b55;
  --ok:#5fd28f; --okbg:#173a2a; --bad:#f08a78; --badbg:#3e1f1b; --chat:#1f3a2e; --chatbg:linear-gradient(160deg,#16324d,#3a2f1a); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;padding-block:10px 24px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:800;font-size:14px;flex:1;min-width:0}
.logo{width:30px;height:30px;border-radius:50%;background:var(--sea);color:var(--card);display:grid;place-items:center;font-size:12px;flex:none}
.hb{background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 9px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sun);transition:width .3s}
.scr{display:flex;flex-direction:column;gap:9px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--sea);font-weight:800}
h1{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:19px;margin:0}
p{margin:0;line-height:1.45}
.sub{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.pic{font-size:54px;text-align:center;line-height:1.1}
.es{font-weight:800;font-size:19px;color:var(--ink)}
.esl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ic{background:var(--sel);border:0;border-radius:8px;padding:3px 7px;font-size:15px;cursor:pointer;line-height:1.2}
.ic.sm{font-size:11px;padding:1px 5px;border-radius:6px}
.trv{color:var(--muted);font-size:13.5px;font-style:italic}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.ob{width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:11px 12px;
  font:inherit;font-weight:700;font-size:16px;color:var(--ink);cursor:pointer}
.ob.ok{border-color:var(--ok);background:var(--okbg)}
.ob.bad{border-color:var(--bad);background:var(--badbg)}
.ob:disabled{cursor:default}
.fb{border-radius:12px;padding:10px 12px;line-height:1.45}
.fb.ok{background:var(--okbg);color:var(--ink)}
.fb.bad{background:var(--badbg);color:var(--ink)}
.fb b{display:block;margin-bottom:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.btn.pri{background:var(--sea);color:var(--card)}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.skip{align-self:flex-start;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:2px 0;text-decoration:underline}
.hint{color:var(--muted);font-size:14px}
.nav{padding-top:6px}
.nav div{max-width:520px;margin:0 auto;display:flex;gap:10px}
.nav .btn{flex:1;font-size:16px}
.nav .btn.sec{flex:0 0 32%}
.pron{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:3px;align-items:center}
.pc .e{font-size:34px}
.pc .w{font-family:var(--display);font-weight:800;font-size:19px;color:var(--sea)}
.cut{display:flex;justify-content:center;align-items:baseline;gap:2px;font-family:var(--display);font-weight:800;font-size:40px}
.cut .x{color:var(--bad);text-decoration:line-through;text-decoration-thickness:3px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line)}
.tbl .end{color:var(--sea);font-weight:800}
.tbl .tr{color:var(--muted);font-size:13px}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.vc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 9px;display:flex;flex-direction:column;gap:2px;min-width:0}
.vc .t{display:flex;align-items:center;gap:6px}
.vc .e{font-size:24px}
.vc .w{font-weight:800;font-size:16px;flex:1;min-width:0}
.menu{display:flex;flex-direction:column;gap:7px}
.mi{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.mi .e{font-size:26px}
.mi .n{flex:1;font-weight:800}
.mi .s{font-size:13px;color:var(--muted);font-weight:600}
.mi.done{border-color:var(--ok)}
.chatbox{background:var(--chatbg);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:7px}
.bub{background:var(--chat);border-radius:14px 14px 14px 4px;padding:8px 10px;font-size:16.5px;line-height:1.4;max-width:92%}
.who{font-size:12px;font-weight:800;color:var(--sea)}
.ans{min-height:46px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--sel);border:0;border-radius:10px;padding:9px 12px;font:inherit;font-weight:800;font-size:16px;color:var(--ink);cursor:pointer}
.chip:disabled{opacity:.25;cursor:default}
.gate input{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:17px;padding:12px}
.err{color:var(--bad);font-weight:700;min-height:1.2em}
.abar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.abar .lb{font-size:13px;font-weight:800;color:var(--sea);margin-right:auto}
.abar button{background:var(--sel);border:0;border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
.abar button.off{opacity:.6}
.abar button{min-width:40px;font-size:16px}.abar #aauto{font-size:12px;min-width:0}.abar .big2{background:var(--sea);color:var(--card)}
.speaking{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.pics{font-size:22px;line-height:1.2;margin-top:2px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:230px;padding:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.frame{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.fin{display:flex;flex-direction:column;gap:7px;width:100%}
.fl{display:flex;align-items:flex-start;gap:8px}.fl .fp{font-size:24px;min-width:44px;text-align:center}.fl>div{min-width:0}
.big{font-size:70px;line-height:1.1}
.tw{font-family:var(--display);font-weight:800;font-size:32px}
.tw2{font-weight:800;font-size:19px}
.cutw{font-family:var(--display);font-weight:800;font-size:46px;display:flex;align-items:baseline}
.cutw.sm{font-size:30px}.cutw .pr{color:var(--muted)}
.cutw .end{color:var(--bad)}
.nw{color:var(--sea);display:inline-block;animation:pop .6s .2s both}
.tcap{text-align:center;font-weight:800;color:var(--sea);min-height:1.3em}
.sc{display:inline-block;font-size:34px;animation:snip 1.1s both}
.fall{display:inline-block;animation:fall 1s 1.1s both}
.pop{animation:pop .5s ease-out both}.pop2{animation:fadeup .5s .25s both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes snip{0%{transform:translateY(-70px);opacity:0}45%{transform:translateY(0) rotate(0);opacity:1}65%{transform:rotate(-25deg)}85%{transform:rotate(15deg)}100%{transform:rotate(0)}}
@keyframes fall{to{transform:translateY(110px) rotate(40deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.nw,.sc,.fall,.pop,.pop2{animation:none}}
.ttr{color:var(--muted);font-size:16px;font-weight:600}
.own{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{max-width:420px;display:flex;flex-direction:column;gap:8px}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

<script>
/* ---------- content ---------- */
const PRON=[["👨","yo","ben","Yo, Fatih."],["👩","tú","sen","Tú, Daria."],["👫","nosotros","biz","Nosotros, juntos."]];
const VERBS=[["👀","mirar","bakmak"],["📷","sacar fotos","fotoğraf çekmek"],["📍","llegar","varmak"],["💃","bailar","dans etmek"],["💶","pagar","ödemek"],["🚶","caminar","yürümek"],["☕","tomar","içmek"],["🎧","escuchar","dinlemek"]];

/* toon = little animated scene before tasks */
const VT=(t,place,verb,root,tail,pics,tr,extra)=>Object.assign({k:"toon",t,place,verb,root,tail,pics,tr},extra||{});
const STORY=[["🚶‍♂️🚶‍♀️🏖️","Nosotros caminamos por la playa.","Biz sahilde yürüyoruz."],
 ["👨📷🌊","Yo saco fotos del mar.","Ben denizin fotoğraflarını çekiyorum."],
 ["👩⛵","Tú miras los barcos.","Sen teknelere bakıyorsun."],
 ["🚶‍♂️🚶‍♀️☕","Nosotros llegamos a un café.","Biz bir kafeye varıyoruz."],
 ["👨☕","Yo tomo un café turco.","Ben bir Türk kahvesi içiyorum."],
 ["👩🫖","Tú tomas un té.","Sen bir çay içiyorsun."],
 ["👨👩🎶","Nosotros escuchamos música.","Biz müzik dinliyoruz."],
 ["🕺💃","Nosotros bailamos un poco.","Biz biraz dans ediyoruz."],
 ["👨💶","Yo pago la cuenta.","Ben hesabı ödüyorum."],
 ["🌙🚶‍♂️🚶‍♀️","Nosotros caminamos a casa.","Biz eve yürüyoruz."]];
const toonStory={k:"toon",t:"🎬 Bizim cumartesi",steps:STORY.map(([p,es],i)=>({h:`<div class="big pop">${p}</div><div class="tw2 pop2">${es}</div>`,say:es,c:`Sahne ${i+1} / ${STORY.length}`})),fin:STORY};
const toonBailar=VT("🎬 Yeni fiil: bailar",["🎉","la fiesta","parti"],["💃","bailar","dans etmek"],"bail","en la fiesta",["🕺","💃","🕺💃"],
  ["Ben partide dans ediyorum.","Sen partide dans ediyorsun.","Biz partide dans ediyoruz."]);
const toonNoPron={k:"toon",t:"🎬 Zamir yok, son ek söyler!",steps:[
  {h:`<div class="big pop">🕺</div><div class="tw pop2">Bail<b class="nw">o</b>.</div>`,say:"Bailo.",c:"-o → yo"},
  {h:`<div class="big pop">💃</div><div class="tw pop2">Bail<b class="nw">as</b>.</div>`,say:"Bailas.",c:"-as → tú"},
  {h:`<div class="big pop">🕺💃</div><div class="tw pop2">Bail<b class="nw">amos</b>.</div>`,say:"Bailamos.",c:"-amos → nosotros"}],
  fin:[["🕺","Bailo.","Dans ediyorum."],["💃","Bailas.","Dans ediyorsun."],["🕺💃","Bailamos.","Dans ediyoruz."]]};
const toonRecap={k:"toon",t:"🎬 Hatırla: -o / -as / -amos",steps:[
  {h:`<div class="big pop">👨🎧</div><div class="tw pop2">Yo escuch<b class="nw">o</b>.</div>`,say:"Yo escucho.",c:"yo → -o"},
  {h:`<div class="big pop">👩🎧</div><div class="tw pop2">Tú escuch<b class="nw">as</b>.</div>`,say:"Tú escuchas.",c:"tú → -as"},
  {h:`<div class="big pop">👨👩🎧</div><div class="tw pop2">Nosotros escuch<b class="nw">amos</b>.</div>`,say:"Nosotros escuchamos.",c:"nosotros → -amos"}],
  fin:[["👨🎧","Yo escucho.","Ben dinliyorum."],["👩🎧","Tú escuchas.","Sen dinliyorsun."],["👨👩🎧","Nosotros escuchamos.","Biz dinliyoruz."]]};
const WHO=[["🕺 Fatih (yo)",null],["💃 Daria (tú)",null],["🕺💃 İkisi (nosotros)",null]];
const LH="Son eke bak: -o = ben, -as = sen, -amos = biz.";

const MODS=[
 {n:"Bizim cumartesi",e:"🎬",s:"çizgi film: izle ve dinle",pages:[toonStory]},
 {n:"Yeni fiiller",e:"✨",s:"çizgi film + 5 yeni fiil",pages:[toonBailar,{k:"vocab"}]},
 {n:"Fiil çekimi",e:"🧩",s:"çizgi film + doğru sonek",pages:[
  VT("🎬 mirar",["⛵","los barcos","tekneler"],["👀","mirar","bakmak"],"mir","los barcos",["👨⛵","👩⛵","👨👩⛵"],
   ["Ben teknelere bakıyorum.","Sen teknelere bakıyorsun.","Biz teknelere bakıyoruz."]),
  {k:"ch",pic:"👩⛵",q:"Doğru fiili seç (mirar = bakmak).",es:"Tú ___ los barcos.",tr:"Sen teknelere bakıyorsun.",
   opts:[["miramos","bakıyoruz"],["miras","bakıyorsun"],["miro","bakıyorum"]],a:1,why:"<b>tú</b> → <b>-as</b>: mir<b>as</b>.",hint:"tú → -as"},
  VT("🎬 sacar fotos",["🌊","el mar","deniz"],["📷","sacar fotos","fotoğraf çekmek"],"sac","fotos del mar",["👨📷","👩📷","👨👩📷"],
   ["Ben denizin fotoğraflarını çekiyorum.","Sen denizin fotoğraflarını çekiyorsun.","Biz denizin fotoğraflarını çekiyoruz."]),
  {k:"ch",pic:"👨📷🌊",q:"Doğru fiili seç (sacar fotos = fotoğraf çekmek).",es:"Yo ___ fotos del mar.",tr:"Ben denizin fotoğraflarını çekiyorum.",
   opts:[["saco","çekiyorum"],["sacas","çekiyorsun"],["sacamos","çekiyoruz"]],a:0,why:"<b>yo</b> → <b>-o</b>: sac<b>o</b>.",hint:"yo → -o"},
  VT("🎬 llegar",["☕","el café","kafe"],["📍","llegar","varmak"],"lleg","al café",["🚶‍♂️☕","🚶‍♀️☕","🚶‍♂️🚶‍♀️☕"],
   ["Ben kafeye varıyorum.","Sen kafeye varıyorsun.","Biz kafeye varıyoruz."]),
  {k:"ch",pic:"🚶‍♂️🚶‍♀️☕",q:"Doğru fiili seç (llegar = varmak).",es:"Nosotros ___ al café.",tr:"Biz kafeye varıyoruz.",
   opts:[["llegas","varıyorsun"],["llego","varıyorum"],["llegamos","varıyoruz"]],a:2,why:"<b>nosotros</b> → <b>-amos</b>: lleg<b>amos</b>.",hint:"nosotros → -amos"},
  VT("🎬 pagar",["🧾","la cuenta","hesap"],["💶","pagar","ödemek"],"pag","la cuenta",["👨💶","👩💶","👨👩💶"],
   ["Ben hesabı ödüyorum.","Sen hesabı ödüyorsun.","Biz hesabı ödüyoruz."]),
  {k:"ch",pic:"👨💶",q:"Doğru fiili seç (pagar = ödemek).",es:"Yo ___ la cuenta.",tr:"Ben hesabı ödüyorum.",
   opts:[["pagamos","ödüyoruz"],["pago","ödüyorum"],["pagas","ödüyorsun"]],a:1,why:"<b>yo</b> → <b>-o</b>: pag<b>o</b>.",hint:"yo → -o"},
  VT("🎬 tomar",["🫖","el té","çay"],["☕","tomar","içmek"],"tom","un té",["👨🫖","👩🫖","👨👩🫖"],
   ["Ben bir çay içiyorum.","Sen bir çay içiyorsun.","Biz bir çay içiyoruz."]),
  {k:"ch",pic:"👩🫖",q:"Doğru fiili seç (tomar = içmek).",es:"Tú ___ un té.",tr:"Sen bir çay içiyorsun.",
   opts:[["tomas","içiyorsun"],["tomamos","içiyoruz"],["tomo","içiyorum"]],a:0,why:"<b>tú</b> → <b>-as</b>: tom<b>as</b>.",hint:"tú → -as"}]},
 {n:"Dinle ve bul",e:"👂",s:"çizgi film + kim yapıyor?",pages:[toonNoPron,
  {k:"ch",pic:"🎧",q:"Dinle: kim yapıyor?",listen:"Bailamos en la fiesta.",opts:WHO,a:2,why:"„<b>Bailamos</b> en la fiesta.“ → -amos = biz.",hint:LH},
  {k:"ch",pic:"🎧",q:"Dinle: kim yapıyor?",listen:"Saco fotos del mar.",opts:WHO,a:0,why:"„<b>Saco</b> fotos del mar.“ → -o = ben.",hint:LH},
  {k:"ch",pic:"🎧",q:"Dinle: kim yapıyor?",listen:"Miras los barcos.",opts:WHO,a:1,why:"„<b>Miras</b> los barcos.“ → -as = sen.",hint:LH},
  {k:"ch",pic:"🎧",q:"Dinle: kim yapıyor?",listen:"Pago la cuenta.",opts:WHO,a:0,why:"„<b>Pago</b> la cuenta.“ → -o = ben.",hint:LH},
  {k:"ch",pic:"🎧",q:"Dinle: kim yapıyor?",listen:"Tomamos limonada.",opts:WHO,a:2,why:"„<b>Tomamos</b> limonada.“ → -amos = biz.",hint:LH}]},
 {n:"Plaj partisi ilanı",e:"📢",s:"oku ve anla",pages:[{k:"read"},
  {k:"ch",pic:"🍹",q:"Partide ne içiliyor?",opts:[["Limonata ve buzlu kahve",null],["Türk kahvesi ve çay",null],["Sadece su",null]],a:0,
   why:"„Tomamos limonada y café helado.“",hint:"Dördüncü satıra bak."},

const PRONS=["yo","tú","nosotros"],ENDS=["o","as","amos"],CAP=s=>s[0].toUpperCase()+s.slice(1);
function toonSteps(P){
  if(P.steps){if(P.fin&&P.fin.length===P.steps.length)P.steps.forEach((x,i)=>{if(x.say&&!x.tr)x.tr=P.fin[i][2]});return P.steps}
  const st=[];
  if(P.place)st.push({h:`<div class="big pop">${P.place[0]}</div><div class="tw pop2">${P.place[1]}</div>`,tr:P.place[2],say:P.place[1],c:"📍 Yer"});
  st.push({h:`<div class="big pop">${P.verb[0]}</div><div class="tw pop2">${P.verb[1]}</div>`,tr:P.verb[2],say:P.verb[1],c:"🎬 Fiil"});
  st.push({h:`<div class="cutw"><span>${P.root}</span><span class="sc">✂️</span><span class="end fall">ar</span></div>`,w:2600,c:"✂️ -ar'ı kesiyoruz → "+P.root+"-"});
  PRONS.forEach((p,i)=>st.push({h:`<div class="big pop">${P.pics[i]}</div><div class="cutw sm"><span class="pr">${p}</span>&nbsp;<span>${P.root}</span><span class="nw">${ENDS[i]}</span></div><div class="tw2 pop2">${CAP(p)} ${P.root}${ENDS[i]} ${P.tail}.</div>`,
     tr:P.tr[i],say:`${CAP(p)} ${P.root}${ENDS[i]} ${P.tail}.`,c:`${p} → -${ENDS[i]}`}));
  if(P.schema)st.push({h:`<div class="cutw sm"><span>${P.root}</span> + <span class="nw">o / as / amos</span></div>`,w:2200,c:"Kural: kes ✂️ + yeni son ek"});
  return st;
}
function toonFin(P){
  if(P.fin)return P.fin.map(([pic,es,tr])=>`<div class="fl"><span class="fp">${pic}</span>${esLineT(es,tr)}</div>`).join("");
  let h="";
  if(P.place)h+=`<div class="fl"><span class="fp">${P.place[0]}</span>${esLineT(P.place[1],P.place[2])}</div>`;
  h+=`<div class="fl"><span class="fp">${P.verb[0]}</span>${esLineT(P.verb[1],P.verb[2])}</div>`;
  PRONS.forEach((p,i)=>{h+=`<div class="fl"><span class="fp">${P.pics[i]}</span>${esLineT(`${CAP(p)} ${P.root}${ENDS[i]} ${P.tail}.`,P.tr[i])}</div>`});
  return h;
}

    utter(el.dataset.say||el.dataset.es,()=>setTimeout(()=>plStep(i+1,id),350))}}

  pg.querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>{S.v="mod";S.m=+b.dataset.mod;S.p=0;save();render()});
  pg.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{S.ans[key()]=+b.dataset.o;save();render()});
  pg.querySelectorAll("[data-retry]").forEach(b=>b.onclick=()=>{delete S.ans[key()];const P=MODS[S.m].pages[S.p];delete P.sh;save();render()});
  const bd=()=>S.ans[key()]||(S.ans[key()]={pick:[],res:null});
  pg.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{bd().pick.push(+b.dataset.pk);save();render()});
  pg.querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{bd().pick.splice(+b.dataset.un,1);save();render()});
  pg.querySelectorAll("[data-chk]").forEach(b=>b.onclick=()=>{const s=bd(),P=MODS[S.m].pages[S.p];s.res=s.pick.every((w,i)=>w===i)&&s.pick.length===P.w.length;save();render()});
  const go=$("#go");if(go){const tryc=()=>{if(CODES.includes(norm($("#code").value))){S.ok=true;save();render()}else $("#err").textContent="Kod yanlış. Daria'nın gönderdiği kodu tekrar yaz."};
    go.onclick=tryc;$("#code").onkeydown=e=>{if(e.key==="Enter")tryc()}}
}
function next(){
  if(S.v==="intro"){S.v="mod";S.m=0;S.p=0}
  else if(S.v==="mdone"){if(S.m<MODS.length-1){S.m++;S.p=0;S.v="mod"}else S.v="menu"}
  else{const M=MODS[S.m];if(S.p<M.pages.length-1)S.p++;else{S.done[S.m]=true;S.v="mdone"}}
  save();render()}
function back(){
  if(S.v==="intro"){S.v="menu"}
  else if(S.v==="mdone"){S.v="mod";S.p=MODS[S.m].pages.length-1}
  else if(S.p>0)S.p--;else S.v=S.m===0?"intro":"menu";
  save();render()}
$("#next").onclick=next;$("#back").onclick=back;
$("#mbtn").onclick=()=>{S.v="menu";save();render()};
$("#home").onclick=()=>{$("#hm").hidden=false};$("#hmc").onclick=()=>{$("#hm").hidden=true};
render();
</script>

</body>
</html>
