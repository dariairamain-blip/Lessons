<style>

}

/* HOME */

.brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px}

{t:"Vamos regressar a Lisboa",ru:"В самолёте: две попытки и разворот",e:"✈️",
 lines:[
 ["co","Boa tarde, fala o comandante. Estamos a aproximar-nos do Funchal.","Добрый день, говорит командир. Мы приближаемся к Фуншалу."],
 ["co","O vento está forte, por isso a aterragem pode ser agitada. Mantenham os cintos apertados.","Ветер сильный, поэтому посадка может быть неспокойной. Держите ремни пристёгнутыми."],
 ["ma","Sr. Gilberto, está a ver? Estamos a descer!","Сеньор Жилберту, видите? Мы снижаемся!"],
 ["gi","Estou. Agora feche os olhos e respire.","Вижу. Теперь закройте глаза и дышите."],
 ["ma","Ai! O avião está a abanar imenso!","Ой! Самолёт ужасно трясёт!"],
 ["gi","Calma. Agora o piloto decide: ou aterra, ou sobe outra vez.","Спокойно. Сейчас пилот решит: либо садится, либо снова набирает высоту."],
 ["ma","Subiu! Porque é que subiu?","Поднялся! Почему он поднялся?"],
 ["co","Senhores passageiros, o vento estava acima dos limites. Vamos fazer uma segunda tentativa.","Уважаемые пассажиры, ветер был выше допустимого. Мы сделаем вторую попытку."],
 ["jo","Está tudo bem, minha senhora? Quer um copo de água?","Всё хорошо, сеньора? Хотите стакан воды?"],
 ["ma","Quero, por favor. Estou um bocado enjoada.","Хочу, пожалуйста. Меня немного укачало."],
 ["jo","Aqui tem. E tem um saco no bolso do assento da frente, se precisar.","Вот, пожалуйста. И в кармане кресла впереди есть пакет, если понадобится."],
 ["ma","Obrigada. Espero não precisar!","Спасибо. Надеюсь, не понадобится!"],
 ["gi","Olhe pela janela: aquilo ali é o Cristo Rei do Garajau.","Посмотрите в окно: вон там статуя Христа в Гаражау."],
 ["ma","Não consigo olhar para nada. Só penso no bolo!","Я ни на что не могу смотреть. Думаю только о торте!"],
 ["co","Senhores passageiros, infelizmente não é possível aterrar no Funchal. Vamos regressar a Lisboa.","Уважаемые пассажиры, к сожалению, приземлиться в Фуншале невозможно. Мы возвращаемся в Лиссабон."],
 ["ma","A Lisboa?! Mas eu vim do Porto!","В Лиссабон?! Но я же летела из Порту!"],
 ["gi","Eu avisei. O vento da Madeira é assim.","Я же предупреждал. Ветер на Мадейре — он такой."],
 ["jo","Em Lisboa, a companhia vai dar assistência a todos os passageiros.","В Лиссабоне авиакомпания окажет помощь всем пассажирам."],
 ["ma","Que tipo de assistência?","Какую именно помощь?"],
 ["jo","Refeição, hotel, se for preciso, e um lugar no próximo voo.","Питание, отель, если понадобится, и место на следующий рейс."],
 ["ma","E quando é o próximo voo?","А когда следующий рейс?"],
 ["jo","Isso só lhe sabem dizer no balcão, em Lisboa. Lamento muito.","Это вам скажут только на стойке в Лиссабоне. Мне очень жаль."],
 ["ma","Vou mandar mensagem à minha irmã. Coitada, está à minha espera no aeroporto.","Напишу сестре. Бедняжка, она ждёт меня в аэропорту."],
 ["gi","Diga-lhe que vá para casa. Hoje já ninguém aterra.","Скажите ей, чтобы ехала домой. Сегодня уже никто не сядет."],
 ["ma","Ela vai ficar tão triste… O jantar era hoje.","Она так расстроится… Ужин был сегодня."],
 ["gi","Mas a festa é no sábado, não é? Ainda há tempo.","Но праздник же в субботу, верно? Время ещё есть."],
 ["ma","Tem razão. E o bolo ainda está inteiro.","Вы правы. И торт пока цел."],
 ["jo","Inteiro e com um ar delicioso! Posso guardá-lo no frigorífico do avião, se quiser.","Цел и выглядит восхитительно! Если хотите, могу положить его в холодильник самолёта."],
 ["ma","A sério? Seria ótimo. Obrigadíssima!","Серьёзно? Было бы чудесно. Огромное спасибо!"],
 ["jo","Não me esqueço de o devolver. Prometo.","Не забуду вернуть. Обещаю."],
 ["gi","Vê? Até o bolo viaja em primeira classe.","Видите? Даже торт летит первым классом."],
 ["ma","Pelo menos alguém está a ter uma boa viagem!","Хоть у кого-то хорошее путешествие!"]
 ],

{t:"No balcão em Lisboa",ru:"Новый рейс, отель и книга жалоб",e:"🎫",
 lines:[
 ["hu","Boa noite. Era do voo que não pôde aterrar no Funchal?","Добрый вечер. Вы с рейса, который не смог приземлиться в Фуншале?"],
 ["ma","Era, sim. E agora? Preciso de chegar ao Funchal o mais depressa possível.","Да. И что теперь? Мне нужно попасть в Фуншал как можно скорее."],
 ["hu","Compreendo. Deixe-me ver… Tenho lugar amanhã às oito e cinco.","Понимаю. Дайте посмотреть… Есть место завтра на восемь ноль пять."],
 ["ma","Às oito e cinco, de Lisboa? Perfeito, fico com esse.","На восемь ноль пять, из Лиссабона? Отлично, беру его."],
 ["hu","Muito bem. Já está confirmado. O cartão de embarque vai para o seu e-mail.","Хорошо. Уже подтверждено. Посадочный придёт вам на почту."],
 ["ma","E onde é que eu durmo esta noite?","А где я сплю этой ночью?"],
 ["hu","Temos hotel para os passageiros, aqui perto do aeroporto. Com jantar e pequeno-almoço.","У нас есть отель для пассажиров, здесь недалеко от аэропорта. С ужином и завтраком."],
 ["ma","E como é que lá chego?","А как мне туда добраться?"],
 ["hu","Há um autocarro do hotel à saída das chegadas, de meia em meia hora.","Есть автобус отеля у выхода из зоны прилёта, каждые полчаса."],
 ["ma","E as minhas malas? Estão no avião?","А мои чемоданы? Они в самолёте?"],
 ["hu","As malas seguem diretamente para o voo de amanhã. Não precisa de as levantar.","Чемоданы отправятся прямо на завтрашний рейс. Забирать их не нужно."],
 ["ma","Mas eu não tenho nada comigo! Nem escova de dentes.","Но у меня с собой ничего нет! Даже зубной щётки."],
 ["hu","No hotel dão-lhe um kit. Escova, pasta e até uma t-shirt.","В отеле вам дадут набор. Щётка, паста и даже футболка."],
 ["ma","Está bem. E tenho direito a alguma indemnização?","Хорошо. А мне полагается какая-нибудь компенсация?"],
 ["hu","Infelizmente, não. Quando é por causa do tempo, a companhia não paga indemnização.","К сожалению, нет. Когда дело в погоде, авиакомпания компенсацию не платит."],
 ["ma","Porquê? Não foi culpa minha!","Почему? Я же не виновата!"],
 ["hu","Também não foi nossa. O vento é uma circunstância extraordinária.","Мы тоже не виноваты. Ветер — это чрезвычайное обстоятельство."],
 ["ma","Então quero o livro de reclamações, se faz favor.","Тогда дайте, пожалуйста, книгу жалоб."],
 ["hu","Tem todo o direito. Aqui está. Também pode reclamar online.","Это ваше полное право. Вот она. Можно также пожаловаться онлайн."],
 ["ma","Vou escrever. Não é contra si, é contra o vento.","Напишу. Это не против вас, это против ветра."],
 ["hu","Hahaha! Escreva: «Exijo um vento mais simpático».","Ха-ха-ха! Напишите: «Требую более вежливого ветра»."],
 ["ma","Boa ideia. E o meu bolo? Ficou no frigorífico do avião!","Хорошая мысль. А мой торт? Он остался в холодильнике самолёта!"],
 ["hu","Um bolo? Espere, a tripulação deixou isto aqui para uma tal Marta.","Торт? Подождите, экипаж оставил вот это для какой-то Марты."],
 ["ma","Sou eu! O meu bolo! Está inteiro?","Это я! Мой торт! Он цел?"],
 ["hu","Está perfeito. E tem um bilhete: «Boa sorte! Joana».","В полном порядке. И здесь записка: «Удачи! Жоана»."],
 ["ma","Que querida! Afinal ainda há gente simpática.","Какая милая! Всё-таки есть ещё добрые люди."],
 ["gi","Marta! Também fico no hotel. Apanhamos o autocarro juntos?","Марта! Я тоже остаюсь в отеле. Поедем на автобусе вместе?"],
 ["ma","Claro, Sr. Gilberto. E amanhã às oito e cinco, outra vez juntos?","Конечно, сеньор Жилберту. А завтра в восемь ноль пять — снова вместе?"],
 ["gi","Às oito e cinco, não. Eu vou às oito e cinquenta. Mas encontramo-nos no Funchal.","Не в восемь ноль пять. Я лечу в восемь пятьдесят. Но встретимся в Фуншале."],
 ["hu","Boa viagem, e desculpe o incómodo.","Хорошего полёта, и простите за неудобства."],
 ["ma","Obrigada, Hugo. Amanhã à mesma hora, outra vez no aeroporto!","Спасибо, Угу. Завтра в это же время — снова в аэропорту!"],
 ["gi","Isso é a vida de quem vai à Madeira, menina.","Такова жизнь тех, кто летает на Мадейру, девушка."]
 ],

{t:"A mala não apareceu",ru:"Фуншал: лента пуста, заявление о пропаже",e:"🔍",
 lines:[
 ["ma","Cheguei! Finalmente no Funchal! Agora só falta a mala.","Прилетела! Наконец-то в Фуншале! Осталось только забрать чемодан."],
 ["ma","O tapete parou… Saiu a pequena, mas a grande não.","Лента остановилась… Маленький вышел, а большой — нет."],
 ["cl","Bom dia. Precisa de ajuda?","Доброе утро. Вам нужна помощь?"],
 ["ma","Bom dia. Falta-me uma mala. Vinha do voo de Lisboa.","Доброе утро. У меня не хватает чемодана. Он летел рейсом из Лиссабона."],
 ["cl","Tem a etiqueta da bagagem?","У вас есть багажная бирка?"],
 ["ma","Tenho. Está colada no cartão de embarque de ontem, do Porto.","Есть. Она приклеена к вчерашнему посадочному, из Порту."],
 ["cl","Deixe-me ver no sistema… A sua mala ainda está em Lisboa.","Сейчас посмотрю в системе… Ваш чемодан ещё в Лиссабоне."],
 ["ma","Em Lisboa? Mas disseram-me que seguia diretamente!","В Лиссабоне? Но мне сказали, что он полетит прямо сюда!"],
 ["cl","Houve muitas malas ontem, de três voos que regressaram. Vem no voo da tarde.","Вчера было много чемоданов, с трёх вернувшихся рейсов. Он прилетит дневным рейсом."],
 ["ma","E o que é que eu faço agora?","И что мне теперь делать?"],
 ["cl","Preenchemos já um registo de bagagem. É rápido.","Сейчас заполним заявление о багаже. Это быстро."],
 ["cl","Como é a mala? Cor, tamanho, algum sinal especial?","Какой чемодан? Цвет, размер, какие-нибудь особые приметы?"],
 ["ma","É azul-escura, grande, rígida, com um autocolante de um gato.","Тёмно-синий, большой, жёсткий, с наклейкой в виде кота."],
 ["cl","Um gato… Muito bem, isso ajuda. O que tem dentro?","Кот… Отлично, это поможет. Что внутри?"],
 ["ma","Roupa, sapatos, os presentes para a minha irmã…","Одежда, обувь, подарки для сестры…"],
 ["cl","Algum objeto de valor?","Какие-нибудь ценные вещи?"],
 ["ma","Um colar de prata. É a prenda de anos dela.","Серебряное ожерелье. Это её подарок на день рождения."],
 ["cl","Fica registado. Qual é a morada onde vai ficar?","Записано. Какой адрес, где вы остановитесь?"],
 ["ma","Rua da Carreira, número vinte, em casa da minha irmã.","Руа-да-Карейра, дом двадцать, у моей сестры."],
 ["cl","Entregamos a mala nessa morada ainda hoje, ao fim do dia.","Мы доставим чемодан по этому адресу ещё сегодня, к концу дня."],
 ["ma","Ao fim do dia? A festa é amanhã. Dá tempo, então.","К концу дня? Праздник завтра. Значит, успеваем."],
 ["cl","Dá. E se precisar de comprar alguma coisa urgente, guarde as faturas.","Успеваете. А если понадобится купить что-то срочно, сохраните чеки."],
 ["ma","As faturas? Para quê?","Чеки? Зачем?"],
 ["cl","A companhia reembolsa as despesas de primeira necessidade.","Авиакомпания возмещает расходы на самое необходимое."],
 ["ma","Ótimo. Vou comprar uma escova de dentes decente.","Отлично. Куплю нормальную зубную щётку."],
 ["cl","Aqui está a cópia do registo. Este é o número de referência.","Вот копия заявления. Это номер для справок."],
 ["ma","Vou tirar uma fotografia, para não o perder.","Сфотографирую, чтобы не потерять."],
 ["cl","Faz bem. Pode acompanhar tudo no site, com esse número.","Правильно. По этому номеру можно всё отслеживать на сайте."],
 ["ma","Muito obrigada, Cláudia. Foi muito amável.","Большое спасибо, Клаудия. Вы очень любезны."],
 ["cl","Não tem de quê. E bem-vinda à Madeira, finalmente!","Не за что. И добро пожаловать на Мадейру — наконец-то!"],
 ["ma","Finalmente, sim. Com bolo, sem mala, mas cá estou!","Наконец-то, да. С тортом, без чемодана, но я здесь!"]
 ],

document.addEventListener('click',e=>{if(e.target.closest('.navB')){e.preventDefault();navPop()}});

function normCode(v){let t=String(v||'').toLowerCase().replace(/[\s.\-_]/g,'');
 t=t.replace(/^(дарья|дария|дариа|даря|дарjа|дарjа)/,'daria').replace(/^(darja|darya|darija|dariya|daria)/,'daria');
 t=t.replace(/[бвbв]2$/,'b2').replace(/[вb]$/,'b');return t}
const TEACHER='dariab2';
const CODES=[TEACHER].concat((META.codes||[]).map(normCode));
function gateOk(){return CODES.includes(normCode(lsGet('code','')))}
function showGate(){const g=document.createElement('div');g.className='gate';
 g.innerHTML=`<form class="gb" id="gf" autocomplete="off"><div class="gi">🔒</div><h2>${META.h1}</h2><p>Введи, пожалуйста, свой код, чтобы открыть урок.</p>
 <input id="gc" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Код" placeholder="Код">
 <p class="err" id="ge" aria-live="polite"></p><button class="big" type="submit">Открыть урок</button><div class="own">© Daria Botina</div></form>`;
 document.body.appendChild(g);
 g.querySelector('#gf').addEventListener('submit',e=>{e.preventDefault();const v=g.querySelector('#gc').value.trim();
  if(CODES.includes(normCode(v))){lsSet('code',v);g.remove();home();startVisit()}
  else{g.querySelector('#ge').textContent=v?'Код не подходит. Проверь, пожалуйста, и попробуй ещё раз.':'Введи, пожалуйста, код.'}})}
function setWho(){const c=normCode(lsGet('code',''));EV_WHO=(!c||c===TEACHER)?'Дарья (тест)':(META.who||'Ученик')}
function startVisit(){setWho();setTimeout(()=>sendEvent('visit',document.title),800)}
if(META.gate&&!gateOk())showGate();else{home();startVisit()}
})();
</script>
