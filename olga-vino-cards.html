<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Otoño 🍇">
<link rel="apple-touch-icon" href="olga-vino-icon.png">
<link rel="icon" type="image/png" href="olga-vino-icon.png">
<title>Otoño en el pueblo — карточки</title>
<style>
:root{
  --bg:#f4ecdc;--card:#fffaf0;--ink:#3b2a1e;--muted:#6f5b47;--wine:#7b1e3a;--olive:#55652a;--terra:#b9572f;
  --line:#e0d0b2;--ok:#2f7d3a;--bad:#b3261e;--okbg:#e2f1dc;--badbg:#fbe2de;--hl:#f6c26b;--btn:#7b1e3a;--btnink:#fff7ea;
  --chip:#efe3cb;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1c1612;--card:#2a201a;--ink:#f3e8d8;--muted:#c9b69e;--wine:#ec8ea8;--olive:#bccb72;--terra:#f2a47e;
  --line:#4b3a2d;--ok:#86d892;--bad:#ff8f86;--okbg:#1f3b25;--badbg:#4b211d;--hl:#8a5c14;--btn:#a8395b;--btnink:#fff7ea;--chip:#3a2c22;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.4;
  background-image:radial-gradient(circle at 12% 8%,rgba(123,30,58,.07) 0 60px,transparent 61px),radial-gradient(circle at 92% 96%,rgba(85,101,42,.08) 0 80px,transparent 81px);
  min-height:100vh;overflow-x:hidden}
.wrap{max-width:480px;margin:0 auto;padding:10px 14px 28px}
button{font-family:inherit;font-size:16px;color:inherit;cursor:pointer}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
h1{font-size:26px;margin:6px 0 2px;color:var(--wine);line-height:1.15}
h2{font-size:21px;margin:4px 0 8px;color:var(--wine)}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 2px 0 rgba(0,0,0,.04)}
.big-btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 14px;background:var(--btn);color:var(--btnink);font-size:17px;font-weight:bold;margin-top:10px}
.ghost{display:block;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;margin-top:8px;text-align:left}
.ghost .r{float:right}
.row{display:flex;gap:8px;align-items:center}
/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0 6px;display:flex;gap:4px;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:8px}
.bar button{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:40px;height:38px;font-size:16px;padding:0 6px}
.bar button.on{background:var(--chip)}
.bar button.off{opacity:.55}
.prog{font-size:13px;color:var(--muted);margin:2px 0 6px}
.skip{display:block;margin:14px auto 0;border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline}
/* learn card */
.word{font-size:32px;font-weight:bold;margin:6px 0 2px;color:var(--ink)}
.art{color:var(--olive);font-weight:normal}
.snd{border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:15px;margin:4px 3px}
.tr{display:none;margin-top:6px;color:var(--terra);font-style:italic;font-size:17px}
.tr.show{display:block}
.mini{border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:13px;padding:3px 9px;margin-top:6px}
/* flip card */
.flip{perspective:1000px;margin-top:4px}
.flip-in{position:relative;height:330px;transition:transform .6s;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;cursor:pointer}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:2px solid var(--line);
 background-color:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;
 box-shadow:0 6px 0 var(--line);background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(123,30,58,.05) 27px 28px)}
.face.front{-webkit-transform:rotateY(0deg) translateZ(1px);transform:rotateY(0deg) translateZ(1px)}
.face.back{-webkit-transform:rotateY(180deg) translateZ(1px);transform:rotateY(180deg) translateZ(1px);background-color:var(--chip)}
.face .emo{font-size:76px;line-height:1.1}
.corner{position:absolute;top:10px;left:12px;font-size:13px;color:var(--muted)}
.turn{position:absolute;bottom:10px;left:0;right:0;font-size:13px;color:var(--muted)}
.back .ru{font-size:26px;font-weight:bold;color:var(--terra);margin-bottom:10px}
.back .exb{font-size:18px;text-align:left;background:var(--card);border-radius:12px;padding:10px 12px;width:100%}
/* memory */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.mc{height:92px;cursor:pointer;position:relative}
.mf{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;border:2px solid var(--line)}
.mfront{background:var(--btn);color:var(--btnink);font-size:30px;border-color:var(--btn)}
.mback{background:var(--card);display:none}
.mc.on .mfront{display:none}
.mc.on .mback{display:flex}
.mback.es{font-size:15px;font-weight:bold;color:var(--ink)}
.mc.ok .mback{background:var(--okbg);border-color:var(--ok)}
.mc.anim{animation:mflip .28s ease-out}
@keyframes mflip{0%{transform:scaleX(.05)}100%{transform:scaleX(1)}}
/* help */
.prog{display:flex;justify-content:space-between;align-items:center;gap:6px}
.help{border:1.5px solid var(--line);background:var(--card);border-radius:999px;font-size:13px;padding:4px 10px;white-space:nowrap;color:var(--ink)}
.htab{width:100%;border-collapse:collapse;font-size:14px;line-height:1.3}
.htab th{background:var(--btn);color:var(--btnink);text-align:left;padding:7px 8px;font-size:13px}
.htab th:first-child{border-radius:10px 0 0 0}.htab th:last-child{border-radius:0 10px 0 0}
.htab td{border-bottom:1px solid var(--line);padding:6px 7px;vertical-align:top;width:50%}
.htab tr:nth-child(even) td{background:var(--chip)}
.hok{position:sticky;bottom:-16px;background:var(--card);padding:2px 0 4px}
/* tasks */
.q{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.stem{font-size:21px;margin:2px 0 6px}
.gap{display:inline-block;min-width:70px;border-bottom:2.5px dashed var(--terra);text-align:center;color:var(--terra)}
.opts{margin-top:10px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:11px 13px;margin:0 0 4px;font-size:19px;transition:background .2s}
.opt.speaking,.speaking{background:var(--hl)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.optwrap{margin-bottom:8px}
.otr{border:0;background:none;color:var(--muted);font-size:12px;padding:0 4px}
.otr-t{display:none;font-size:13px;color:var(--terra);margin-left:6px}
.otr-t.show{display:inline}
.listen{display:block;margin:10px auto;border:0;background:var(--olive);color:#fff;border-radius:999px;width:96px;height:96px;font-size:40px}
.fb{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:16px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--ink);border:1.5px solid var(--bad)}
.fbbtns{display:flex;gap:8px;margin-top:8px}
.fbbtns button{flex:1;border-radius:12px;padding:11px;border:0;font-weight:bold}
.b-again{background:var(--chip);color:var(--ink);border:1.5px solid var(--line)!important}
.b-next{background:var(--btn);color:var(--btnink)}
/* pairs */
.pairs{display:flex;gap:8px;margin-top:8px}
.pcol{flex:1;display:flex;flex-direction:column;gap:7px}
.pc{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;font-size:16px;min-height:48px}
.pc.sel{border-color:var(--terra);background:var(--chip)}
.pc.done{border-color:var(--ok);background:var(--okbg);opacity:.6}
.pc.no{border-color:var(--bad);background:var(--badbg)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mbox{background:var(--card);border-radius:18px;padding:16px;max-width:400px;width:100%;position:relative;max-height:85vh;overflow:auto}
.x{position:absolute;top:8px;right:8px;border:0;background:var(--chip);border-radius:999px;width:34px;height:34px;font-size:16px}
input.code{width:100%;font-size:20px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit}
.err{color:var(--bad);font-size:15px;min-height:20px;margin-top:6px}
.owner{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}
.ans{border-bottom:1px solid var(--line);padding:8px 0;font-size:15px}
.hero{text-align:center;padding:18px 10px 12px}
.hero .emo{font-size:52px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .25s 2}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<script>
(function(){
"use strict";

var STUDENT='Ольга';
var EVENT_URL='https://daria-talk.daria-iramain.workers.dev/event';

function lsGet(k,d){try{var v=localStorage.getItem(LS+k);return v?JSON.parse(v):d}catch(e){return d}}

 racimo:{emo:'🍇',art:'el',w:'racimo',ru:'гроздь (винограда)',ex:'Este racimo está perfecto: grande y muy dulce.',exRu:'Эта гроздь идеальная: большая и очень сладкая.'},

 colina:{emo:'⛰️',art:'la',w:'colina',ru:'холм',ex:'El viñedo está en una colina, cerca del pueblo.',exRu:'Виноградник на холме, недалеко от деревни.'},

};
function full(k){var o=W[k];return (o.art?o.art+' ':'')+o.w}

/* ---------- parts & tasks ---------- */
var PARTS=[
 {id:'p1',emo:'🍇',es:'En el viñedo',ru:'В винограднике',steps:[

   {id:'p1a2',type:'listen',es:'La vid de mi abuelo tiene cincuenta años.',opts:['Лозе моего дедушки пятьдесят лет.','Мой дедушка покупает лозу за пятьдесят евро.','Холму у деревни пятьдесят лет.'],a:0,why:'la vid = лоза, mi abuelo = мой дедушка, tiene cincuenta años = ему пятьдесят лет.'},

 ]},
 {id:'p2',emo:'🛢️',es:'La vendimia y la bodega',ru:'Сбор винограда и погреб',steps:[

function sendEvent(type,title,detail){
  try{
    if(location.hostname!=='dariairamain-blip.github.io')return;

  }catch(e){}
}
function doneDetail(){
  var ids=Object.keys(answers),ok=0,bad=[];
  ids.forEach(function(k){var a=answers[k];if(a.ok)ok++;else bad.push(a.right==='все пары'?a.q:a.right);});
  if(!ids.length||!bad.length)return 'Урок пройден полностью';
  return 'Верно '+ok+' из '+ids.length+'; ошибки: '+bad.slice(0,12).join('; ')+(bad.length>12?' …':'');
}

/* ---------- speech ---------- */
var esVoice=null;
function pickVoice(){
  try{var v=speechSynthesis.getVoices();
    esVoice=v.find(function(x){return /^es[-_]ES/i.test(x.lang)})||v.find(function(x){return /^es/i.test(x.lang)})||null;}catch(e){}
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function clean(t){
  return String(t).replace(/_{2,}/g,', ').replace(/\p{Extended_Pictographic}|️|‍/gu,'').replace(/[=→/()]/g,' ').replace(/\s+/g,' ').trim();
}
var tok=0;
function stopSpeak(){tok++;try{speechSynthesis.cancel()}catch(e){}clearSpeaking();}
function clearSpeaking(){var s=document.querySelectorAll('.speaking');for(var i=0;i<s.length;i++)s[i].classList.remove('speaking');}
function sayOne(text,el,cb){
  var fired=false;function end(){if(fired)return;fired=true;if(el)el.classList.remove('speaking');cb&&cb();}
  if(!soundOn||!('speechSynthesis' in window)){setTimeout(end,150);return;}
  var c=clean(text);if(!c){end();return;}
  try{
    var u=new SpeechSynthesisUtterance(c);u.lang='es-ES';if(esVoice)u.voice=esVoice;u.rate=0.88;
    u.onend=end;u.onerror=end;if(el)el.classList.add('speaking');
    speechSynthesis.speak(u);setTimeout(end,1800+c.length*110);
  }catch(e){end();}
}
function speakSeq(items,done){
  stopSpeak();var my=tok,i=0;
  (function nx(){if(my!==tok)return;if(i>=items.length){done&&done();return;}var it=items[i++];sayOne(it.t,it.el,function(){if(my!==tok)return;setTimeout(nx,300)});})();
}
function say(t,el){speakSeq([{t:t,el:el}]);}

function h(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function orderNoFirst(n,correct){
  var idx=[];for(var i=0;i<n;i++)idx.push(i);
  for(var k=0;k<20;k++){idx=shuffle(idx);if(idx[0]!==correct)break;}
  return idx;
}

/* ---------- part flow ---------- */
function startPart(i){
  curPart=PARTS[i];pages=[];pos=0;errs={};offered={};
  curPart.steps.forEach(function(s){
    if(s.learn)s.learn.forEach(function(k,n){pages.push({k:'learn',w:k,n:n+1,of:s.learn.length});});
    if(s.game){s.tasks.forEach(function(t,n){pages.push({k:'task',t:t,g:s.game,gname:s.name,n:n+1,of:s.tasks.length});});pages.push({k:'gend',g:s.game});}
  });
  pages.push({k:'pend'});
  renderPage();
}
function go(d){stopSpeak();closeModal();pos+=d;if(pos<0){renderHome();return;}if(pos>=pages.length){renderHome();return;}renderPage();}
function bar(){
  return '<div class="bar sans"><button data-b="home" aria-label="Меню">☰</button><button data-b="prev" aria-label="Назад">⏮</button><button data-b="rep" aria-label="Повторить звук">🔁</button><button data-b="next" aria-label="Вперёд">⏭</button>'+
  '<button data-b="snd" class="'+(soundOn?'on':'off')+'" aria-label="Звук">'+(soundOn?'🔊':'🔇')+'</button><button data-b="auto" class="'+(autoOn?'on':'off')+'" style="font-size:13px">Авто '+(autoOn?'вкл':'выкл')+'</button></div>';
}
var replay=function(){};
function wireBar(){
  [].forEach.call(app.querySelectorAll('[data-b]'),function(b){b.onclick=function(){var a=b.getAttribute('data-b');
    if(a==='home'){stopSpeak();renderHome();}
    else if(a==='prev')go(-1);else if(a==='next')go(1);else if(a==='rep')replay();
    else if(a==='snd'){soundOn=!soundOn;lsSet('sound',soundOn);if(!soundOn)stopSpeak();b.textContent=soundOn?'🔊':'🔇';b.className=soundOn?'on':'off';}
    else if(a==='auto'){autoOn=!autoOn;lsSet('auto',autoOn);b.textContent='Авто '+(autoOn?'вкл':'выкл');b.className=autoOn?'on':'off';}
  };});
  var sk=app.querySelector('[data-skip]');if(sk)sk.onclick=function(){go(1)};
}
var SKIP='<button class="skip sans" data-skip>⏭ Пропустить эту страницу</button>';

  var p=pages[pos];window.scrollTo(0,0);
  if(p.k==='learn')renderLearn(p);else if(p.k==='fc')renderFlash(p);else if(p.k==='memo')renderMemo(p);else if(p.k==='cend')renderCardsEnd(p);else if(p.k==='task')renderTask(p);else if(p.k==='gend')renderGameEnd(p);else renderPartEnd();
}

function showHelp(type,first){
  var o=HELP[type];if(!o)return;stopSpeak();
  var rows=o.r.map(function(r,i){return '<tr><td><b>'+(i+1)+'.</b> '+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join('');
  showModal('<h2 style="padding-right:36px">'+o.t+'</h2><table class="htab sans"><thead><tr><th>Что вы делаете</th><th>Что происходит</th></tr></thead><tbody>'+rows+'</tbody></table><div class="hok"><button class="big-btn" data-ok>'+(first?'Понятно, начинаем ▶':'Понятно')+'</button></div>');
  var fin=function(){closeModal();if(first&&autoOn)replay();};
  modal.querySelector('[data-ok]').onclick=fin;modal.querySelector('[data-x]').onclick=fin;
  modal.querySelector('.modal').onclick=function(e){if(e.target.classList.contains('modal'))fin();};
}
function wireHelp(){[].forEach.call(app.querySelectorAll('[data-help]'),function(b){b.onclick=function(){showHelp(b.getAttribute('data-help'),false)};});}
function autoHelp(type){wireHelp();if(lsGet('seen_'+type,false))return false;lsSet('seen_'+type,true);showHelp(type,true);return true;}

/* learn card: flip card */
function renderLearn(p){
  var o=W[p.w];
  app.innerHTML=bar()+'<div class="prog sans"><span>'+curPart.emo+' '+h(curPart.es)+' · карточка '+p.n+' из '+p.of+'</span>'+helpBtn('learn')+'</div>'+
  '<div class="flip" id="fl"><div class="flip-in" id="fi">'+
   '<div class="face front"><span class="corner sans">'+p.n+' / '+p.of+'</span><div class="emo">'+o.emo+'</div><div class="word" id="wd">'+(o.art?'<span class="art">'+o.art+'</span> ':'')+h(o.w)+'</div>'+
   '<button class="snd sans" id="sw">🔊 Слушать</button><div class="turn sans">👆 Нажмите на карточку, чтобы перевернуть</div></div>'+
   '<div class="face back"><div class="ru">'+h(o.ru)+'</div><div class="exb"><span class="small muted sans">Пример</span><br><span id="exs">'+h(o.ex)+'</span><br><button class="mini sans" id="se">🔊</button> <button class="mini sans" id="te">🌐</button><div class="tr" id="tre" style="font-size:16px">'+h(o.exRu)+'</div></div><div class="turn sans">👆 Нажмите, чтобы перевернуть обратно</div></div>'+
  '</div></div>'+
  '<button class="big-btn" id="nx">Дальше →</button>'+SKIP;
  wireBar();
  var w=document.getElementById('wd'),ex=document.getElementById('exs'),fl=document.getElementById('fl');
  function stop(e){e.stopPropagation();}
  document.getElementById('fi').onclick=function(){fl.classList.toggle('on');if(fl.classList.contains('on')&&autoOn)say(o.ex,ex);};
  document.getElementById('sw').onclick=function(e){stop(e);say(full(p.w),w)};
  document.getElementById('se').onclick=function(e){stop(e);say(o.ex,ex)};
  document.getElementById('te').onclick=function(e){stop(e);document.getElementById('tre').classList.toggle('show')};
  document.getElementById('nx').onclick=function(){go(1)};
  replay=function(){if(fl.classList.contains('on'))say(o.ex,ex);else say(full(p.w),w);};
  if(!autoHelp('learn')&&autoOn)replay();
}

/* tasks */
function record(t,label,your,ok,right){
  answers[t.id]={part:curPart.es,q:label,your:your,ok:ok,right:right,ts:Date.now()};lsSet('answers',answers);
  if(!ok){errs[pagesG()]=errs[pagesG()]||{};errs[pagesG()][t.id]=t;}
}
function pagesG(){return pages[pos].g;}
function renderTask(p){
  var t=p.t;
  var head=bar()+'<div class="prog sans"><span>'+curPart.emo+' '+h(p.gname||'')+(p.redo?' · работа над ошибками':'')+' · '+p.n+' / '+p.of+'</span>'+helpBtn(t.type)+'</div>';
  if(t.type==='pairs')return renderPairs(p,head);
  var order=orderNoFirst(t.opts.length,t.a),html=head+'<div class="card">';
  if(t.type==='emoji')html+='<div class="q sans">Что на картинке?</div><div style="text-align:center;font-size:72px;line-height:1.2">'+t.emo+'</div>';
  if(t.type==='gap')html+='<div class="q sans">Вставьте слово</div><div class="stem" id="stem">'+h(t.es).replace('___','<span class="gap">?</span>')+'</div><button class="mini sans" id="tg">🌐</button><span class="tr" id="trg" style="font-size:15px">'+h(t.tr)+'</span>';
  if(t.type==='listen')html+='<div class="q sans">Послушайте и выберите перевод</div><button class="listen" id="ls" aria-label="Слушать">🔊</button><div class="stem" id="stem" style="display:none;text-align:center">'+h(t.es)+'</div>';
  html+='<div class="opts" id="opts">';
  order.forEach(function(i){
    html+='<div class="optwrap"><button class="opt" data-i="'+i+'">'+h(t.opts[i])+'</button>'+
      (t.ru?'<button class="otr sans" data-tr="'+i+'">🌐</button><span class="otr-t sans" id="ot'+i+'">'+h(t.ru[i])+'</span>':'')+'</div>';
  });
  html+='</div><div id="fb"></div></div>'+SKIP;
  app.innerHTML=html;wireBar();
  var tg=document.getElementById('tg');if(tg)tg.onclick=function(){document.getElementById('trg').classList.toggle('show')};
  [].forEach.call(app.querySelectorAll('[data-tr]'),function(b){b.onclick=function(){document.getElementById('ot'+b.getAttribute('data-tr')).classList.toggle('show')};});
  var optEls={};[].forEach.call(app.querySelectorAll('.opt'),function(b){optEls[b.getAttribute('data-i')]=b;});
  var stem=document.getElementById('stem'),ls=document.getElementById('ls');
  if(ls)ls.onclick=function(){say(t.es)};
  var label=t.type==='emoji'?(t.emo+' — что на картинке?'):t.type==='listen'?('🎧 '+t.es):t.es;
  replay=function(){
    var seq=[];
    if(t.type==='listen')seq.push({t:t.es});
    else{if(t.type==='gap')seq.push({t:t.es,el:stem});order.forEach(function(i){seq.push({t:t.opts[i],el:optEls[i]})});}
    speakSeq(seq,function(){scrollTo(document.getElementById('opts'))});
  };
  var locked=false;
  [].forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){
    if(locked)return;locked=true;stopSpeak();
    var i=+b.getAttribute('data-i'),ok=i===t.a,right=t.opts[t.a];
    record(t,label,t.opts[i],ok,right);
    optEls[t.a].classList.add('right');if(!ok)b.classList.add('wrong');
    if(stem&&t.type==='listen')stem.style.display='block';
    if(stem&&t.type==='gap')stem.innerHTML=h(t.es).replace('___','<b style="color:var(--ok)">'+h(right)+'</b>');
    var fb=document.getElementById('fb'),sayT=t.type==='listen'?t.es:(t.type==='gap'?t.es.replace('___',right):right);
    if(ok){
      fb.innerHTML='<div class="fb ok sans">✅ ¡Muy bien!</div>';
      var mv=false;function adv(){if(mv)return;mv=true;if(pages[pos]===p)go(1);}
      speakSeq([{t:sayT}],function(){setTimeout(adv,500)});if(!soundOn)setTimeout(adv,1100);
    }else{
      setTimeout(function(){
        fb.innerHTML='<div class="fb bad sans">Правильно: <b>'+h(right)+'</b><br>'+h(t.why)+'<div class="fbbtns"><button class="b-again" id="ag">↩ Ещё раз</button><button class="b-next" id="nx">Дальше →</button></div></div>';
        document.getElementById('ag').onclick=function(){stopSpeak();renderPage();};
        document.getElementById('nx').onclick=function(){go(1)};
        scrollTo(document.getElementById('nx'));
        say(sayT);
      },1000);
    }
  };});
  if(autoHelp(t.type)){}else if(autoOn)replay();else if(t.type==='listen')setTimeout(function(){say(t.es)},300);
}

function renderPairs(p,head){
  var t=p.t,keys=t.words,left=shuffle(keys),right=shuffle(keys),sel=null,left_done=0,mist=0;
  var html=head+'<div class="card"><div class="q sans">Соедините пары</div><div class="small muted sans">Нажмите испанское слово, потом его перевод.</div><div class="pairs"><div class="pcol">';
  left.forEach(function(k){html+='<button class="pc" data-l="'+k+'">'+h(full(k))+'</button>';});
  html+='</div><div class="pcol">';
  right.forEach(function(k){html+='<button class="pc sans" data-r="'+k+'" style="font-size:15px">'+h(W[k].ru)+'</button>';});
  html+='</div></div><div id="fb"></div></div>'+SKIP;
  app.innerHTML=html;wireBar();
  replay=function(){var seq=[];left.forEach(function(k){seq.push({t:full(k),el:app.querySelector('[data-l="'+k+'"]')})});speakSeq(seq);};autoHelp('pairs');
  [].forEach.call(app.querySelectorAll('[data-l]'),function(b){b.onclick=function(){
    if(b.classList.contains('done'))return;
    [].forEach.call(app.querySelectorAll('[data-l]'),function(x){x.classList.remove('sel')});
    b.classList.add('sel');sel=b.getAttribute('data-l');say(full(sel));};});
  [].forEach.call(app.querySelectorAll('[data-r]'),function(b){b.onclick=function(){
    if(b.classList.contains('done')||!sel)return;var k=b.getAttribute('data-r'),L=app.querySelector('[data-l="'+sel+'"]');
    if(k===sel){L.classList.remove('sel');L.classList.add('done');b.classList.add('done');sel=null;left_done++;
      if(left_done===keys.length){
        var ok=mist===0;
        answers[t.id]={part:curPart.es,q:'Соедините пары: '+keys.map(full).join(', '),your:ok?'все пары верно':'ошибок: '+mist,ok:ok,right:'все пары',ts:Date.now()};lsSet('answers',answers);
        if(!ok){errs[p.g]=errs[p.g]||{};errs[p.g][t.id]=t;}
        document.getElementById('fb').innerHTML='<div class="fb ok sans">✅ ¡Perfecto! Все пары найдены.</div>';
        setTimeout(function(){if(pages[pos]===p)go(1)},1200);
      }
    }else{mist++;b.classList.add('no','shake');setTimeout(function(){b.classList.remove('no','shake')},600);}
  };});
}

function renderGameEnd(p){
  stopSpeak();
  var e=errs[p.g]?Object.keys(errs[p.g]):[];
  if(e.length){
    app.innerHTML=bar()+'<div class="card hero"><div class="emo">🧐</div><h2>Работа над ошибками?</h2><div class="sans">Ошибок в этой игре: '+e.length+'. Хотите пройти эти задания ещё раз?</div><div class="fbbtns"><button class="b-again" id="no">Нет, дальше</button><button class="b-next" id="yes">Да</button></div></div>'+SKIP;
    wireBar();replay=function(){};
    document.getElementById('yes').onclick=function(){
      var list=e.map(function(id){return errs[p.g][id]});errs[p.g]={};
      var ins=list.map(function(t,n){return {k:'task',t:t,g:p.g,gname:'',redo:true,n:n+1,of:list.length}});
      ins.push({k:'gend',g:p.g});pages.splice.apply(pages,[pos+1,0].concat(ins));go(1);};
    document.getElementById('no').onclick=function(){errs[p.g]={};go(1)};
  }else{
    app.innerHTML=bar()+'<div class="card hero"><div class="emo">🎉</div><h2>¡Muy bien!</h2><div class="sans">Игра пройдена.</div><button class="big-btn" id="nx">Дальше →</button></div>';
    wireBar();replay=function(){};document.getElementById('nx').onclick=function(){go(1)};
  }
}
function renderPartEnd(){
  stopSpeak();done[curPart.id]=true;lsSet('done',done);
  var all=PARTS.every(function(p){return done[p.id]});
  if(all&&!lsGet('sent_'+WHO,false)){sendEvent('lesson_done',document.title,doneDetail());lsSet('sent_'+WHO,true);}
  var i=PARTS.indexOf(curPart),nxt=PARTS[i+1];
  app.innerHTML=bar()+'<div class="card hero"><div class="emo">'+curPart.emo+'🎉</div><h2>¡Enhorabuena!</h2><div class="sans">Часть «'+h(curPart.es)+'» пройдена.</div>'+
   (nxt?'<button class="big-btn" id="np">'+nxt.emo+' Дальше: '+h(nxt.es)+'</button>':'<div class="sans" style="margin-top:8px">Все 18 слов ваши! 🍇</div>')+
   '<button class="ghost sans" id="hm" style="text-align:center">☰ В меню</button></div>';
  wireBar();replay=function(){};
  if(nxt)document.getElementById('np').onclick=function(){startPart(i+1)};
  document.getElementById('hm').onclick=renderHome;
}

/* ---------- card training ---------- */
var MODES={
 deck:{emo:'🃏',es:'Колода: знаю / ещё учу',ru:'Переверните карточку и отметьте: знаю или ещё учу. «Ещё учу» вернутся в конец колоды.'},
 rev:{emo:'🔄',es:'Обратные карточки',ru:'Видите русское слово — вспомните испанское и переверните карточку.'},
 aud:{emo:'🎧',es:'Карточки на слух',ru:'Слушаете испанское слово — вспомните перевод и переверните карточку.'},
 memo:{emo:'🧠',es:'Мемори',ru:'Откройте по две карточки и найдите пары: испанское слово + картинка.'}
};
function renderCardsMenu(){
  stopSpeak();
  var html='<div class="bar sans"><button id="bk">☰ Меню</button></div><h2>🃏 Тренировка с карточками</h2><div class="sans small muted">Все 18 слов модуля. Выберите игру:</div>';
  ['deck','rev','aud','memo'].forEach(function(m){var o=MODES[m];
    html+='<button class="ghost" data-m="'+m+'"><span style="font-size:22px">'+o.emo+'</span> <b>'+h(o.es)+'</b><span class="r">'+(done['c_'+m]?'✅':'›')+'</span><br><span class="muted small sans">'+h(o.ru)+'</span></button>';});
  app.innerHTML=html;window.scrollTo(0,0);
  document.getElementById('bk').onclick=renderHome;
  [].forEach.call(app.querySelectorAll('[data-m]'),function(b){b.onclick=function(){startCards(b.getAttribute('data-m'))};});
}
function startCards(m){
  curPart={id:'c_'+m,emo:MODES[m].emo,es:MODES[m].es,cards:true};pages=[];pos=0;errs={};
  if(m==='memo')pages.push({k:'memo'});
  else shuffle(Object.keys(W)).forEach(function(k){pages.push({k:'fc',mode:m,w:k});});
  pages.push({k:'cend',mode:m});
  renderPage();
}
function renderFlash(p){
  var o=W[p.w],m=p.mode,left=pages.slice(pos).filter(function(x){return x.k==='fc'}).length;
  var word=(o.art?'<span class="art">'+o.art+'</span> ':'')+h(o.w);
  var front,back;
  if(m==='deck'){front='<div class="emo">'+o.emo+'</div><div class="word" id="wd">'+word+'</div><button class="snd sans" id="sw">🔊 Слушать</button>';
    back='<div class="ru">'+h(o.ru)+'</div>';}
  else if(m==='rev'){front='<div class="emo">'+o.emo+'</div><div class="ru" style="font-size:26px;font-weight:bold;color:var(--terra)">'+h(o.ru)+'</div><div class="sans small muted" style="margin-top:8px">Как это по-испански?</div>';
    back='<div class="word" id="wd">'+word+'</div><button class="snd sans" id="sw">🔊 Слушать</button>';}
  else{front='<button class="listen" id="sw" aria-label="Слушать">🔊</button><div class="sans small muted">Что это значит?</div>';
    back='<div class="emo" style="font-size:48px">'+o.emo+'</div><div class="word" id="wd" style="font-size:26px">'+word+'</div><div class="ru">'+h(o.ru)+'</div>';}
  back+='<div class="exb"><span class="small muted sans">Пример</span><br><span id="exs">'+h(o.ex)+'</span><br><button class="mini sans" id="se">🔊</button> <button class="mini sans" id="te">🌐</button><div class="tr" id="tre" style="font-size:16px">'+h(o.exRu)+'</div></div>';
  var btns=m==='deck'?'<div class="fbbtns" id="kb" style="visibility:hidden"><button class="b-again" id="learn">😅 Ещё учу</button><button class="b-next" id="know">✅ Знаю</button></div>':'<button class="big-btn" id="nx">Дальше →</button>';
  app.innerHTML=bar()+'<div class="prog sans"><span>'+MODES[m].emo+' '+h(MODES[m].es)+' · осталось: '+left+'</span>'+helpBtn(m)+'</div>'+
   '<div class="flip" id="fl"><div class="flip-in" id="fi"><div class="face front">'+front+'<div class="turn sans">👆 Нажмите на карточку, чтобы перевернуть</div></div>'+
   '<div class="face back">'+back+'<div class="turn sans">👆 Нажмите, чтобы перевернуть обратно</div></div></div></div>'+btns+SKIP;
  wireBar();
  var fl=document.getElementById('fl'),ex=document.getElementById('exs');
  function stop(e){e.stopPropagation();}
  function wd(){return document.getElementById('wd');}
  document.getElementById('fi').onclick=function(){fl.classList.toggle('on');var on=fl.classList.contains('on');
    var kb=document.getElementById('kb');if(kb&&on){kb.style.visibility='visible';scrollTo(kb);}
    if(on&&autoOn){if(m==='deck')say(o.ex,ex);else speakSeq([{t:full(p.w),el:wd()},{t:o.ex,el:ex}]);}};
  [].forEach.call(app.querySelectorAll('#sw'),function(b){b.onclick=function(e){stop(e);say(full(p.w),wd())};});
  document.getElementById('se').onclick=function(e){stop(e);say(o.ex,ex)};
  document.getElementById('te').onclick=function(e){stop(e);document.getElementById('tre').classList.toggle('show')};
  if(m==='deck'){
    document.getElementById('know').onclick=function(){go(1)};
    document.getElementById('learn').onclick=function(){pages.splice(pages.length-1,0,{k:'fc',mode:m,w:p.w});go(1)};
  }else document.getElementById('nx').onclick=function(){go(1)};
  replay=function(){if(fl.classList.contains('on'))speakSeq([{t:full(p.w),el:wd()},{t:o.ex,el:ex}]);else if(m!=='rev')say(full(p.w),wd());};
  if(!autoHelp(m)&&autoOn&&m!=='rev')say(full(p.w),wd());
}
function flipM(el,on){el.classList.remove('anim');void el.offsetWidth;el.classList.add('anim');el.classList.toggle('on',on);}
function renderMemo(p){
  var keys=shuffle(Object.keys(W)).slice(0,6),cards=[];
  keys.forEach(function(k){cards.push({k:k,t:'es'});cards.push({k:k,t:'emo'});});
  cards=shuffle(cards);var open=[],found=0,moves=0,lock=false;
  var html=bar()+'<div class="prog sans"><span>🧠 Мемори · найдите 6 пар</span>'+helpBtn('memo')+'</div><div class="mgrid">';
  cards.forEach(function(c,i){html+='<div class="mc" data-i="'+i+'"><div class="mf mfront">🍇</div><div class="mf mback'+(c.t==='es'?' es':'')+'">'+(c.t==='es'?h(full(c.k)):'<span style="font-size:38px">'+W[c.k].emo+'</span>')+'</div></div>';});
  html+='</div><div id="fb" class="sans small muted" style="text-align:center;margin-top:8px">Ходов: 0</div>'+SKIP;
  app.innerHTML=html;wireBar();replay=function(){};autoHelp('memo');
  [].forEach.call(app.querySelectorAll('.mc'),function(el){el.onclick=function(){
    if(lock||el.classList.contains('on'))return;var c=cards[+el.getAttribute('data-i')];
    flipM(el,true);if(c.t==='es')say(full(c.k));open.push({el:el,c:c});
    if(open.length===2){moves++;lock=true;var a=open[0],b=open[1];open=[];
      document.getElementById('fb').textContent='Ходов: '+moves;
      if(a.c.k===b.c.k){setTimeout(function(){a.el.classList.add('ok');b.el.classList.add('ok');say(full(a.c.k));lock=false;found++;
        if(found===6){document.getElementById('fb').innerHTML='<div class="fb ok">✅ ¡Perfecto! Все пары найдены за '+moves+' ходов.</div><div class="fbbtns"><button class="b-again" id="again">🎲 Новая игра</button><button class="b-next" id="nx">Дальше →</button></div>';
          document.getElementById('again').onclick=function(){renderPage()};document.getElementById('nx').onclick=function(){go(1)};scrollTo(document.getElementById('nx'));}
      },350);}
      else setTimeout(function(){flipM(a.el,false);flipM(b.el,false);lock=false;},2000);
    }
  };});
}
function renderCardsEnd(p){
  stopSpeak();done[curPart.id]=true;lsSet('done',done);
  app.innerHTML=bar()+'<div class="card hero"><div class="emo">'+MODES[p.mode].emo+'🎉</div><h2>¡Muy bien!</h2><div class="sans">«'+h(MODES[p.mode].es)+'» пройдено.</div>'+
   '<button class="big-btn" id="ag">🔁 Ещё раз</button><button class="ghost sans" id="cm" style="text-align:center">🃏 Другие игры с карточками</button></div>';
  wireBar();replay=function(){};
  document.getElementById('ag').onclick=function(){startCards(p.mode)};
  document.getElementById('cm').onclick=renderCardsMenu;
}

/* my answers */
function renderAnswers(){
  stopSpeak();
  var ids=Object.keys(answers),html='<div class="bar sans"><button id="bk">☰ Меню</button></div><h2>📒 Мои ответы</h2>';
  if(!ids.length)html+='<div class="card sans">Пока здесь пусто. Ответы появятся, когда вы начнёте игры.</div>';
  else{
    var okN=ids.filter(function(k){return answers[k].ok}).length;
    html+='<div class="sans small muted">Верно: '+okN+' из '+ids.length+'. При повторном прохождении ответ перезаписывается.</div>';
    PARTS.forEach(function(p){
      var list=ids.filter(function(k){return answers[k].part===p.es});if(!list.length)return;
      html+='<h3 style="color:var(--olive);margin:14px 0 4px">'+p.emo+' '+h(p.es)+'</h3><div class="card">';
      list.forEach(function(k){var a=answers[k];
        html+='<div class="ans">'+(a.ok?'✅':'❌')+' '+h(a.q)+'<br><span class="sans small">Ваш ответ: <b>'+h(a.your)+'</b>'+(a.ok?'':' · правильно: <b>'+h(a.right)+'</b>')+'</span></div>';});
      html+='</div>';
    });
  }
  app.innerHTML=html;document.getElementById('bk').onclick=renderHome;window.scrollTo(0,0);
}

renderGate();
})();
