["Personal abbauen – die Stelle wurde gestrichen","сокращать персонал — должность сократили"],["eine Referenz geben","дать рекомендацию"],
["für … zuständig sein","отвечать за …"],["Preise und Bedingungen verhandeln","обсуждать цены и условия"],
["Kunden gewinnen","привлекать клиентов"],["Beschwerden lösen","решать жалобы"],
["Ich bin mir nicht sicher.","Я не уверена."],["nach Absprache mit …","по согласованию с …"],
["die Einarbeitung","введение в должность, обучение"],["Gehaltsvorstellungen","ожидания по зарплате"],
["Ich kann sofort anfangen.","Я могу начать сразу."],["Ich freue mich auf Ihre Rückmeldung.","Жду вашего ответа."]
];
let sound=true,auto=false,train=false,slow=false,cur=-1,lines=[],voices=[];
function loadV(){const v=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().startsWith('de'));voices=v;}
speechSynthesis.onvoiceschanged=loadV;loadV();
const dlg=document.getElementById('dlg'),nav=document.getElementById('nav');
SECTIONS.forEach((s,si)=>{const h=document.createElement('div');h.className='sec';h.id='s'+si;h.textContent=s.t;dlg.appendChild(h);
 const o=document.createElement('option');o.value=si;o.textContent=s.t;nav.appendChild(o);
 s.items.forEach(it=>{[[it[0],it[1],0],[it[2],it[3],1]].forEach(([de,ru,me])=>{
  const r=document.createElement('div');r.className='row'+(me?' me':'');const b=document.createElement('div');b.className='b';
  b.innerHTML=`<div class="who">${me?'Ich':'Arbeitgeber'}</div><div class="txt"></div>${me?'<button class="reveal">👁 Показать ответ</button>':''}<div class="tools"><button class="p">🔊</button><button class="t">🌐</button></div><div class="ru"></div>`;
  b.querySelector('.txt').textContent=de;b.querySelector('.ru').textContent=ru;r.appendChild(b);dlg.appendChild(r);
  const idx=lines.length;lines.push({b,de,me,row:r});
  b.querySelector('.p').onclick=()=>{auto=false;upd();play(idx)};
  b.querySelector('.t').onclick=()=>b.querySelector('.ru').classList.toggle('show');
  if(me)b.querySelector('.reveal').onclick=()=>{r.classList.remove('hid');play(idx)};
 });});});
const vd=document.getElementById('vocab');VOCAB.forEach(([d,r])=>{const e=document.createElement('div');e.className='v';e.innerHTML='<span><button>🔊</button> </span><span></span>';e.children[0].append(d);e.children[1].textContent=r;e.querySelector('button').onclick=()=>say(d);vd.appendChild(e);});
nav.onchange=()=>document.getElementById('s'+nav.value).scrollIntoView({behavior:'smooth',block:'start'});
function say(t,me,done){speechSynthesis.cancel();if(!sound){done&&setTimeout(done,600);return}
 const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=slow?0.75:0.95;
 if(voices.length){u.voice=voices[me&&voices.length>1?1:0]}u.onend=()=>done&&done();speechSynthesis.speak(u);}
function play(i){if(i<0||i>=lines.length)return;cur=i;lines.forEach(l=>l.b.classList.remove('playing'));const L=lines[i];
 L.b.classList.add('playing');L.b.scrollIntoView({behavior:'smooth',block:'center'});
 if(train&&L.me&&L.row.classList.contains('hid')){auto=false;upd();return}
 say(L.de,L.me,()=>{L.b.classList.remove('playing');if(auto)play(i+1)});}
function upd(){bA.classList.toggle('on',auto);bA.textContent=auto?'⏸ Авто':'▶ Авто'}
const bA=document.getElementById('bAuto');
bA.onclick=()=>{auto=!auto;upd();if(auto)play(cur<0?0:cur);else speechSynthesis.cancel()};
document.getElementById('bSound').onclick=e=>{sound=!sound;e.target.classList.toggle('on',sound);e.target.textContent=sound?'🔊 Звук':'🔇 Звук';if(!sound)speechSynthesis.cancel()};
document.getElementById('bSlow').onclick=e=>{slow=!slow;e.target.classList.toggle('on',slow)};
document.getElementById('bTrain').onclick=e=>{train=!train;e.target.classList.toggle('on',train);lines.forEach(l=>{if(l.me)l.row.classList.toggle('hid',train)})};
document.getElementById('pPrev').onclick=()=>{auto=false;upd();play(Math.max(0,cur-1))};
document.getElementById('pNext').onclick=()=>{auto=false;upd();play(cur+1)};
document.getElementById('pPlay').onclick=()=>{if(speechSynthesis.speaking){speechSynthesis.cancel()}else play(cur<0?0:cur)};
</script></body></html>
