<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estar + gerundio — игра-урок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F0FF;--surface:#FFFFFF;--ink:#1F1640;--muted:#6A6290;
  --violet:#6C3BFF;--violet-soft:#E6DEFF;--pink:#FF4F8B;--sun:#FFC83D;
  --mint:#10A877;--mint-soft:#D7F6EA;--coral:#E2482F;--coral-soft:#FFE1DA;
  --line:#DDD6F5;--on-violet:#FFFFFF;--tv:#2A1F63;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151032;--surface:#221A4C;--ink:#F1EEFF;--muted:#B0A8D8;
  --violet:#9C7BFF;--violet-soft:#33296B;--pink:#FF77A6;--sun:#FFD465;
  --mint:#3CD8A4;--mint-soft:#15433A;--coral:#FF7E68;--coral-soft:#4A221C;
  --line:#3A3170;--on-violet:#151032;--tv:#0E0A26;}}
:root[data-theme="dark"]{
  --bg:#151032;--surface:#221A4C;--ink:#F1EEFF;--muted:#B0A8D8;
  --violet:#9C7BFF;--violet-soft:#33296B;--pink:#FF77A6;--sun:#FFD465;
  --mint:#3CD8A4;--mint-soft:#15433A;--coral:#FF7E68;--coral-soft:#4A221C;
  --line:#3A3170;--on-violet:#151032;--tv:#0E0A26;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:700 18px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,serif;line-height:1.1;margin:0;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px 120px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:15px 22px;background:var(--violet);color:var(--on-violet);font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 rgba(0,0,0,.22);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--violet);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.wide{width:100%}
.btn-row{display:flex;gap:12px;margin-top:22px}
.btn-row .btn{flex:1}
.btn-row .btn.back{flex:0 0 58px;padding:15px 0}

/* Gate */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);z-index:60}
#gate .box{max-width:380px;width:100%;text-align:center}
#gate .emo{font-size:72px}
#gate h1{font-size:2.2rem;margin:8px 0}
#gate p{color:var(--muted);margin:0 0 20px;font-weight:500}
#gate input{width:100%;padding:15px;border:3px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font:800 1.15rem Nunito,sans-serif;text-align:center;text-transform:uppercase;letter-spacing:.06em}
#gate .btn{margin-top:12px}
#gate .err{color:var(--coral);min-height:1.5em;margin-top:10px;font-size:.95rem}

/* Map */
.map-head{display:flex;align-items:center;gap:10px;margin:8px 0 6px}
.map-head h1{font-size:2rem;flex:1}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.95rem;white-space:nowrap}
.icon-btn{background:var(--surface);border:2px solid var(--line);border-radius:50%;width:44px;height:44px;font-size:20px}
.map-sub{color:var(--muted);margin:0 0 20px;font-weight:500}
.path{list-style:none;margin:0;padding:0;position:relative}
.node{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:8px 0;text-align:left}
.ch-head{font:800 1.25rem "Bricolage Grotesque",serif;margin:26px 0 8px;padding:8px 14px;background:var(--surface);border:2px solid var(--line);border-radius:14px}
.path .ch-head:first-child{margin-top:0}
.bubble{position:relative;flex:0 0 72px;height:72px;border-radius:50%;background:var(--violet-soft);display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 5px 0 var(--line)}
.node.done .bubble{background:var(--sun);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.node.done .bubble::after{content:"⭐";position:absolute;right:-6px;top:-6px;font-size:22px}
.node.next .bubble{background:var(--violet);box-shadow:0 5px 0 rgba(0,0,0,.25);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.node .t{display:block;font-size:1.08rem}
.node .s{display:block;color:var(--muted);font-weight:500;font-size:.9rem}
.map-foot{margin-top:28px;color:var(--muted);font-size:.8rem;font-weight:500}

/* Play */
#play{min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 18px;max-width:560px;margin:0 auto}
.top .icon-btn{flex:0 0 44px}
.bar{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--pink));border-radius:999px;transition:width .35s}
#combo{min-width:52px;text-align:right;color:var(--pink)}
#stage{max-width:560px;margin:0 auto;padding:10px 18px 190px}
.q-title{font-size:1.55rem;margin:6px 0 16px}
.q-hint{color:var(--muted);font-weight:500;margin:-8px 0 16px}
.big-emo{font-size:96px;text-align:center;line-height:1.2;margin:4px 0 14px}
.sent{font-size:1.4rem;text-align:center;margin:0 0 18px}
.slot{display:inline-block;min-width:3.5em;border-bottom:4px solid var(--violet);color:var(--violet);padding:0 6px}
.slot.ok{color:var(--mint);border-color:var(--mint)} .slot.bad{color:var(--coral);border-color:var(--coral)}
.opts{display:grid;gap:12px}
.opt{width:100%;text-align:left;background:var(--surface);border:3px solid var(--line);border-radius:16px;padding:15px 18px;font-weight:800;font-size:1.08rem;box-shadow:0 4px 0 var(--line)}
.opt.ok{border-color:var(--mint);background:var(--mint-soft);box-shadow:0 4px 0 var(--mint)}
.opt.bad{border-color:var(--coral);background:var(--coral-soft);box-shadow:0 4px 0 var(--coral)}
.opts.chips{grid-template-columns:repeat(3,1fr)} .opts.chips .opt{text-align:center;padding:14px 6px}
.opts.tiles{grid-template-columns:repeat(3,1fr)} .opts.tiles .opt{text-align:center;font-size:52px;padding:14px 0;line-height:1.1}
.opts.tf{grid-template-columns:1fr 1fr} .opts.tf .opt{text-align:center;font-size:1.15rem}

/* Scene (mini cartoon) */
.tv{position:relative;background:var(--tv);border-radius:22px;padding:34px 14px 18px;text-align:center;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.tv::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,rgba(156,123,255,.45),transparent 60%)}
.tv-tag{position:absolute;left:14px;top:10px;color:#FFD465;font-size:.85rem}
.tv-tag::before{content:"● ";color:#FF4F8B}
.actor{position:relative;font-size:104px;line-height:1.15}
.cap{position:relative;display:inline-block;margin-top:8px;background:rgba(0,0,0,.45);color:#fff;border-radius:12px;padding:8px 14px;font-size:1.25rem}
.ru{color:var(--muted);text-align:center;font-weight:500;margin:12px 0 0}
.a-wiggle{animation:wiggle .9s ease-in-out infinite}
.a-bounce{animation:bounce .8s ease-in-out infinite}
.a-float{animation:float 2.2s ease-in-out infinite}
.a-swim{animation:swim 1.8s ease-in-out infinite}
.a-shake{animation:shake .5s ease-in-out infinite}
@keyframes wiggle{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes bounce{50%{transform:translateY(-16px)}}
@keyframes float{50%{transform:translateY(-8px) scale(1.03)}}
@keyframes swim{25%{transform:translateX(-22px)}75%{transform:translateX(22px)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Rule cards */
.rule{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:22px;text-align:center}
.rule .emo{font-size:60px}
.rule h2{font-size:1.5rem;margin:8px 0 12px}
.rule .body{font-weight:500;font-size:1.05rem}
.rule .body b{color:var(--violet)}
.formula{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.formula span{background:var(--violet-soft);border-radius:12px;padding:8px 12px;font-weight:800;color:var(--violet)}
.formula .plus{background:none;color:var(--pink);font-size:1.5rem}
.mini{display:grid;grid-template-columns:auto auto;gap:4px 18px;justify-content:center;text-align:left}

/* Flip card */
.flip{display:block;width:100%;height:280px;border:0;background:none;padding:0;perspective:1000px}
.flip .inner{position:relative;display:block;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--line);background:var(--surface);box-shadow:0 6px 0 var(--line)}
.face.back{transform:rotateY(180deg);background:var(--violet);color:var(--on-violet);border-color:var(--violet)}
.face .big{font-size:80px;line-height:1.1}
.face b{font-size:2rem;font-family:"Bricolage Grotesque",serif}
.face small{font-weight:500;opacity:.8;font-size:.95rem}

/* Build (words / letters) */
.answer-line{min-height:64px;border-bottom:3px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:8px 0;margin-bottom:22px}
.answer-line.ok{border-color:var(--mint)} .answer-line.bad{border-color:var(--coral)}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tok{background:var(--surface);border:3px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800;font-size:1.1rem;box-shadow:0 4px 0 var(--line)}
.tok.letter{width:50px;height:54px;padding:0;font-size:1.4rem}
.tok:disabled{opacity:.15;box-shadow:none}
.tok.in{background:var(--violet-soft);border-color:var(--violet)}

/* Memory */
.mem{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:480px){.mem{grid-template-columns:repeat(4,1fr)}}
.card{height:86px;border-radius:16px;border:3px solid var(--line);background:var(--violet);color:var(--on-violet);font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.card.open{background:var(--surface);color:var(--ink)}
.card.got{background:var(--mint-soft);border-color:var(--mint);color:var(--ink);box-shadow:none}
.card.miss{background:var(--coral-soft);border-color:var(--coral);color:var(--ink)}

.match2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol{display:grid;gap:12px}
.mbtn{height:62px;border-radius:16px;border:3px solid var(--line);background:var(--surface);font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 var(--line)}
.mbtn.sel{border-color:var(--violet);background:var(--violet-soft);box-shadow:0 4px 0 var(--violet)}
.mbtn.got{border-color:var(--mint);background:var(--mint-soft);box-shadow:none;opacity:.75}
.mbtn.miss{border-color:var(--coral);background:var(--coral-soft);box-shadow:0 4px 0 var(--coral)}
/* Morph animation */
.morph{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:20px 16px;text-align:center}
.m-emo{font-size:52px}
.m-word{position:relative;display:flex;justify-content:center;align-items:baseline;font:800 clamp(2.6rem,13vw,3.6rem)/1.2 "Bricolage Grotesque",serif;min-height:1.4em;margin:6px 0 10px}
.end{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:baseline;transition:max-width .6s,opacity .6s,transform .7s,background .3s}
.old{max-width:2.2em;color:var(--ink);border-radius:10px}
.neu{max-width:0;opacity:0;color:var(--mint)}
.scis{position:absolute;top:-.55em;left:50%;font-size:.55em;opacity:0;transition:opacity .3s,transform .6s}
.morph.s1 .old{color:var(--coral);background:var(--coral-soft)}
.morph.s1 .scis{opacity:1;transform:translateX(.6em)}
.morph.s2 .scis{opacity:0;transform:translateX(1.6em) rotate(-30deg)}
.morph.s2 .old,.morph.s3 .old{max-width:0;opacity:0;transform:translateY(.8em) rotate(25deg)}
.morph.s3 .neu{max-width:4.5em;opacity:1}
.morph.s3 .m-word{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.08)}}
.m-steps{list-style:none;padding:0;margin:0 auto 14px;max-width:320px;text-align:left;font-weight:500}
.m-steps li{padding:6px 10px;border-radius:10px;opacity:.35;transition:opacity .3s,background .3s}
.m-steps li.on{opacity:1}
.morph.s1 li[data-s="1"],.morph.s2 li[data-s="2"],.morph.s3 li[data-s="3"]{background:var(--violet-soft)}
.m-rule{display:inline-block;background:var(--sun);color:#1F1640;border-radius:12px;padding:8px 16px;font-weight:800;font-size:1.2rem}
.tr-ru{font-size:1.5rem}
.tr-hint{text-align:center;margin:0 0 16px}
.big-rule{font-size:2rem;font-family:"Bricolage Grotesque",serif;color:var(--violet)}
@media (prefers-reduced-motion:reduce){.end,.scis{transition:none}.morph.s3 .m-word{animation:none}}
/* Talk */
.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:10px}
.bub{max-width:88%;padding:12px 14px;border-radius:20px;font-size:1.15rem}
.bub.bot{align-self:flex-start;background:var(--surface);border:3px solid var(--line);display:flex;gap:10px;align-items:center;border-bottom-left-radius:6px}
.bub.bot small{display:block;color:var(--muted);font-weight:500;font-size:.9rem}
.bub.bot .round-play{width:46px;height:46px;font-size:20px}
.bot-ava{font-size:40px;line-height:1}
.bub.me{align-self:flex-end;background:var(--violet);color:var(--on-violet);border-bottom-right-radius:6px}
.talk-pic{font-size:80px;margin:0}
.mic{display:flex;align-items:center;justify-content:center;margin:8px auto 6px;width:112px;height:112px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:48px;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.mic:disabled{opacity:.35;box-shadow:none}
.mic.rec{background:var(--coral);animation:pulse 1s ease-in-out infinite}
.mic-hint{text-align:center;color:var(--muted);font-weight:500;margin:0}
.live{text-align:center;min-height:1.6em;margin:10px 0}
.talk-ctrl{display:flex;gap:10px}
.talk-ctrl .btn{flex:1;padding:12px 10px;font-size:.95rem}
.type-box{margin-top:14px}
.privacy{color:var(--muted);font-weight:500;font-size:.78rem;text-align:center;margin-top:16px}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}}
/* Link box */
.link-box{background:var(--surface);border:3px solid var(--sun);border-radius:18px;padding:14px 16px;margin:6px 0 4px}
.link-step{font-weight:500;margin:4px 0 10px}
.link-url{background:var(--bg);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem;word-break:break-all;margin-bottom:12px;-webkit-user-select:all;user-select:all}
.m-ru{margin-top:12px;font-weight:700;font-size:1.1rem;color:var(--violet);opacity:0;transition:opacity .4s}
.morph.s3 .m-ru{opacity:1}
.mini3{display:grid;grid-template-columns:auto auto auto;gap:6px 12px;justify-content:center;text-align:left;font-size:.95rem}
.mini3 i{font-style:normal;color:var(--muted);font-weight:500}
.vocab{margin-top:28px;background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:10px 14px;font-weight:500;font-size:.92rem}
.vocab summary{font-weight:800;cursor:pointer;color:var(--violet)}
.vocab ul{list-style:none;margin:8px 0 0;padding:0}
.vocab li{padding:4px 0;border-top:1px solid var(--line)}
.vocab li b{color:var(--ink)}
.dlg{display:grid;gap:10px}
.dl-line{display:flex;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.dl-body{flex:1}
.dl-who{display:block;font-size:.8rem;color:var(--muted);font-weight:800}
.dl-text{font-weight:600;font-size:1.05rem}
.dl-text b{color:var(--pink)}
.dl-line .round-play{width:44px;height:44px;font-size:20px;flex:0 0 44px}
.dlg-tr{margin-top:16px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:500}
.dlg-tr summary{font-weight:800;color:var(--violet);cursor:pointer}
.dlg-tr ul{list-style:none;padding:0;margin:8px 0 0}
.dlg-tr li{padding:6px 0;border-top:1px solid var(--line)}
.dlg-tr li u{text-decoration:none;color:var(--pink);font-weight:800}
.tr-banner{background:var(--violet-soft);color:var(--ink);border-radius:14px;padding:10px 14px;margin:-4px 0 14px;font-weight:700;font-size:1rem}
.btn.skip{padding:11px 16px;font-size:.95rem;margin:0 0 16px;box-shadow:none}
.prep-ru{display:block;margin-top:2px;color:var(--muted);font-weight:600;font-size:.92rem}
.dl-trbtn{display:inline-block;margin-top:6px;border:0;background:var(--violet-soft);color:var(--violet);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:800}
.dl-ru{display:block;margin-top:5px;color:var(--muted);font-weight:600;font-size:.95rem}
/* Logs */
.log-sum{background:var(--surface);border:3px solid var(--violet);border-radius:18px;padding:16px;margin-bottom:22px}
.log-sum h2,.log-h{font-size:1.4rem;margin-bottom:10px}
.sum-total{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.sum-total span{border-radius:12px;padding:8px 14px;font-size:1.15rem}
.s-ok{background:var(--mint-soft);color:var(--mint)} .s-bad{background:var(--coral-soft);color:var(--coral)} .s-pct{background:var(--violet-soft);color:var(--violet)}
.sum-table{width:100%;border-collapse:collapse;font-size:.95rem}
.sum-table th{text-align:left;color:var(--muted);font-weight:700;padding:6px 4px;border-bottom:2px solid var(--line)}
.sum-table th:not(:first-child),.sum-table td:not(:first-child){text-align:center;width:3em}
.sum-table td{padding:7px 4px;border-bottom:1px solid var(--line)}
.n-ok{color:var(--mint)} .n-bad{color:var(--muted)} .n-bad.hot{color:var(--coral);font-weight:800}
.log-lvl{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.log-lvl h3{font-size:1.15rem}
.log-meta{color:var(--muted);font-weight:500;font-size:.88rem;margin:2px 0 8px}
.log-list{list-style:none;margin:0;padding:0}
.log-list li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.95rem}
.log-ic{flex:0 0 auto}
.log-q{display:block}
.log-a{display:block;color:var(--muted);font-weight:500}
.log-list li.bad .log-a{color:var(--coral)}
/* Timer */
.timer{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:0 0 18px}
.timer i{display:block;height:100%;width:100%;background:var(--sun)}

/* Listen */
.big-play{display:flex;align-items:center;justify-content:center;margin:6px auto 22px;width:120px;height:120px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:52px;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.round-play{flex:0 0 auto;width:54px;height:54px;border-radius:50%;border:3px solid var(--line);background:var(--surface);font-size:24px;box-shadow:0 4px 0 var(--line)}

.type-in{width:100%;padding:15px;border:3px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font:800 1.3rem Nunito,sans-serif;text-align:center}

/* Feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:18px 18px calc(52px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .25s}
.sheet.show{transform:none}
.sheet.ok{background:var(--mint-soft)} .sheet.bad{background:var(--coral-soft)}
.sheet .in{max-width:560px;margin:0 auto}
.sheet .msg{font-size:1.2rem;margin-bottom:12px}
.sheet.ok .msg{color:var(--mint)} .sheet.bad .msg{color:var(--coral)}
.sheet .msg small{display:block;color:var(--ink);font-weight:500;font-size:1rem;margin-top:4px}
.sheet.ok .btn{background:var(--mint)} .sheet.bad .btn{background:var(--coral)}

/* Done */
#done{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#done .emo{font-size:90px}
#done h2{font-size:2.1rem;margin:6px 0}
#done .stars{font-size:44px;letter-spacing:6px;margin:6px 0}
#done p{color:var(--muted);font-weight:500;margin:0 0 22px}
#done .btn{width:100%;margin-top:12px}
.confetti{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:45;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}

/* Watermark */
#wm-bar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));font:500 .75rem Nunito,sans-serif;color:var(--muted);text-align:center}
#wm-bg{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.045;overflow:hidden}
#wm-bg div{position:absolute;inset:-50%;transform:rotate(-24deg);font:800 17px Nunito,sans-serif;color:var(--ink);line-height:5;word-spacing:3em}

@media (prefers-reduced-motion:reduce){
  .a-wiggle,.a-bounce,.a-float,.a-swim,.a-shake,.node.next .bubble{animation:none}
  .flip .inner,.sheet,.bar i{transition:none}
}
</style>
</head>
<body>

<div id="gate" role="dialog" aria-labelledby="gate-title">
  <div class="box">
    <div class="emo" aria-hidden="true">🎮</div>
    <h1 id="gate-title">Estar + gerundio</h1>
    <p>Введи личный код от преподавателя</p>
    <input id="code" type="text" autocomplete="off" placeholder="Код доступа" aria-label="Код доступа">
    <button class="btn wide" id="enter">Начать</button>
    <div class="err" id="gate-err" role="alert"></div>
  </div>
</div>

<div id="map" hidden><div class="wrap" id="map-in"></div></div>
<div id="logs" hidden><div class="wrap" id="logs-in"></div></div>

<div id="play" hidden>
  <div class="top">
    <button class="icon-btn" id="quit" aria-label="Выйти на карту">✕</button>
    <div class="bar" role="progressbar" aria-label="Прогресс уровня"><i id="bar-fill"></i></div>
    <span id="combo" aria-live="polite"></span>
  </div>
  <div id="stage"></div>
</div>

<div class="sheet" id="sheet" role="status" aria-live="polite">
  <div class="in"><div class="msg" id="sheet-msg"></div><button class="btn wide" id="sheet-next">Дальше</button></div>
</div>

<div id="done" hidden>
  <div class="box" style="max-width:380px;width:100%">
    <div class="emo" aria-hidden="true">🎉</div>
    <h2>Уровень пройден!</h2>
    <div class="stars" id="done-stars"></div>
    <p id="done-text"></p>
    <button class="btn" id="done-next">Следующий уровень</button>
    <button class="btn ghost" id="done-map">На карту</button>
  </div>
</div>

<div id="wm-bg" aria-hidden="true" hidden><div id="wm-bg-text"></div></div>
<div id="wm-bar" hidden></div>

let LEVELS = null;
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openVault(code){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  for(const v of VAULT){
    try{
      const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64d(v.s), iterations: 100000, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
      const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64d(v.iv)}, key, b64d(v.c));
      return JSON.parse(new TextDecoder().decode(pt));
    }catch(e){}
  }
  return null;
}

let esVoice = null;
function pickVoice(){ if(!("speechSynthesis" in window)) return; const v = speechSynthesis.getVoices(); esVoice = v.find(x => x.lang === "es-ES") || v.find(x => x.lang && x.lang.startsWith("es")) || null; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t, done){
  if(!("speechSynthesis" in window)){ if(done) done(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = "es-ES"; u.rate = .85; if(esVoice) u.voice = esVoice;
  if(done){ let fired = false, sto = null; const fin = () => { if(fired) return; fired = true; clearTimeout(sto); done(); }; u.onend = fin; u.onerror = fin; sto = setTimeout(fin, Math.min(12000, 1500 + t.length * 110)); }
  speechSynthesis.speak(u);
}
let actx;
function tones(notes, type, vol, step){
  if(P.mute) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i * step;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + step + .08);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + step + .1);
    });
  }catch(e){}
}

const GLOSS_ONE = new Set(["a","o","y"]);
const glow = x => x.toLowerCase();
function vocabFor(it){
  const T = [];
  const add = x => { if(typeof x === "string") T.push(x.replace(/<\/?i[^>]*>/g, "").replace(/<[^>]+>/g, " ").replace(/\([^)]*\)/g, " ")); };
  const addAll = a => (a || []).forEach(add);
  switch(it.t){
    case "scene": add(it.es); break;
    case "morph": add(it.stem + it.old); add(it.stem + it.neu); break;
    case "choice": add(it.q); add(it.big); addAll(it.opts); break;
    case "rule": add(it.h); add(it.body); break;
    case "flash": add(it.inf); add(it.ger); break;
    case "pic": addAll(it.opts); break;
    case "match": (it.pairs || []).forEach(addAll); break;
    case "listen": add(it.say); break;
    case "order": addAll(it.words); break;
    case "tf": add(it.s); break;
    case "chips": add(it.s); addAll(it.opts); break;
    case "letters": add(it.inf); break;
    case "type": add(it.q); break;
    case "talk": add(it.q); break;
    case "translate": add(it.a[0]); break;
    case "dialog": it.lines.forEach(l => add(l[1].replace(/\*\*/g, ""))); break;
    case "dq": add(it.q); addAll(it.opts); break;
    case "audio": it.lines.forEach(l => add(l[1])); break;
    case "aq": add(it.q); addAll(it.opts); break;
    case "prep": it.rows.forEach(r => add(r[0])); break;
  }
  const out = [], seen = new Set();
  T.forEach(t => {
    const re = /[A-Za-zÁÉÍÓÚÑÜáéíóúñüÇĞİÖŞçğıöş]+/g; let m;
    while((m = re.exec(t))){
      const prev = t[m.index - 1] || " ", nx = t[m.index + m[0].length] || " ";
      if(prev === "-" || nx === "_" || nx === "-") continue;
      const w = glow(m[0]);
      if(w.length < 2 && !GLOSS_ONE.has(w)) continue;
      const e = GLOSS[w];
      if(e && !seen.has(e)){ seen.add(e); out.push(e); }
    }
  });
  return out;
}
function appendVocab(it){
  const list = vocabFor(it); if(!list.length) return;
  const d = el("details", "vocab"); if(!["listen","audio","aq"].includes(it.t)) d.open = true;

  const ul = el("ul");

  d.append(ul); stage.append(d);
}

function logSummary(){
  const rows = []; let ok = 0, all = 0;
  LEVELS.forEach((L, i) => {
    const g = P.logs && P.logs[i]; if(!g || !g.entries.length) return;
    const r = g.entries.filter(e => e.ok).length, n = g.entries.length;
    rows.push({title: g.title, ok: r, bad: n - r, done: g.done}); ok += r; all += n;
  });
  return {rows, ok, bad: all - ok, all};
}
function logText(){
  const sm = logSummary();
  const lines = ["Estar + gerundio: ответы ученика", "", "РЕЗЮМЕ", "Всего: ✅ " + sm.ok + "  ❌ " + sm.bad + " (" + (sm.all ? Math.round(sm.ok / sm.all * 100) : 0) + "% верно)"];
  sm.rows.forEach(r => lines.push(r.title + ": ✅ " + r.ok + "  ❌ " + r.bad + (r.done ? "" : " (не закончен)")));
  lines.push("", "ДЕТАЛИ", "");
  LEVELS.forEach((L, i) => {
    const g = P.logs && P.logs[i]; if(!g || !g.entries.length) return;
    lines.push(g.title + " (" + g.date + ")" + (g.done ? "" : " — не закончен") + ": верно " + g.right + " из " + g.scored);

}

/* ===== Движок уровня ===== */
let LI, L, idx, right, scored, combo, answered, timer, curIt, curQ = "", curA = "—";
const stage = $("#stage");
function startLevel(i){
  LI = i; L = LEVELS[i]; idx = 0; right = 0; scored = 0; combo = 0;
  if(!P.logs) P.logs = {};
  P.logs[i] = {title: L.icon + " " + L.title, date: new Date().toLocaleString("ru-RU"), done: false, right: 0, scored: 0, entries: []}; save();
  $("#map").hidden = true; $("#play").hidden = false; $("#combo").textContent = "";
  render();
}
$("#quit").onclick = () => { clearTimer(); hideSheet(); if(window.speechSynthesis) speechSynthesis.cancel(); showMap(); };
let morphTO = [];
function clearTimer(){ if(timer){ clearInterval(timer); timer = null; } morphTO.forEach(clearTimeout); morphTO = []; }
function hideSheet(){ $("#sheet").className = "sheet"; }
function render(){
  clearTimer(); hideSheet(); answered = false;
  $("#bar-fill").style.width = (idx / L.items.length * 100) + "%";
  stage.innerHTML = ""; window.scrollTo(0, 0);
  const it = L.items[idx]; curIt = it; curQ = descQ(it); curA = "—"; R[it.t](it); appendVocab(it);
}
function playLines(a){
  let i = 0; const cur = L.items[idx];
  const go = () => { if(i >= a.lines.length || L.items[idx] !== cur) return; speak(a.lines[i++][1], () => setTimeout(go, 450)); };
  go();
}
function backBtn(){
  const b = el("button", "btn ghost back", "◀"); b.setAttribute("aria-label", "Назад");
  b.disabled = idx === 0;
  b.onclick = () => { if(idx > 0){ idx--; render(); } };
  return b;
}
function next(){ idx++; if(idx >= L.items.length) finish(); else render(); }
const PRAISE = ["¡Muy bien!", "¡Genial!", "¡Perfecto!", "¡Eso es!", "¡Increíble!"];
function trKey(it){
  if(!it) return null;
  switch(it.t){
    case "pic": return it.a;
    case "listen": return it.say;
    case "chips": return it.s.replace("___", it.a).replace(/\s*\(.*?\)/, "");
    case "tf": return it.s;
    case "choice": return it.big || it.q;
    case "dq": return it.a;
    case "aq": return it.a;
  }
  return null;
}
function showTr(){
  const k = trKey(curIt), ru = k && TRMAP[k]; if(!ru) return;
  const b = el("div", "tr-banner"); b.textContent = "🇷🇺 " + ru;
  const h = stage.querySelector(".q-title");
  if(h && h.nextSibling) stage.insertBefore(b, h.nextSibling); else stage.prepend(b);
}
function answer(ok, wrongMsg, sayAfter){
  if(answered) return; answered = true; clearTimer(); scored++;
  showTr();
  const lg = P.logs[LI]; if(lg){ lg.entries.push({q: curQ, a: curA, ok: ok, c: descA(curIt)}); lg.right = right + (ok ? 1 : 0); lg.scored = scored; }
  const sh = $("#sheet");
  if(ok){ right++; combo++; P.xp += 10; sfxOk(); $("#sheet-msg").innerHTML = PRAISE[Math.floor(Math.random() * PRAISE.length)] + " +10 ⚡"; sh.className = "sheet show ok"; }
  else { combo = 0; sfxBad(); $("#sheet-msg").innerHTML = "Почти!<small>" + wrongMsg + "</small>"; sh.className = "sheet show bad"; }
  $("#combo").textContent = combo >= 2 ? "🔥" + combo : "";
  const nbtn = $("#sheet-next");
  if(sayAfter && window.speechSynthesis){
    nbtn.disabled = true; nbtn.textContent = "🔊 Слушаем…";
    setTimeout(() => speak(sayAfter, () => { nbtn.disabled = false; nbtn.textContent = "Дальше"; nbtn.focus(); }), 350);
  } else { nbtn.disabled = false; nbtn.textContent = "Дальше"; }
  save(); $("#sheet-next").focus();
}
$("#sheet-next").onclick = () => { hideSheet(); next(); };
function finish(){
  $("#bar-fill").style.width = "100%";
  P.done[LI] = true; P.xp += 20; if(P.logs[LI]) P.logs[LI].done = true; save(); sfxWin();
  const pct = scored ? right / scored : 1;
  const stars = pct >= .9 ? 3 : pct >= .6 ? 2 : 1;
  $("#done-stars").textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
  $("#done-text").textContent = (scored ? "Верно " + right + " из " + scored + ". " : "") + "+20 ⚡ за уровень";
  const nb = $("#done-next"); nb.hidden = LI >= LEVELS.length - 1;
  $("#done").hidden = false; confetti();
}
$("#done-next").onclick = () => { $("#done").hidden = true; startLevel(LI + 1); };
$("#done-map").onclick = showMap;
function confetti(){
  if(reduced) return;
  const cols = ["#6C3BFF", "#FF4F8B", "#FFC83D", "#10A877", "#4FC3FF"];
  for(let i = 0; i < 40; i++){
    const c = el("span", "confetti");
    c.style.left = Math.random() * 100 + "vw"; c.style.background = cols[i % cols.length];
    c.style.animationDelay = Math.random() * .5 + "s";
    document.body.append(c); setTimeout(() => c.remove(), 2600);
  }
}

/* helper: варианты ответа */
function options(list, correct, cls, sayAfter, onPick){
  const box = el("div", "opts" + (cls ? " " + cls : ""));
  shuffle(list).forEach(o => {
    const b = el("button", "opt"); b.textContent = o;
    b.onclick = () => {
      if(answered) return;
      const ok = o === correct; curA = o;
      b.classList.add(ok ? "ok" : "bad");
      if(!ok) [...box.children].forEach(x => { if(x.textContent === correct) x.classList.add("ok"); });
      if(onPick) onPick(o, ok);
      answer(ok, "Правильно: <b>" + correct + "</b>", sayAfter);
    };
    box.append(b);
  });
  return box;
}

  morph(it){
    const inf = it.stem + it.old, ger = it.stem + it.neu;
    stage.append(el("h2", "q-title", "Смотри, как это работает"));
    const m = el("div", "morph");
    m.innerHTML = '<div class="m-emo">' + it.emo + '</div>' +
      '<div class="m-word"><span class="stem">' + it.stem + '</span><span class="end old">' + it.old + '</span><span class="end neu">' + it.neu + '</span><span class="scis" aria-hidden="true">✂️</span></div>' +
      '<ol class="m-steps"><li data-s="1">Берём глагол: <b>' + inf + '</b></li><li data-s="2">Отрезаем <b>-' + it.old + '</b> ✂️</li><li data-s="3">Добавляем <b>-' + it.neu + '</b> → <b>' + ger + '</b></li></ol>' +
      '<div class="m-rule">' + it.rule + '</div>' + (it.ru ? '<div class="m-ru">' + it.ru + '</div>' : '');
    stage.append(m);
    const setStep = n => {
      m.className = "morph s" + n;
      m.querySelectorAll("li").forEach(li => li.classList.toggle("on", +li.dataset.s <= n));
    };
    const run = () => {
      clearTimer(); setStep(0);
      if(reduced){ setStep(3); speak(inf + ". " + ger); return; }
      speak(inf);
      morphTO.push(setTimeout(() => setStep(1), 400));
      morphTO.push(setTimeout(() => { setStep(2); tones([520], "triangle", .1, .1); }, 1600));
      morphTO.push(setTimeout(() => { setStep(3); tones([660, 990], "triangle", .12, .09); }, 2800));
      morphTO.push(setTimeout(() => speak(ger), 3300));
    };
    const row = el("div", "btn-row");
    const rep = el("button", "btn ghost", "🔁 Ещё раз"); rep.onclick = run;
    const nb = el("button", "btn", "Дальше"); nb.onclick = next;
    row.append(backBtn(), rep, nb); stage.append(row);
    run();
  },
  choice(it){
    stage.append(el("h2", "q-title", it.q));
    if(it.big) stage.append(el("p", "sent big-rule", it.big));
    stage.append(options(it.opts, it.a, it.cls || "", it.say));
  },
  scene(it){
    const tv = el("div", "tv", '<span class="tv-tag">Мини-мультик ' + (idx + 1) + '/' + L.items.length + '</span><div class="actor a-' + it.anim + '">' + it.pic + '</div><div class="cap">' + it.es + '</div>');
    stage.append(tv, el("p", "ru", it.ru));
    const row = el("div", "btn-row"); const rep = el("button", "btn ghost", "🔊 Ещё раз"); rep.onclick = () => speak(it.es);
    const nb = el("button", "btn", "Дальше"); nb.onclick = next; row.append(backBtn(), rep, nb); stage.append(row);
    speak(it.es);
  },
  rule(it){
    stage.append(el("div", "rule", '<div class="emo">' + it.emo + '</div><h2>' + it.h + '</h2><div class="body">' + it.body + '</div>'));
    const nb = el("button", "btn", "Понятно 👍"); nb.onclick = next; const row = el("div", "btn-row"); row.append(backBtn(), nb); stage.append(row);
  },
  flash(it){
    stage.append(el("h2", "q-title", "Нажми на карточку"));
    const card = el("button", "flip", '<span class="inner"><span class="face front"><span class="big">' + it.emo + '</span><b>' + it.inf + '</b><small>нажми, чтобы перевернуть</small></span><span class="face back"><span class="big">' + it.emo + '</span><b>' + it.ger + '</b><small>' + it.ru + '</small></span></span>');
    card.setAttribute("aria-label", "Карточка " + it.inf + ", нажми, чтобы перевернуть");
    const nb = el("button", "btn", "Дальше"); nb.disabled = true; nb.onclick = next; const frow = el("div", "btn-row");
    card.onclick = () => { card.classList.toggle("on"); if(card.classList.contains("on")){ speak(it.ger); nb.disabled = false; } };
    frow.append(backBtn(), nb); stage.append(card, frow);
  },
  pic(it){
    stage.append(el("h2", "q-title", "¿Qué está haciendo?"), el("div", "big-emo", it.pic), options(it.opts, it.a, "", it.a));
  },
  chips(it){
    const parts = it.s.split("___");
    const sent = el("p", "sent"); const slot = el("span", "slot", "?");
    sent.append(parts[0], slot, parts[1]);
    stage.append(el("h2", "q-title", "Выбери форму estar"), sent,
      options(it.opts, it.a, "chips", it.s.replace("___", it.a), (o, ok) => { slot.textContent = o; slot.classList.add(ok ? "ok" : "bad"); }));
  },
  tf(it){
    stage.append(el("h2", "q-title", "Верно или нет?"));
    const tm = el("div", "timer", "<i></i>"); stage.append(tm);
    if(it.pic) stage.append(el("div", "big-emo", it.pic));
    stage.append(el("p", "sent", it.s));
    const right = it.ok ? "Верно ✅" : "Неверно ❌";
    const msg = "Правильный ответ: <b>" + right + "</b>" + (it.why ? " " + it.why : "");
    const box = el("div", "opts tf");
    [["Верно ✅", true], ["Неверно ❌", false]].forEach(([label, v]) => {
      const b = el("button", "opt", label);
      b.onclick = () => { if(answered) return; curA = label; const ok = v === it.ok; b.classList.add(ok ? "ok" : "bad"); answer(ok, msg); };
      box.append(b);
    });
    stage.append(box);
    const T = 8000, t0 = Date.now(), fill = tm.firstChild;
    timer = setInterval(() => {
      const left = 1 - (Date.now() - t0) / T; fill.style.width = Math.max(0, left * 100) + "%";
      if(left <= 0){ clearTimer(); curA = "⏰ время вышло"; answer(false, "Время вышло ⏰ " + msg); }
    }, 80);
  },
  listen(it){
    stage.append(el("h2", "q-title", "Что ты слышишь?"));
    const p = el("button", "big-play", "🔊"); p.setAttribute("aria-label", "Прослушать фразу"); p.onclick = () => speak(it.say);
    stage.append(p, options(it.opts, it.a, "tiles", it.say));
    speak(it.say);
  },
  order(it){
    stage.append(el("h2", "q-title", "Собери фразу"), el("p", "q-hint", it.ru));
    const line = el("div", "answer-line"), pool = el("div", "pool");
    const target = it.words.join(" "); const picked = [];
    let order = shuffle(it.words); if(order.join(" ") === target) order = order.reverse();
    order.forEach(w => {
      const b = el("button", "tok"); b.textContent = w;
      b.onclick = () => {
        if(answered) return;
        b.disabled = true; const c = el("button", "tok in"); c.textContent = w; picked.push(w);
        c.onclick = () => { if(answered) return; c.remove(); b.disabled = false; picked.splice(picked.indexOf(w), 1); };
        line.append(c);
        if(picked.length === it.words.length){
          curA = [...line.children].map(x => x.textContent).join(" "); const ok = curA === target;
          line.classList.add(ok ? "ok" : "bad");
          answer(ok, "Правильно: <b>" + target + "</b>", target);
        }
      };
      pool.append(b);
    });
    stage.append(line, pool);
  },
  letters(it){
    stage.append(el("h2", "q-title", "Собери слово"), el("div", "big-emo", it.emo), el("p", "sent", it.inf + " → ?"));
    const line = el("div", "answer-line"), pool = el("div", "pool");
    let letters = shuffle(it.word.split("")); if(letters.join("") === it.word) letters = letters.reverse();
    const used = [];
    letters.forEach(ch => {
      const b = el("button", "tok letter"); b.textContent = ch;
      b.onclick = () => {
        if(answered) return;
        b.disabled = true; used.push(b);
        const c = el("span", "tok letter in"); c.style.display = "inline-flex"; c.style.alignItems = "center"; c.style.justifyContent = "center"; c.textContent = ch; line.append(c);
        if(used.length === it.word.length){
          const got = used.map(x => x.textContent).join(""); curA = got; const ok = got === it.word;
          line.classList.add(ok ? "ok" : "bad");
          answer(ok, "Правильно: <b>" + it.word + "</b>", it.word);
        }
      };
      pool.append(b);
    });
    const undo = el("button", "btn ghost wide", "⌫ Стереть букву"); undo.style.marginTop = "20px";
    undo.onclick = () => { if(answered || !used.length) return; used.pop().disabled = false; line.lastChild.remove(); };
    stage.append(line, pool, undo);
  },
  match(it){
    stage.append(el("h2", "q-title", "Соедини пары"), el("p", "q-hint", "Нажми глагол слева, потом его форму справа"));
    const grid = el("div", "match2"), colL = el("div", "mcol"), colR = el("div", "mcol");
    let sel = {L:null, R:null}, found = 0, miss = 0, lock = false;
    const mk = (txt, k, side) => {
      const b = el("button", "mbtn"); b.textContent = txt;
      b.onclick = () => {
        if(lock || b.classList.contains("got")) return;
        if(sel[side]) sel[side].b.classList.remove("sel");
        sel[side] = {b, k}; b.classList.add("sel"); speak(txt);
        if(sel.L && sel.R){
          const a = sel.L, c = sel.R; sel = {L:null, R:null};
          if(a.k === c.k){
            [a.b, c.b].forEach(x => { x.classList.remove("sel"); x.classList.add("got"); x.disabled = true; });
            found++; tones([700, 1050], "triangle", .12, .08);
            if(found === it.pairs.length) setTimeout(() => { curA = "все пары, ошибок: " + miss; answer(miss <= 2, "Все пары найдены! В следующий раз постарайся с меньшим числом ошибок."); }, 400);
          } else {
            miss++; lock = true; sfxBad();
            [a.b, c.b].forEach(x => { x.classList.remove("sel"); x.classList.add("miss"); });
            setTimeout(() => { [a.b, c.b].forEach(x => x.classList.remove("miss")); lock = false; }, 650);
          }
        }
      };
      return b;
    };
    shuffle(it.pairs.map((p, i) => [p[0], i])).forEach(([t, k]) => colL.append(mk(t, k, "L")));
    shuffle(it.pairs.map((p, i) => [p[1], i])).forEach(([t, k]) => colR.append(mk(t, k, "R")));
    grid.append(colL, colR); stage.append(grid);
  },
  type(it){
    stage.append(el("h2", "q-title", "Напиши герундий"), el("div", "big-emo", it.emo), el("p", "sent", it.q));
    const inp = el("input", "type-in"); inp.type = "text"; inp.autocomplete = "off"; inp.setAttribute("autocapitalize", "off"); inp.setAttribute("aria-label", "Ответ");
    const nb = el("button", "btn wide", "Проверить"); nb.style.marginTop = "16px";
    const plain = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    const check = () => { if(answered || !inp.value.trim()) return; curA = inp.value.trim(); answer(plain(inp.value) === plain(it.a), "Правильно: <b>" + it.a + "</b>", it.a); };
    nb.onclick = check; inp.addEventListener("keydown", e => { if(e.key === "Enter") check(); });
    stage.append(inp, nb);
  }
};

if(P.code) unlock(P.code);
</script>
</body>
</html>
