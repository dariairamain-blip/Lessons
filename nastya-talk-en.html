<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Разговор с героем</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: hero picker → full-screen chat, input docked at the bottom */
:root{
  --bg:#F3F0FF; --card:#FFFFFF; --ink:#1F1640; --muted:#6A6290; --line:#DDD6F5;
  --sea:#6C3BFF; --pink:#FF4F8B; --sel:#E6DEFF; --me:#6C3BFF; --meink:#FFFFFF; --fix:#FFF4D6; --fixink:#6B4A00;
  --display:"Bricolage Grotesque",Georgia,serif; --body:Nunito,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151032; --card:#221A4C; --ink:#F1EEFF; --muted:#B0A8D8; --line:#3A3170; --sea:#9C7BFF; --pink:#FF77A6; --sel:#33296B; --me:#7B55FF; --fix:#3B2F12; --fixink:#F5C66B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151032; --card:#221A4C; --ink:#F1EEFF; --muted:#B0A8D8; --line:#3A3170; --sea:#9C7BFF; --pink:#FF77A6; --sel:#33296B; --me:#7B55FF; --fix:#3B2F12; --fixink:#F5C66B; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:700 16px/1.45 var(--body)}
.wrap{max-width:560px;margin:0 auto;padding-block:0 var(--dockh,170px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:2px solid var(--line);display:grid;gap:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.who{font-weight:900;font-size:16px}
.tag{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--pink)}
.snd{display:flex;gap:6px;flex-wrap:wrap}
.msg.me .mtag{color:#fff;opacity:.85}
.snd button,.back{font:800 12.5px var(--body);border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 9px;cursor:pointer}
.snd button.on{border-color:#10A877;color:#10A877}
h1{font:800 26px/1.15 var(--display);margin:4px 0 0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-weight:600;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{display:grid;gap:4px;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:12px;cursor:pointer;box-shadow:0 4px 0 var(--line);font:inherit}
.hero .e{font-size:34px;line-height:1}
.hero b{font-size:16px}
.hero small{font-weight:600;font-size:13px;color:var(--muted);line-height:1.3}
.hero:focus-visible,.send:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.chat{display:grid;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg .av{font-size:30px;line-height:1;flex:none}
.bub{border-radius:18px 18px 18px 4px;padding:10px 12px;background:var(--card);border:2px solid var(--line);max-width:85%;min-width:0;display:grid;gap:6px}
.bub .pt{font-size:17px;overflow-wrap:anywhere}
.bub .ru{font-size:14px;color:var(--muted);font-weight:600}
.bub .tools{display:flex;gap:6px;flex-wrap:wrap}
.bub .tools button{border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 13px var(--body);cursor:pointer;padding:5px 9px;border-radius:999px}
.bub .tools button.on{background:var(--sel)}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--me);color:var(--meink);border-color:var(--me);border-radius:18px 18px 4px 18px}
.fix{background:var(--fix);color:var(--fixink);border-radius:12px;padding:8px 10px;font-size:14px;font-weight:700}
.typing{color:var(--muted);font-style:italic;font-weight:600}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.dock textarea{flex:1;min-width:0;min-height:46px;max-height:120px;resize:none;font:700 16px var(--body);border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--card);color:var(--ink)}
.send{flex:none;border:0;border-radius:14px;background:var(--sea);color:#fff;font:900 18px var(--body);width:52px;height:48px;cursor:pointer}
.send:disabled{opacity:.5}
.hint{font-size:13px;color:var(--muted);font-weight:600;margin:6px auto 0;max-width:560px}
.note{font-size:13.5px;color:var(--muted);font-weight:600;margin:0}
.w{cursor:pointer;border-radius:6px;padding:0 1px;border-bottom:1.5px dotted rgba(108,59,255,.45)}
.w.on{background:var(--sel);color:var(--sea)}
.gl{background:var(--sel);border-radius:12px;padding:8px 10px;font-size:14.5px;display:grid;gap:6px}
.gl .hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gl .hd b{font-size:16px}
.gl button{border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 13px var(--body);cursor:pointer;padding:4px 9px;border-radius:999px}
.gl .more{display:grid;gap:6px;font-weight:600}
.gl .ex{display:flex;gap:6px;align-items:flex-start}
.gl .ex small{display:block;color:var(--muted)}
[hidden]{display:none!important}
.sos{flex:none;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:900 13px var(--body);height:48px;padding:0 10px;cursor:pointer;line-height:1.1}
.sos.on{background:#E2482F;border-color:#E2482F;color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion: reduce){.sos.on{animation:none}}
.helps{max-width:560px;margin:0 auto 8px;display:grid;gap:6px}
.help{background:var(--card);border:2px solid #F2B632;border-radius:14px;padding:8px 10px;display:grid;gap:6px;font-size:14.5px}
.help .hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.help .ru{color:var(--muted)}
.help .pt{font-weight:900;color:var(--sea);font-size:16px}
.help button{border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 12.5px var(--body);cursor:pointer;padding:4px 8px;border-radius:999px}
.help .more{display:grid;gap:6px;font-weight:600}
.help .ex{display:flex;gap:6px;align-items:flex-start}.help .ex small{display:block;color:var(--muted)}
.sosnote{max-width:560px;margin:0 auto 6px;font-size:13.5px;font-weight:800;color:#E2482F}
.chips{max-width:560px;margin:0 auto 6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;font-weight:800;color:var(--muted)}
.chip{border:2px solid #F2B632;background:#FFF6DC;color:#7A5200;border-radius:999px;padding:4px 10px;font:800 13.5px var(--body);cursor:pointer}
.help .x{margin-left:auto}
.msg.me .new{border-bottom:2px dotted currentColor}
.modal{position:fixed;inset:0;background:#0008;z-index:30;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--card);color:var(--ink);border-radius:18px;padding:16px;max-width:460px;max-height:86vh;overflow:auto;display:grid;gap:10px;font-size:15px;line-height:1.4}
.modal h2{margin:0;font-size:19px}.modal ol{margin:0;padding-left:20px;display:grid;gap:6px}.modal p{margin:0;color:var(--muted);font-size:14px}
.modal .box{position:relative;max-height:78vh;font-size:14.5px;padding-top:14px}.modal ol{font-size:14.5px;gap:4px}.modal h2{padding-right:40px;font-size:18px}
.modal .mx{position:sticky;top:0;justify-self:end;margin:-6px -6px -40px 0;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font:900 17px var(--body);cursor:pointer;z-index:2}
.modal .box > .ok:last-child{position:sticky;bottom:-16px;box-shadow:0 -8px 12px var(--card)}
.modal .ok{border:0;border-radius:14px;background:#6C3BF5;color:#fff;font:900 16px var(--body);padding:12px;cursor:pointer}
.mics{max-width:560px;margin:0 auto 8px;display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
.mic{border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:900 15px var(--body);min-height:48px;padding:6px 10px;cursor:pointer}
.mic.on{background:#E2482F;border-color:#E2482F;color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none}}
.codebox{display:grid;gap:10px}.codebox input{width:100%;min-width:0;box-sizing:border-box}.codebox input{font:800 20px var(--body);text-align:center;letter-spacing:.15em;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.mtag{display:block;margin-top:4px;font-size:12px;font-weight:800;color:var(--muted)}
.rep{display:grid;gap:8px}.rep h2{margin:0;font-size:19px}.rep .lv{font-weight:900;color:#6C3BF5}
.rep .mi{background:var(--fix);color:var(--fixink);border-radius:12px;padding:8px 10px;font-size:14px}
.rep .mi b{display:block}.rep .row{display:flex;gap:8px;flex-wrap:wrap}
.rep button.sec{border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 14px var(--body);border-radius:14px;padding:10px 12px;cursor:pointer;flex:1 1 auto}
.rep .day{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:left;background:var(--card);color:var(--ink);font:600 14px var(--body);cursor:pointer;display:grid;gap:2px}
.rep .day small{color:var(--muted)}
.rep .opt{border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--ink);font:800 15px var(--body);cursor:pointer;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center}
.rep .opt.ok{border-color:#10A877;background:#E3F7EF;color:#0B6B4C}.rep .opt.no{border-color:#E2482F;background:#FDE8E4;color:#8A2414}
.rep .q{font-size:16px;font-weight:800}.rep .toast{font-weight:800;color:#10A877}
.prog{margin-top:12px;width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);font:900 16px var(--body);border-radius:16px;padding:12px;cursor:pointer}
.dash{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:8px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.dash .st{display:flex;gap:10px;flex-wrap:wrap;font-weight:900;font-size:15px}
.dash small{color:var(--muted);font-weight:700;font-size:13px}
.barx{height:12px;background:var(--sel);border-radius:99px;overflow:hidden}.barx i{display:block;height:100%;background:linear-gradient(90deg,var(--sea),var(--pink));border-radius:99px}
.sit{background:var(--card);border:2px solid #F2B632;border-radius:18px;padding:12px;display:grid;gap:6px}
.sit .k{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#B7791F}
.sit b{font-size:16px}.sit small{color:var(--muted);font-weight:700;font-size:13.5px}
.sit button,.pbtn{border:0;border-radius:14px;background:var(--sea);color:#fff;font:900 15px var(--body);padding:10px 12px;cursor:pointer}
.tools2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools2 .tool:last-child:nth-child(odd){grid-column:1/-1}
.tool{border:2px solid var(--line);background:var(--card);color:var(--ink);font:900 14.5px var(--body);border-radius:14px;padding:11px 8px;cursor:pointer;min-height:48px}
.goal{background:#FFF6DC;color:#7A5200;border:2px solid #F2B632;border-radius:14px;padding:8px 10px;font-size:14px;font-weight:800}
.rep .card{min-width:min(260px,70vw);border:2px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px;text-align:center}
.rep .card .f{font:800 24px/1.2 var(--display);overflow-wrap:anywhere}.rep .card .bk{font-size:17px;color:var(--muted)}
.rep .vrow{display:flex;flex-wrap:wrap;gap:6px}.rep .vrow button{border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 13px var(--body);border-radius:999px;padding:6px 10px;cursor:pointer}
.rep .vrow button.on{border-color:var(--sea);background:var(--sel);color:var(--sea)}
.rep input,.rep textarea{font:700 16px var(--body);border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
.rep .fact{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
.rep .fact button{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:800 13px var(--body);padding:3px 8px;cursor:pointer}
.rep .hl{display:grid;gap:4px;border-radius:12px;padding:8px 10px;background:var(--sel);font-size:14.5px}.rep .hl.me{background:var(--me);color:var(--meink)}
.rep .hl .fx{font-size:13px;background:var(--fix);color:var(--fixink);border-radius:8px;padding:4px 6px}
.rep .emo{display:flex;flex-wrap:wrap;gap:6px}.rep .emo button{font-size:24px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:4px 8px;cursor:pointer}.rep .emo button.on{border-color:var(--sea);background:var(--sel)}
.rep small{font-size:13px}
.addk{border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 13px var(--body);cursor:pointer;padding:4px 9px;border-radius:999px}
.stopb{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--dockh,170px) - 8px);z-index:20;border:0;border-radius:999px;background:#E2482F;color:#fff;font:900 16px var(--body);padding:12px 18px;box-shadow:0 6px 18px #0004;cursor:pointer}
.pv{max-width:560px;margin:0 auto 8px;display:flex;align-items:center;gap:8px;background:#FFF6DC;border:2px solid #F2B632;color:#7A5200;border-radius:14px;padding:8px 10px;font:800 14px var(--body)}
.pv span{flex:1}.pv button{border:2px solid #F2B632;background:#fff;color:#7A5200;border-radius:999px;font:900 14px var(--body);padding:6px 12px;cursor:pointer}
.warn{background:var(--fix);color:var(--fixink);border-radius:14px;padding:12px;font-size:14.5px}
</style>
<div class="wrap" id="wrap">
  <div class="bar"><div class="top"><span class="tag" id="who">Разговор с героем</span>
    <div class="snd"><button type="button" id="hlp" aria-label="Как говорить с героем">❓</button><button type="button" id="mdl" hidden>🧠 Sonnet</button><button type="button" id="sttb" hidden>🎧 Распознавание: iPhone</button><button type="button" id="ttsb" hidden>🗣 Голос героя: iPhone</button><button type="button" id="mute">🔊 Звук: вкл</button><button type="button" id="auto" class="on">🗣 Автоозвучка: вкл</button></div></div></div>
  <div id="app"></div>
  <p class="own" style="text-align:center;font-size:12.5px;color:var(--muted);margin:18px 0 0">© Daria Botina</p>
</div>
<div class="dock" id="dock" hidden><div class="helps" id="helps"></div><div class="chips" id="chips" hidden></div><div class="pv" id="pv" hidden><span id="pvt"></span><button type="button" id="pved">✏️ Исправить</button></div><div class="mics" id="mics" hidden><button class="mic" id="micpt" type="button">🎤 Говорить</button><button class="mic" id="micru" type="button">🆘 Скажу по-русски</button></div><div class="in">
  <textarea id="box" rows="1" placeholder="Write in English…" aria-label="Твоё сообщение"></textarea>
  <button class="send" id="send" type="button" aria-label="Отправить">➤</button></div></div>
<script>
const HEROES = [
 {id:"client", words:{}, e:"🧑‍💼", n:"Клиентка Emma", d:"Клиентка из Чикаго. Заказывает переводы: сроки, цена, правки.", br:false,
  role:"You are Emma, a friendly but demanding American client from Chicago (marketing manager in a logistics company) who orders translations from the learner's translation agency. You discuss deadlines, prices, terminology, edits and feedback. Professional, polite, sometimes in a hurry.",
  hi:"Hi Anastasia! Thanks for the last translation. Do you have a minute to talk about a new project?", hiru:"Привет, Анастасия! Спасибо за прошлый перевод. Есть минутка обсудить новый проект?"},
 {id:"colleague", words:{}, e:"👩‍💻", n:"Коллега Sarah", d:"Проект-менеджер агентства переводов в Нью-Йорке. Проекты, дедлайны, кофе.", br:false,
  role:"You are Sarah, an energetic American project manager at a partner translation agency in New York and the learner's colleague. You chat about projects, deadlines, tricky texts, CAT tools, clients and work-life balance, like colleagues over coffee.",
  hi:"Morning, Anastasia! How's your week going? Busy with projects?", hiru:"Доброе утро, Анастасия! Как проходит неделя? Много проектов?"},
 {id:"mentor", words:{}, e:"🎤", n:"Наставник James", d:"Опытный устный переводчик из Лондона. Как сказать естественнее.", br:true,
  role:"You are James, a warm, witty senior conference interpreter from London and the learner's mentor. You love language: idioms, phrasal verbs, collocations, how natives really say things, translation traps between Russian and English. You give one practical tip at a time.",
  hi:"Hello, Anastasia! Lovely to see you. Shall we play with some English today?", hiru:"Здравствуй, Анастасия! Рад тебя видеть. Поиграем сегодня с английским?"},
 {id:"hr", words:{}, e:"📞", n:"HR Rachel", d:"Рекрутер международной компании. Тренировка собеседования.", br:false,
  role:"You are Rachel, a friendly American recruiter at an international company hiring translators and localization specialists. You run a realistic but kind job interview: typical interview questions, follow-up questions, and at the end short honest feedback.",
  hi:"Hi Anastasia, thanks for joining the call! Can you hear me okay?", hiru:"Здравствуйте, Анастасия, спасибо, что подключились! Хорошо меня слышите?"},
 {id:"friend", words:{}, e:"🇺🇸", n:"Подруга Jessica", d:"Американка из Калифорнии, тоже мама. Семья, дети, сериалы.", br:false,
  role:"You are Jessica, a cheerful American woman from San Diego, California, the learner's friend. You are also a mom of a teenager who is finishing high school. You chat about family, kids, school and university plans, TV series, food, weekends and everyday life, react with emotion and share your own stories.",
  hi:"Hey Nastya! It's been ages! How are you and the family?", hiru:"Привет, Настя! Сто лет не виделись! Как ты и семья?"},
 {id:"masha", words:{}, e:"👩", n:"Подруга Маша", d:"Подруга из Новосибирска, 10 лет жила в США. Говорит только по-английски и учит.", br:false,
  role:"You are Masha, the learner's Russian friend from Novosibirsk who lived in the USA for 10 years and speaks excellent, natural American English. You talk with Nastya ONLY in English (that is your deal, to help her practise). You are warm, supportive and a bit funny. Very often you give her one friendly tip in \"fix\": how to say her phrase more naturally or more beautifully, like a native speaker would.",
  hi:"Hey Nastya! Our English-only deal is on, okay? So, how was your day?", hiru:"Привет, Настя! Наш уговор «только по-английски» в силе, ок? Ну, как прошёл твой день?"}
];
const RULES = h => `${h.role}
You are a conversation partner for Anastasia (Nastya). ABOUT HER (use naturally, one topic at a time, never list it all): Russian woman from Novosibirsk, Russia; works as a translator at a translation agency; her English is about B2.1 (good grammar and vocabulary, but little speaking practice, so she wants fluency and confidence); she is married to Vitaly; her son Artem is 17 (finishing school, thinking about exams and university). Ask about her translation work (projects, clients, tricky texts, deadlines), life in Novosibirsk, her family (Vitaly, Artem), her plans, hobbies and travels — real-life topics she can talk about.
How to reply:
- Stay in character. Reply ONLY in natural, friendly ${h.br ? "British" : "American"} English.
- LENGTH: usually 3–4 short sentences. Only if the meaning really needs more (she asks for instructions, a story, an explanation) use up to 7 sentences. If even 7 is not enough, stop after 7 and add an 8th sentence asking "Shall I tell you more?"; if she says yes, continue with the next part, again at most 7 sentences.
- LEVEL: she is about B2.1 — speak naturally at B2 level and match what you see in her messages. At most 5% of your words and grammar may be one level higher. No rare idioms unless you explain them.
- Usually end with ONE short question back to keep the talk going.
- Every time vary your words: never reuse a sentence you already said in this chat.
- If her last message has a mistake, give a short friendly correction in Russian: show the corrected English phrase and explain in max 12 words why. If no mistake, "fix" is "".
- If she wrote a word in Russian, use the English word naturally in your reply and mention it in "fix" («устала» — tired).
- If her message ends with a note about words she did not know (said in Russian), often — about 2 times out of 3, not always — ask her a short question that uses one of those English words, so the word sticks.
- Never repeat the same correction twice in a row; if the message is fine, praise briefly in "fix" only every few turns, otherwise leave it empty.
Inside text values use « » for quotes, never the double-quote character.

const TO_RU = /(^|\s)in\s+russian\b[.,!?]*/i;
const TO_PT = /(^|\s)по[\s-]?английски(?=[\s.,!?]|$)[.,!?]*/i;
function listen(mode, empty){

  const r = new REC(); r.lang = ru ? "ru-RU" : lang(); r.interimResults = true; r.continuous = true; r.maxAlternatives = 1;
  const box = $("#box"); const base = box.value && !/\s$/.test(box.value) ? box.value + " " : box.value;
  let fin = "", next = null, heard = false;
  const me = {r, btn, manual: false}; recNow = me;
  $("#micpt").classList.toggle("on", !ru); $("#micru").classList.toggle("on", ru);
  $("#micpt").textContent = ru ? "🎤 Говорить" : "● Слушаю · закончила — нажми, отправлю";
  $("#micru").textContent = ru ? "● Слушаю 🇷🇺 · назад: «по-английски»" : "🆘 Скажу по-русски";
  try{ speechSynthesis.cancel(); }catch(e){}
  r.onresult = e => { if(next) return; let interim = ""; heard = true; S.usedStt = "iPhone";
    for(let i = e.resultIndex; i < e.results.length; i++){ const t = e.results[i][0].transcript; if(e.results[i].isFinal) fin += t + " "; else interim += t; }
    const txt = (fin + interim).replace(/\s+/g, " ");

    if(m){ next = ru ? "pt" : "ru"; box.value = (base + txt.slice(0, m.index)).replace(/\s+$/, "") + " "; renderChips(); try{ r.stop(); }catch(err){} return; }
    box.value = base + txt.trim(); renderChips(); };
  r.onerror = e => { if(e.error === "not-allowed" || e.error === "service-not-allowed"){ me.manual = true; micHelp(); } };
  r.onend = () => {
    box.value = box.value.replace(/\s+$/, "") + (box.value.trim() ? " " : ""); renderChips();
    const done = () => { if(recNow === me) recNow = null; $("#micpt").classList.remove("on"); $("#micru").classList.remove("on"); $("#micpt").textContent = "🎤 Говорить"; $("#micru").textContent = "🆘 Скажу по-русски"; };

// ---- repair an AI answer that is not clean JSON (extra commas, or cut off at the end)
function repairJSON(t){
  const i0 = t.indexOf("{"); if(i0 < 0) return null; let s = t.slice(i0);
  const tryP = x => { try{ return JSON.parse(x); }catch(e){ try{ return JSON.parse(x.replace(/,\s*([}\]])/g, "$1")); }catch(e2){ return null; } } };
  let st = [], inS = false, esc = false, safe = null;
  for(let i = 0; i < s.length; i++){ const c = s[i];
    if(inS){ if(esc) esc = false; else if(c === "\\") esc = true; else if(c === '"') inS = false; continue; }
    if(c === '"') inS = true;
    else if(c === "{" || c === "["){ st.push(c === "{" ? "}" : "]"); }
    else if(c === "}" || c === "]"){ st.pop(); safe = {i: i + 1, st: st.slice()}; if(!st.length){ const r = tryP(s.slice(0, i + 1)); if(r) return r; break; } }
    else if(c === ","){ safe = {i, st: st.slice()}; }
  }
  if(!safe) return null;
  return tryP(s.slice(0, safe.i) + safe.st.slice().reverse().join(""));
}

// ================= Daily summaries (one per date) =================
const DAYS = (() => {
  const KS = "nastya_daysum", DAY = 864e5;
  const load = (k, d) => { try{ return JSON.parse(localStorage.getItem(k) || "null") || d; }catch(e){ return d; } };
  const store = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
  const dkey = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const dname = k => fromKey(k).toLocaleDateString("ru-RU", {day: "numeric", month: "long"});
  const btn = (txt, cls, fn) => { const x = h("button", cls || "sec", txt); x.type = "button"; x.onclick = fn; return x; };
  const reported = () => load("nastya_sessions", []).filter(x => x.report);
  const byDay = () => { const g = {}; reported().forEach(x => { (g[dkey(x.date)] = g[dkey(x.date)] || []).push(x); }); return g; };
  const mins = k => Math.round(((load("nastya_days", {})[k] || {}).s || 0) / 60);
  const DPROMPT = (k, reps) => `Daily summary of Anastasia's English conversation practice on ${k} (Russian speaker). Talk reports of this day:
${reps.map(r => r.hero + " | level " + r.report.level + " | topic: " + (r.report.topic || "") + " | mistakes: " + (r.report.mistakes || []).map(m => m.bad + "→" + m.good).join("; ") + " | words: " + (r.report.words || []).map(w => w[0] + "=" + w[1]).join(", ")).join("\n").slice(0, 6000)}
Reply in Russian with only JSON: {"level": "level of the day, e.g. B1+", "praise": "1–2 warm sentences: what went well today", "mistakes": [{"bad": "mistake", "good": "correct form", "why": "max 10 Russian words"}] (max 3, no repeats), "words": [["English", "Russian"]] (max 8), "tip": "one tip for tomorrow, max 15 Russian words"}`;
  function fromOne(x){ const r = x.report; return {n: 1, level: r.level, praise: r.praise, mistakes: r.mistakes || [], words: r.words || [], tip: r.tip}; }
  async function make(k, reps){
    const D = load(KS, {});
    if(reps.length === 1){ D[k] = fromOne(reps[0]); store(KS, D); return D[k]; }
    const r = await sample.json(DPROMPT(k, reps), {modelTier: "quick"});
    D[k] = {n: reps.length, level: String(r.level || ""), praise: String(r.praise || ""), mistakes: Array.isArray(r.mistakes) ? r.mistakes.slice(0, 3) : [], words: Array.isArray(r.words) ? r.words.slice(0, 8) : [], tip: String(r.tip || "")};
    store(KS, D); return D[k];
  }
  async function auto(){
    if(!sample) return; const g = byDay(), D = load(KS, {}), today = dkey(Date.now());
    for(const k of Object.keys(g).sort().reverse().slice(0, 5)){
      if(k === today) continue; if(D[k] && D[k].n === g[k].length) continue;
      try{ await make(k, g[k]); }catch(e){ return; }
    }
  }
  function dayModal(k, reps, show){
    document.querySelectorAll(".modal.repm").forEach(x => x.remove());
    const m = h("div", "modal repm"); m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true"); const b = h("div", "box rep"); m.append(b); m.onclick = e => { if(e.target === m) m.remove(); }; document.body.append(m);
    const today = k === dkey(Date.now());
    b.append(h("h2", "", "📅 " + dname(k) + (today ? " · сегодня" : "")), h("div", "", reps.length + " разг." + (mins(k) ? " · " + mins(k) + " мин" : "")));
    const draw = d => { const box = h("div", "rep");
      const lv = h("div", ""); lv.append("Уровень дня: "); lv.append(h("span", "lv", d.level || "—")); box.append(lv);
      if(d.praise) box.append(h("div", "", "🎉 " + d.praise));
      (d.mistakes || []).forEach(x => { const q = h("div", "mi"); q.append(h("span", "", "«" + x.bad + "» → "), h("b", "", x.good), h("small", "", x.why || "")); box.append(q); });
      if((d.words || []).length) box.append(h("div", "", "🆕 " + d.words.map(w => w[0] + " — " + w[1]).join(" · ")));
      if(d.tip) box.append(h("div", "", "👉 " + d.tip)); return box; };
    const slot = h("div", ""); b.append(slot);
    const D = load(KS, {});
    if(today) slot.append(h("div", "goal", "⏳ День ещё идёт — итог дня будет готов завтра. Итоги разговоров — ниже."));
    else if(D[k] && D[k].n === reps.length) slot.append(draw(D[k]));
    else if(sample){ slot.append(h("div", "", "Готовлю итог дня…")); make(k, reps).then(d => { slot.innerHTML = ""; slot.append(draw(d)); }).catch(() => { slot.innerHTML = ""; slot.append(h("div", "warn", "Итог дня не получился — попробуй позже.")); }); }
    b.append(h("b", "", "💬 Разговоры этого дня"));
    reps.slice().sort((a, c) => a.id - c.id).forEach(x => { const d = h("button", "day"); d.type = "button";
      d.append(h("span", "", new Date(x.date).toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"}) + " · " + x.hero), h("small", "", "Уровень " + x.report.level + (x.report.topic ? " · " + x.report.topic : "")));
      d.onclick = () => show(x, false); b.append(d); });
    b.append(btn("Закрыть", "ok", () => m.remove()));
  }
  function list(b, ses, show){
    const g = byDay(), D = load(KS, {}), act = load("nastya_days", {});
    const keys = Object.keys(g).concat(Object.keys(act).filter(k => act[k] && ((act[k].m || 0) > 0 || (act[k].s || 0) >= 60))).sort();
    if(!keys.length) return;
    const first = fromKey(keys[0]), todayK = dkey(Date.now()); let d = fromKey(todayK), gap = null; const rows = [];
    const flush = () => { if(gap){ rows.push({empty: gap}); gap = null; } };
    for(let i = 0; i < 120 && d >= first; i++){
      const k = dkey(d);
      if(g[k]){ flush(); rows.push({k}); }
      else if(act[k] && ((act[k].m || 0) > 0 || (act[k].s || 0) >= 60)){ flush(); rows.push({short: k}); }
      else if(k !== todayK){ if(gap) gap.from = k; else gap = {to: k, from: k}; }
      d = new Date(d.getTime() - DAY); d.setHours(0, 0, 0, 0);
    }
    flush();
    rows.forEach(r => {
      if(r.empty){ const e = h("div", "day"); e.style.cursor = "default"; e.style.opacity = ".6"; e.append(h("span", "", (r.empty.from === r.empty.to ? dname(r.empty.to) : dname(r.empty.from) + " – " + dname(r.empty.to)) + " · 💤 разговоров не было")); b.append(e); return; }
      if(r.short){ const e = h("div", "day"); e.style.cursor = "default"; e.append(h("span", "", "📅 " + dname(r.short) + (r.short === todayK ? " · сегодня" : "") + " · " + mins(r.short) + " мин"), h("small", "", r.short === todayK ? "день идёт — для итога нужно минимум 3 сообщения" : "короткий разговор — без итога (меньше 3 сообщений)")); b.append(e); return; }
      const k = r.k, reps = g[k], sm = D[k] && D[k].n === reps.length ? D[k] : null, today = k === todayK;
      const x = h("button", "day"); x.type = "button";
      x.append(h("span", "", "📅 " + dname(k) + (today ? " · сегодня" : "") + " · " + reps.length + " разг." + (mins(k) ? " · " + mins(k) + " мин" : "")),
        h("small", "", today ? "день ещё идёт" : sm ? "Уровень " + (sm.level || "—") + (sm.praise ? " · " + sm.praise.slice(0, 80) : "") : "итог дня: нажми"));
      x.onclick = () => dayModal(k, reps, show); b.append(x);
    });
  }
  return {list, auto};
})();


// ---- 3-second preview of the recognised phrase: «✏️ Исправить» stops the timer, ➤ sends at once
