const VC={};
function voiceFor(lang){try{if(VC[lang])return VC[lang];const vs=speechSynthesis.getVoices();if(!vs.length)return null;const L=lang.toLowerCase();
  const sc=v=>{const l=(v.lang||"").toLowerCase().replace("_","-");let n=0;if(l.startsWith("pt"))n+=10;if(l===L)n+=6;if(/google|luciana|joana|catarina|felipe|francisca|thiago|raquel|duarte|fernanda|ines/i.test(v.name))n+=1;return n};
  const b=vs.slice().sort((a,c)=>sc(c)-sc(a))[0];if(sc(b)>=10){VC[lang]=b;return b}return null}catch(e){return null}}
try{speechSynthesis.onvoiceschanged=()=>{for(const k in VC)delete VC[k]}}catch(e){}
function utter(t,end,lang){try{lang=lang||"pt-BR";const v=voiceFor(lang);const u=new SpeechSynthesisUtterance(clean(t));u.lang=v?v.lang:lang;if(v)u.voice=v;u.rate=.85;if(end){u.onend=end;u.onerror=end}speechSynthesis.speak(u)}catch(e){if(end)end()}}
function say(t,lang){stopAll();PL.playing=false;plBar();utter(t,null,lang)}
function hlEl(el){return el.dataset.es?el:(el.closest(".esl,.pc,.vc,td")||el)}
/* one player for cartoons and page phrases: ⏮ ⏯ ⏭ ↺ */
const PL={mode:"",items:[],i:0,playing:false,P:null};
function plBuild(){if($("#stage")){PL.mode="toon";PL.P=MODS[S.m].pages[S.p];PL.items=toonSteps(PL.P)}
  else{PL.mode="ph";PL.items=[...document.querySelectorAll("#page [data-say],#page [data-es]")]}PL.i=0;PL.playing=false;plBar()}
function plBar(){const c=$("#pcnt"),t=$("#ptog");if(!c)return;const n=PL.items.length;
  c.textContent=n?`${Math.min(PL.i+1,n)}/${n}`:"–";t.textContent=PL.playing?"⏸":"▶";t.setAttribute("aria-label",PL.playing?"Duraklat":"Oynat")}
function plFin(){const stg=$("#stage"),cap=$("#tcap");if(!stg)return;stg.innerHTML=`<div class="fin pop2">${toonFin(PL.P)}</div>`;cap.textContent="✅ Готово! Теперь упражнения →";wireIn(stg)}
function plStep(i,id){if(id!==qid)return;const n=PL.items.length;clearHl();
  if(i>=n){PL.playing=false;PL.i=n;if(PL.mode==="toon")plFin();plBar();return}
  PL.i=i;plBar();
  if(PL.mode==="toon"){const st=PL.items[i];$("#stage").innerHTML=`<div class="frame">${st.lang==="pt-PT"?`<div class="flag">🇵🇹 Португалия</div>`:""}${st.h}${st.tr?`<div class="ttr pop2">🇷🇺 ${st.tr}</div>`:""}</div>`;$("#tcap").textContent=st.c||"";
    if(st.say)setTimeout(()=>{if(id===qid)utter(st.say,()=>setTimeout(()=>plStep(i+1,id),800),st.lang)},450);else setTimeout(()=>plStep(i+1,id),st.w||1800)}
  else{const el=PL.items[i];if(!el.isConnected){plStep(i+1,id);return}hlEl(el).classList.add("speaking");/* followRead */{const he=hlEl(el),r=he.getBoundingClientRect();if(r.top<70||r.bottom>innerHeight-90){try{he.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}catch(e){he.scrollIntoView()}}}
    utter(el.dataset.say||el.dataset.es,()=>setTimeout(()=>plStep(i+1,id),350),el.dataset.lang)}}
function plPlay(i){stopAll();PL.playing=true;plStep(Math.max(0,i),qid)}
function plPause(){stopAll();PL.playing=false;plBar()}
function plToggle(){if(PL.playing)plPause();else plPlay(PL.i>=PL.items.length?0:PL.i)}
function plPrev(){plPlay(PL.i-1)}
function plNext(){plPlay(PL.i+1)}
function playAll(){plPlay(0)}
const playToon=playAll;
let CURLANG="";
const DL=lg=>{lg=lg||CURLANG;return lg?` data-lang="${lg}"`:""};
const esLineT=(es,tr,lg)=>`<div><div class="esl"><span class="es">${esc(es)}</span><button type="button" class="ic" data-say="${esc(es)}"${DL(lg)} aria-label="Слушать">🔊</button></div><div class="ttr">🇷🇺 ${esc(tr)}</div></div>`;
const esLine=(es,tr,cls="es",pic)=>`<div><div class="esl"><span class="${cls}">${esc(es)}</span><button type="button" class="ic" data-say="${esc(es)}"${DL()} aria-label="Слушать">🔊</button>${tr?`<button type="button" class="ic" data-tr aria-label="Перевод">🌐</button>`:""}</div>${pic?`<div class="pics">${pic}</div>`:""}${tr?`<div class="trv" hidden>${esc(tr)}</div>`:""}</div>`;

/* ---------- screens ---------- */
function render(){const k0=S.v+"|"+S.m+"|"+S.p;
  {const kk=S.v+"|"+S.m+"|"+S.p;if(S.ok&&S.v==="mod"&&kk!==lastKey){const P=MODS[S.m].pages[S.p];if(P&&(P.k==="ch"||P.k==="bd")){delete S.ans[S.m+"-"+S.p];delete P.sh;save()}}} /* freshTask */
  const pg=$("#page");let h="";
  $("#nav").hidden=!S.ok||S.v==="menu"||S.v==="log";
  $("#mbtn").hidden=!S.ok;
  let pct=0;
  if(!S.ok){h=gate()}
  else if(S.v==="intro"){h=intro()}
  else if(S.v==="log"){h=logView()}
  else if(S.v==="menu"){h=menu();pct=Object.keys(S.done).length/MODS.length*100}
  else if(S.v==="mdone"){h=mdone();pct=100}
  else{const M=MODS[S.m],P=M.pages[S.p];pct=(S.p)/M.pages.length*100;
    h=`<div class="eyebrow">Урок ${CFG.n} · ${S.m+1}. ${esc(M.n)} · ${S.p+1}/${M.pages.length}</div>`+page(P)+`<button type="button" class="skip" data-skip>⏭ Пропустить эту страницу</button>`}
  $("#bar").style.width=pct+"%";
  pg.innerHTML=`<div class="scr">${h}</div>`;
  $("#back").textContent=S.v==="intro"?"☰ Меню":"← Назад";
  $("#next").textContent=S.v==="intro"?"Начать →":S.v==="mdone"?(S.m<MODS.length-1?"Следующая часть →":"☰ Меню"):"Далее →";
  const tb=$("#tbar"),topb=$("#abar");topb.innerHTML="";const ab=tb||topb;topb.hidden=!!tb||!S.ok||S.v==="menu"||S.v==="intro"||S.v==="log";
  ab.innerHTML=`<span class="lb">🔊 <span id="pcnt">–</span></span><button type="button" id="pprev" aria-label="Назад">⏮</button><button type="button" id="ptog" class="big2">▶</button><button type="button" id="pnext" aria-label="Вперёд">⏭</button><button type="button" id="prst" aria-label="Сначала">↺</button><button type="button" id="aauto" class="${S.auto?"":"off"}">Авто: ${S.auto?"вкл":"выкл"}</button>`;
  $("#pprev").onclick=plPrev;$("#ptog").onclick=plToggle;$("#pnext").onclick=plNext;$("#prst").onclick=playAll;
  $("#aauto").onclick=()=>{S.auto=!S.auto;save();if(!S.auto)plPause();const b=$("#aauto");b.textContent="Авто: "+(S.auto?"вкл":"выкл");b.className=S.auto?"":"off"};
  wire();if(window.__lastTop!==k0){window.scrollTo(0,0);window.__lastTop=k0}else{const fb=document.querySelector("#page .fb");if(fb)fb.scrollIntoView({block:"nearest"})}
  const k=S.v+"|"+S.m+"|"+S.p;
  stopAll();plBuild();if(k!==lastKey){lastKey=k;if(S.ok&&S.auto&&!ab.hidden)playAll()}
}
function gate(){return `<div class="gate scr"><div class="pic">🇧🇷🔑</div><h1>Olá!</h1>
 <p class="sub">Введи код доступа. Его нужно ввести только один раз.</p>
 <input id="code" type="text" autocomplete="off" placeholder="Код">
 <button class="btn pri" id="go" type="button">Войти →</button><div class="err" id="err" aria-live="polite"></div></div>`}
function intro(){return CFG.intro}
function menu(){return `<h1>Урок ${CFG.n} · Части</h1><p class="sub">Иди по порядку или выбери любую часть.</p><div class="menu">`+
 MODS.map((M,i)=>`<button type="button" class="mi${S.done[i]?" done":""}" data-mod="${i}"><span class="e">${M.e}</span><span class="n">${i+1}. ${esc(M.n)}<br><span class="s">${esc(M.s)}</span></span>${S.done[i]?"✅":"▶"}</button>`).join("")+`</div><button type="button" class="btn sec" data-log>📋 Мои ответы</button>`}
function mdone(){const last=S.m===MODS.length-1;return `<div class="pic">${last?"🏆":"🎉"}</div><h1>${last?`Parabéns! Урок ${CFG.n} пройден`:"Muito bem! Часть пройдена"}</h1>`+
 (last?CFG.fin():`<p class="sub">Часть ${S.m+1} готова. Дальше: <b>${esc(MODS[S.m+1].n)}</b> ${MODS[S.m+1].e}</p>`)}

function page(P){CURLANG="";
  if(P.k==="toon")return `<h1>${P.t}</h1><div class="stage" id="stage"><div class="fin">${toonFin(P)}</div></div><div class="abar" id="tbar"></div><div class="tcap" id="tcap">🎬 Нажми ▶ · ⏮ ⏭ — сцены</div><div class="row"><button type="button" class="btn sec" id="treplay">▶ Смотреть ещё раз</button><button type="button" class="btn pri" data-next>К упражнениям →</button></div>`;
  if(P.k==="cult")return cultPage(P);
  if(P.k==="read")return `<h1>${CFG.readT}</h1><p class="sub">Прочитай про себя. Непонятная фраза — нажми 🌐. Потом 3 вопроса.</p>
   <div class="chatbox"><span class="who">${CFG.who}</span>${READ.map(r=>`<div class="bub">${esLine(r[1],r[2],"",r[0])}</div>`).join("")}</div>`;
  if(P.k==="ch")return choice(P);
  if(P.k==="bd")return build(P);
}
const key=()=>S.m+"-"+S.p;
const LTR={},OTR={};
function cultPage(P){const G=P.gloss||{};const key=w=>w.toLowerCase().replace(/[^\p{L}\p{N}]/gu,"");
  return `<h1>${P.t}</h1><p class="sub">Прочитай и послушай. Нажми на любое слово — увидишь перевод. 🌐 — перевод всей фразы. Потом вопросы.</p>
  <div class="cult">${P.lines.map(([pt,ru],i)=>`<div class="cl"><div class="cw">${pt.split(" ").map(w=>G[key(w)]?`<button type="button" class="wd" data-w="${esc(key(w))}" data-l="${i}">${esc(w)}</button>`:`<span class="wn">${esc(w)}</span>`).join(" ")}</div><div class="esl"><button type="button" class="ic sm" data-say="${esc(pt)}">🔊</button><button type="button" class="ic sm" data-tr>🌐</button></div><div class="trv" hidden>${esc(ru)}</div><div class="wtr" id="wtr${i}" hidden></div></div>`).join("")}</div>`}
function choice(P){CURLANG=P.lang||"";const a=S.ans[key()];
  let h=`<div class="pic">${P.pic}</div><p><b>${esc(P.q)}</b></p>`;
  if(P.es)h+=`<div class="card">${esLine(P.es,P.tr)}</div>`;
  if(P.listen){const lt=P.ltr||LTR[P.listen];h+=`<div class="card" style="text-align:center"><div class="esl" style="justify-content:center"><button type="button" class="btn pri" data-say="${esc(P.listen)}"${DL()}>🔊 Слушать</button>${lt?`<button type="button" class="ic" data-tr aria-label="🌐">🌐</button>`:""}</div>${lt?`<div class="trv" hidden><b>${esc(P.listen)}</b> — ${esc(lt)}</div>`:""}</div>`}
  const trFor=o=>o[1]||OTR[o[0]]||null,anyT=P.opts.some(o=>trFor(o)),trF=o=>trFor(o)||(anyT?trFor(P.opts[P.a]):null);
  h+=`<div class="opts">`+P.opts.map((o,i)=>{let c="";if(a!=null){if(i===P.a)c=" ok";else if(i===a)c=" bad"}
    return `<div class="opt"><button type="button" class="ob${c}" data-o="${i}"${anyT&&!P.quiet?` data-es="${esc(o[0])}"${DL()}`:""}${a!=null?" disabled":""}>${esc(o[0])}</button>${trF(o)?`<button type="button" class="ic sm" data-tr aria-label="Перевод">🌐</button><div class="trv" hidden>${esc(trF(o))}</div>`:""}</div>`}).join("")+`</div>`;
  if(a==null)h+=`<button type="button" class="skip" data-hint style="text-decoration:none">💡 Подсказка</button><p class="hint" id="hint" hidden>${P.hint}</p>`;
  else if(a===P.a)h+=`<div class="fb ok"><b>✅ Muito bem!</b>${P.why}</div><div class="row stick"><button type="button" class="btn pri" data-next>Следующее задание →</button></div>`;
  else h+=`<div class="fb bad"><b>❌ Правильный ответ: ${esc(P.opts[P.a][0])}</b>${P.why}</div><div class="row stick"><button type="button" class="btn sec" data-retry>🔁 Ещё раз</button><button type="button" class="btn pri" data-next>Следующее задание →</button></div>`;
  return h}
function build(P){CURLANG=P.lang||"";const st=S.ans[key()]||{pick:[],res:null};
  const shuffled=P.sh||(P.sh=P.w.map((w,i)=>i).sort(()=>Math.random()-.5));
  let h=`<div class="pic">${P.pic}</div><p class="sub">Собери фразу по-португальски:</p><p><b>„${esc(P.q)}“</b></p>
   <div class="ans">${st.pick.map((wi,j)=>`<button type="button" class="chip" data-un="${j}"${st.res!=null?" disabled":""}>${esc(P.w[wi])}</button>`).join("")}</div>
   <div class="chips">${shuffled.map(wi=>`<button type="button" class="chip" data-pk="${wi}"${st.pick.includes(wi)||st.res!=null?" disabled":""}>${esc(P.w[wi])}</button>`).join("")}</div>`;
  const full=P.w.join(" ");
  if(st.res==null)h+=`<div class="row"><button type="button" class="btn pri" data-chk${st.pick.length<P.w.length?" disabled":""}>Проверить</button></div><button type="button" class="skip" data-hint style="text-decoration:none">💡 Подсказка</button><p class="hint" id="hint" hidden>Первое слово — с большой буквы, в последнем — точка или знак вопроса.</p>`;
  else if(st.res)h+=`<div class="fb ok"><b>✅ Perfeito!</b>${P.why}</div>${esLine(full,P.q)}<div class="row stick"><button type="button" class="btn pri" data-next>Следующее задание →</button></div>`;
  else h+=`<div class="fb bad"><b>❌ Правильно: ${esc(full)}</b>${P.why}</div><div class="row stick"><button type="button" class="btn sec" data-retry>🔁 Ещё раз</button><button type="button" class="btn pri" data-next>Следующее задание →</button></div>`;
  return h}

/* ---------- events ---------- */
function wireIn(root){
  root.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say,b.dataset.lang));
  root.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{const t=b.closest(".opt,.vc,div:not(.esl)").querySelector(".trv");if(t)t.hidden=!t.hidden});}
function logIt(e){S.log=S.log||{};S.log[key()]=Object.assign({m:S.m,p:S.p,t:Date.now()},e);save()}
function logView(){const L=S.log||{};const ks=Object.keys(L).sort((a,b)=>{const[x1,y1]=a.split("-").map(Number),[x2,y2]=b.split("-").map(Number);return x1-x2||y1-y2});
  const ok=ks.filter(k=>L[k].ok).length;let h=`<h1>📋 Мои ответы</h1><p class="sub">При повторном прохождении ответ на задание перезаписывается.</p>`;
  if(!ks.length)return h+`<p>Пока нет ответов. Пройди задания — здесь появится каждый ответ.</p><button type="button" class="btn sec" data-tomenu>← В меню</button>`;
  h+=`<div class="card"><b>${"✅ {ok} · ❌ {bad}".replace("{ok}",ok).replace("{bad}",ks.length-ok)}</b></div>`;let cur=-1;
  ks.forEach(k=>{const e=L[k];if(e.m!==cur){cur=e.m;h+=`<h2>Часть ${e.m+1}. ${esc(MODS[e.m]?MODS[e.m].n:"")}</h2>`}
    h+=`<div class="lg ${e.ok?"ok":"bad"}"><div class="lq">${e.ok?"✅":"❌"} ${esc(e.q)}</div><div>Твой ответ: <b>${esc(e.your)}</b></div>${e.ok?"":`<div>Правильно: <b>${esc(e.right)}</b></div>`}</div>`});
  return h+`<button type="button" class="btn sec" data-tomenu>← В меню</button>`}
function afterBuild(ok,txt,lang){const k=key(),v=S.v,same=()=>key()===k&&S.v===v;
  if(!S.auto){afterAnswer(ok,txt,lang);return}
  if(ok){stopAll();let done=false;const go=()=>{if(done)return;done=true;setTimeout(()=>{if(same())next()},600)};
    setTimeout(()=>{if(same())utter(txt,go,lang);else done=true},250);setTimeout(go,7000)}
  else setTimeout(()=>{if(same())say(txt,lang)},700)}
function afterAnswer(ok,txt,lang){const k=key(),v=S.v,same=()=>key()===k&&S.v===v;
  if(ok)setTimeout(()=>{if(same())next()},1100);else if(txt)setTimeout(()=>{if(same())say(txt,lang)},1000)}
function wireCult(pg){const P=S.v==="mod"?MODS[S.m].pages[S.p]:null;if(!P||P.k!=="cult")return;
  pg.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{const box=document.getElementById("wtr"+b.dataset.l);const t=`<b>${esc(b.textContent)}</b> — ${esc(P.gloss[b.dataset.w])}`;
    if(!box.hidden&&box.dataset.w===b.dataset.w){box.hidden=true;return}box.innerHTML=t;box.dataset.w=b.dataset.w;box.hidden=false})}
function wire(){
  const pg=$("#page");
  wireIn(pg);wireCult(pg);const tr=$("#treplay");if(tr)tr.onclick=playToon;
  pg.querySelectorAll("[data-hint]").forEach(b=>b.onclick=()=>{const t=$("#hint");t.hidden=!t.hidden});
  pg.querySelectorAll("[data-skip],[data-next]").forEach(b=>b.onclick=next);
  pg.querySelectorAll("[data-log]").forEach(b=>b.onclick=()=>{S.v="log";save();render()});
  pg.querySelectorAll("[data-tomenu]").forEach(b=>b.onclick=()=>{S.v="menu";save();render()});
  pg.querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>{S.v="mod";S.m=+b.dataset.mod;S.p=0;save();render()});
  pg.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const P=MODS[S.m].pages[S.p],o=+b.dataset.o;S.ans[key()]=o;logIt({q:P.q+(P.es?" — "+P.es:"")+(P.listen?" 🎧 "+P.listen:""),your:P.opts[o][0],right:P.opts[P.a][0],ok:o===P.a});save();render();afterAnswer(o===P.a,P.opts[P.a][1]?P.opts[P.a][0]:null,P.lang)});
  pg.querySelectorAll("[data-retry]").forEach(b=>b.onclick=()=>{delete S.ans[key()];const P=MODS[S.m].pages[S.p];delete P.sh;save();render()});
  const bd=()=>S.ans[key()]||(S.ans[key()]={pick:[],res:null});
  pg.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{bd().pick.push(+b.dataset.pk);save();render()});
  pg.querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{bd().pick.splice(+b.dataset.un,1);save();render()});
  pg.querySelectorAll("[data-chk]").forEach(b=>b.onclick=()=>{const s=bd(),P=MODS[S.m].pages[S.p];s.res=s.pick.every((w,i)=>w===i)&&s.pick.length===P.w.length;logIt({q:P.q,your:s.pick.map(i=>P.w[i]).join(" "),right:P.w.join(" "),ok:s.res});save();render();afterBuild(s.res,P.w.join(" "),P.lang)});
  const go=$("#go");if(go){const tryc=()=>{if(CODES.includes(norm($("#code").value))){S.ok=true;save();render()}else $("#err").textContent="Неверный код. Попробуй ещё раз."};
    go.onclick=tryc;$("#code").onkeydown=e=>{if(e.key==="Enter")tryc()}}
}
function next(){
  if(S.v==="intro"){S.v="mod";S.m=0;S.p=0}
  else if(S.v==="mdone"){if(S.m<MODS.length-1){S.m++;S.p=0;S.v="mod"}else S.v="menu"}
  else{const M=MODS[S.m];if(S.p<M.pages.length-1)S.p++;else{S.done[S.m]=true;S.v="mdone"}}
  save();render()}
function back(){
  if(S.v==="intro"){S.v="menu"}
  else if(S.v==="mdone"){S.v="mod";S.p=MODS[S.m].pages.length-1}
  else if(S.p>0)S.p--;else S.v=S.m===0?"intro":"menu";
  save();render()}
$("#next").onclick=next;$("#back").onclick=back;
$("#mbtn").onclick=()=>{S.v="menu";save();render()};
$("#home").onclick=()=>{$("#hm").hidden=false};$("#hmc").onclick=()=>{$("#hm").hidden=true};
render();
</script>
