<title>Китайский урок 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one narrow phone column; sticky lesson bar on top, page card, back/skip row under it. Jade ink + seal red for the radicals. */
:root{
  --paper:#EEF3F0; --card:#FFFFFF; --ink:#1A2925; --muted:#586A64; --line:#D3DDD8;
  --jade:#1E6B58; --jade-soft:#DCECE5; --seal:#C0352A; --seal-soft:#F8E2DF;
  --ok:#2C7A4C; --ok-soft:#DDF0E3; --bad:#B3261E; --bad-soft:#F9DEDC; --gold:#A87A20;
  --chat:#DCEFE6; --chat2:#FFFFFF;
  --f-head:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-zh:"Noto Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", "SimSun", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111917; --card:#1A2522; --ink:#E5EEEA; --muted:#9AADA6; --line:#2D3C37;
  --jade:#5FC4A6; --jade-soft:#1C3630; --seal:#F0705F; --seal-soft:#3B2321;
  --ok:#6FCB91; --ok-soft:#1D3527; --bad:#F2877E; --bad-soft:#3C2220; --gold:#E2B65C;
  --chat:#1F3A31; --chat2:#22302C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111917; --card:#1A2522; --ink:#E5EEEA; --muted:#9AADA6; --line:#2D3C37;
  --jade:#5FC4A6; --jade-soft:#1C3630; --seal:#F0705F; --seal-soft:#3B2321;
  --ok:#6FCB91; --ok-soft:#1D3527; --bad:#F2877E; --bad-soft:#3C2220; --gold:#E2B65C;
  --chat:#1F3A31; --chat2:#22302C; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--paper)}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,.tok:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
.zh{font-family:var(--f-zh);font-weight:500}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.hidden{display:none!important}
[hidden]{display:none!important}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.bar .t{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:36px;height:38px;padding:0 8px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.ib small{font-size:12px}
.ib.off{opacity:.55}

/* page */
.page{padding-top:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--jade);font-weight:700}
.q{font-size:17px;font-weight:600}
.q .zh{font-size:22px;color:var(--seal)}
.nav{display:flex;gap:8px;margin-top:4px}
.nav button{flex:1;border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 8px;font-size:14px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--jade);color:var(--card);font-size:16px}
.btn.ghost{background:transparent;border:1.5px solid var(--jade);color:var(--jade)}
.btn.small{padding:8px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tiny{border:1px solid var(--line);background:transparent;border-radius:8px;font-size:12px;padding:2px 7px;color:var(--muted)}
.snd{border:0;background:var(--jade-soft);color:var(--jade);border-radius:50%;width:36px;height:36px;font-size:16px;flex:none}

/* intro */
.hero{display:flex;gap:14px;align-items:center}
.seal{flex:none;width:104px;height:104px;border-radius:14px;background:var(--seal-soft);border:2px solid var(--seal);display:flex;align-items:center;justify-content:center;font-size:72px;color:var(--seal);line-height:1}
.hero h2{font-size:24px}
.pyname{font-size:14px;color:var(--muted)}
.story{font-size:15px}
.exs{display:flex;flex-direction:column;gap:8px}
.ex{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.ex .c{font-size:40px;width:52px;text-align:center;line-height:1.1}
.ex .m{flex:1;min-width:0;font-size:14px}
.ex .f{font-family:var(--f-zh);font-size:17px}
.ex .f b{color:var(--seal);font-weight:700}

/* options */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;flex-direction:column;align-items:stretch;gap:2px}
.ob{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-size:16px;display:flex;align-items:center;gap:10px;min-height:52px}
.ob .zh{font-size:30px;line-height:1}
.ob.ok{border-color:var(--ok);background:var(--ok-soft)}
.ob.bad{border-color:var(--bad);background:var(--bad-soft)}
.ob[disabled]{cursor:default}
.opt .row{margin-left:6px}
.tr{font-size:13px;color:var(--muted);margin-left:6px}
.big{font-size:64px;color:var(--seal);text-align:center;line-height:1.1}
.fb{border-radius:12px;padding:12px;font-size:15px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.fb.bad{background:var(--bad-soft)}
.fb.bad b.h{color:var(--bad)}
.hint{background:var(--jade-soft);border-radius:10px;padding:8px 12px;font-size:14px}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mb{border:1.5px solid var(--line);background:var(--card);border-radius:12px;min-height:56px;padding:6px 8px;font-size:15px}
.mb.zh{font-size:30px}
.mb.sel{border-color:var(--jade);background:var(--jade-soft)}
.mb.done{opacity:.35;border-style:dashed}
.mb.shake{animation:sh .35s;border-color:var(--bad)}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* writing */
.wbox{position:relative;width:min(280px,100%);aspect-ratio:1;margin:0 auto;background:var(--card);border:2px solid var(--seal);border-radius:10px;touch-action:none}
.wbox svg{width:100%;height:100%;display:block}
.wstat{text-align:center;font-size:14px;color:var(--muted);min-height:20px}

/* speaking */
.clues{display:flex;flex-direction:column;gap:4px;font-size:14px}
.clue{display:flex;gap:8px;align-items:baseline}
.clue span:first-child{color:var(--gold)}
.clue.lock{color:var(--muted)}
.word{text-align:center}
.word .zh{font-size:52px;line-height:1.1}
.mic{font-size:18px;padding:14px 20px}
.mic.rec{background:var(--seal)}
.status{font-size:14px;min-height:20px}
details{font-size:14px}
details summary{cursor:pointer;color:var(--jade);font-weight:600}

/* reading */
.phone{border-radius:18px;padding:14px 12px;background:
  radial-gradient(circle at 15% 20%, var(--jade-soft) 0 18%, transparent 19%),
  radial-gradient(circle at 85% 70%, var(--seal-soft) 0 14%, transparent 15%),
  linear-gradient(160deg, var(--jade-soft), var(--paper));
  border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.phone .who{font-size:13px;color:var(--muted);text-align:center}
.bub{align-self:flex-start;max-width:92%;background:var(--chat2);border-radius:4px 16px 16px 16px;padding:8px 12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bub .zh{font-size:22px;line-height:1.5}
.bub .tools{display:flex;gap:6px;margin-top:4px}
.bub .rt{font-size:13px;color:var(--muted);margin-top:4px}

/* culture */
.ctext{font-size:22px;line-height:1.8}
.sent{padding:6px 0;border-bottom:1px dashed var(--line)}
.tok{cursor:pointer;border-radius:4px;padding:0 1px}
.tok:hover,.tok.on{background:var(--jade-soft)}
.winfo{font-size:14px;background:var(--jade-soft);border-radius:8px;padding:6px 10px;margin-top:4px}

/* menu */
.top{display:flex;align-items:center;gap:12px;padding-top:18px}
.logo{display:flex;flex-direction:column;align-items:center;gap:2px}
.logo small{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.top h1{font-size:26px;line-height:1.15}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:8px}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px}
.mi .ic{font-size:22px;width:30px;text-align:center;flex:none}
.mi .tx{flex:1;min-width:0}
.mi .tx b{display:block;font-size:16px}
.mi .tx span{font-size:13px;color:var(--muted)}
.mi .st{color:var(--ok);font-weight:700;font-size:18px}
.owner{text-align:center;font-size:13px;color:var(--muted);padding-top:18px}
.radrow{font-family:var(--f-zh);font-size:22px;color:var(--seal);letter-spacing:.15em}

/* answers */
.ans{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.ans .ok{color:var(--ok);font-weight:700}
.ans .bad{color:var(--bad);font-weight:700}

/* character breakdown */
.hz{cursor:pointer;text-decoration:underline dotted var(--line);text-underline-offset:4px}
.hz:hover{background:var(--seal-soft);border-radius:3px}
.pt .py{font-size:12px;color:var(--muted)}
.hzbox .hc{display:flex;gap:12px;align-items:center}
.hzbox .hc .zh{font-size:64px;line-height:1;color:var(--seal)}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pt{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:4px 10px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pt .zh{font-size:22px;color:var(--jade)}
button.pt{cursor:pointer}
.why{background:var(--jade-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.hzbtn.on{background:var(--seal);color:var(--card);border-color:var(--seal)}
/* modal */
.mod{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.mod .box{background:var(--card);border-radius:16px;padding:16px;max-width:400px;width:100%;position:relative;font-size:15px}
.mod .x{position:absolute;top:8px;right:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script type="text/plain" id="decomp">
人|rén|человек||Рисунок человека, который идёт: две ноги.
亻|rén|человек (слева в иероглифе)|人=человек|Это 人, сжатый в узкую полоску, когда он стоит слева.
单|dān|один, одиночный||Древний рисунок рогатины для охоты. Значение «один» запоминается целиком.
旁|páng|сбоку, рядом|方=сторона|Внизу 方 «сторона». Что сбоку — то «со стороны».
尔|ěr|ты (книжное)||Старое слово «ты». Запоминается целиком; сидит внутри 你.
你|nǐ|ты|亻=человек;尔=ты (книжн.)|Человек 亻 + старое «ты» 尔 → ты, человек, к которому обращаюсь.
也|yě|тоже||Древний рисунок, значение «тоже» запоминается целиком.
他|tā|он|亻=человек;也=тоже (звук)|Человек 亻 + 也. Другой человек, не я и не ты → он.
门|mén|дверь||Рисунок двустворчатой двери (упрощено из 門).
们|men|мн. число людей|亻=человек;门=дверь (звук men)|Человек 亻 говорит о людях, 门 mén подсказывает звук → 我们, 你们.
我|wǒ|я|手=рука;戈=алебарда|Древний рисунок оружия-алебарды в руке. Запоминалка: «я — с оружием в руке».
戈|gē|алебарда||Рисунок древнего оружия на длинной ручке.
手|shǒu|рука||Рисунок ладони с пальцами.
口|kǒu|рот||Рисунок открытого рта.
乞|qǐ|просить (милостыню)||Запоминается целиком; в 吃 подсказывает звук.
吃|chī|есть, кушать|口=рот;乞=просить (звук)|Рот 口 — делаем ртом; 乞 подсказывает звук → есть.
曷|hé|что? (книжн.)||Звуковая часть, сама по себе встречается редко.
喝|hē|пить|口=рот;曷=звук hé|Рот 口 + 曷 hé (звук) → hē пить.
丩|jiū|переплетение||Звуковая часть.
叫|jiào|звать, кричать; зваться|口=рот;丩=звук jiū|Рот 口 кричит; 丩 подсказывает звук → звать.
女|nǚ|женщина||Рисунок женщины, присевшей со скрещёнными руками.
她|tā|она|女=женщина;也=тоже (звук)|Как 他 «он», только вместо человека — женщина 女 → она.
马|mǎ|лошадь||Рисунок лошади: голова с гривой, ноги, хвост.
妈|mā|мама|女=женщина;马=лошадь (звук mǎ)|Женщина 女 + 马 mǎ подсказывает звук → mā мама.
且|qiě|к тому же||Звуковая часть (древний рисунок таблички).
姐|jiě|старшая сестра|女=женщина;且=звук qiě|Женщина 女 + 且 подсказывает звук → jiě старшая сестра.
妹|mèi|младшая сестра|女=женщина;未=ещё не (звук wèi)|Женщина 女, которая «ещё не» 未 выросла → младшая сестра.
未|wèi|ещё не||Дерево 木 с маленькими верхними ветками — «ещё не выросло».
子|zǐ|ребёнок||Малыш в пелёнке: голова, ручки в стороны, спелёнутые ножки.
宀|mián|крыша||Рисунок крыши дома.
字|zì|иероглиф|宀=крыша;子=ребёнок|Ребёнок 子 под крышей 宀 учится писать → иероглиф. 子 zǐ подсказывает и звук zì.
亥|hài|12-я ветвь (свинья)||Звуковая часть.
孩|hái|ребёнок|子=ребёнок;亥=звук hài|Ребёнок 子 + 亥 hài подсказывает звук → hái.
冖|mì|покрышка||Крышка, накрывающая что-то.
学|xué|учиться|⺍=знания сверху;冖=крыша;子=ребёнок|Ребёнок 子 под крышей 冖 школы, сверху на него «сыплются» знания ⺍ → учиться.
木|mù|дерево||Ствол, ветка поперёк, корни вниз.
林|lín|роща|木=дерево;木=дерево|Два дерева → роща.
森|sēn|лес|木=дерево;木=дерево;木=дерево|Три дерева → густой лес.
对|duì|правильно; пара|又=рука;寸=мера|Рука 又 + 寸 «точная мера» → правильно.
又|yòu|снова; рука||Рисунок правой руки.
寸|cùn|вершок (мера)||Рука с точкой на запястье, где меряют пульс → точная мера.
树|shù|дерево|木=дерево;对=правильно|Дерево 木 + 对 (в упрощённом написании заменило старую часть) → дерево.
日|rì|солнце, день||Солнце в рамке с чертой посередине.
月|yuè|луна, месяц||Рисунок полумесяца.
明|míng|светлый; 明天 — завтра|日=солнце;月=луна|Солнце 日 + луна 月 — два самых ярких света → светлый, ясный.
天|tiān|небо, день|大=человек с раскинутыми руками;一=черта над головой|Над человеком 大 — черта 一 → небо.
大|dà|большой||Человек раскинул руки: «во-о-от такой большой».
一|yī|один||Одна черта.
十|shí|десять||Пересечение черт — полный счёт.
早|zǎo|рано, утро|日=солнце;十=черта горизонта|Солнце 日 поднялось над горизонтом/травой 十 → рано утром.
时|shí|время|日=солнце;寸=мера|Солнце 日 + мера 寸 → время, которое меряют по солнцу.
水|shuǐ|вода||Поток посередине и брызги по бокам.
氵|shuǐ|вода (слева в иероглифе)|水=вода|Три капли — короткая форма 水.
三|sān|три||Три черты.
点|diǎn|точка; час|占=звук zhàn;灬=огонь (точки)|Внизу 4 точки 灬 → точка, пятнышко. 占 подсказывает звук.
可|kě|можно|口=рот;丁=гвоздь|Рот 口 говорит «можно». Звуковая часть в 河.
河|hé|река|氵=вода;可=звук kě|Вода 氵 + 可 подсказывает звук → hé река.
母|mǔ|мать||Женщина 女 с двумя точками (грудь) → мать.
每|měi|каждый|𠂉=трава сверху;母=мать|Запоминается целиком; в 海 подсказывает звук.
海|hǎi|море|氵=вода;每=звук měi|Вода 氵 + 每 подсказывает звук → hǎi море.
先|xiān|сначала|𠂉=ступня;儿=ноги|Ноги 儿 идут впереди → сначала.
洗|xǐ|мыть|氵=вода;先=звук xiān|Вода 氵 + 先 подсказывает звук → xǐ мыть.
言|yán|слово, речь|口=рот;三=черты — звук изо рта|Изо рта 口 выходят линии звука → слово.
讠|yán|речь (слева в иероглифе)|言=слово|Сокращённое 言.
兑|duì|обменивать||Звуковая часть.
说|shuō|говорить|讠=речь;兑=звук duì|Речь 讠 + 兑 подсказывает звук → говорить.
舌|shé|язык (во рту)|千=тысяча;口=рот|Язык высовывается изо рта 口.
话|huà|речь, слова|讠=речь;舌=язык|Слово 讠 + язык 舌 → речь, разговор.

/* silent report to the teacher (works only on the GitHub site) */
function sendEvent(type,data){
  if(location.hostname!=='dariairamain-blip.github.io')return;
  try{fetch('https://daria-talk.daria-iramain.workers.dev/event',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({who:WHO,lesson:LESSON,type:type,data:data||{},t:new Date().toISOString()})}).catch(function(){});}catch(e){}
}
sendEvent('enter');

/* ---------- audio ---------- */
let zhVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();zhVoice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang)&&!/HK|TW/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
let speakTok=0;
const clean=s=>String(s).replace(/[^㐀-鿿豈-﫿⺀-⿟，。！？、]/g,'');
function stopSpeak(){speakTok++;try{speechSynthesis.cancel()}catch(e){}}
function speak(list,onEnd){
  stopSpeak();
  const arr=(Array.isArray(list)?list:[list]).map(clean).filter(Boolean);
  if(!settings.sound||!('speechSynthesis' in window)||!arr.length){onEnd&&setTimeout(onEnd,10);return;}
  const tok=speakTok;let i=0;
  const nx=()=>{if(tok!==speakTok)return;if(i>=arr.length){onEnd&&onEnd();return;}
    const u=new SpeechSynthesisUtterance(arr[i++]);u.lang='zh-CN';if(zhVoice)u.voice=zhVoice;u.rate=.8;
    u.onend=()=>setTimeout(nx,380);u.onerror=()=>setTimeout(nx,30);speechSynthesis.speak(u);};
  nx();
}

const intro=k=>({t:'intro',k});
function A(id,comp,opts,hint,why){ // which character contains the component
  return {t:'mcq',id,q:`В каком иероглифе есть часть <span class="zh">${comp}</span> «${COMP[comp].ru}»?`,say:[CN(comp)],
    opts:opts.map(o=>({x:o[0],zh:1,say:o[0],tr:o[1]})),hint,why};}
function B(id,ch,py,ru,ask,opts,hint,why){ // which component in a character
  return {t:'mcq',id,q:`<span class="zh">${ch}</span> ${py} — «${ru}». ${ask}`,say:[ch],
    opts:opts.map(c=>({x:c,zh:1,say:CN(c),tr:COMP[c].ru})),hint,why};}
function C(id,ch,py,opts,hint,why){ // guess a new character
  return {t:'mcq',id,q:'Новый иероглиф. Что он может значить?',big:ch,bigPy:py,say:[ch],
    opts:opts.map(o=>({x:o})),hint,why};}
const M=(id,keys)=>({t:'match',id,pairs:keys.map(k=>[k,CN(k),COMP[k].ru])});

/* ---------- helpers ---------- */
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h;}
function order(id,n){const r=hash(id)%n;return [...Array(n).keys()].map(i=>(i+r)%n);} // rotated, varied positions
const strip=h=>h.replace(/<[^>]+>/g,'');
function rec(id,q,your,right,ok){answers[id]={part:cur.P.title,q:strip(q),your,right,ok,ts:Date.now()};LS.set('zh1_ans',answers);}
function saveSet(){LS.set('zh1_set',settings);}
function shuffle(a,id){const o=order(id+'s',a.length);return o.map(i=>a[i]);}

/* ---------- state ---------- */
let cur=null, lock=false, timers=[];
function later(fn,ms){timers.push(setTimeout(fn,ms));}
function clearT(){timers.forEach(clearTimeout);timers=[];}

function bar(){
  const P=cur.P, n=P.pages.length, extra=cur.i>=n;
  const pg=cur.pages[cur.i];
  const prog=pg.t==='done'?'готово':(cur.retry&&extra?'работа над ошибками':`${Math.min(cur.i+1,n)} / ${n}`);
  return `<div class="bar">
   <button class="ib" id="bMenu" aria-label="Меню">☰</button>
   <div class="t">${P.title}<small>${prog}</small></div>
   <button class="ib" id="bRep" aria-label="Повторить аудио">🔁</button>
   <button class="ib ${settings.sound?'':'off'}" id="bSnd" aria-label="Звук">${settings.sound?'🔊':'🔇'}</button>
   <button class="ib ${settings.auto?'':'off'}" id="bAuto" aria-label="Авто-озвучка">▶<small>авто</small></button></div>`;
}
const navHtml=`<div class="nav"><button id="bPrev">⏮ Назад</button><button id="bSkip">⏭ Пропустить эту страницу</button></div>`;

function showMenu(){
  clearT();stopSpeak();cur=null;lock=false;
  let html=`<div class="top"><div class="logo">${sealSvg(56)}<small>Daria Botina</small></div>
    <div><h1>Китайский · Урок 1</h1><div class="radrow">亻口女子木日氵讠忄</div></div></div>

  let sec='';
  PARTS.forEach(p=>{
    if(p.sec!==sec){sec=p.sec;html+=`<div class="sec">${sec}</div>`;}
    html+=`<button class="mi" data-p="${p.id}"><span class="ic ${/[一-鿿]/.test(p.ic)?'zh':''}">${p.ic}</span><span class="tx"><b>${p.title}</b><span>${p.sub}</span></span><span class="st">${done[p.id]?'✓':''}</span></button>`;
  });
  html+=`<div class="sec">Итоги</div><button class="mi" id="bAns"><span class="ic">📋</span><span class="tx"><b>Мои ответы</b><span>все ответы, верные и с ошибками</span></span></button>
    <div class="owner">© Daria Botina</div></div>`;
  $('#app').innerHTML=html;
  document.querySelectorAll('.mi[data-p]').forEach(b=>b.onclick=()=>openPart(b.dataset.p));
  $('#bAns').onclick=showAnswers;
  $('#bHome').onclick=()=>modal(`<h3>Добавить урок на экран</h3>
   <p><b>iPhone (Safari):</b> внизу нажми «Поделиться» ⬆️ → «На экран „Домой“» → «Добавить».</p>
   <p><b>Android (Chrome):</b> нажми ⋮ вверху справа → «Добавить на главный экран».</p>`);
  window.scrollTo(0,0);
}
function sealSvg(s){return `<svg width="${s}" height="${s}" viewBox="0 0 56 56" aria-hidden="true"><rect x="3" y="3" width="50" height="50" rx="9" fill="var(--seal)"/><rect x="8" y="8" width="40" height="40" rx="5" fill="none" stroke="var(--card)" stroke-width="1.5"/><text x="28" y="39" text-anchor="middle" font-size="28" fill="var(--card)" font-family="Noto Serif SC, Noto Serif CJK SC, serif" font-weight="700">字</text></svg>`;}
function modal(inner){
  const d=document.createElement('div');d.className='mod';
  d.innerHTML=`<div class="box" role="dialog"><button class="ib x" aria-label="Закрыть">✕</button>${inner}</div>`;
  d.onclick=e=>{if(e.target===d||e.target.closest('.x'))d.remove();};
  document.body.appendChild(d);
}

function openPart(pid){
  const P=PARTS.find(p=>p.id===pid);
  cur={pid,P,pages:P.pages.slice(),i:0,mist:new Set(),retry:false,asked:false,clues:new Set()};
  render();
}
function next(){clearT();lock=false;if(cur.i<cur.pages.length-1){cur.i++;render();}else finishPart();}
function prev(){clearT();lock=false;if(cur.i>0){cur.i--;render();}else showMenu();}
function finishPart(){
  if(!cur.retry&&cur.mist.size&&!cur.asked){cur.asked=true;cur.pages.push({t:'errq'});cur.i++;render();return;}
  markDone();cur.pages.push({t:'done'});cur.i=cur.pages.length-1;render();
}
function markDone(){
  done[cur.pid]=1;LS.set('zh1_done',done);
  if(PARTS.every(p=>done[p.id])&&!LS.get('zh1_sent',0)){LS.set('zh1_sent',1);
    const ok=Object.values(answers).filter(a=>a.ok).length;
    sendEvent('lessonDone',{answers:Object.keys(answers).length,correct:ok,mistakes:Object.values(answers).filter(a=>!a.ok).map(a=>a.q+' → '+a.your)});}
}

/* ---------- render ---------- */
let pageAudio=[];
function render(){
  clearT();stopSpeak();lock=false;
  const p=cur.pages[cur.i];
  pageAudio=[];
  const body=PAGE[p.t](p);
  $('#app').innerHTML=bar()+`<div class="page">${body}${p.t==='done'?'':navHtml}</div>`;
  $('#bMenu').onclick=showMenu;
  $('#bRep').onclick=()=>playPage(true);
  $('#bSnd').onclick=()=>{settings.sound=!settings.sound;saveSet();if(!settings.sound)stopSpeak();const b=$('#bSnd');b.textContent=settings.sound?'🔊':'🔇';b.classList.toggle('off',!settings.sound);};
  $('#bAuto').onclick=()=>{settings.auto=!settings.auto;saveSet();$('#bAuto').classList.toggle('off',!settings.auto);};
  if($('#bPrev')){$('#bPrev').onclick=prev;$('#bSkip').onclick=next;}
  window.scrollTo(0,0);
  (MOUNT[p.t]||(()=>{}))(p);
  if(settings.auto&&p.t!=='write'&&p.t!=='listen')later(()=>playPage(false),250);
}
function playPage(manual,onEnd){if(pageAudio.length)speak(pageAudio,onEnd);else onEnd&&onEnd();}
function wireSnd(){document.querySelectorAll('[data-say]').forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.say);});}
function wireTr(){document.querySelectorAll('[data-tr]').forEach(b=>b.onclick=e=>{e.stopPropagation();const t=document.getElementById(b.dataset.tr);t.hidden=!t.hidden;});}

function phraseCard(zh,py,ru,title){const n=++pcN;

   <div class="muted" style="font-size:12px">Нажми на любой иероглиф — 🧩 разбор.</div></div>`;}
function cardFor(p){
  if(p.t==='listen')return phraseCard(p.zh,p.py,p.opts[0].x,'Фраза из аудио');
  if(p.src!=null){const l=READ[p.src];return phraseCard(l[0],l[1],l[2],'Строка из письма');}
  if(p.srcC!=null)return phraseCard(cultZh(p.srcC),cultPy(p.srcC),CULT[p.srcC][1],'Предложение из текста');
  return '';}
function answer(p,k,review){
  if(!review){if(lock)return;lock=true;clearT();stopSpeak();cur.ans=cur.ans||{};cur.ans[p.id]=k;}
  const ok=k===0, right=p.opts[0];
  const bs=[...document.querySelectorAll('.ob')];bs.forEach(b=>b.setAttribute("aria-disabled","true"));
  const mine=bs.find(b=>+b.dataset.k===k), good=bs.find(b=>+b.dataset.k===0);
  const fb=$('#fb');
  if(review){
    (ok?mine:good).classList.add('ok');if(!ok)mine.classList.add('bad');
    fb.innerHTML=`<div class="fb ${ok?'ok':'bad'}" style="font-weight:400"><div>${ok?'<b>✓ Ты ответила верно.</b>':`<b class="h">Было неверно.</b> Правильно: <b>${right.x}</b>`}</div>${ok?'':`<div>${p.why}</div>`}${cardFor(p)}
      <div class="row"><button class="btn ghost small" id="bAgain">↩︎ Ответить ещё раз</button><button class="btn small" id="bNext">Дальше →</button></div></div>`;
    wireSnd();wireTr();
    $('#bAgain').onclick=()=>{delete cur.ans[p.id];render();};$('#bNext').onclick=next;
    return;}
  rec(p.id,p.q||('🎧 '+p.zh+' ('+p.py+')'),p.opts[k].x,right.x,ok);
  if(ok){
    mine.classList.add('ok');
    const s=p.t==='listen'?p.zh:right.say;
    fb.innerHTML=`<div class="fb ok">✓ Верно!</div>`;
    later(()=>{speak(s||[]);},150);
    later(next,s?2100:1100);
  }else{
    cur.mist.add(p.id);mine.classList.add('bad');
    later(()=>{
      good.classList.add('ok');
      speak((p.t==='listen'?p.zh:right.say)||[]);
      fb.innerHTML=`<div class="fb bad"><div><b class="h">Не совсем.</b> Правильно: <b>${right.x}</b></div><div>${p.why}</div>${cardFor(p)}
        <div class="row"><button class="btn ghost small" id="bAgain">↩︎ Попробовать ещё раз</button><button class="btn small" id="bNext">Дальше →</button></div></div>`;
      wireSnd();wireTr();
      $('#bAgain').onclick=()=>{delete cur.ans[p.id];render();};$('#bNext').onclick=next;
      fb.scrollIntoView({block:'end',behavior:'smooth'});
    },1000);
  }
}

   <div class="row" style="justify-content:center"><button class="btn ghost small" id="bAnim">▶ Порядок черт</button><button class="btn small" id="bTrace">✍️ Обвести пальцем</button></div>
   <div id="fb"></div></div>`;
};
MOUNT.write=p=>{
  wireSnd();
  const S=STROKES[p.ch], NS='http://www.w3.org/2000/svg';
  const d=pts=>'M'+pts.map(q=>q.join(' ')).join(' L');
  const box=$('#wb');
  box.innerHTML=`<svg viewBox="0 0 100 100"><g stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 2"><line x1="0" y1="50" x2="100" y2="50"/><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/></g>
    <g id="out" fill="none" stroke="var(--line)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">${S.map(s=>`<path d="${d(s)}"/>`).join('')}</g>
    <g id="ink" fill="none" stroke="var(--ink)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></g>
    <path id="usr" fill="none" stroke="var(--jade)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/></svg>`;
  const svg=box.querySelector('svg'), ink=svg.querySelector('#ink'), usr=svg.querySelector('#usr'), ws=$('#ws');
  let mode='idle', k=0, miss=0, pts=[], animTok=0, autoT=null;
  function addStroke(i,color,dur,cb){const pa=document.createElementNS(NS,'path');pa.setAttribute('d',d(S[i]));if(color)pa.setAttribute('stroke',color);ink.appendChild(pa);
    const L=pa.getTotalLength();pa.style.strokeDasharray=L;pa.style.strokeDashoffset=L;
    pa.getBoundingClientRect();pa.style.transition=`stroke-dashoffset ${dur}ms ease-in-out`;pa.style.strokeDashoffset=0;
    if(cb)later(cb,dur+120);return pa;}
  function animate(){const tok=++animTok;mode='anim';ink.innerHTML='';k=0;ws.textContent=`Черт: ${S.length}`;
    let i=0;const step=()=>{if(tok!==animTok)return;if(i>=S.length){ws.textContent='Теперь обведи сама ✍️';startTrace(false);return;}
      ws.textContent=`Черта ${i+1} из ${S.length}`;addStroke(i,'var(--seal)',650,step);i++;};step();}
  function startTrace(reset){animTok++;clearTimeout(autoT);mode='trace';k=0;miss=0;if(reset!==false||true)ink.innerHTML='';ws.textContent=`Обведи черту 1 из ${S.length}`;}
  function pos(e){const r=svg.getBoundingClientRect();return [(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100];}
  const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  box.addEventListener('pointerdown',e=>{if(mode!=='trace')return;e.preventDefault();box.setPointerCapture(e.pointerId);pts=[pos(e)];usr.setAttribute('d',d(pts));});
  box.addEventListener('pointermove',e=>{if(mode!=='trace'||!pts.length)return;pts.push(pos(e));usr.setAttribute('d',d(pts));});
  box.addEventListener('pointerup',()=>{if(mode!=='trace'||!pts.length)return;
    const s=S[k], a=pts[0], b=pts[pts.length-1];let len=0;for(let i=1;i<pts.length;i++)len+=dist(pts[i-1],pts[i]);
    let sl=0;for(let i=1;i<s.length;i++)sl+=dist(s[i-1],s[i]);
    const endOk=dist(b,s[s.length-1])<24||(s.length>2&&dist(b,s[s.length-2])<20);
    pts=[];usr.setAttribute('d','');
    if(dist(a,s[0])<24&&endOk&&len>sl*.45){addStroke(k,null,180);k++;miss=0;
      if(k>=S.length){mode='done';ws.textContent='';$('#fb').innerHTML=`<div class="fb ok">✓ Отлично! Иероглиф ${p.ch} написан.</div>`;speak(p.ch);later(next,1900);}
      else ws.textContent=`Обведи черту ${k+1} из ${S.length}`;}
    else{miss++;ws.textContent=miss>=2?`Смотри, как идёт черта ${k+1} 👇`:`Не та черта — начни с другого конца или с другого места`;
      if(miss>=2){const h=addStroke(k,'var(--seal)',600);later(()=>h.remove(),1300);}}
  });
  $('#bAnim').onclick=()=>{clearTimeout(autoT);animate();};$('#bTrace').onclick=()=>startTrace(true);
  if(settings.auto){speak(p.ch);autoT=setTimeout(animate,500);timers.push(autoT);}else startTrace(true);
};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recog=null;
function listenOnce(cb){
  if(!SR){cb({err:'unsupported'});return;}
  try{recog=new SR();}catch(e){cb({err:'unsupported'});return;}
  let got=false;recog.lang='zh-CN';recog.interimResults=false;recog.maxAlternatives=5;
  recog.onresult=e=>{got=true;cb({alts:[...e.results[0]].map(a=>a.transcript)});};
  recog.onerror=e=>{got=true;cb({err:e.error||'error'});};
  recog.onend=()=>{if(!got)cb({err:'no-speech'});recog=null;};
  try{recog.start();}catch(e){cb({err:'not-allowed'});}
}
const ERR={
 'unsupported':'Здесь распознавание речи не работает. Послушай слово, скажи его вслух и отметь сама.',
 'not-allowed':'Нет доступа к микрофону. Как включить — ниже. А пока можно отметить самой.',
 'service-not-allowed':'Нет доступа к микрофону. Как включить — ниже. А пока можно отметить самой.',
 'no-speech':'Я ничего не услышал. Нажми 🎤 и скажи погромче.',
 'audio-capture':'Микрофон не найден. Проверь, что он включён.',
 'network':'Распознаванию речи нужен интернет. Проверь связь или отметь сама.'};

  return `<div class="card" style="display:flex;flex-direction:column;gap:12px;text-align:center"><h2 style="font-size:22px">Работа над ошибками?</h2>
   <p style="margin:0">Ошибок в этой части: <b>${cur.mist.size}</b>. Повторим эти задания ещё раз?</p>
   <div class="row" style="justify-content:center"><button class="btn" id="bY">Да, повторим</button><button class="btn ghost" id="bN">Нет, дальше</button></div></div>`;};
MOUNT.errq=()=>{
  $('#bY').onclick=()=>{const t=cur.P.pages.filter(p=>p.id&&cur.mist.has(p.id));cur.retry=true;cur.pages.splice(cur.i+1,0,...t);
    if(t.some(x=>x.t==='speak'))t.forEach(x=>cur.clues.delete(x.id));next();};
  $('#bN').onclick=()=>{markDone();cur.pages.push({t:'done'});cur.i=cur.pages.length-1;render();};
};
PAGE.done=()=>{pageAudio=[];
  const idx=PARTS.findIndex(x=>x.id===cur.pid), nx=PARTS[idx+1];
  return `<div class="card" style="display:flex;flex-direction:column;gap:12px;text-align:center">
   <div class="zh" style="font-size:56px;color:var(--seal)">好！</div><h2 style="font-size:22px">Часть пройдена</h2>
   <div class="row" style="justify-content:center">${nx?`<button class="btn" id="bNx">${nx.title} →</button>`:''}<button class="btn ghost" id="bM">☰ Меню</button></div></div>`;};
MOUNT.done=()=>{const idx=PARTS.findIndex(x=>x.id===cur.pid), nx=PARTS[idx+1];
  if(nx)$('#bNx').onclick=()=>openPart(nx.id);$('#bM').onclick=showMenu;};

/* my answers */
function showAnswers(){
  clearT();stopSpeak();
  const list=Object.entries(answers);
  const by={};list.forEach(([id,a])=>{(by[a.part]=by[a.part]||[]).push(a);});
  const okN=list.filter(([,a])=>a.ok).length;
  $('#app').innerHTML=`<div class="bar"><button class="ib" id="bMenu" aria-label="Меню">☰</button><div class="t">📋 Мои ответы<small>верно: ${okN} из ${list.length}</small></div></div>
   <div class="page">${list.length?'':'<div class="card muted">Здесь появятся твои ответы. Если пройти задание ещё раз, ответ перезапишется.</div>'}
   ${PARTS.filter(p=>by[p.title]).map(p=>`<div class="card"><div class="eyebrow">${p.title}</div>${by[p.title].map(a=>`<div class="ans"><div>${a.q}</div>
     <div>Твой ответ: <span class="${a.ok?'ok':'bad'}">${a.ok?'✓':'✗'} ${a.your}</span>${a.ok?'':` · верно: <b>${a.right}</b>`}</div></div>`).join('')}</div>`).join('')}</div>`;
  $('#bMenu').onclick=showMenu;window.scrollTo(0,0);
}

/* ---------- character breakdown ---------- */
const DEC={};
$('#decomp').textContent.trim().split('\n').forEach(l=>{const f=l.split('|');if(f.length<5)return;
  DEC[f[0]]={py:f[1],ru:f[2],parts:f[3]?f[3].split(';').map(x=>x.split('=')):[],why:f[4]};});
const HZRE=/[\u3400-\u9fff\u2e80-\u2fdf]/;
/* how to pronounce parts that are only components */
const PPY={'⺍':['—','знаки сверху'],'𠂉':['—','',],'儿':['ér','ноги; сын'],'千':['qiān','тысяча'],'五':['wǔ','пять'],'丨':['gǔn','вертикальная черта'],
 '丶':['zhǔ','точка'],'灬':['huǒ','огонь'],'占':['zhàn','занимать'],'斿':['yóu','флажок'],'云':['yún','облако'],'艮':['gěn','упрямый'],'止':['zhǐ','стоп'],
 '厶':['sī','личный'],'与':['yǔ','и; давать'],'米':['mǐ','рис'],'另':['lìng','другой'],'老':['lǎo','старый'],'才':['cái','только; талант'],
 '禾':['hé','злак'],'食':['shí','еда'],'示':['shì','показывать'],'刀':['dāo','нож'],'丝':['sī','нить'],'糸':['mì','шёлк'],'父':['fù','отец'],'圣':['shèng','святой'],
 '侯':['hóu','маркиз'],'𠂇':['zuǒ','рука'],'〢':['—','черты'],'竹':['zhú','бамбук'],'方':['fāng','сторона']};
const SAYAS={'亻':'人','氵':'水','讠':'言','忄':'心','扌':'手','纟':'丝','饣':'食','刂':'刀','阝':'阜','⺮':'竹','艹':'草','辶':'辵','礻':'示','宀':'绵','冖':'幂','丩':'纠','夬':'怪','囗':'围','攵':'扑','覀':'亚','𠂇':'左','灬':'火','丨':'滚','丶':'主'};
const pyOf=c=>DEC[c]?DEC[c].py:(PPY[c]?PPY[c][0]:'');
const canSay=c=>pyOf(c)&&pyOf(c)!=='—';
function toast(t){const d=document.createElement('div');d.className='mod';d.style.background='transparent';d.style.pointerEvents='none';d.style.alignItems='flex-end';
  d.innerHTML=`<div class="box" style="text-align:center;padding:10px 14px;margin-bottom:24px;box-shadow:0 4px 16px rgba(0,0,0,.2)">${t}</div>`;
  document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}
function wrapHz(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    const pe=n.parentElement;if(!pe||!HZRE.test(n.nodeValue))return NodeFilter.FILTER_REJECT;
    if(pe.closest('svg,script,style,.hz,.mod,.bar,.mi,.nav,button,.tok'))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT;}});
  const list=[];while(w.nextNode())list.push(w.currentNode);
  list.forEach(n=>{const fr=document.createDocumentFragment();
    n.nodeValue.split(/([\u3400-\u9fff\u2e80-\u2fdf])/).forEach(part=>{if(!part)return;
      if(HZRE.test(part)&&part.length===1){const sp=document.createElement('span');sp.className='hz';sp.textContent=part;fr.appendChild(sp);}
      else fr.appendChild(document.createTextNode(part));});
    n.parentNode.replaceChild(fr,n);});
}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1&&!n.classList.contains('hz'))wrapHz(n);else if(n.nodeType===3&&n.parentElement&&!n.parentElement.closest('.hz'))wrapHz(n.parentElement);})))
  .observe($('#app'),{childList:true,subtree:true});
document.addEventListener('click',e=>{
  const b=e.target.closest('#app [data-hz]');
  if(b){e.preventDefault();e.stopPropagation();showHz(b.dataset.hz);return;}
  const h=e.target.closest('#app .hz');if(!h)return;
  e.preventDefault();e.stopPropagation();showHz(h.textContent);},true);
function showHz(ch){
  document.querySelectorAll('.mod.hzm').forEach(m=>m.remove());
  const d=DEC[ch];
  const body=d?`<div class="hzbox"><div class="hc"><div class="zh">${ch}</div><div><div style="font-size:18px"><b>${d.py}</b></div><div style="font-size:16px">${d.ru}</div>
      <button class="snd" id="hzSay" aria-label="Слушать" style="margin-top:4px">🔊</button></div></div>
    ${d.parts.length?`<div class="eyebrow" style="margin-top:12px">Из каких частей</div><div class="parts">${d.parts.map(p=>{const c=p[0],py=pyOf(c);
        const inner=`<span class="zh">${c}</span><span>${py&&py!=='—'?`<b>${py}</b><br>`:''}<span class="py">${p[1]}</span></span>`;
        const snd=canSay(c)?`<button class="snd" style="width:28px;height:28px;font-size:12px" data-sayp="${SAYAS[c]||c}" aria-label="Слушать">🔊</button>`:'';
        return DEC[c]&&c!==ch?`<span class="row" style="gap:4px"><button class="pt" data-ch="${c}">${inner} ›</button>${snd}</span>`:`<span class="row" style="gap:4px"><span class="pt">${inner}</span>${snd}</span>`;}).join('<span style="align-self:center">+</span>')}</div>
    <div class="muted" style="font-size:12px;margin-top:-4px">Нажми на часть со знаком › — разберём и её.</div>`
      :`<div class="eyebrow" style="margin-top:12px">Цельный знак</div><div class="muted" style="font-size:14px;margin:6px 0 10px">Его не делят на части — это сам по себе маленький рисунок.</div>`}
    <div class="why">💡 ${d.why}</div></div>`
   :`<div class="hzbox"><div class="hc"><div class="zh">${ch}</div><div>Разбора этого знака пока нет.</div></div></div>`;
  const m=document.createElement('div');m.className='mod hzm';
  m.innerHTML=`<div class="box" role="dialog"><button class="ib x" aria-label="Закрыть">✕</button>${body}</div>`;
  m.onclick=e=>{const sp=e.target.closest('[data-sayp]');if(sp){speak(sp.dataset.sayp);return;}
    const pb=e.target.closest('.pt[data-ch]');if(pb){showHz(pb.dataset.ch);return;}
    if(e.target===m||e.target.closest('.x'))m.remove();};
  document.body.appendChild(m);
  const sb=m.querySelector('#hzSay');if(sb)sb.onclick=e=>{e.stopPropagation();speak(SAYAS[ch]||ch);};
  speak(SAYAS[ch]||ch);
}
showMenu();
})();
</script>

</body>
