 ],

{t:"A visita ao T1",ru:"Смотрим квартиру с агентом",e:"🔑",
 lines:[
 ["ri","Olá, Vera! Encontraste bem o prédio?","Привет, Вера! Легко нашла дом?"],
 ["v","Encontrei! Vim de metro, foi facílimo.","Нашла! Приехала на метро, было проще простого."],
 ["ri","Ótimo. É no segundo andar. O elevador é pequenino, só cabem duas pessoas.","Отлично. Это на втором этаже. Лифт крошечный, помещаются только двое."],
 ["v","Duas pessoas magras, pelos vistos!","Двое худых, судя по всему!"],
 ["ri","Ahah, exatamente. Pronto, cá estamos. Entra à vontade.","Ха-ха, именно. Ну вот, пришли. Заходи, не стесняйся."],
 ["v","Que sala tão luminosa! Apanha muito sol?","Какая светлая гостиная! Здесь много солнца?"],
 ["ri","Apanha sol de manhã. A sala está virada a nascente.","Солнце бывает утром. Гостиная выходит на восток."],
 ["v","E da varanda vê-se o mar?","А с балкона видно море?"],
 ["ri","Vê-se, sim! Olha, ali ao fundo, depois das palmeiras.","Видно, да! Смотри, вон там вдали, за пальмами."],
 ["v","Que vista linda! E aquelas cordas por baixo da janela?","Какой красивый вид! А что это за верёвки под окном?"],
 ["ri","É o estendal. Aqui toda a gente seca a roupa à janela.","Это сушилка. Здесь все сушат бельё за окном."],
 ["v","A sério? Na Rússia secamos a roupa dentro de casa.","Серьёзно? В России мы сушим бельё дома."],
 ["ri","Aqui também, no inverno. Com a humidade do Porto, às vezes demora dias!","Здесь тоже, зимой. При влажности Порту иногда сохнет по нескольку дней!"],
 ["v","Humidade? Esta casa tem problemas de humidade?","Влажность? В этой квартире проблемы с влажностью?"],
 ["ri","Esta casa é boa, as janelas são novas, de vidro duplo. Mas aconselho um desumidificador.","Эта квартира хорошая, окна новые, с двойным стеклом. Но советую осушитель воздуха."],
 ["v","E há aquecimento central?","А центральное отопление есть?"],
 ["ri","Não há, como na maioria das casas portuguesas. Mas há um aquecedor elétrico no quarto.","Нет, как в большинстве португальских домов. Но в спальне есть электрический обогреватель."],
 ["v","No inverno faz muito frio dentro de casa?","Зимой дома очень холодно?"],
 ["ri","Faz algum. Os portugueses dizem que passam mais frio em casa do que na rua!","Прохладно. Португальцы говорят, что дома им холоднее, чем на улице!"],
 ["v","Que curioso! Então vou comprar umas mantas. E a cozinha?","Как интересно! Тогда куплю пару пледов. А кухня?"],
 ["ri","Tem frigorífico, placa elétrica, forno e máquina de lavar roupa.","Есть холодильник, электрическая плита, духовка и стиральная машина."],
 ["v","E a água quente? É com esquentador?","А горячая вода? От газовой колонки?"],
 ["ri","É, é um esquentador a gás. Está aqui, ao lado da janela.","Да, газовая колонка. Вот она, рядом с окном."],
 ["v","Posso ver a casa de banho?","Можно посмотреть ванную?"],
 ["ri","Claro. Tem banheira com chuveiro.","Конечно. Там ванна с душем."],
 ["v","Banheira! Que luxo. E a internet já está instalada?","Ванна! Какая роскошь. А интернет уже подключён?"],
 ["ri","Ainda não, tens de fazer o contrato com uma operadora. Demora uns três dias.","Ещё нет, нужно заключить договор с провайдером. Это занимает дня три."],
 ["v","Está bem. E este cantinho? Dá para pôr uma secretária?","Хорошо. А этот уголок? Можно поставить письменный стол?"],
 ["ri","Dá perfeitamente. E há uma estante para os teus livros.","Без проблем. И есть стеллаж для твоих книг."],
 ["v","Gosto muito! E o barulho? A rua é sossegada?","Мне очень нравится! А шум? Улица тихая?"],
 ["ri","Durante o dia há algum movimento, mas à noite é muito sossegada.","Днём есть движение, но ночью очень тихо."],
 ["v","E a renda são mil e cinquenta, certo?","А аренда тысяча пятьдесят, верно?"],
 ["ri","Certo. Mas o senhorio, o Sr. Armando, gostava de te conhecer primeiro.","Верно. Но хозяин, сеньор Арманду, хотел бы сначала с тобой познакомиться."],
 ["v","Então marcamos uma reunião com ele?","Тогда назначим с ним встречу?"]
 ],

{t:"A conversa com o senhorio",ru:"Торгуемся с хозяином о цене и залоге",e:"🤝",
 lines:[
 ["ar","Boa tarde! A menina é que é a Vera?","Добрый день! Вы и есть Вера?"],
 ["v","Sou, sim. Muito prazer, Sr. Armando.","Да, я. Очень приятно, сеньор Арманду."],
 ["ar","O prazer é todo meu. Então, gostou do apartamento?","Мне тоже очень приятно. Ну что, вам понравилась квартира?"],
 ["v","Gostei muito, é muito luminoso. Mas queria falar sobre a renda.","Очень понравилась, она очень светлая. Но я хотела поговорить об аренде."],
 ["ar","Diga, diga.","Говорите, говорите."],
 ["v","Mil e cinquenta está um pouco acima do meu orçamento. Seria possível mil?","Тысяча пятьдесят немного выше моего бюджета. Можно было бы тысячу?"],
 ["ar","Mil? Ó menina, assim não me safo! Os impostos estão caríssimos.","Тысячу? Ох, девушка, так я не выкручусь! Налоги ужасно дорогие."],
 ["v","Eu percebo. Mas sou uma inquilina sossegada: não fumo, não tenho animais e não dou festas.","Я понимаю. Но я спокойная жилица: не курю, животных нет и вечеринок не устраиваю."],
 ["ar","Isso conta muito. O último inquilino tocava bateria às duas da manhã.","Это много значит. Прошлый жилец играл на барабанах в два часа ночи."],
 ["v","Bateria? Coitados dos vizinhos!","На барабанах? Бедные соседи!"],
 ["ar","Coitado de mim! A D. Lurdes ligava-me todos os dias. Pronto, faço mil e vinte. Pode ser?","Бедный я! Дона Лурдеш звонила мне каждый день. Ладно, сделаю тысячу двадцать. Подходит?"],
 ["v","Pode ser, combinado! E o que é preciso para fazer o contrato?","Подходит, договорились! А что нужно, чтобы заключить договор?"],
 ["ar","Normalmente peço um fiador.","Обычно я прошу поручителя."],
 ["v","Um fiador? Eu ainda não conheço quase ninguém em Portugal.","Поручителя? Я пока почти никого не знаю в Португалии."],
 ["ar","Então pode ser caução. São dois meses de caução e duas rendas adiantadas.","Тогда можно залог. Это два месяца залога и две аренды вперёд."],
 ["v","Quatro meses de uma vez? É muito dinheiro...","Четыре месяца сразу? Это много денег…"],
 ["ar","Eu sei, mas a caução devolvo-a no fim, se a casa estiver em bom estado.","Я знаю, но залог я верну в конце, если квартира будет в хорошем состоянии."],
 ["v","Está bem. E as contas da luz, da água e do gás?","Хорошо. А счета за свет, воду и газ?"],
 ["ar","Ficam em seu nome. Tem de pedir a ligação às empresas.","Они будут на ваше имя. Нужно попросить компании подключить."],
 ["v","E se houver algum problema na casa? Por exemplo, uma avaria?","А если в квартире будет какая-нибудь проблема? Например, поломка?"],
 ["ar","Avarias da casa são comigo: canos, esquentador, eletrodomésticos. Lâmpadas é consigo!","Поломки по дому — ко мне: трубы, колонка, бытовая техника. Лампочки — на вас!"],
 ["v","Parece-me justo. Como pago a renda?","Мне кажется, это справедливо. Как платить аренду?"],
 ["ar","Por transferência bancária, até ao dia oito de cada mês.","Банковским переводом, до восьмого числа каждого месяца."],
 ["v","E recebo recibo?","А я получу квитанцию?"],
 ["ar","Claro, eu passo recibos eletrónicos nas Finanças. Está tudo legal.","Конечно, я выписываю электронные квитанции через налоговую. Всё законно."],
 ["v","Ótimo. E o contrato também fica registado?","Отлично. А договор тоже регистрируется?"],
 ["ar","Fica, sim. Eu registo-o nas Finanças. A menina precisa de ter NIF.","Да. Я регистрирую его в налоговой. Вам нужен NIF."],
 ["v","Já tenho NIF! Tratei disso na semana passada.","У меня уже есть NIF! Я занялась этим на прошлой неделе."],
 ["ar","Muito bem, está preparada! Assinamos na sexta, na imobiliária?","Очень хорошо, вы подготовились! Подпишем в пятницу, в агентстве?"],
 ["v","Combinado. Obrigada, Sr. Armando!","Договорились. Спасибо, сеньор Арманду!"],
 ["ar","De nada, menina. E nada de bateria, hein!","Не за что, девушка. И никаких барабанов, слышите!"],
 ["v","Prometo! Só música baixinha.","Обещаю! Только тихая музыка."]
 ],

{t:"Assinar e receber as chaves",ru:"Подписываем договор и получаем ключи",e:"📝",
 lines:[
 ["ri","Bom dia, Vera! Trouxeste os documentos?","Доброе утро, Вера! Принесла документы?"],
 ["v","Trouxe: o passaporte, o NIF e o contrato de trabalho.","Принесла: паспорт, NIF и трудовой договор."],
 ["ri","Perfeito. Também preciso de um comprovativo de morada no estrangeiro.","Отлично. Ещё мне нужно подтверждение адреса за границей."],
 ["v","Pode ser uma fatura da luz da minha casa na Rússia?","Можно счёт за свет из моего дома в России?"],
 ["ri","Pode, sim. Manda-me por e-mail, se faz favor.","Можно. Пришли мне по почте, пожалуйста."],
 ["v","Já está enviado! E agora?","Уже отправлено! А теперь?"],
 ["ri","Agora lemos o contrato juntas. Qualquer dúvida, pergunta.","Теперь вместе читаем договор. Если что-то непонятно — спрашивай."],
 ["v","Obrigada. O meu português ainda não é perfeito.","Спасибо. Мой португальский пока не идеальный."],
 ["ri","Está ótimo! Aqui diz: contrato de arrendamento por seis meses, de um de março a trinta e um de agosto.","Он отличный! Тут написано: договор аренды на шесть месяцев, с первого марта по тридцать первое августа."],
 ["v","E se eu quiser ficar mais tempo?","А если я захочу остаться подольше?"],
 ["ri","Não precisas de fazer nada: o contrato renova-se automaticamente.","Ничего не нужно делать: договор продлевается автоматически."],
 ["v","E se eu quiser sair no fim do contrato?","А если я захочу съехать в конце договора?"],
 ["ri","Basta avisar com sessenta dias de antecedência. É a lei.","Достаточно предупредить за шестьдесят дней. Таков закон."],
 ["v","E se precisar de sair antes? Há multa?","А если придётся уехать раньше? Есть штраф?"],
 ["ri","Se avisares a tempo, não há multa. Está nesta cláusula.","Если предупредишь вовремя, штрафа нет. Это в этом пункте."],
 ["v","Ainda bem! E o inventário?","Вот и хорошо! А опись?"],
 ["ri","Está aqui: a lista de todos os móveis e eletrodomésticos, com fotografias.","Вот она: список всей мебели и техники, с фотографиями."],
 ["v","Olha, nesta foto o sofá já tem um risco.","Смотри, на этой фотографии на диване уже есть царапина."],
 ["ri","Bem visto! Vou apontar: risco no sofá, já existia.","Хорошо подмечено! Запишу: царапина на диване, была раньше."],
 ["v","E o condomínio? Há regras no prédio?","А дом? Есть правила в доме?"],
 ["ri","Há: silêncio depois das dez da noite e o lixo vai para os ecopontos na rua.","Есть: тишина после десяти вечера, а мусор — в баки для раздельного сбора на улице."],
 ["v","Ecopontos? O que é isso?","Экопонты? Что это?"],
 ["ri","São os contentores coloridos: azul para papel, amarelo para plástico e verde para vidro.","Это цветные контейнеры: синий для бумаги, жёлтый для пластика и зелёный для стекла."],
 ["v","Que organizado! Na Rússia também separamos, mas não em todo o lado.","Как организованно! В России мы тоже сортируем, но не везде."],
 ["ri","E a quota do condomínio já está incluída na renda.","И взнос за дом уже включён в аренду."],
 ["v","Melhor ainda. Onde assino?","Ещё лучше. Где мне подписать?"],
 ["ri","Aqui e aqui. E rubricas em todas as páginas, se faz favor.","Здесь и здесь. И инициалы на всех страницах, пожалуйста."],
 ["v","Em todas? São doze páginas!","На всех? Тут двенадцать страниц!"],
 ["ri","Bem-vinda a Portugal, o país da burocracia!","Добро пожаловать в Португалию, страну бюрократии!"],
 ["v","Pronto, já está. A minha mão está cansada!","Всё, готово. У меня рука устала!"],
 ["ri","E aqui tens as chaves: esta é da porta da rua, esta do apartamento e esta da caixa do correio.","А вот твои ключи: этот от входной двери, этот от квартиры, а этот от почтового ящика."],
 ["v","Que emoção! A minha primeira casa em Portugal!","Как волнительно! Мой первый дом в Португалии!"],
 ["ri","Parabéns! Quando é a mudança?","Поздравляю! Когда переезд?"],
 ["v","No sábado de manhã. Um amigo vai ajudar-me.","В субботу утром. Друг мне поможет."],
 ["ri","Então boa mudança! Qualquer coisa, liga-me.","Тогда удачного переезда! Если что — звони."]
 ],

{t:"Dia de mudanças",ru:"Переезд и новая соседка",e:"📦",
 lines:[
 ["nu","Bom dia, vizinha nova! Trouxe pastéis de nata para dar energia.","Доброе утро, новая соседка! Принёс пирожные с заварным кремом для энергии."],
 ["v","Nuno, és um anjo! Só tenho duas malas, mas ontem comprei imensa coisa.","Нуну, ты ангел! У меня только два чемодана, но вчера я накупила кучу всего."],
 ["nu","Estou a ver: almofadas, tachos, plantas... Compraste a loja toda?","Вижу: подушки, кастрюли, растения… Ты скупила весь магазин?"],
 ["v","Quase! Quero que a casa fique ao meu gosto.","Почти! Хочу, чтобы квартира была на мой вкус."],
 ["nu","O elevador é minúsculo. Vamos ter de fazer várias viagens.","Лифт малюсенький. Придётся ездить несколько раз."],
 ["v","A Rita disse: cabem duas pessoas magras ou uma caixa grande.","Рита сказала: помещаются двое худых или одна большая коробка."],
 ["nu","Então vai a caixa no elevador e nós vamos pelas escadas!","Тогда коробка едет на лифте, а мы — по лестнице!"],
 ["v","Ufa, segundo andar! Onde ponho esta caixa pesada?","Уф, второй этаж! Куда мне поставить эту тяжёлую коробку?"],
 ["nu","Deixa-a na cozinha. Depois arrumamos com calma.","Оставь её на кухне. Потом спокойно разберём."],
 ["lu","Com licença! Bom dia! Eu sou a D. Lurdes, a vizinha do lado.","Простите! Доброе утро! Я дона Лурдеш, соседка за стеной."],
 ["v","Bom dia, D. Lurdes! Eu sou a Vera, a nova inquilina.","Доброе утро, дона Лурдеш! Я Вера, новая жилица."],
 ["lu","Seja muito bem-vinda! Trouxe-lhe uma sopa de legumes, que hoje está fresco.","Добро пожаловать! Принесла вам овощной суп, сегодня прохладно."],
 ["v","Que simpatia! A senhora mora aqui há muito tempo?","Как мило! Вы давно здесь живёте?"],
 ["lu","Há trinta anos! Conheço o prédio todo. Se precisar de alguma coisa, é só bater à porta.","Тридцать лет! Знаю весь дом. Если что-нибудь понадобится, просто постучите."],
 ["v","Muito obrigada! Sabe se há um supermercado aqui perto?","Большое спасибо! Вы не знаете, есть ли поблизости супермаркет?"],
 ["lu","Há um ao virar da esquina. E o mercado de Matosinhos é ótimo para peixe fresco.","Есть один сразу за углом. А рынок Матозиньюша отлично подходит для свежей рыбы."],
 ["v","Que boa dica! E o lixo? Onde se põe?","Отличная подсказка! А мусор? Куда его выносить?"],
 ["lu","O lixo normal vai para o contentor na rua e o reciclável para os ecopontos.","Обычный мусор — в контейнер на улице, а на переработку — в экопонты."],
 ["nu","Olhem quem chegou! Que cão tão giro!","Смотрите, кто пришёл! Какой симпатичный пёс!"],
 ["lu","Ai, é o Douro! Ele adora conhecer os vizinhos. Douro, anda cá!","Ой, это Доуру! Он обожает знакомиться с соседями. Доуру, иди сюда!"],
 ["v","Ele já se deitou no meu tapete! Acho que gostou da casa.","Он уже улёгся на мой ковёр! Кажется, ему понравилась квартира."],
 ["lu","Se o Douro gosta, é porque a casa tem bom ambiente!","Если Доуру нравится, значит, в доме хорошая атмосфера!"],
 ["nu","Vera, e a internet? Já tens?","Вера, а интернет? Уже есть?"],
 ["v","Ainda não, o técnico só vem na terça. Vou ficar três dias sem internet!","Ещё нет, мастер придёт только во вторник. Я останусь на три дня без интернета!"],
 ["lu","Três dias? No meu tempo não havia internet e vivíamos muito bem!","Три дня? В моё время интернета не было, и мы прекрасно жили!"],
 ["nu","Ahah, mas a Vera trabalha pela internet, D. Lurdes.","Ха-ха, но Вера работает через интернет, дона Лурдеш."],
 ["lu","Então use a minha! A palavra-passe está num papel no frigorífico. Venha buscá-la mais logo.","Тогда пользуйтесь моим! Пароль на бумажке на холодильнике. Зайдите за ним попозже."],
 ["v","A sério? A senhora é a melhor vizinha do mundo!","Серьёзно? Вы лучшая соседка на свете!"],
 ["lu","Exagerada! E o estendal? Já sabe estender a roupa à janela?","Ну это вы преувеличиваете! А сушилка? Уже умеете развешивать бельё за окном?"],
 ["v","Ainda não! Tenho medo de deixar cair as meias na rua.","Ещё нет! Боюсь уронить носки на улицу."],
 ["lu","Isso acontece a toda a gente. Eu ensino-a, é fácil.","Это со всеми бывает. Я вас научу, это просто."],
 ["nu","D. Lurdes, aceita um pastel de nata connosco?","Дона Лурдеш, съедите с нами пирожное?"],
 ["lu","Aceito! Mas só um, que o Douro também vai querer.","Не откажусь! Но только одно, Доуру ведь тоже захочет."]
 ],

{t:"O esquentador não acende",ru:"Поломка: звоним хозяину и мастеру",e:"🚿",
 lines:[
 ["v","Está? Sr. Armando? Bom dia, fala a Vera, do T1 de Matosinhos.","Алло? Сеньор Арманду? Доброе утро, это Вера, из квартиры в Матозиньюше."],
 ["ar","Bom dia, menina! Então, está tudo bem?","Доброе утро, девушка! Ну что, всё в порядке?"],
 ["v","Mais ou menos. Hoje de manhã não havia água quente!","Так себе. Сегодня утром не было горячей воды!"],
 ["ar","Não havia? Então o esquentador não acende?","Не было? Значит, колонка не зажигается?"],
 ["v","Não acende. Faz um barulhinho, clic, clic, mas não pega.","Не зажигается. Щёлкает — клик, клик, — но не загорается."],
 ["ar","Deve ser alguma avaria. Vou mandar aí o Sr. Fernando, o meu técnico.","Наверное, какая-то поломка. Пришлю к вам сеньора Фернанду, моего мастера."],
 ["v","Ele pode vir hoje? Tenho uma reunião por videochamada à tarde.","Он может прийти сегодня? У меня днём встреча по видеосвязи."],
 ["ar","Vou ligar-lhe já e depois digo-lhe alguma coisa.","Сейчас же ему позвоню и потом вам сообщу."],
 ["v","Obrigada! E há outra coisa: apareceu uma mancha escura no teto da casa de banho.","Спасибо! И ещё одно: на потолке в ванной появилось тёмное пятно."],
 ["ar","Ai, é a humidade. Já vamos ver isso também.","Ох, это влажность. Сейчас и этим займёмся."],
 ["fe","Bom dia! Venho ver o esquentador. A senhora é a D. Vera?","Доброе утро! Я пришёл посмотреть колонку. Вы — сеньора Вера?"],
 ["v","Sou eu, bom dia! Entre, entre. É ali na cozinha.","Это я, доброе утро! Заходите, заходите. Она вон там, на кухне."],
 ["fe","Vamos lá ver o doente. Hum... faz clic, clic e não acende.","Ну, посмотрим на больного. Хм… щёлкает — и не зажигается."],
 ["v","É grave? Vai ser preciso comprar um novo?","Это серьёзно? Придётся покупать новую?"],
 ["fe","Calma, deixe-me ver... Já sei! São as pilhas.","Спокойно, дайте-ка посмотреть… Всё ясно! Это батарейки."],
 ["v","As pilhas? O esquentador tem pilhas?","Батарейки? У колонки есть батарейки?"],
 ["fe","Tem, sim! Muitos esquentadores precisam de pilhas para acender. Estas estão gastas.","Есть! Многим колонкам нужны батарейки, чтобы зажигаться. Эти сели."],
 ["v","Que vergonha! Chamei um técnico por causa de duas pilhas!","Как стыдно! Я вызвала мастера из-за двух батареек!"],
 ["fe","Não se preocupe, acontece a toda a gente. Eu trouxe pilhas novas.","Не переживайте, это со всеми бывает. Я принёс новые батарейки."],
 ["fe","Pronto. Abra lá a torneira da água quente.","Готово. Откройте-ка кран с горячей водой."],
 ["v","Deixe-me ver... Funciona! Água quentinha!","Сейчас посмотрю… Работает! Тёпленькая вода!"],
 ["fe","Agora a mancha na casa de banho. Mostre-me, se faz favor.","Теперь пятно в ванной. Покажите, пожалуйста."],
 ["v","É aqui, por cima do chuveiro.","Вот здесь, над душем."],
 ["fe","Isto é bolor, por causa da humidade. É normal no Porto, sobretudo no inverno.","Это плесень, из-за влажности. В Порту это обычное дело, особенно зимой."],
 ["v","E o que posso fazer?","А что я могу сделать?"],
 ["fe","Depois do banho, abra a janela uns dez minutos. E compre um desumidificador.","После душа открывайте окно минут на десять. И купите осушитель воздуха."],
 ["v","A Rita também me disse isso! E a mancha sai?","Рита мне тоже это говорила! А пятно отойдёт?"],
 ["fe","Sai com um produto próprio. Eu limpo agora e na próxima semana venho pintar.","Отойдёт специальным средством. Я сейчас почищу, а на следующей неделе приду покрасить."],
 ["v","Muito obrigada! Quanto lhe devo?","Большое спасибо! Сколько я вам должна?"],
 ["fe","Nada, quem paga é o Sr. Armando. Mas as pilhas ficam por sua conta, ahah!","Ничего, платит сеньор Арманду. Но батарейки — за ваш счёт, ха-ха!"],
 ["v","Justo! Fico a dever-lhe um café.","Справедливо! С меня кофе."],
 ["fe","Aceito o café. E da próxima vez, verifique primeiro as pilhas!","Кофе принимаю. А в следующий раз сначала проверьте батарейки!"]
 ],

{t:"Já me sinto em casa",ru:"Полгода спустя: продлеваем договор",e:"🏡",
 lines:[
 ["nu","Vera, já reparaste? Passaram cinco meses desde a mudança!","Вера, ты заметила? С переезда прошло пять месяцев!"],
 ["v","Nem acredito! Parece que foi ontem que cheguei com as duas malas.","Не верится! Кажется, я только вчера приехала с двумя чемоданами."],
 ["nu","E com aquela planta enorme! Então, e agora? Voltas para a Rússia?","И с тем огромным растением! Ну и что теперь? Вернёшься в Россию?"],
 ["v","Pois, estive a pensar nisso. Acho que vou ficar mais seis meses.","Вот, я как раз думала об этом. Кажется, я останусь ещё на шесть месяцев."],
 ["nu","A sério? Que boa notícia! O que te fez decidir?","Серьёзно? Какая хорошая новость! Что тебя убедило?"],
 ["v","Tudo! O mar, as pessoas, o peixe grelhado, os pastéis de nata...","Всё! Море, люди, рыба на гриле, пирожные с кремом…"],
 ["lu","E a vizinha do lado, espero!","И соседка за стеной, надеюсь!"],
 ["v","D. Lurdes! Claro, a senhora em primeiro lugar. E o Douro também.","Дона Лурдеш! Конечно, вы на первом месте. И Доуру тоже."],
 ["lu","O Douro passa mais tempo no seu tapete do que em minha casa, o traidor!","Доуру проводит больше времени на вашем ковре, чем у меня дома, предатель!"],
 ["nu","E o trabalho? Dá para continuar daqui?","А работа? Можно продолжать отсюда?"],
 ["v","Dá perfeitamente. Os meus clientes nem repararam que mudei de país.","Прекрасно можно. Мои клиенты даже не заметили, что я сменила страну."],
 ["lu","Então ligue já à Rita, antes que o Sr. Armando aumente a renda!","Тогда звоните скорее Рите, пока сеньор Арманду не поднял аренду!"],
 ["v","Tem razão. O contrato renova-se sozinho, mas quero confirmar a renda.","Вы правы. Договор продлевается сам, но я хочу уточнить аренду."],
 ["ri","Imobiliária Ribeira, bom dia. Fala a Rita.","Агентство «Рибейра», доброе утро. Это Рита."],
 ["v","Olá, Rita! É a Vera, do T1 de Matosinhos. Tudo bem?","Привет, Рита! Это Вера, из квартиры в Матозиньюше. Как дела?"],
 ["ri","Vera! Tudo ótimo. Então, o esquentador está a portar-se bem?","Вера! Всё отлично. Ну что, колонка ведёт себя хорошо?"],
 ["v","Ahah, está ótimo, já tem pilhas novas. Olha, queria renovar o contrato.","Ха-ха, отлично, у неё уже новые батарейки. Слушай, я хотела продлить договор."],
 ["ri","Que boa notícia! Por mais seis meses?","Какая хорошая новость! Ещё на шесть месяцев?"],
 ["v","Sim. E queria saber se a renda continua igual.","Да. И хотела узнать, остаётся ли аренда прежней."],
 ["ri","Normalmente há uma atualização anual, mas o teu contrato ainda não fez um ano.","Обычно бывает ежегодный пересмотр, но твоему договору ещё нет года."],
 ["v","Então continua mil e vinte?","Значит, остаётся тысяча двадцать?"],
 ["ri","Vou confirmar com o Sr. Armando, mas acho que sim. Ele diz que és a inquilina mais sossegada que já teve.","Уточню у сеньора Арманду, но думаю, что да. Он говорит, что ты самая спокойная жилица, которая у него была."],
 ["v","Ainda não toquei bateria nem uma vez!","Я ещё ни разу не играла на барабанах!"],

 if(scroll&&P.items[i])P.items[i].el.scrollIntoView({block:'center',behavior:'smooth'});updBar()}
function playFrom(i){if(i>=P.items.length){P.playing=false;setCur(-1);updBar();P.onEnd&&P.onEnd();return}
 P.playing=true;setCur(i,true);const it=P.items[i];
 say(it.say,it.g,()=>{if(!P.playing)return;if(opt.auto)setTimeout(()=>{if(P.playing&&P.cur===i)playFrom(i+1)},650);else{P.playing=false;P.cur=Math.min(i+1,P.items.length-1);setCur(P.cur);updBar()}})}
function pause(){P.playing=false;stopSpeech();updBar()}
function toggle(){if(P.playing)pause();else playFrom(Math.max(0,P.cur))}
function playOne(i){P.playing=false;setCur(i,false);say(P.items[i].say,P.items[i].g,()=>{})}
function updBar(){const pb=document.getElementById('pp');if(pb)pb.textContent=P.playing?'⏸':'▶';
 const c=document.getElementById('cnt');if(c)c.textContent=(P.cur>=0?P.cur+1:0)+'/'+P.items.length;
 const a=document.getElementById('autoB');if(a){a.classList.toggle('on',opt.auto);a.setAttribute('aria-pressed',opt.auto)}
 const sb=document.getElementById('subB');if(sb){sb.classList.toggle('on',opt.subs);sb.setAttribute('aria-pressed',opt.subs)}
 const s=document.getElementById('sndB');if(s){s.textContent=opt.sound?'🔊 Звук':'🔇 Без звука';s.classList.toggle('on',opt.sound);s.setAttribute('aria-pressed',opt.sound)}}

function barHTML(title,backLabel){return `<div class="bar gut"><div class="col">
 <div class="r1"><button class="ib" id="backB">${backLabel}</button><button class="ttl navB" aria-label="Навигация: все диалоги и упражнения"><span class="tt">${title}</span><span class="car">▾</span></button><button class="ib" id="vocB" aria-label="Слова и конструкции">📚</button></div>
 <div class="r2"><button class="ib" id="prevB" aria-label="Предыдущая фраза">⏮</button><button class="ib play" id="pp" aria-label="Пауза / слушать">▶</button><button class="ib" id="nextB" aria-label="Следующая фраза">⏭</button><button class="ib" id="rptB" aria-label="Сначала">🔁</button><span class="cnt" id="cnt"></span></div>
 <div class="r3"><button class="ib" id="autoB" aria-pressed="true">▶▶ Авто</button><button class="ib" id="sndB" aria-pressed="true">🔊 Звук</button><button class="ib" id="subB" aria-pressed="false">💬 Субтитры</button></div>
</div></div>`}
function bindBar(onBack,onVoc){
 document.getElementById('backB').onclick=()=>{pause();onBack()};
 document.getElementById('vocB').onclick=()=>{pause();onVoc()};
 document.getElementById('pp').onclick=toggle;
 document.getElementById('prevB').onclick=()=>{const i=Math.max(0,P.cur-1);if(P.playing)playFrom(i);else playOne(i)};
 document.getElementById('nextB').onclick=()=>{const i=Math.min(P.items.length-1,P.cur+1);if(P.playing)playFrom(i);else playOne(i)};
 document.getElementById('rptB').onclick=()=>{playFrom(0)};
 document.getElementById('autoB').onclick=()=>{opt.auto=!opt.auto;lsSet('auto',opt.auto);updBar()};
 document.getElementById('sndB').onclick=()=>{opt.sound=!opt.sound;lsSet('sound',opt.sound);if(!opt.sound)try{S&&S.cancel()}catch(e){};if(P.playing)playFrom(P.cur);updBar()};
 document.getElementById('subB').onclick=()=>{opt.subs=!opt.subs;lsSet('subs',opt.subs);setCur(P.cur)};
 updBar()}

function closePop(){if(popEl){popEl.remove();popEl=null}if(selW){selW.classList.remove('sel');selW=null}}
function showWord(span){closePop();const w=span.dataset.w,k=w.toLowerCase();const tr=DICT[k]||'—';
 selW=span;span.classList.add('sel');
 popEl=document.createElement('div');popEl.className='pop';popEl.setAttribute('role','dialog');
 popEl.innerHTML=`<button class="sb" aria-label="Послушать слово">🔊</button><div style="flex:1;min-width:0"><div class="pw">${esc(w)}</div><div class="pr">${esc(tr)}</div></div><button class="x" aria-label="Закрыть">✕</button>`;
 document.body.appendChild(popEl);
 const r=span.getBoundingClientRect(),pw=popEl.offsetWidth,ph=popEl.offsetHeight,vw=innerWidth;
 let left=Math.min(Math.max(16,r.left+r.width/2-pw/2),vw-16-pw);let top=r.bottom+8;if(top+ph>innerHeight-10)top=r.top-ph-8;
 popEl.style.left=left+'px';popEl.style.top=top+'px';
 popEl.querySelector('.sb').onclick=e=>{e.stopPropagation();const was=P.playing;if(was)pause();say(w,DV,()=>{})};
 popEl.querySelector('.x').onclick=e=>{e.stopPropagation();closePop()};
 if(opt.sound){if(P.playing)pause();say(w,DV,()=>{})}}
document.addEventListener('click',e=>{const w=e.target.closest('.w');if(w){e.stopPropagation();showWord(w);return}
 if(popEl&&!e.target.closest('.pop'))closePop()},true);
addEventListener('scroll',()=>{if(popEl)closePop()},{passive:true});

 if(X.pos>=X.list.length)return exEnd();

/* exp: build the growing phrase */
function taskExp(box,idx,chain){const st=chain[X.stage],prev=X.stage>0?chain[X.stage-1]:null;
 const tgt=st[0].split(' ').filter(Boolean);const tl=tgt.map(w=>w.replace(/[.,!?]/g,''));
 let tiles;const pv=prev?prev[0].split(' '):null;let pos=-1;
 if(pv){for(let a=0;a+pv.length<=tl.length;a++){if(pv.every((w,j)=>tl[a+j]===w)){pos=a;break}}}
 if(pos>=0)tiles=[...tl.slice(0,pos),pv.join(' '),...tl.slice(pos+pv.length)];else tiles=tl.slice();
 const chunkTxt=pos>=0?pv.join(' '):null;
 tiles.push(st[2]);
 let order=shuf(tiles.map((t,n)=>n));let tries=0;while(tries++<8&&order.slice(0,tiles.length-1).every((v,n)=>v===n))order=shuf(order);
 box.innerHTML=`<div class="steps">${chain.map((_,n)=>`<span class="dot${n<=X.stage?' on':''}"></span>`).join('')}<span>Шаг ${X.stage+1} из ${chain.length} · задание ${X.pos+1} из ${X.list.length}</span></div>
 ${prev?`<div class="model"><div class="q">Было:</div><div class="row"><div class="pt">${wordsHTML(prev[0])}</div><button class="sb" id="pvS" aria-label="Послушать">🔊</button><button class="sb" id="pvG" aria-label="Перевод фразы">🌐</button></div><div class="tr" hidden>${esc(prev[1])}</div></div>`:''}
 <div class="q">Собери по-португальски:<br><b>«${esc(st[1])}»</b></div>
 <div class="ansbox" id="ab" aria-live="polite"></div>
 <div class="tiles" id="tl">${order.map(n=>`<button class="tile${tiles[n]===chunkTxt?' chunk':''}" data-n="${n}">${esc(tiles[n])}</button>`).join('')}</div>
 <div class="fb"></div>`;
 const ab=box.querySelector('#ab'),tlb=box.querySelector('#tl');let placed=[];
 const need=tl.length;
 const count=()=>placed.reduce((s,n)=>s+tiles[n].split(' ').length,0);
 const speakPrev=()=>{if(prev)say(prev[0],DV,()=>{})};
 bindExBar(speakPrev);
 if(prev){box.querySelector('#pvS').onclick=speakPrev;box.querySelector('#pvG').onclick=()=>{const t=box.querySelector('.model .tr');t.hidden=!t.hidden}}
 const nextStage=()=>{if(X.stage<chain.length-1){X.stage++;renderTask()}else{X.stage=0;X.pos++;renderTask()}};
 const check=()=>{const a=placed.map(n=>tiles[n]).join(' ');const okList=[st[0],...(st[3]||[])].map(norm);const ok=okList.includes(norm(a));
  tlb.querySelectorAll('.tile').forEach(b=>b.disabled=true);ab.querySelectorAll('.tile').forEach(b=>b.disabled=true);
  if(X.stage===chain.length-1||!ok)record(idx,ok&&!(idx in X.first&&!X.first[idx]),`${chain[chain.length-1][1]}`,ok?st[0]:a,st[0]);
  if(ok){ab.classList.add('ok');okBox(box,'Верно: '+esc(cap(st[0])),()=>say(st[0],DV,()=>setTimeout(nextStage,700)))}
  else{ab.classList.add('bad');const extra=placed.map(n=>tiles[n]).includes(st[2])?`<br>Лишнее слово: <b>${esc(st[2])}</b>`:'';
   wrongBox(box,`Правильно: <b>${esc(cap(st[0]))}</b>${extra}`,()=>renderTask(),nextStage,()=>say(st[0],DV,()=>{}))}};
 const draw=()=>{ab.innerHTML=placed.map(n=>`<button class="tile${tiles[n]===chunkTxt?' chunk':''}" data-n="${n}">${esc(tiles[n])}</button>`).join('');
  tlb.querySelectorAll('.tile').forEach(b=>b.hidden=placed.includes(+b.dataset.n));if(count()>=need)check()};
 tlb.onclick=e=>{const b=e.target.closest('.tile');if(!b||b.disabled)return;placed.push(+b.dataset.n);say(tiles[+b.dataset.n],DV,()=>{});draw()};
 ab.onclick=e=>{const b=e.target.closest('.tile');if(!b||b.disabled)return;placed=placed.filter(n=>n!==+b.dataset.n);draw()};
 if(opt.auto&&prev)setTimeout(speakPrev,300)}

/* options shared by sub & ant */
function buildOpts(okT,bads){const opts=[okT,...bads];let ord=shuf([0,1,2]);if(ord[0]===0)ord=[ord[1],ord[0],ord[2]];return ord.map(n=>({t:opts[n],ok:n===0}))}
function optsHTML(o){return `<div class="opts">${o.map((x,n)=>`<div class="orow"><button class="opt" data-n="${n}">${esc(x.t)}</button><button class="sb osay" data-n="${n}" aria-label="Послушать вариант">🔊</button></div>`).join('')}</div>`}
function bindOpts(box,o,idx,q,okT,why,readFirst){const els=[...box.querySelectorAll('.opt')];
 const readAll=()=>{const l=(readFirst?[{t:readFirst.t,el:readFirst.el}]:[]).concat(els.map((el,n)=>({t:o[n].t,el})));sayList(l,0,()=>{clearRd();box.querySelector('.opts').scrollIntoView({block:'nearest',behavior:'smooth'})})};
 box.querySelectorAll('.osay').forEach(b=>b.onclick=()=>{stopSpeech();clearRd();say(o[+b.dataset.n].t,DV,()=>{})});
 els.forEach((b,n)=>b.onclick=()=>{stopSpeech();clearRd();els.forEach(e=>e.disabled=true);const ok=o[n].ok;
  record(idx,ok,q,o[n].t,okT);
  if(ok){b.classList.add('ok');okBox(box,'Верно!',()=>say(okT,DV,()=>setTimeout(()=>{X.pos++;renderTask()},700)))}
  else{b.classList.add('bad');els[o.findIndex(x=>x.ok)].classList.add('ok');
   wrongBox(box,`Правильно: <b>${esc(okT)}</b><br>💡 ${esc(why)}`,()=>renderTask(),()=>{X.pos++;renderTask()},()=>say(okT,DV,()=>{}))}});
 return readAll}

/* sub: substitution drill */
function taskSub(box,idx,it){const [m,mru,cue,okT,b1,b2,why]=it;const o=buildOpts(okT,[b1,b2]);
 box.innerHTML=`<div class="model"><div class="q">Образец:</div><div class="row"><div class="pt" id="mT">${wordsHTML(m)}</div><button class="sb" id="mS" aria-label="Послушать">🔊</button><button class="sb" id="mG" aria-label="Перевод фразы">🌐</button></div><div class="tr" hidden>${esc(mru)}</div></div>
 <div class="q">Замени на: <b>${esc(cue)}</b></div>${optsHTML(o)}<div class="fb"></div>`;
 const readAll=bindOpts(box,o,idx,`${m} → ${cue}`,okT,why,{t:m,el:box.querySelector('.model')});
 box.querySelector('#mS').onclick=()=>say(m,DV,()=>{});
 box.querySelector('#mG').onclick=()=>{const t=box.querySelector('.model .tr');t.hidden=!t.hidden};
 bindExBar(readAll);if(opt.auto)setTimeout(readAll,300)}

/* ant: anticipation — say it first, then check */
function taskAnt(box,idx,it){const [ru,okT,b1,b2,why]=it;const o=buildOpts(okT,[b1,b2]);
 box.innerHTML=`<div class="q">${META.antQ||'Как сказать по-португальски?'}</div><div class="rucard">${esc(ru)}</div>
 <div class="cd" id="cd"><b id="cdn">4</b><span>🗣 Скажи вслух сама…</span><button class="pill" id="cdSkip">Показать варианты</button></div>
 <div id="ow" hidden>${optsHTML(o)}</div><div class="fb"></div>`;
 const readAll=bindOpts(box,o,idx,ru,okT,why,null);
 let n=4;const show=()=>{clearTimeout(cdT);box.querySelector('#cd').hidden=true;box.querySelector('#ow').hidden=false;if(opt.auto)readAll()};
 const tick=()=>{n--;const c=box.querySelector('#cdn');if(!c)return;if(n<=0)return show();c.textContent=n;cdT=setTimeout(tick,1000)};
 cdT=setTimeout(tick,1000);box.querySelector('#cdSkip').onclick=show;
 bindExBar(()=>{if(!box.querySelector('#ow').hidden)readAll()})}

function exEnd(){const tot=X.list.length,good=X.list.filter(i=>X.first[i]===true).length;
 if(X.mode==='main'){xs[X.i+'-'+X.k]=good+'/'+tot;lsSet('xs',xs)}
 const t=XT.find(t=>t.k===X.k);const ki=XT.findIndex(t=>t.k===X.k);
 app.innerHTML=simpleBar(t.n,'← Назад')+`<div class="gut"><div class="col page">
 <button class="skip" id="skipE">⏭ Пропустить эту страницу</button>
 <div class="end"><h2>${good===tot?'🎉 Всё верно!':'💪 Готово!'}</h2><div style="font-size:17px">Верно с первого раза: <b>${good} из ${tot}</b></div>
 ${X.wrong.length?`<div class="fbm bad">Работа над ошибками? Повторим ${X.wrong.length} ${X.wrong.length===1?'задание':'задания'} с ошибкой.</div><div class="btnrow"><button class="big" id="fixY">Да</button><button class="big sec" id="fixN">Нет</button></div>`:''}
 <div id="after" ${X.wrong.length?'hidden':''} style="display:flex;flex-direction:column;gap:8px">
 ${ki<XT.length-1?`<button class="big" id="nxE"><span>➡️</span><span>Следующее: ${XT[ki+1].n}</span></button>`:''}
 <button class="big ${ki<XT.length-1?'sec':''}" id="mnE"><span>🏋️</span><span>К упражнениям диалога</span></button></div>
 </div></div></div>`;
 scrollTo(0,0);const i=X.i,w=X.wrong.slice(),k=X.k;
 const after=()=>{const a=document.getElementById('after');a.hidden=false;const y=document.getElementById('fixY');if(y)y.closest('.btnrow').remove();a.scrollIntoView({block:'end',behavior:'smooth'})};
 document.getElementById('backB').onclick=()=>exMenu(i);
 document.getElementById('skipE').onclick=()=>exMenu(i);
 const y=document.getElementById('fixY');if(y){y.onclick=()=>runEx(i,k,w,'fix');document.getElementById('fixN').onclick=after}
 const nx=document.getElementById('nxE');if(nx)nx.onclick=()=>runEx(i,XT[ki+1].k);
 document.getElementById('mnE').onclick=()=>exMenu(i)}

function myAnswers(back){closePop();stopSpeech();
 const keys=Object.keys(ans);
 const body=DLG.map((d,i)=>{const parts=XT.map(t=>{const ks=keys.filter(k=>k.startsWith(i+'-'+t.k+'-')).sort((a,b)=>+a.split('-')[2]-+b.split('-')[2]);if(!ks.length)return'';
   return `<div class="q"><b>${t.n}</b></div>`+ks.map(k=>{const a=ans[k];return `<div class="mya">${a.ok?'✅':'❌'} ${esc(a.q)}<br>Мой ответ: ${esc(a.a)}${a.ok?'':`<br><span class="c">Правильно: ${esc(a.c)}</span>`}</div>`}).join('')}).join('');
  return parts?`<div class="sec-h">${d.e} ${i+1}. ${esc(d.t)}</div><div class="myl">${parts}</div>`:''}).join('');
 app.innerHTML=simpleBar('📋 Мои ответы','← Назад')+`<div class="gut"><div class="col page">
 <button class="skip" id="skipA">⏭ Пропустить эту страницу</button>
 ${body||'<div class="hint">Здесь появятся твои ответы из упражнений: что верно, где ошибка и правильный вариант. При повторном прохождении ответ перезаписывается.</div>'}
 </div></div>`;
 scrollTo(0,0);document.getElementById('backB').onclick=back;document.getElementById('skipA').onclick=back}

/* ---------- NAVIGATION (from any page to any dialogue / exercise) ---------- */
function navPop(){closePop();stopSpeech();if(typeof pause==='function')pause();clearTimeout(cdT);
 const old=document.querySelector('.ov');if(old)old.remove();
 const ov=document.createElement('div');ov.className='ov';
 const cell=(i,k,ic,lbl)=>{const here=CUR.i===i&&CUR.k===k;const dn=k==='dlg'?done.includes(i):!!xs[i+'-'+k];
  return `<button class="nb ex${here?' here':''}${dn?' dn':''}" data-i="${i}" data-k="${k}" aria-label="${lbl} ${i+1}">${ic}</button>`};
 ov.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><button class="x" aria-label="Закрыть">✕</button><h3>🧭 Куда перейти?</h3>
 <div class="navtop"><button class="big sec" data-go="home">🏠 Меню</button><button class="big sec" data-go="all">📚 Все слова</button><button class="big sec" data-go="my">📋 Ответы</button></div>
 <div class="nav"><span class="hd l">Диалог</span><span class="hd">➕</span><span class="hd">🔄</span><span class="hd">🎯</span><span class="hd">📚</span>
 ${DLG.map((d,i)=>`<button class="nb dl${CUR.i===i&&CUR.k==='dlg'?' here':''}${done.includes(i)?' dn':''}" data-i="${i}" data-k="dlg"><span>${d.e}</span><span class="nt">${i+1}. ${esc(d.t)}</span></button>${cell(i,'exp','➕','Расширяем фразу')}${cell(i,'sub','🔄','Замени слово')}${cell(i,'ant','🎯','Скажи раньше')}${cell(i,'voc','📚','Слова')}`).join('')}
 </div>
 <div class="legend">➕ Расширяем фразу · 🔄 Замени слово · 🎯 Скажи раньше, чем услышишь · 📚 Слова и конструкции · ✓ пройдено</div></div>`;
 document.body.appendChild(ov);
 const c=()=>ov.remove();ov.querySelector('.x').onclick=c;ov.onclick=e=>{if(e.target===ov)c()};
 ov.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{c();const g=b.dataset.go;if(g==='home')home();else if(g==='all')vocab(-1,home);else myAnswers(home)});
 ov.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{c();const i=+b.dataset.i,k=b.dataset.k;
  if(k==='dlg')openDlg(i);else if(k==='voc')vocab(i,()=>openDlg(i));else runEx(i,k)});}
document.addEventListener('click',e=>{if(e.target.closest('.navB')){e.preventDefault();navPop()}});

function normCode(v){let t=String(v||'').toLowerCase().replace(/[\s.\-_]/g,'');
 t=t.replace(/^(дарья|дария|дариа|даря|дарjа|дарjа)/,'daria').replace(/^(darja|darya|darija|dariya|daria)/,'daria');
 t=t.replace(/[бвbв]2$/,'b2').replace(/[вb]$/,'b');return t}
const TEACHER='dariab2';
const CODES=[TEACHER].concat((META.codes||[]).map(normCode));
function gateOk(){return CODES.includes(normCode(lsGet('code','')))}
function showGate(){const g=document.createElement('div');g.className='gate';
 g.innerHTML=`<form class="gb" id="gf" autocomplete="off"><div class="gi">🔒</div><h2>${META.h1}</h2><p>Введи, пожалуйста, свой код, чтобы открыть урок.</p>
 <input id="gc" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Код" placeholder="Код">
 <p class="err" id="ge" aria-live="polite"></p><button class="big" type="submit">Открыть урок</button><div class="own">© Daria Botina</div></form>`;
 document.body.appendChild(g);
 g.querySelector('#gf').addEventListener('submit',e=>{e.preventDefault();const v=g.querySelector('#gc').value.trim();
  if(CODES.includes(normCode(v))){lsSet('code',v);g.remove();home();startVisit()}
  else{g.querySelector('#ge').textContent=v?'Код не подходит. Проверь, пожалуйста, и попробуй ещё раз.':'Введи, пожалуйста, код.'}})}
function setWho(){const c=normCode(lsGet('code',''));EV_WHO=(!c||c===TEACHER)?'Дарья (тест)':(META.who||'Ученик')}
function startVisit(){setWho();setTimeout(()=>sendEvent('visit',document.title),800)}
if(META.gate&&!gateOk())showGate();else{home();startVisit()}
})();
</script>
